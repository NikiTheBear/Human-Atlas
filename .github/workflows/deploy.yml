name: Verify & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Audit (2,000 rounds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gate — 计分排雷 + 全链路验收
        run: npm test
      - name: Gate — 蒙特卡洛审计
        run: node tests/audit.mjs 2000
      - name: Gate — v5.2 专项（空态门禁 / 导入融合 / 逐维显微镜）
        run: node tests/audit-v52.mjs

  build:
    name: Build static bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 生成 bundle / 单文件 / dist
        run: npm run build
      - name: 记录产物体积
        run: |
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          du -h human-atlas.html | awk '{print "单文件：" $1}' >> $GITHUB_STEP_SUMMARY
          du -sh dist | awk '{print "dist/：" $1}' >> $GITHUB_STEP_SUMMARY
      - name: Gate — 渲染冒烟（真浏览器验 DOM）
        run: |
          # 用 runner 自带的 Chrome；找不到就 SKIP（脚本自己处理）
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME_PATH=${CHROME_PATH:-（未找到，脚本会 SKIP）}"
          node tests/render-smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
