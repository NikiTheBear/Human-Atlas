name: Release Offline Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空则读取 package.json 版本号）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Verify, build & publish human-atlas.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gate — 计分与全链路单测
        run: npm test

      - name: Gate — 蒙特卡洛与 v5.2 验收
        run: |
          node tests/audit.mjs 2000
          node tests/audit-v52.mjs

      - name: Build single-file & dist bundle
        run: npm run build

      - name: Gate — Chrome 真 DOM 冒烟测试
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME_PATH=${CHROME_PATH:-（未找到，脚本会 SKIP）}"
          node tests/render-smoke.mjs

      - name: Publish offline bundle to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          fi
          cp human-atlas.html "human-atlas-${TAG}.html"
          echo "Publishing Release for ${TAG}..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" human-atlas.html "human-atlas-${TAG}.html" --clobber
          else
            gh release create "$TAG" human-atlas.html "human-atlas-${TAG}.html" \
              --title "The Human Atlas ${TAG}" \
              --generate-notes
          fi
