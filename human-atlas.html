/* ------------------------------------------------------------
   单卷报告
   ------------------------------------------------------------ */

function renderVolumeReport(root, ctx, volId) {
  const { App, DATA, VOL_IDS } = ctx;
  const state = App.state;
  const vol = DATA.volumes[volId];
  const P = themeColors();
  const ans = state.answersByVolume?.[volId] || {};

  const dims = (vol.dimensions || [])
    .map((d) => ({ id: d, score: state.computedScores?.[d] }))
    .filter((d) => Number.isFinite(d.score));

  const mirrors = {};
  dims.forEach((d) => {
    const m = mirrorFor(d.id, d.score, DATA.mirrors);
    if (m) mirrors[d.id] = m;
  });

  const giftList = topGifts(Object.fromEntries(dims.map((d) => [d.id, d.score])), DATA.mirrors, 3);
  const shadowList = topShadows(Object.fromEntries(dims.map((d) => [d.id, d.score])), DATA.mirrors, 3);

  root.classList.add('view');
  const wrap = el('div', { class: 'report', style: { '--vc': vol.theme_color } });
  root.appendChild(wrap);

  /* ---------- 封面 ---------- */
  const cover = el('div', { class: 'report-cover' });
  cover.appendChild(el('div', { class: 'cover-top' }, [
    el('div', { class: 'cover-vol' }, [
      el('span', { text: `VOL. ${String(vol.index).padStart(2, '0')}` }),
      el('span', { style: { opacity: 0.5 }, text: '·' }),
      el('span', { text: vol.subtitle }),
    ]),
    el('div', { style: { fontSize: '10.5px', letterSpacing: '0.16em', color: 'var(--text-tertiary)' }, text: formatDate(state.updatedAt) }),
  ]));

  /* 主标题：本卷专属分型（不是 36 个跨卷原型）
     卷名降为上方的小字副标，分型成为封面主角。 */
  const scoreMap = Object.fromEntries(dims.map((d) => [d.id, d.score]));
  const zMap = {};
  for (const d of Object.keys(typoScoreMap)) {
    const z = state.zScores?.[d];
    if (Number.isFinite(z)) zMap[d] = z;
  }
  const typo = buildVolumeTypology(volId, typoScoreMap, zMap, DATA.dimMap, {
    pressure: state.pressureStyle || null,
    mask: state.maskIndex,
  });

  cover.appendChild(el('div', {
    style: {
      fontSize: '11px',
      letterSpacing: '0.22em',
      color: 'var(--text-tertiary)',
      marginBottom: '10px',
    },
    text: vol.title,
  }));

  cover.appendChild(el('h1', {
    class: 'cover-title',
    text: typo ? typo.title : vol.title,
  }));

  if (typo && typo.tag) {
    cover.appendChild(el('p', {
      class: 'cover-psych',
      text: typo.tag,
    }));
  }

  if (state.nickname) {
    cover.appendChild(el('div', {
      style: { fontSize: '11px', letterSpacing: '0.2em', color: 'var(--text-tertiary)', marginBottom: '16px' },
      text: `${state.nickname} · 私人档案`,
    }));
  }

  if (giftList.length) {
    cover.appendChild(el('div', { class: 'cover-keywords' }, giftList.map((g) => el('span', { class: 'kw', text: g.gift_title }))));
    cover.appendChild(el('p', {
      class: 'cover-verdict',
      text: `在这一卷的坐标里，你最亮的形态是「${giftList[0].gift_title}」。同时，${shadowList.length ? `「${shadowList[0].shadow_title}」是你需要留意的反面。` : '你的分布相对均衡，没有明显的极端化倾向。'}`,
    }));
  }

  const answeredCount = vol.questions.filter((q) => ans[q.id]?.value !== undefined).length;
  cover.appendChild(el('div', { class: 'gauges' }, [
    gauge('本卷完成度', `${answeredCount}`, ` / ${vol.questions.length} 题`),
    gauge('维度数', `${dims.length}`, ''),
    gauge('社会面具厚度', Number.isFinite(state.maskIndex) ? Math.round(state.maskIndex) : '—', ''),
    gauge('全卷进度', `${(state.completedVolumes || []).length}`, ` / ${VOL_IDS.length} 卷`),
  ]));

  wrap.appendChild(cover);

  /* ---------- 本卷图谱 ---------- */
  const chartOpt = {
    colorText: P.text,
    colorMuted: P.faint,
    colorBorder: P.border,
    bg: P.card,
  };

  const chartCard = (title, note) => {
    const box = el('div', { class: 'chart-card', style: { marginBottom: '26px' } });
    box.appendChild(el('div', { class: 'chart-card__head' }, [
      el('h3', { text: title }),
      el('span', { class: 'chart-card__note', text: note }),
    ]));
    const body = el('div', { class: 'chart-card__body' });
    box.appendChild(body);
    wrap.appendChild(box);
    return body;
  };

  const typoScoreMap = Object.fromEntries(dims.map((d) => [d.id, d.score]));

  if (volId === 'vol1') {
    const body = chartCard('七美德 × 七原罪 · 双翼蝶形', '左翼为秩序，右翼为驱力');
    body.appendChild(butterflySvg(scoreMap, {
      width: 720,
      colorVirtue: P.vol2,
      colorSin: P.vol1,
      ...chartOpt,
    }));
  }

  if (volId === 'vol2') {
    const body = chartCard('大五人格 · 十子维轮廓', 'Vol.2 · 外部自评视角');
    body.appendChild(radarSvg(dims.map((d) => ({
      id: d.id,
      label: DATA.dimMap[d.id]?.name.slice(0, 4) || d.id,
      value: d.score,
    })), {
      width: 520,
      ...chartOpt,
      series: [{ name: 'Big Five', values: dims.map((d) => d.score), color: P.vol2, fillOpacity: 0.12 }],
      showValues: true,
      labelSize: 10.5,
    }));
  }

  if (volId === 'vol3') {
    const body = chartCard('光明三角 × 黑暗三角', '两枚三角形的填充面积即该侧强度');
    body.appendChild(triadSvg(scoreMap, {
      width: 560,
      colorLight: P.vol2,
      colorDark: P.vol1,
      ...chartOpt,
    }));

    // 认知 / 情感共情（若维度存在）
    if (dims.some((d) => d.id === 'emp_cognitive') || dims.some((d) => d.id === 'emp_affective')) {
      body.appendChild(el('p', {
        style: { fontSize: '12px', lineHeight: '1.9', color: 'var(--text-secondary)', marginTop: '14px' },
        text: '当认知共情显著高于情感共情时，通常意味着你能精准读懂他人的情绪，但不会跟着一起起伏——这是「暗黑共情者」的典型结构。',
      }));
    }
  }

  if (volId === 'vol4') {
    const body = chartCard('三观 · 九维双极光谱', '中轴为 50，两端为对立极');
    const list = el('div', { class: 'spec-list' });
    const polar = [
      ['wv_nature', '人性预设', '审慎防备', '善意信任'],
      ['wv_causal', '因果归因', '顺应随机', '长期掌控'],
      ['wv_social', '社会逻辑', '现实博弈', '契约规则'],
      ['lv_happiness', '幸福取向', '体验主义', '实现主义'],
      ['lv_suffering', '苦难态度', '拒绝内耗', '意义转化'],
      ['lv_anchor', '存在锚点', '向外建构', '向内自洽'],
      ['val_moral', '道德算法', '结果优先', '原则底线'],
      ['val_boundary', '边界重心', '归属稳定', '自由独立'],
      ['val_standard', '评判标尺', '效率务实', '真诚公平'],
    ].filter(([id]) => Number.isFinite(scoreMap[id]));

    polar.forEach(([id, name, neg, pos]) => {
      const row = el('div', { class: 'spec-item' }, [
        el('div', { class: 'spec-item__name', text: name }),
        (() => {
          const box = el('div', { class: 'spec-svg' });
          box.appendChild(spectrumSvg({
            id, name, negLabel: neg, posLabel: pos,
            value: scoreMap[id], color: P.vol4,
          }, {
            ...chartOpt,
            negColor: P.faint,
            posColor: P.vol4,
            bg: P.card,
          }));
          return box;
        })(),
      ]);
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  if (volId === 'vol5') {
    const body = chartCard('思维棱镜 · 六道棱面', '中轴为 50，两端为两种加工方式');
    const list = el('div', { class: 'spec-list' });
    const cog = [
      ['cog_global', '全局 / 细节', '细节实证', '全局抽象'],
      ['cog_diverge', '发散 / 收敛', '收敛风控', '发散破局'],
      ['cog_logic', '逻辑 / 直觉', '直觉共振', '逻辑抽离'],
      ['cog_ambiguity', '模糊 / 确定', '确定性偏好', '高模糊容忍'],
      ['cog_independent', '独立 / 共识', '共识校准', '独立反叛'],
      ['cog_speed', '快 / 慢决策', '慢决策求全', '快决策迭代'],
    ].filter(([id]) => Number.isFinite(scoreMap[id]));

    cog.forEach(([id, name, neg, pos]) => {
      const row = el('div', { class: 'spec-item' }, [
        el('div', { class: 'spec-item__name', text: name }),
        (() => {
          const box = el('div', { class: 'spec-svg' });
          box.appendChild(spectrumSvg({
            id, name, negLabel: neg, posLabel: pos,
            value: scoreMap[id], color: P.vol5,
          }, {
            ...chartOpt,
            negColor: P.faint,
            posColor: P.vol5,
            bg: P.card,
          }));
          return box;
        })(),
      ]);
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  if (volId === 'vol6') {
    const body = chartCard('六大欲望引擎', 'Vol.6 · 含 100 点筹码分配');
    body.appendChild(radarSvg(dims.map((d) => ({
      id: d.id,
      label: DATA.dimMap[d.id]?.name.slice(0, 4) || d.id,
      value: d.score,
    })), {
      width: 520,
      ...chartOpt,
      series: [{ name: 'Motors', values: dims.map((d) => d.score), color: P.gold, fillOpacity: 0.12 }],
      showValues: true,
      labelSize: 11,
    }));

    // 若做过筹码题，补一条条形排序
    const budgetQ = vol.questions.find((q) => q.type === 'budget_100');
    const budgetAns = budgetQ ? ans[budgetQ.id]?.value : null;
    if (budgetQ && budgetAns && typeof budgetAns === 'object') {
      const list = el('div', { class: 'spec-list', style: { marginTop: '18px' } });
      const sorted = [...budgetQ.items]
        .map((it) => ({ ...it, pts: Number(budgetAns[it.key] ?? 0) }))
        .sort((a, b) => b.pts - a.pts);
      sorted.forEach((it) => {
        const row = el('div', { class: 'spec-item' }, [
          el('div', { class: 'spec-item__name', text: it.label }),
          (() => {
            const box = el('div', { class: 'spec-svg' });
            box.appendChild(spectrumSvg({
              id: it.key,
              name: it.label,
              negLabel: '0 点',
              posLabel: '100 点',
              value: it.pts,
              color: P.gold,
            }, {
              ...chartOpt,
              negColor: P.faint,
              posColor: P.gold,
              bg: P.card,
            }));
            return box;
          })(),
        ]);
        list.appendChild(row);
      });
      body.appendChild(el('div', {
        style: { fontSize: '10px', letterSpacing: '0.18em', color: 'var(--text-tertiary)', margin: '20px 0 12px' },
        text: '筹码实际分配',
      }));
      body.appendChild(list);
    }
  }

  if (volId === 'vol7') {
    const an = scoreMap.att_anxiety;
    const av = scoreMap.att_avoidance;
    const style = attachmentStyle(an, av);
    const body = chartCard(`依恋坐标 · ${style.name}`, 'X 轴回避，Y 轴焦虑');
    body.appendChild(quadrantSvg({ anxiety: an, avoidance: av }, {
      width: 440,
      color: P.vol7,
      ...chartOpt,
      safeColor: P.vol2,
    }));
    body.appendChild(el('p', {
      style: { fontSize: '12.5px', lineHeight: '1.95', color: 'var(--text-secondary)', marginTop: '14px' },
      text: style.desc,
    }));

    // 六大防御机制横向光谱
    const defs = [
      ['def_intellectual', '理智化'],
      ['def_detach', '情感隔离'],
      ['def_sublimate', '升华转化'],
      ['def_attack', '先发反击'],
      ['def_fawn', '讨好安抚'],
      ['def_project', '反向投射'],
    ].filter(([id]) => Number.isFinite(scoreMap[id]));

    if (defs.length) {
      const list = el('div', { class: 'spec-list', style: { marginTop: '18px' } });
      defs.forEach(([id, name]) => {
        const row = el('div', { class: 'spec-item' }, [
          el('div', { class: 'spec-item__name', text: name }),
          (() => {
            const box = el('div', { class: 'spec-svg' });
            box.appendChild(spectrumSvg({
              id, name, negLabel: '很少使用', posLabel: '几乎默认',
              value: scoreMap[id], color: P.vol7,
            }, {
              ...chartOpt,
              negColor: P.faint,
              posColor: P.vol7,
              bg: P.card,
            }));
            return box;
          })(),
        ]);
        list.appendChild(row);
      });
      body.appendChild(el('div', {
        style: { fontSize: '10px', letterSpacing: '0.18em', color: 'var(--text-tertiary)', margin: '20px 0 12px' },
        text: '六大防御机制使用倾向',
      }));
      body.appendChild(list);
    }
  }

  if (volId === 'vol8') {
    // 面具虚实叠层：本卷整体作答 vs 前七卷明线
    const maskV = Number.isFinite(state.maskIndex) ? round(state.maskIndex, 0) : null;
    const body = chartCard('高压剧场 · 面具校准', maskV === null ? 'Vol.8' : `面具厚度 ${maskV}`);

    const pressure = state.pressureStyle;
    if (pressure && pressure.distribution) {
      const list = el('div', { class: 'spec-list' });
      const names = {
        burst: '爆发火 · 攻击外化',
        cutoff: '断联冰 · 彻底关闭',
        cold: '黑化刃 · 冰冷计算',
        collapse: '坍塌雾 · 自我耗竭',
      };
      Object.entries(pressure.distribution)
        .sort((a, b) => b[1] - a[1])
        .forEach(([k, v]) => {
          const row = el('div', { class: 'spec-item' }, [
            el('div', { class: 'spec-item__name', text: names[k] || k }),
            (() => {
              const box = el('div', { class: 'spec-svg' });
              box.appendChild(spectrumSvg({
                id: k, name: names[k] || k,
                negLabel: '0%', posLabel: '100%',
                value: v, color: P.vol8,
              }, {
                ...chartOpt,
                negColor: P.faint,
                posColor: P.vol8,
                bg: P.card,
              }));
              return box;
            })(),
          ]);
          list.appendChild(row);
        });
      body.appendChild(el('div', {
        style: { fontSize: '10px', letterSpacing: '0.18em', color: 'var(--text-tertiary)', marginBottom: '12px' },
        text: '高压退行态分布',
      }));
      body.appendChild(list);
    }

    // 面具三分量
    if (state.maskDetail) {
      const md = state.maskDetail;
      const parts = [
        ['社会期许偏移', md.dsd],
        ['犹豫修饰度', md.hlat],
        ['镜像撕裂度', md.mirror],
      ].filter(([, v]) => Number.isFinite(v));

      if (parts.length) {
        const list = el('div', { class: 'spec-list', style: { marginTop: '18px' } });
        parts.forEach(([label, v]) => {
          const row = el('div', { class: 'spec-item' }, [
            el('div', { class: 'spec-item__name', text: label }),
            (() => {
              const box = el('div', { class: 'spec-svg' });
              box.appendChild(spectrumSvg({
                id: label, name: label, negLabel: '低', posLabel: '高',
                value: v, color: P.vol1,
              }, {
                ...chartOpt,
                negColor: P.faint,
                posColor: P.vol1,
                bg: P.card,
              }));

function formatAnswer(q, value) {
  if (value === undefined || value === null) return '未作答';
  if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
    const o = (q.options || []).find((x) => x.key === value);
    return o ? `${o.key}. ${o.text}` : String(value);
  }
  if (q.type === 'stealth_scale') {
    return `${value} / 7 — ${value >= 4 ? (q.scale?.right || '偏右') : (q.scale?.left || '偏左')}`;
  }
  if (q.type === 'budget_100') {
    return Object.entries(value || {})
      .filter(([, v]) => v > 0)
      .map(([k, v]) => {
        const it = (q.items || []).find((x) => x.key === k);
        return `${it?.label || k} ${v}`;
      })
      .join(' · ') || '未分配';
  }
  if (q.type === 'pyramid_top3') {
    return (value || [])
      .map((k, i) => {
        const it = (q.values || []).find((x) => x.key === k);
        return `${i + 1}. ${it?.label || k}`;
      })
      .join(' · ');
  }
  return String(value);
}

function computeLightDark(scores) {
  const lightKeys = ['light_humanism', 'light_kant', 'light_faith', 'virtue_humility', 'virtue_charity', 'virtue_kindness', 'virtue_patience', 'virtue_temperance', 'virtue_diligence', 'virtue_chastity'];
  const darkKeys = ['dark_mach', 'dark_narc', 'dark_psycho', 'sin_pride', 'sin_greed', 'sin_envy', 'sin_wrath', 'sin_sloth', 'sin_lust', 'sin_gluttony'];
  const l = lightKeys.map((k) => scores[k]).filter(Number.isFinite);
  const d = darkKeys.map((k) => scores[k]).filter(Number.isFinite);
  if (!l.length || !d.length) return '—';
  const lm = l.reduce((a, b) => a + b, 0) / l.length;
  const dm = d.reduce((a, b) => a + b, 0) / d.length;
  if (dm <= 0.5) return '100 : 1';
  const ratio = Math.max(1, Math.round((lm / dm) * 100));
  return `${ratio} : 100`;
}

/* ───────── src/core/comparator.js ───────── */
/* ============================================================
   comparator.js — 双人局部 / 全量契合度
   · 底层共振度（三观 + 光明/黑暗）
   · 性格互补度（大五 + 思维）
   · 阴影碰撞预警
   ============================================================ */




function commonVolumes(a, b) {
  return VOLS.filter((v) => (a.completedVolumes || []).includes(v) && (b.completedVolumes || []).includes(v));
}

function commonDims(a, b, DATA) {
  const vols = commonVolumes(a, b);
  const set = new Set();
  for (const v of vols) {
    const vol = DATA.volumes[v];
    for (const d of vol?.dimensions || []) set.add(d);
  }
  return Array.from(set).filter(
    (d) => Number.isFinite(a.computedScores?.[d]) && Number.isFinite(b.computedScores?.[d]),
  );
}

/** 底层共振度 R_sync = 100 − 平均绝对差 */
function resonance(a, b, dims, DATA) {
  const core = dims.filter((d) => (DATA.pairRules.coreDims || []).includes(d));
  const list = core.length ? core : dims;
  if (!list.length) return null;
  const diffs = list.map((d) => Math.abs(a.computedScores[d] - b.computedScores[d]));
  return {
    value: round(100 - mean(diffs), 1),
    dims: list,
    meanDiff: round(mean(diffs), 1),
  };
}

/** 性格互补度：差异 20–45 视为黄金互补 */
function complement(a, b, dims, DATA) {
  const list = dims.filter((d) => (DATA.pairRules.complementDims || []).includes(d));
  if (!list.length) return null;

  const rows = list.map((d) => {
    const diff = Math.abs(a.computedScores[d] - b.computedScores[d]);
    let score;
    if (diff < 12) score = 55 + diff * 1.4;          // 太像：缺张力
    else if (diff < 20) score = 72 + (diff - 12) * 2.6;
    else if (diff <= 45) score = 100 - (diff - 20) * 0.7; // 黄金互补区
    else score = 82 - (diff - 45) * 1.5;
    return { dim: d, diff: round(diff, 1), score: clamp(score, 0, 100) };
  });

  const value = mean(rows.map((r) => r.score));
  const golden = rows.filter((r) => r.diff >= 20 && r.diff <= 45);
  const twins = rows.filter((r) => r.diff < 12);
  return {
    value: round(value, 1),
    rows,
    golden: sortBy(golden, (r) => r.diff, -1),
    twins,
  };
}

/* ------------------------------------------------------------
   阴影碰撞
   ------------------------------------------------------------ */

function hit(rules, scores, mask) {
  return rules.every((c) => {
    const v = c.dim === 'mask' ? mask : scores[c.dim];
    if (!Number.isFinite(v)) return false;
    switch (c.op) {
      case '>=': return v >= c.val;
      case '>': return v > c.val;
      case '<=': return v <= c.val;
      case '<': return v < c.val;
      default: return false;
    }
  });
}

function collisions(a, b, dims, DATA) {
  const rules = DATA.pairRules.collisions || [];
  const out = [];
  const aScores = a.computedScores || {};
  const bScores = b.computedScores || {};

  for (const r of rules) {
    const dimsUsed = [...r.a.map((c) => c.dim), ...r.b.map((c) => c.dim)];
    if (!dimsUsed.every((d) => dims.includes(d))) continue;

    const direct = hit(r.a, aScores, a.maskIndex) && hit(r.b, bScores, b.maskIndex);
    const reverse = hit(r.b, aScores, a.maskIndex) && hit(r.a, bScores, b.maskIndex);
    if (!direct && !reverse) continue;
    out.push({ ...r, reversed: !direct && reverse });
  }
  return sortBy(out, (r) => ({ high: 0, mid: 1, low: 2 }[r.severity] ?? 3), 1);
}

function resonances(a, b, dims, DATA) {
  const rules = DATA.pairRules.resonance || [];
  const out = [];
  const aS = a.computedScores || {};
  const bS = b.computedScores || {};

  for (const r of rules) {
    if (!r.dims.every((d) => dims.includes(d))) continue;
    let ok = true;
    for (const d of r.dims) {
      const av = aS[d];
      const bv = bS[d];
      if (!Number.isFinite(av) || !Number.isFinite(bv)) { ok = false; break; }
      if (r.op === 'bothHigh') {
        if (!(av >= r.threshold && bv >= r.threshold)) { ok = false; break; }
      } else if (r.op === 'bothLow') {
        if (!(av <= r.threshold && bv <= r.threshold)) { ok = false; break; }
      } else if (r.op === 'gapSmall') {
        if (Math.abs(av - bv) > (r.threshold || 15)) { ok = false; break; }
      }
    }
    if (ok) out.push(r);
  }
  return out;
}

/* ------------------------------------------------------------
   综合契合度
   ------------------------------------------------------------ */

function compareStates(a, b, DATA) {
  const common = commonVolumes(a, b);
  const dims = commonDims(a, b, DATA);

  if (!common.length || !dims.length) {
    return {
      ok: false,
      common,
      dims,
      reason: common.length
        ? '双方共同完成的卷宗里，还没有可比较的维度。'
        : '你们还没有共同完成任何一卷，暂时无法计算契合度。',
    };
  }

  const res = resonance(a, b, dims, DATA);
  const comp = complement(a, b, dims, DATA);
  const coll = collisions(a, b, dims, DATA);
  const reson = resonances(a, b, dims, DATA);

  const sync = res?.value ?? 50;
  const tension = comp?.value ?? 50;
  let overall = sync * 0.58 + tension * 0.42;

  // 高严重度碰撞扣分，但不至于归零（冲突本身就是关系的一部分）
  const highHits = coll.filter((c) => c.severity === 'high').length;
  const midHits = coll.filter((c) => c.severity === 'mid').length;
  const penalty = Math.min(20, highHits * 5.5 + midHits * 2.5);
  overall = clamp(overall - penalty, 20, 100);

  const grade = overall >= 84
    ? { id: 'S', name: '深度共振', desc: '你们的核心价值与节奏高度接近，同时保留了足够的性格张力。' }
    : overall >= 72
      ? { id: 'A', name: '稳固互补', desc: '有共同的地基，也有彼此没有的部分；多数分歧可以靠沟通穿过。' }
      : overall >= 60
        ? { id: 'B', name: '需要校准', desc: '基础是好的，但有几处结构性的差异，需要明确的规则来承接。' }
        : { id: 'C', name: '张力偏高', desc: '你们的核心逻辑差异明显，靠近需要更多耐心与更少的假设。' };

  // 维度对照表
  const rows = sortBy(
    dims.map((d) => {
      const av = a.computedScores[d];
      const bv = b.computedScores[d];
      return { dim: d, a: av, b: bv, diff: round(Math.abs(av - bv), 1) };
    }),
    (r) => r.diff,
    -1,
  );

  return {
    ok: true,
    common,
    dims,
    sync: res,
    complement: comp,
    collisions: coll,
    resonances: reson,
    overall: round(overall, 1),
    grade,
    topGaps: rows.slice(0, 5),
    topMatches: rows.slice(-5).reverse(),
    rows,
    maskGap: Number.isFinite(a.maskIndex) && Number.isFinite(b.maskIndex)
      ? round(Math.abs(a.maskIndex - b.maskIndex), 1)
      : null,
  };
}

  return (state?.nickname || '').trim() || fallback;

/* ============================================================
   ecologySvg.js — 六大关系生态位雷达（六边形对比）
   ============================================================ */



/**
 * @param {Array<{id,name,value}>} list  六个生态位得分（按 ECOLOGIES 顺序）
 * @param {Object} opt { width, color, colorText, colorMuted, colorBorder, bg, bestId }
 */
function ecologySvg(list, opt = {}) {
  const items = (list || []).slice(0, 6);
  const n = items.length;
  if (n < 3) return svg('svg', { viewBox: '0 0 10 10' });

  const W = opt.width || 560;
  const H = Math.round(W * 0.86);
  const cx = W / 2;
  const cy = H / 2 + 6;
  const R = Math.min(W, H) * 0.33;

  const cMain = opt.color || '#9A7B45';
  const cText = opt.colorText || '#171918';
  const cMuted = opt.colorMuted || '#6E736E';
  const cBorder = opt.colorBorder || 'rgba(23,25,24,0.11)';
  const bg = opt.bg || '#FFFFFF';

  const root = svg('svg', {
    viewBox: `0 0 ${W} ${H}`,
    width: '100%',
    role: 'img',
    'aria-label': '六大关系生态位雷达图',
  });

  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, f) => [cx + Math.cos(angle(i)) * R * f, cy + Math.sin(angle(i)) * R * f];

  /* 网格 */
  [0.25, 0.5, 0.75, 1].forEach((f) => {
    const pts = Array.from({ length: n }, (_, i) => pt(i, f).join(',')).join(' ');
    root.appendChild(svg('polygon', {
      points: pts,
      fill: f === 1 ? 'none' : 'none',
      stroke: cBorder,
      'stroke-width': f === 1 ? 1 : 0.7,
      opacity: f === 1 ? 0.95 : 0.5,
    }));
  });

  /* 轴线 */
  for (let i = 0; i < n; i += 1) {
    const [x, y] = pt(i, 1);
    root.appendChild(svg('line', {
      x1: cx, y1: cy, x2: x, y2: y, stroke: cBorder, 'stroke-width': 0.7, opacity: 0.6,
    }));
  }

  /* 数据面 */
  const dataPts = items.map((it, i) => pt(i, clamp(it.value, 0, 100) / 100));
  root.appendChild(svg('polygon', {
    points: dataPts.map((p) => p.join(',')).join(' '),
    fill: cMain,
    'fill-opacity': 0.14,
    stroke: cMain,
    'stroke-width': 1.8,
    'stroke-linejoin': 'round',
  }));

  dataPts.forEach((p, i) => {
    const isBest = items[i].id === opt.bestId;
    root.appendChild(svg('circle', {
      cx: p[0],
      cy: p[1],
      r: isBest ? 4.6 : 3,
      fill: isBest ? cMain : bg,
      stroke: cMain,
      'stroke-width': 1.6,
    }));
  });

  /* 轴标签 + 数值 */
  items.forEach((it, i) => {
    const [x, y] = pt(i, 1.19);
    const cos = Math.cos(angle(i));
    const sin = Math.sin(angle(i));
    const anchor = Math.abs(cos) < 0.25 ? 'middle' : cos > 0 ? 'start' : 'end';
    const dy = sin > 0.55 ? 12 : sin < -0.55 ? -4 : 4;
    const isBest = it.id === opt.bestId;

    root.appendChild(svgText(it.name, {
      x,
      y: y + dy,
      'text-anchor': anchor,
      'font-size': 11,
      'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
      fill: isBest ? cMain : cMuted,
      'font-weight': isBest ? 600 : 400,
      'letter-spacing': '0.04em',
    }));

    root.appendChild(svgText(String(Math.round(it.value)), {
      x,
      y: y + dy + (sin < -0.55 ? -14 : 14),
      'text-anchor': anchor,
      'font-size': 12,
      'font-family': "'Noto Serif SC',Georgia,serif",
      fill: isBest ? cMain : cText,
      'font-variant-numeric': 'tabular-nums',
      opacity: isBest ? 1 : 0.72,
    }));
  });

  return root;
}

/* ------------------------------------------------------------
   2. 张力曲线（与 comparator.complement 一致）
   ------------------------------------------------------------ */

function tensionScore(diff) {
  const d = Math.abs(diff);
  if (d < 12) return 55 + d * 1.4;
  if (d < 20) return 72 + (d - 12) * 2.6;
  if (d <= 45) return 100 - (d - 20) * 0.7;
  return 82 - (d - 45) * 1.5;
}

/* ------------------------------------------------------------
   3. 单维度得分
   ------------------------------------------------------------ */

/**
 * 把 (av, bv, kind) 折算成 0–100。
 *
 * syncHigh 的关键在「水平门」：两人都高才满分。
 *   相似度 = 100 − |av − bv|
 *   水平门 = min(av, bv) / 62，夹在 0–1
 *   最终 = 相似度 × 水平门
 * 两人都是 80 且完全一致：100 × 1 = 100
 * 两人都是 35 且完全一致：100 × 0.56 = 56（「一起不在乎」不算同频）
 */
function dimScore(av, bv, kind) {
  const diff = av - bv;
  const sim = clamp(100 - Math.abs(diff), 0, 100);

  switch (kind) {
    case 'tension':
      return clamp(tensionScore(diff), 0, 100);

    case 'bothHigh':
      // 双方都要高；取较低一侧，避免一方极高把均值拉起来
      return clamp(Math.min(av, bv), 0, 100);

    case 'syncHigh': {
      /* 校准说明：计分引擎把所有维度中心化到 50，所以「两个普通人」
         在 min(av,bv)/62 下会拿到 0.81 × 100 = 81 分，六个生态位全都挤在 80 附近。
         改成 (min − 35) / 30：
           35 分 → 0     50 分（中性）→ 0.50     65 分以上 → 1.0
         这样中性组合落在 50 附近，真有共同底色才上得去。 */
      const gate = clamp((Math.min(av, bv) - 35) / 30, 0, 1);
      return clamp(sim * gate, 0, 100);
    }

    case 'syncLow': {
      // 双方都不高才好：(65 − max) / 30，50 分 → 0.5，35 分以下 → 1.0
      const gate = clamp((65 - Math.max(av, bv)) / 30, 0, 1);
      return clamp(sim * gate, 0, 100);
    }

    case 'sync':
    default:
      return sim;
  }
}

/* ------------------------------------------------------------
   4. 单生态位计分
   ------------------------------------------------------------ */

function scoreEcology(a, b, availableDims, def, masks = {}) {
  const set = new Set(availableDims);
  const aS = a.computedScores || {};
  const bS = b.computedScores || {};

  const parts = [];
  for (const d of def.dims) {
    if (!set.has(d.id)) continue;
    const av = aS[d.id];
    const bv = bS[d.id];
    if (!Number.isFinite(av) || !Number.isFinite(bv)) continue;

    parts.push({
      id: d.id,
      w: d.w,
      kind: d.kind,
      score: round(dimScore(av, bv, d.kind), 1),
      av: round(av, 0),
      bv: round(bv, 0),
      diff: round(av - bv, 1),
    });
  }

  if (!parts.length) return null;

  const wSum = parts.reduce((s, p) => s + p.w, 0);
  const weighted = parts.reduce((s, p) => s + p.score * p.w, 0) / wSum;

  let value = weighted;
  if (typeof def.extra === 'function') {
    value += def.extra(masks, a, b) || 0;
  }

  /* 减分雷区 */
  const hits = [];
  for (const p of def.penalties || []) {
    const av = aS[p.id];
    const bv = bS[p.id];
    if (!Number.isFinite(av) || !Number.isFinite(bv)) continue;

    let fired = false;

    if (p.gap !== undefined) {
      if (Math.abs(av - bv) >= p.gap) fired = true;
    } else if (p.cross) {
      const pv = aS[p.partner];
      const pw = bS[p.partner];
      const okA = av >= (p.a || 0) && Number.isFinite(pw) && pw >= p.partnerAt;
      const okB = bv >= (p.a || 0) && Number.isFinite(pv) && pv >= p.partnerAt;
      if (okA || okB) fired = true;
    } else if (p.partner) {
      const pv = aS[p.partner];
      const pw = bS[p.partner];
      const okA = av >= p.a && Number.isFinite(pv) && pv >= p.partnerAt;
      const okB = bv >= p.a && Number.isFinite(pw) && pw >= p.partnerAt;
      if (okA || okB) fired = true;
    } else if (p.same) {
      if (av >= p.a && bv >= p.b) fired = true;
    }

    if (fired) hits.push({ label: p.label, w: p.w });
  }

  const penalty = hits.reduce((s, h) => s + h.w, 0);
  value = clamp(value - penalty, 0, 100);

  const n = parts.length;
  const confidence = n >= 10 ? 'high' : n >= 5 ? 'mid' : 'low';

  return {
    id: def.id,
    name: def.name,
    latin: def.latin,
    summary: def.summary,
    value: round(value, 1),
    weighted: round(weighted, 1),
    penalty,
    hits,
    parts,
    dimCount: n,
    confidence,
    unlock: def.unlock,
  };
}

/* ------------------------------------------------------------
   5. 六生态位总览
   ------------------------------------------------------------ */

function scoreAllEcologies(a, b, availableDims, masks = {}) {
  const list = ECOLOGIES
    .map((def) => scoreEcology(a, b, availableDims, def, masks))
    .filter(Boolean)
    .sort((x, y) => y.value - x.value);

  const best = list[0] || null;
  return {
    list,
    best,
    missing: ECOLOGIES
      .filter((def) => !list.some((r) => r.id === def.id))
      .map((def) => ({ id: def.id, name: def.name, unlock: def.unlock })),
  };
}

  high: '证据置信度 高',
  mid: '证据置信度 中',
  low: '证据置信度 初探',

function ecologyById(id) {

/* ============================================================
   6. 深度关系剧本 / 潜台词解码器 / 相处红黑榜
   ============================================================ */

const pick = (scoreMap, ids) => ids
  .map((id) => ({ id, v: scoreMap?.[id] }))
  .filter((x) => Number.isFinite(x.v))

/**
 * 关系演变三幕剧。

function relationshipScript(A, B, masks = {}) {

    if (Number.isFinite(aMask) && Number.isFinite(bMask) && Math.abs(aMask - bMask) >= 15) {

      body += `${thick === 'A' ? 'A' : 'B'} 刚开始会显得更完整、更得体，话都说得恰到好处；另一方则更早露出真实的一面。`
        + '这段关系最初的错位就藏在这里：一个人以为对方天生从容，其实那只是他习惯的外壳。';

    } else {
      body += '你们的初始体面度接近，所以第一印象大概率为「同类」。';
      tags.push('同频起步');
    }

    if (moreFawn === moreDetach) {
      body += `${shier} 更慢热，${moreDetach} 更早退回自己的壳里——破冰这一步通常要花比预期更久。`;

    acts.push({ key: 'act1', title: '第一幕 · 初识破冰期', body, tags });

  /* ---------- 第二幕 · 升温共振 ---------- */
  {
    const tags = [];
    const sameHigh = [];
    const ids = ['big5_open', 'big5_aesthetic', 'phil_humanist', 'light_humanism', 'hss_novelty', 'hss_intensity', 'mot_purpose', 'jung_ne'];

    const topShared = sameHigh.slice(0, 2);
    const sceneMap = {
      big5_open: '一起去看一个谁都没听过的小展，出来后能聊两小时',

    };

    if (topShared.length) {
      const scenes = topShared.map((id) => sceneMap[id]).filter(Boolean);
      acts.push({
        key: 'act2',
        title: '第二幕 · 升温共振期',
        body: `最容易产生默契的场景：${scenes.join('；')}。这些不是刻意安排的，是你们刚好都在同一条频率上。`,
        tags: topShared.map((id) => TOP_LABEL[id] || id),
      });
    } else {
      acts.push({
        key: 'act2',
        title: '第二幕 · 升温共振期',
        body: '你们没有明显重叠的高位兴趣，升温会更依赖「一起做事」而不是「一起聊天」。'
          + '共同完成一件具体的事，比共同消磨一个晚上更能拉近距离。',
        tags: ['靠共同行动'],
      });
    }
    void tags;
  }

  /* ---------- 第三幕 · 首次摩擦 ---------- */
  {
    const tags = [];
    let body = '';

    const aAnx = aS.att_anxiety;
    const bAnx = bS.att_anxiety;
    const aAvo = aS.att_avoidance;
    const bAvo = bS.att_avoidance;
    const chase = (aAnx ?? 0) >= 60 && (bAvo ?? 0) >= 60;
    const chaseRev = (bAnx ?? 0) >= 60 && (aAvo ?? 0) >= 60;

    if (chase || chaseRev) {
      const chaser = chase ? 'A' : 'B';
      const runner = chase ? 'B' : 'A';
      body += `第一次冷战最可能这样开始：${chaser} 想要一个明确的回应，${runner} 觉得被逼近了需要退开。`
        + '一个更用力，另一个更远，两天后谁都不记得最初是为了什么。';
      tags.push('追逃循环');
    } else if ((aS.tki_avoiding ?? 0) >= 58 && (bS.tki_avoiding ?? 0) >= 58) {
      body += '第一次摩擦大概率不会爆发，而是同时沉默：两个人都选择先不碰。'
        + '表面风平浪静，但那件事会一直躺在那里，等下一次小事把它翻出来。';
      tags.push('双回避');
    } else if ((aS.tki_competing ?? 0) >= 58 && (bS.tki_competing ?? 0) >= 58) {
      body += '第一次摩擦会是正面冲突：两个人都想把道理讲赢，且都擅长这件事。'
        + '吵完不会有人受伤到崩溃，但会留下一个「这个人不好惹」的印象。';
      tags.push('硬碰硬');
    } else {
      body += '第一次分歧大概会以「一个人先让一步」结束。短期看很顺，'
        + '但让步的那一方会记住次数——真正的爆点往往在第五次之后。';
      tags.push('单侧让步');
    }

    if ((aS.def_attack ?? 0) >= 58 && (bS.def_attack ?? 0) >= 58) {
      body += '特别注意：你们都会在受伤时先反击，这意味着小误会很容易升级成互相指责。';
      tags.push('双反击');
    }

    acts.push({
      key: 'act3',
      title: '第三幕 · 首次摩擦期',
      body,
      bodyPlus: '破冰口令：先说出「我不是要赢，我只是刚才有点难受」，再谈事情本身。',
      tags,
    });
  }

  return { acts };
}

/**
 * @param {Object} target  对方 state（我们解码「他」的潜台词）
 * @param {string} name    对方称呼
 */
function subtextDecoder(target, name = '对方') {
  const s = target.computedScores || {};
  const ranked = pick(s, SUBTEXT_RULES.map((r) => r.dim));

  const out = [];
  for (const r of SUBTEXT_RULES) {
    const v = s[r.dim];
    if (!Number.isFinite(v) || v < r.at) continue;
    out.push({
      dim: r.dim,
      tag: r.tag,
      score: round(v, 0),
      line: r.line,
      real: r.real,
      better: r.better,
    });
    if (out.length >= 3) break;
  }
  void ranked;
  void name;
  return out;
}

/**
 * 从 Vol.6 欲望引擎、Vol.13 图式、Vol.11 道德基础提炼各 3 条。
 */
function chemistryBoard(A, B) {
  const aS = A.computedScores || {};
  const bS = B.computedScores || {};

  const green = [];   // 加分动作
  const red = [];     // 隐形禁区

  /* ---- 从欲望引擎看：对方最在意什么，就给它什么 ---- */
  const motives = [
    ['mot_autonomy', '不替他做决定', '给他一段完全不被打扰的时间，不要问他在干什么'],
    ['mot_mastery', '认真看他的成果', '让他讲一次他做成的具体的事，听完追问一个细节'],
    ['mot_belonging', '具体的分量', '一句「这件事我只跟你讲」，比任何夸奖都有效'],
    ['mot_security', '提前说清楚', '把你们下一步的安排讲明白，模糊本身就是消耗'],
    ['mot_purpose', '意义要落地', '跟他聊一件「这事对谁有用」，而不是「这事值多少钱」'],
    ['mot_hedonism', '一起浪费时间', '安排一个没有任何产出的下午，允许纯粹开心'],
  ];

  const aTop = pick(aS, motives.map((m) => m[0]))[0];
  const bTop = pick(bS, motives.map((m) => m[0]))[0];

  for (const [dim, title, text] of motives) {
    if (aTop && aTop.id === dim) green.push({ for: 'A', title, text });
    if (bTop && bTop.id === dim) green.push({ for: 'B', title, text });
  }

  /* ---- 从图式看：别踩的雷 ---- */
  const mines = [
    ['schema_abandonment', '不要说「随便你」', '这句话对他是「我要走了」的简化版，宁可说「我不同意，但我不会走」'],
    ['schema_deprivation', '不要拿关心当条件', '如果想给，就别让对方觉得欠你'],
    ['schema_defect', '不要在别人面前纠正他', '私下说都行，当众说是另一种伤害'],
    ['schema_mistrust', '别追问得太急', '查岗式的追问只会让他更确信你不可信'],
    ['schema_std', '不要替他降标准', '「这样就行了」在他是「你不用管了」'],
    ['schema_sacrifice', '不要让他一直让步', '每一次他退让，都在心里记了一笔'],
    ['schema_approval', '不要只讲道理', '他要的第一句是「你做得挺好」，然后才是建议'],
    ['schema_entitlement', '别当众驳他', '他的自尊比事实更急'],
    ['schema_negativity', '不要突然变计划', '临时改期对你是小事，对他是灾难预演'],
  ];

  const aV = pick(aS, mines.map((m) => m[0]))[0];
  const bV = pick(bS, mines.map((m) => m[0]))[0];

  for (const [dim, title, text] of mines) {
    if (aV && aV.id === dim) red.push({ for: 'A', title, text });
    if (bV && bV.id === dim) red.push({ for: 'B', title, text });
  }

  /* ---- 从道德基础看：价值排序别碰 ---- */
  const mftDims = ['mft_care', 'mft_fairness', 'mft_loyalty', 'mft_authority', 'mft_sanctity', 'mft_liberty'];
  const mftLabel = {
    mft_care: '关爱',
    mft_fairness: '公平',
    mft_loyalty: '忠诚',
    mft_authority: '权威',
    mft_sanctity: '圣洁',
    mft_liberty: '自由',
  };
  const aMft = pick(aS, mftDims)[0];
  const bMft = pick(bS, mftDims)[0];
  const aMftLow = [...mftDims].map((d) => ({ id: d, v: aS[d] })).filter((x) => Number.isFinite(x.v)).sort((x, y) => x.v - y.v)[0];
  const bMftLow = [...mftDims].map((d) => ({ id: d, v: bS[d] })).filter((x) => Number.isFinite(x.v)).sort((x, y) => x.v - y.v)[0];

  if (aMft && Number.isFinite(aMft.v)) {
    green.push({
      for: 'A',
      title: `他的底线是「${mftLabel[aMft.id]}」`,
      text: '在这件事上不要讲效率和划算，那是他判断一个人值不值得深交的地方',
    });
  }
  if (bMft && Number.isFinite(bMft.v)) {
    green.push({
      for: 'B',
      title: `他的底线是「${mftLabel[bMft.id]}」`,
      text: '在这件事上不要讲效率和划算，那是他判断一个人值不值得深交的地方',
    });
  }
  if (aMftLow && Number.isFinite(aMftLow.v)) {
    red.push({
      for: 'A',
      title: `别拿「${mftLabel[aMftLow.id]}」要求他`,
      text: '这一项在他身上本来就弱，用道德去要求，只会换来敷衍而不是认同',
    });
  }
  if (bMftLow && Number.isFinite(bMftLow.v)) {
    red.push({
      for: 'B',
      title: `别拿「${mftLabel[bMftLow.id]}」要求他`,
      text: '这一项在他身上本来就弱，用道德去要求，只会换来敷衍而不是认同',
    });
  }

  return { green: green.slice(0, 6), red: red.slice(0, 6) };
}

const SLOT_COLORS = { a: '#8C4A32', b: '#3B4D70' };

/* ------------------------------------------------------------
   输入槽
   ------------------------------------------------------------ */

function slotInput(key, label, initial, onParse, dimOrder = []) {
  const color = SLOT_COLORS[key];

  const ta = el('textarea', {
    class: 'field field--code',
    rows: '4',
    placeholder: '粘贴 HA4- 开头的存档码（HA3- 亦可）',
  });
  if (initial) ta.value = initial;

  const status = el('div', { class: 'cmp-slot__status', text: initial ? '已载入' : '等待输入' });
  if (initial) status.classList.add('is-ok');

  const pasteBtn = el('button', {
    class: 'btn btn--xs btn--gold',
    type: 'button',
    text: '粘贴',
    onclick: async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          ta.value = text.trim();
          ta.dispatchEvent(new Event('input'));
        }
      } catch {
        toast('无法读取剪贴板，请手动粘贴');
      }
    },
  });

  const slot = el('div', { class: 'cmp-slot', style: { '--slot-c': color } });
  slot.appendChild(el('div', { class: 'cmp-slot__head' }, [
    el('span', { class: 'cmp-slot__dot' }),
    el('h3', { text: label }),
    el('span', { class: 'cmp-slot__badge', text: key.toUpperCase() }),
  ]));
  slot.appendChild(ta);
  slot.appendChild(el('div', { class: 'cmp-slot__foot' }, [pasteBtn, status]));

  const handle = () => {
    const raw = ta.value.trim();
    if (!raw) {
      status.textContent = '等待输入';
      status.className = 'cmp-slot__status';
      onParse(null);
      return;
    }
    const res = decodeSoulCode(raw, dimOrder);
    if (!res.ok) {
      status.textContent = res.error || '无法解析';
      status.className = 'cmp-slot__status is-err';
      onParse(null);
      return;
    }
    status.textContent = `${displayName(res.state)} · ${res.state.completedVolumes.length} 卷`;
    status.className = 'cmp-slot__status is-ok';
    onParse(res.state);
  };

  let timer = 0;
  ta.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(handle, 320);
  });

  if (initial) handle();

  return { node: slot, ta, status, getValue: () => ta.value };
}

function renderCompare(root, ctx) {
  const { App, DATA, soulCode } = ctx;
  const C = getComputedStyle(document.documentElement);
  const col = (k) => C.getPropertyValue(k).trim();

  root.classList.add('view');
  const wrap = el('div');
  root.appendChild(wrap);

  wrap.appendChild(el('div', { class: 'cmp-intro' }, [
    el('div', { class: 'eyebrow', style: { marginBottom: '14px' }, text: 'Soul Alignment · 双人对比' }),
    el('h1', { text: '两个人的暗线' }),
    el('p', {
      text: '把两份存档码放进同一个房间。系统只比较你们共同完成的卷宗——不必强迫任何一方做满 152 题。它会算出你们的价值共振、性格互补，以及那些最容易在深夜引爆的阴影碰撞。',
    }),
  ]));

  let stateA = null;
  let stateB = null;

  const resultBox = el('div', { id: 'cmp-result' });

  const selfCode = App.state.completedVolumes.length ? soulCode() : '';

  const form = el('div', { class: 'cmp-form' });

  const slotA = slotInput('a', 'A · 你', selfCode, (s) => {
    stateA = s ? hydrate({ ...s, nickname: s.nickname || App.state.nickname || '你' }) : null;
    maybeRender();
  }, DATA.dimOrder);
  const slotB = slotInput('b', 'B · 对方', '', (s) => {
    stateB = s;
    maybeRender();
  }, DATA.dimOrder);

  form.appendChild(slotA.node);
  form.appendChild(slotB.node);
  wrap.appendChild(form);

  const actions = el('div', {
    style: { display: 'flex', gap: '10px', marginTop: '18px', flexWrap: 'wrap' },
  }, [
    el('button', {
      class: 'btn btn--solid',
      type: 'button',
      text: '计算契合度',
      onclick: () => maybeRender(true),
    }),
    el('button', {
      class: 'btn btn--ghost',
      type: 'button',
      text: '清空',
      onclick: () => {
        slotB.ta.value = '';
        slotB.ta.dispatchEvent(new Event('input'));
        resultBox.innerHTML = '';
      },
    }),
    !App.state.completedVolumes.length
      ? el('span', { class: 'chip', style: { alignSelf: 'center', padding: '8px 14px' }, text: '先完成至少一卷，才能生成你自己的存档码' })
      : null,
  ]);
  wrap.appendChild(actions);

  wrap.appendChild(resultBox);

  function hydrate(s) {
    // 存档码只带分数，这里补齐 computedScores 结构
    const out = { ...s };
    out.computedScores = { ...(s.computedScores || {}) };
    if (!out.completedVolumes) out.completedVolumes = [];
    return out;
  }

  function maybeRender(force = false) {
    if (!stateA || !stateB) {
      if (force) toast('需要两份有效的存档码');
      resultBox.innerHTML = '';
      return;
    }
    renderResult(resultBox, stateA, stateB, { DATA, col });
  }
}

/* ───────── src/core/express.js ───────── */
/* ============================================================
   express.js — 28 题「初见微光」极速模式

   设计要点：
   1. 题目不复制，只引用原卷题目 id。作答完成后写回**原卷**的
      answersByVolume，因此与十六卷完整模式 100% 互通：
       · 极速版答过的题，进完整卷时自动显示为已答
       · 完整卷答过的题，进极速版时自动跳过
   2. 会话期间答案暂存在 state.answersByVolume.__express 这个
      虚拟桶里，避免污染任何真实卷的「进度」与「完成度」。
   3. 极速模式不写 completedVolumes，因此不会误触发跨卷解锁门槛。
   ============================================================ */

const EXPRESS_BUCKET = '__express';

/**
 * 由 EXPRESS 清单与原题库拼出一个虚拟卷对象。
 * 形态与 volumes/volX.json 完全一致，因此可以直接喂给 renderQuiz。
 */
function buildExpressVolume(DATA, EXPRESS) {
  const ids = EXPRESS?.questions || [];
  const questions = [];

  for (const vol of Object.values(DATA.volumes)) {
    for (const q of vol.questions || []) {
      if (!ids.includes(q.id)) continue;
      questions.push({ ...q, _srcVol: vol.volume_id, _srcTitle: vol.title });
    }
  }
  // 按清单顺序排列，保证每次进入顺序一致
  questions.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));

  const dims = new Set();
  for (const q of questions) {
    for (const o of q.options || []) {
      Object.keys(o.effects || {}).forEach((k) => dims.add(k));
    }
    Object.keys(q.effects || {}).forEach((k) => dims.add(k));
  }

  return {
    volume_id: EXPRESS_BUCKET,
    index: 0,
    title: EXPRESS?.title || '初见微光',
    subtitle: EXPRESS?.subtitle || '28 题 · 约 4 分钟',
    theme_color: '#9A7B45',
    estimated_minutes: EXPRESS?.estimated_minutes || 4,
    intro: EXPRESS?.intro || '',
    dimensions: Array.from(dims),
    questions,
    isExpress: true,
  };
}

/** 该题是否已经在原卷里被答过 */
function alreadyAnswered(state, srcVol, qid) {
  const rec = state.answersByVolume?.[srcVol]?.[qid];
  return rec && rec.value !== undefined;
}

/**
 * 进入极速模式前，把原卷里已答的题灌进虚拟桶。
 * 这样用户不会看到「已经答过的题又要再答一遍」。
 */
function seedFromVolumes(state, expressVol) {
  const bucket = (state.answersByVolume[EXPRESS_BUCKET] ||= {});
  let seeded = 0;
  for (const q of expressVol.questions) {
    const src = state.answersByVolume?.[q._srcVol]?.[q.id];
    if (src && src.value !== undefined && bucket[q.id] === undefined) {
      bucket[q.id] = { ...src };
      seeded += 1;
    }
  }
  return seeded;
}

/**
 * 收卷：把虚拟桶里的答案按来源卷写回真实卷。
 * 写完删除虚拟桶，避免它出现在存档码维度之外的任何统计里。
 */
function commitExpress(state, expressVol) {
  const bucket = state.answersByVolume[EXPRESS_BUCKET] || {};
  let moved = 0;

  for (const q of expressVol.questions) {
    const rec = bucket[q.id];
    if (!rec || rec.value === undefined) continue;
    const target = (state.answersByVolume[q._srcVol] ||= {});
    // 不覆盖已有作答（用户可能先做了完整卷）
    if (target[q.id] && target[q.id].value !== undefined) continue;
    target[q.id] = rec;
    if (state.telemetry && rec.ms) {
      state.telemetry[q.id] = {
        ...(state.telemetry[q.id] || {}),
        ms: rec.ms,
        changes: rec.changes || 0,
      };
    }
    moved += 1;
  }

  delete state.answersByVolume[EXPRESS_BUCKET];
  delete state.inProgress[EXPRESS_BUCKET];
  return moved;
}

/** 极速会话已答数（排除来自原卷的预填） */
function expressProgress(state, expressVol) {
  const bucket = state.answersByVolume?.[EXPRESS_BUCKET] || {};
  const answered = expressVol.questions.filter((q) => bucket[q.id]?.value !== undefined).length;
  return { answered, total: expressVol.questions.length };
}

/** 本期极速作答覆盖了哪些维度（用于简报页脚） */
function expressDimCoverage(expressVol) {
  const dims = new Set(expressVol.dimensions || []);
  return { count: dims.size, dims: Array.from(dims) };
}

/* ------------------------------------------------------------
   HA4J- 短码：12 个维度分数（0–100，1 字节一个）
   ------------------------------------------------------------ */

const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

function toB64(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i += 3) {
    const b0 = bytes[i];
    const b1 = bytes[i + 1];
    const b2 = bytes[i + 2];
    out += B64[b0 >> 2];
    out += B64[((b0 & 3) << 4) | ((b1 ?? 0) >> 4)];
    if (b1 === undefined) break;
    out += B64[((b1 & 15) << 2) | ((b2 ?? 0) >> 6)];
    if (b2 === undefined) break;
    out += B64[b2 & 63];
  }
  return out;
}

function fromB64(str) {
  const clean = String(str || '').replace(/[^A-Za-z0-9\-_]/g, '');
  const bytes = [];
  let buf = 0;
  let bits = 0;
  for (const ch of clean) {
    const idx = B64.indexOf(ch);
    if (idx < 0) continue;
    buf = (buf << 6) | idx;
    bits += 6;
    if (bits >= 8) {
      bits -= 8;
      bytes.push((buf >> bits) & 0xff);
    }
  }
  return new Uint8Array(bytes);
}

function sum8(bytes) {
  let h = 0x2b;
  for (const b of bytes) h = (h * 31 + b) & 0xff;
  return h;
}

/** 编码：version(1) + 12 维 + 昵称 UTF8 + 校验(1) */
function encodeJohari(scores, nickname = '') {
  const body = [1];
  for (const d of JOHARI_DIMS) {
    const v = scores?.[d];
    body.push(Number.isFinite(v) ? clamp(Math.round(v), 0, 100) : 255);
  }
  const nameBytes = [...new TextEncoder().encode(String(nickname).slice(0, 12))];
  body.push(...nameBytes);

  const bytes = new Uint8Array(body.length + 1);
  bytes.set(body, 0);
  bytes[body.length] = sum8(Uint8Array.from(body));
  return `HA4J-${toB64(bytes)}`;
}

function decodeJohari(code) {
  const raw = String(code || '').trim();
  if (!/^HA4J-/i.test(raw)) return { ok: false, error: '不是 HA4J- 开头的印象码' };
  const bytes = fromB64(raw.slice(5));
  if (bytes.length < 14) return { ok: false, error: '印象码长度异常' };
  if (sum8(bytes.subarray(0, bytes.length - 1)) !== bytes[bytes.length - 1]) {
    return { ok: false, error: '校验失败' };
  }
  if (bytes[0] !== 1) return { ok: false, error: '不支持的印象码版本' };

  const scores = {};
  JOHARI_DIMS.forEach((d, i) => {
    const b = bytes[1 + i];
    if (b !== 255) scores[d] = b;
  });
  const nickname = new TextDecoder().decode(bytes.subarray(13, bytes.length - 1)).replace(/\u0000/g, '').trim();
  return { ok: true, scores, nickname };
}

/* ------------------------------------------------------------
   四象限
   ------------------------------------------------------------ */

/**
 * @param {Object} selfScores  本人 12 维真实分
 * @param {Array}  guesses     好友作答：[{ dim, pick(0–3) }]
 * @returns {{ quadrants, open, blind, facade, unknown, agreement }}
 */
function johariResult(selfScores, guesses) {
  const open = [];
  const blind = [];
  const facade = [];
  const unknown = [];

  const selfMean = (() => {
    const v = JOHARI_DIMS.map((d) => selfScores?.[d]).filter(Number.isFinite);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 50;
  })();

  const guessMap = new Map();
  for (const g of guesses || []) guessMap.set(g.dim, g.pick);

  for (const d of JOHARI_DIMS) {
    const sv = selfScores?.[d];
    const pick = guessMap.get(d);
    if (!Number.isFinite(sv) || pick === undefined) continue;

    /* 把 4 档折算成 0–100 的估计分 */
    const gv = clamp((Number(pick) / 3) * 100, 0, 100);
    const selfHigh = sv >= selfMean;
    const friendHigh = gv >= 50;

    const row = { dim: d, self: round(sv, 0), friend: round(gv, 0) };

    if (selfHigh && friendHigh) open.push(row);          // 公开区
    else if (!selfHigh && friendHigh) blind.push(row);   // 盲区：他人看见，你没看见
    else if (selfHigh && !friendHigh) facade.push(row);  // 隐藏区
    else unknown.push(row);                              // 未知区
  }

  /* 一致度：|self − friend| 的均值反推 */
  const all = [...open, ...blind, ...facade, ...unknown];
  const agreement = all.length
    ? round(100 - all.reduce((s, r) => s + Math.abs(r.self - r.friend), 0) / all.length, 1)
    : null;

  return { open, blind, facade, unknown, agreement };
}

/** 按维度名取中文，供 UI 用 */
function labelOf(dim, dimMap) {
  return dimMap?.[dim]?.name || dim;
}

/**
 * 为每个成员分配生态位。
 * 用加权契合度，同一角色不给两个人（贪心 + 分数降序）。
 */
function assignRoles(members, DATA) {
  if (!members.length) return [];

  const scored = [];
  for (let i = 0; i < members.length; i += 1) {
    const s = members[i].state.computedScores || {};
    for (const role of SQUAD_ROLES) {
      let acc = 0;
      let wSum = 0;
      for (const [dim, w] of Object.entries(role.weights)) {
        const v = s[dim];
        if (!Number.isFinite(v)) continue;
        const mag = Math.abs(w);
        acc += (w < 0 ? 100 - v : v) * mag;
        wSum += mag;
      }
      if (wSum <= 0) continue;
      scored.push({ idx: i, role: role.id, fit: round(acc / wSum, 1) });
    }
  }

  scored.sort((a, b) => b.fit - a.fit);

  const usedMember = new Set();
  const usedRole = new Set();
  const out = members.map((m, i) => ({
    idx: i,
    name: m.name,
    state: m.state,
    role: null,
    roleFit: 0,
  }));

  for (const s of scored) {
    if (usedMember.has(s.idx) || usedRole.has(s.role)) continue;
    usedMember.add(s.idx);
    usedRole.add(s.role);
    out[s.idx].role = s.role;
    out[s.idx].roleFit = s.fit;
    if (usedMember.size === members.length) break;
  }

  /* 剩下的人（角色数少于人数时）按最高分补 */
  for (const m of out) {
    if (m.role) continue;
    const best = scored.filter((s) => s.idx === m.idx).sort((a, b) => b.fit - a.fit)[0];
    if (best) { m.role = best.role; m.roleFit = best.fit; }
  }

  void DATA;
  return out;
}

function roleMeta(id) {
  return SQUAD_ROLES.find((r) => r.id === id) || null;
}

/* ------------------------------------------------------------
   2. 缘分热力矩阵
   ------------------------------------------------------------ */

/**
 * @returns {{ matrix: number[][], best: {i,j,score}, worst: {i,j,score} }}
 */
function affinityMatrix(members, DATA) {
  const n = members.length;
  const matrix = Array.from({ length: n }, () => Array(n).fill(null));

  for (let i = 0; i < n; i += 1) {
    matrix[i][i] = 100;
    for (let j = i + 1; j < n; j += 1) {
      let score = null;
      try {
        const res = compareStates(members[i].state, members[j].state, DATA);
        if (res?.ok && Number.isFinite(res.overall)) score = round(res.overall, 1);
      } catch {
        score = null;
      }
      matrix[i][j] = score;
      matrix[j][i] = score;
    }
  }

  const pairs = [];
  for (let i = 0; i < n; i += 1) {
    for (let j = i + 1; j < n; j += 1) {
      if (Number.isFinite(matrix[i][j])) pairs.push({ i, j, score: matrix[i][j] });
    }
  }
  pairs.sort((a, b) => b.score - a.score);

  return {
    matrix,
    best: pairs[0] || null,
    worst: pairs[pairs.length - 1] || null,
    pairs,
  };
}

   3. 群体覆盖与短板
   ------------------------------------------------------------ */

/** 常用能力维度：整个小队在这些轴上的覆盖情况 */
const COVER_DIMS = [
  'big5_order', 'big5_open', 'big5_assert', 'big5_compassion',
  'cog_global', 'cog_logic', 'mot_autonomy', 'mot_belonging',
  'mot_mastery', 'mot_purpose', 'light_kant', 'dark_mach',
  'tki_collaborating', 'time_future', 'hsp_sensory', 'att_advance_placeholder',
];

/**
 * 每个人的强项是否被整个小队覆盖。
 * 「共同短板」= 所有人在这条轴上都低于 55。
 */
function coverage(members, DATA) {
  const dims = COVER_DIMS.filter((d) => d !== 'att_advance_placeholder');
  const rows = [];

  for (const d of dims) {
    const vals = members
      .map((m) => m.state.computedScores?.[d])
      .filter(Number.isFinite);
    if (!vals.length) continue;
    const max = Math.max(...vals);
    const avg = mean(vals);
    rows.push({
      dim: d,
      name: DATA.dimMap?.[d]?.name || d,
      max: round(max, 0),
      avg: round(avg, 0),
      covered: max >= 60,
    });
  }

  const gaps = rows.filter((r) => !r.covered);
  const strong = rows.filter((r) => r.covered).sort((a, b) => b.max - a.max);

  return { rows, gaps, strong };
}

function squadCharter(members, roles, gaps) {
  const lines = [];

  const r = (id) => roles.find((x) => x.role === id);

  if (r('operator')) {
    lines.push(`${r('operator').name} 大概率是真正推动事情的人，但他的动作不一定让所有人看见。定期问一句「现在是谁在推」，能省掉很多误会。`);
  }
  if (r('igniter') && r('risk')) {
    lines.push(`${r('igniter').name} 会先冲，${r('risk').name} 会先拦。这不是矛盾，是这支队伍最值钱的一组刹车与油门——只要两个人互相知道对方在做什么。`);
  }
  if (r('warmer')) {
    lines.push(`${r('warmer').name} 承担的调温工作通常不会被记功。把「谁在照顾气氛」明确说出来，能防止这种劳动长期隐形。`);
  }
  if (r('anchor')) {
    lines.push(`${r('anchor').name} 一沉默，全队会本能地紧张。他的稳定是公共资源，也需要被回充——别只在出事时才找他。`);
  }
  if (r('longhaul')) {
    lines.push(`${r('longhaul').name} 说的是三年后的事，容易被当下的紧迫感压过去。每次决策留五分钟专门听这一段。`);
  }

  if (gaps.length) {
    lines.push(`整支队伍在「${gaps.slice(0, 3).map((g) => g.name).join('、')}」上都没有人明显强——这不是谁的错，是结构缺口。要么外请一个补位，要么明确承认这块没人负责。`);
  } else {
    lines.push('这支队伍在常见的能力轴上都有人覆盖，真正的风险不在能力，而在分工是否被说清楚过。');
  }

  return lines;
}

  const submitBtn = el('button', {

      submitBtn.disabled = true;
    } else {
      submitBtn.textContent = '揭晓四象限';
      submitBtn.disabled = false;
    }
  }
  checkReady();
}

function labelOfLocal(dim, DATA) {

function summaryOf(res, name) {
  const parts = [];
  if (res.blind.length) {
    parts.push(`你看见了 ${res.blind.length} 处他自己没注意的地方——这通常是他在别人面前比在自己心里更清楚的部分。`);
  }
  if (res.facade.length) {
    parts.push(`另有 ${res.facade.length} 处他很强，但藏得比较好，你这次没接住。`);
  }
  if (res.unknown.length > 4) {
    parts.push('还有不少留白，说明这些题不足以覆盖他的全部。');
  }
  parts.unshift(`这是 ${name} 在一个人眼里的一个切面，不是结论。`);
  return parts.join('');
}

function renderSquad(root, ctx) {
  const { DATA } = ctx;

  root.classList.add('view');

  const hero = el('div', { class: 'express-hero' });

  hero.appendChild(el('h1', { text: '一支队伍的形状' }));
  hero.appendChild(el('p', {
    text: '把 3–6 份存档码放在一起。系统会给每个人分配一个隐形生态位，'
      + '算出一张两两之间的缘分矩阵，并指出整支队伍共同缺的那块板。',
  }));
  wrap.appendChild(hero);

  const box = el('div', { class: 'squad-input' });
  wrap.appendChild(box);

  const rows = [];
  const resultBox = el('div', { class: 'squad-result' });
  wrap.appendChild(resultBox);

  function addSlot(idx) {
    const ta = el('textarea', {
      class: 'field field--code',
      rows: '2',
      placeholder: `第 ${idx + 1} 个人的 HA4- 存档码（或昵称）`,
    });
    const nameInput = el('input', {
      class: 'field',
      type: 'text',
      maxlength: '8',
      placeholder: '称呼（可空）',
      style: { maxWidth: '140px' },
    });
    const row = el('div', { class: 'squad-slot' }, [
      el('span', { class: 'squad-slot__no', text: String(idx + 1) }),
      ta,
      nameInput,
    ]);
    rows.push({ ta, nameInput, row });
    box.appendChild(row);
  }

  for (let i = 0; i < 3; i += 1) addSlot(i);

  box.appendChild(el('div', { class: 'express-actions' }, [
    el('button', {
      class: 'btn btn--sm',
      type: 'button',
      text: '+ 加一个人',
      onclick: () => {
        if (rows.length >= 6) { toast('最多 6 人'); return; }
        addSlot(rows.length);
      },
    }),
    el('button', {
      class: 'btn btn--solid',
      type: 'button',
      text: '生成群像',
      onclick: () => build(),
    }),
  ]));

  function build() {
    const members = [];
    const dimOrder = DATA.dimOrder;

    for (const r of rows) {
      const raw = r.ta.value.trim();
      if (!raw) continue;
      const dec = decodeSoulCode(raw, dimOrder);
      if (!dec.ok) { toast(`第 ${members.length + 1} 份解析失败：${dec.error}`); return; }
      members.push({
        name: r.nameInput.value.trim() || dec.state.nickname || `成员 ${members.length + 1}`,
        state: dec.state,
      });
    }

    if (members.length < 3) { toast('至少需要 3 份有效存档码'); return; }

    resultBox.innerHTML = '';
    renderSquadResult(resultBox, members, DATA);
    resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderSquadResult(box, members, DATA) {
  const roles = assignRoles(members, DATA);
  const aff = affinityMatrix(members, DATA);
  const cov = coverage(members, DATA);
  const charter = squadCharter(members, roles, cov.gaps);

  /* ---- 生态位 ---- */
  box.appendChild(socialHead('01', '小队生态位', `${members.length} 人 · 六种角色自动分配`));
  const roleGrid = el('div', { class: 'squad-roles' });
  roles.forEach((m) => {
    const meta = roleMeta(m.role);
    roleGrid.appendChild(el('div', { class: 'squad-role' }, [
      el('div', { class: 'squad-role__name', text: m.name }),
      el('div', { class: 'squad-role__tag', text: meta?.name || '—' }),
      el('p', { class: 'squad-role__desc', text: meta?.desc || '' }),
      el('span', { class: 'squad-role__fit', text: `契合 ${Math.round(m.roleFit)}` }),
    ]));
  });
  box.appendChild(roleGrid);

  /* ---- 缘分矩阵 ---- */
  if (aff.pairs.length) {
    box.appendChild(socialHead('02', '缘分热力矩阵', '数值为双人契合度，深色代表更合拍'));
    const table = el('table', { class: 'affinity' });
    const thead = el('thead');
    const hr = el('tr');
    hr.appendChild(el('th', { text: '' }));
    members.forEach((m) => hr.appendChild(el('th', { text: m.name })));
    thead.appendChild(hr);
    table.appendChild(thead);

    const tbody = el('tbody');
    members.forEach((m, i) => {
      const tr = el('tr');
      tr.appendChild(el('th', { text: m.name }));
      members.forEach((_, j) => {
        const v = aff.matrix[i][j];
        const td = el('td');
        if (Number.isFinite(v)) {
          td.textContent = String(Math.round(v));
          td.style.background = `color-mix(in srgb, var(--gold) ${Math.round((v - 30) * 0.9)}%, transparent)`;
          if (i === j) td.style.opacity = '0.35';
        } else {
          td.textContent = '—';
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);

    if (aff.best) {
      box.appendChild(el('p', {
        class: 'sandbox__lead',
        text: `最合拍的两人：${members[aff.best.i].name} × ${members[aff.best.j].name}（${aff.best.score}）；`
          + `最需要留意的：${members[aff.worst.i].name} × ${members[aff.worst.j].name}（${aff.worst.score}）。`,
      }));
    }
  }

  /* ---- 覆盖与短板 ---- */
  box.appendChild(socialHead('03', '群体覆盖与共同短板', '这条轴有没有人在 60 分以上'));

  const covList = el('div', { class: 'squad-cov' });
  cov.rows.forEach((r) => {
    covList.appendChild(el('div', { class: `squad-cov__row${r.covered ? '' : ' is-gap'}` }, [
      el('span', { class: 'squad-cov__name', text: r.name }),
      el('span', { class: 'squad-cov__avg', text: `均 ${r.avg}` }),
      el('span', { class: 'squad-cov__max', text: `最高 ${r.max}` }),
      el('span', { class: 'squad-cov__tag', text: r.covered ? '已覆盖' : '缺口' }),
    ]));
  });
  box.appendChild(covList);

  /* ---- 公约 ---- */
  box.appendChild(socialHead('04', '小队相处公约', '从角色与缺口自动提炼'));
  const list = el('div', { class: 'squad-charter' });
  charter.forEach((line, i) => {
    list.appendChild(el('div', { class: 'squad-charter__item' }, [
      el('span', { class: 'squad-charter__no', text: String(i + 1).padStart(2, '0') }),
      el('p', { text: line }),
    ]));
  });
  box.appendChild(list);
}

/* ───────── src/main.js ───────── */
/* ============================================================
   main.js — 应用启动 / Hash 路由 / 全局状态
   ============================================================ */
















/* ------------------------------------------------------------
   数据装配
   ------------------------------------------------------------ */

const DATA = {
  dimensions: DIMENSIONS,
  volumes: VOLUMES,
  mirrors: MIRRORS,
  archetypes: ARCHETYPES,
  crossRules: CROSS_RULES,
  pairRules: PAIR_RULES,
  dimOrder: DIM_ORDER,
  dimMap: DIM_MAP,
  values: DIMENSIONS.values || [],
  pressureStyles: DIMENSIONS.pressureStyles || [],
  express: EXPRESS,
};

const VOL_IDS = Object.keys(VOLUMES).sort((a, b) => VOLUMES[a].index - VOLUMES[b].index);

/* ------------------------------------------------------------
   全局状态
   ------------------------------------------------------------ */

const App = {
  state: load(),
  theme: loadTheme(),
  route: '',
};

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  App.theme = theme;
  saveTheme(theme);
  const btn = qs('#theme-toggle');
  if (btn) {
    btn.setAttribute('aria-label', theme === 'dark' ? '切换到光之纸境' : '切换到暗夜档案馆');
    btn.innerHTML = theme === 'dark'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="4.4"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20.2 14.6A8.4 8.4 0 1 1 9.4 3.8a6.6 6.6 0 0 0 10.8 10.8Z"/></svg>`;
  }
}

/* ------------------------------------------------------------
   计分刷新
   ------------------------------------------------------------ */

function recompute({ silent = true } = {}) {
  const s = App.state;

  // 逐卷算分并写回
  const all = computeAll(s, DATA);
  s.computedScores = {};
  for (const d of DIM_ORDER) {
    const v = all.scores[d];
    if (Number.isFinite(v)) s.computedScores[d] = v;
  }

  // 个人内部相对尖峰：报告的「王牌天赋 / 阴影预警」按 |Z| 排序时才用得到
  s.zScores = {};
  for (const d of DIM_ORDER) {
    const z = all.zScores?.[d];
    if (Number.isFinite(z)) s.zScores[d] = z;
  }

  const mask = maskIndex(s, DATA);
  s.maskIndex = mask.value === null ? null : mask.value;
  s.maskDetail = mask;

  // Top3 价值
  s.topValues = all.topValues || [];

  // 压力退行态
  s.pressureStyle = all.pressure || null;

  save(s, { immediate: silent });
  return all;
}

/* ------------------------------------------------------------
   存档码
   ------------------------------------------------------------ */

function soulCode() {
  return encodeSoulCode(App.state, DIM_ORDER);
}

function importSoulCode(text, { merge = true } = {}) {
  const res = decodeSoulCode(text, DIM_ORDER);
  if (!res.ok) return res;

  const incoming = res.state;
  if (!merge) {
    App.state = { ...App.state, ...incoming };
  } else {
    const s = App.state;
    s.nickname = s.nickname || incoming.nickname;
    s.completedVolumes = Array.from(new Set([...(s.completedVolumes || []), ...(incoming.completedVolumes || [])]));
    s.computedScores = { ...(incoming.computedScores || {}), ...(s.computedScores || {}) };
    s.maskIndex = Number.isFinite(s.maskIndex) ? s.maskIndex : incoming.maskIndex;
    if (!s.topValues?.length) s.topValues = incoming.topValues || [];
    save(s, { immediate: true });
  }
  recompute({ silent: true });
  return { ok: true, state: App.state };
}

/* ------------------------------------------------------------
   外壳
   ------------------------------------------------------------ */

const BRAND_MARK = `<svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="0.8" opacity="0.45"/>
  <circle cx="16" cy="16" r="9.5" stroke="currentColor" stroke-width="0.6" opacity="0.28"/>
  <path d="M16 2v28M2 16h28" stroke="currentColor" stroke-width="0.5" opacity="0.22"/>
  <circle cx="16" cy="16" r="3.6" stroke="currentColor" stroke-width="1"/>
  <path d="M16 7.5v2M16 22.5v2M7.5 16h2M22.5 16h2" stroke="currentColor" stroke-width="0.9"/>
</svg>`;

function mountShell() {
  const app = qs('#app');
  app.innerHTML = '';

  const masthead = el('header', { class: 'masthead' });
  const inner = el('div', { class: 'masthead__inner' });

  const brand = el('a', {
    class: 'brand',
    href: '#/',
    'aria-label': '返回卷宗大厅',
  });
  brand.innerHTML = `${BRAND_MARK}
    <span class="brand__name">人性全息图谱</span>
    <span class="brand__latin">The Human Atlas</span>`;
  inner.appendChild(brand);

  const nav = el('nav', { class: 'masthead__nav', 'aria-label': '主导航' });

  const navItems = [
    { href: '#/', label: '卷宗大厅', key: 'hub' },
    { href: '#/report', label: '全息报告', key: 'report' },
    { href: '#/compare', label: '双人对比', key: 'compare' },
  ];

  navItems.forEach((it) => {
    nav.appendChild(el('a', {
      class: 'nav-btn nav-btn--text',
      href: it.href,
      dataset: { nav: it.key },
    }, [el('span', { class: 'nav-btn__label', text: it.label })]));
  });

  const themeBtn = el('button', {
    class: 'theme-toggle',
    id: 'theme-toggle',
    type: 'button',
    onclick: () => applyTheme(App.theme === 'dark' ? 'light' : 'dark'),
  });
  nav.appendChild(themeBtn);

  inner.appendChild(nav);
  masthead.appendChild(inner);
  app.appendChild(masthead);

  const main = el('main', { id: 'view-root', class: 'page' });
  app.appendChild(main);

  applyTheme(App.theme);

  // 键盘快捷键：T 切换主题
  window.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    if (e.key === 't' || e.key === 'T') {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      applyTheme(App.theme === 'dark' ? 'light' : 'dark');
    }
  });
}

function setActiveNav(key) {
  document.querySelectorAll('[data-nav]').forEach((n) => {
    if (n.dataset.nav === key) n.setAttribute('aria-current', 'page');
    else n.removeAttribute('aria-current');
  });
}

/* ------------------------------------------------------------
   路由
   ------------------------------------------------------------ */

function render(route) {
  const root = qs('#view-root');
  if (!root) return;
  document.body.classList.remove('is-immersive');
  root.innerHTML = '';
  root.className = 'page';

  const { parts } = route;
  const head = parts[0] || '';

  if (head === '' || head === 'hub') {
    setActiveNav('hub');
    renderHub(root, { App, DATA, VOL_IDS, recompute, soulCode, importSoulCode, go });
    return;
  }

  if (head === 'vol' && parts[1]) {
    setActiveNav('hub');
    root.className = 'page page--narrow';
    renderQuiz(root, { App, DATA, volId: parts[1], mode: 'intro', recompute, go });
    return;
  }

  // 乔哈里窗 / 群像星图
  if (head === 'johari') {
    root.className = 'page';
    renderJohari(root, { App, DATA, go });
    return;
  }

  if (head === 'squad') {
    root.className = 'page';
    renderSquad(root, { App, DATA, go });
    return;
  }

  // 极速模式：入口 / 答题 / 简报
  if (head === 'express') {
    document.body.classList.remove('is-immersive');
    if (parts[1] === 'quiz') {
      root.className = 'page page--narrow page--immersive';
      document.body.classList.add('is-immersive');
      const vol = buildExpressVolume(DATA, DATA.express);
      // 只把虚拟卷挂进 DATA，App.state 保持同一个引用 ——
      // 否则 renderQuiz 里的 save() 会写入一份副本，进度就存不回来了。
      const dataWithExpress = { ...DATA, volumes: { ...DATA.volumes, [vol.volume_id]: vol } };
      seedFromVolumes(App.state, vol);
      renderQuiz(root, {
        App,
        DATA: dataWithExpress,
        volId: vol.volume_id,
        mode: 'run',
        recompute,
        go,
      });
      return;
    }
    if (parts[1] === 'result') {
      root.className = 'page';
      renderExpressResult(root, { App, DATA, recompute, soulCode, go });
      return;
    }
    root.className = 'page';
    renderExpressIntro(root, { App, DATA, go });
    return;
  }

  if (head === 'quiz' && parts[1]) {
    setActiveNav('hub');
    root.className = 'page page--narrow page--immersive';
    // 沉浸模式：收起顶栏冗余入口，答题区独占整屏
    document.body.classList.add('is-immersive');
    renderQuiz(root, { App, DATA, volId: parts[1], mode: 'run', recompute, go });
    return;
  }
  document.body.classList.remove('is-immersive');

  if (head === 'report') {
    setActiveNav('report');
    root.className = 'page';
    renderReport(root, { App, DATA, volId: parts[1] || null, VOL_IDS, recompute, soulCode, go });
    return;
  }

  if (head === 'compare') {
    setActiveNav('compare');
    root.className = 'page';
    renderCompare(root, { App, DATA, VOL_IDS, soulCode, importSoulCode, go });
    return;
  }

  // fallback
  go('#/');
}

function onRouteChange() {
  App.route = location.hash || '#/';
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  render(parseHash());
}

/* ------------------------------------------------------------
   启动
   ------------------------------------------------------------ */

function boot() {
  mountShell();

  // 首次启动：确保分数与当前存档一致
  if (Object.keys(App.state.answersByVolume || {}).length) {
    try { recompute({ silent: true }); } catch (e) { console.warn('[boot] recompute failed', e); }
  }

  if (!location.hash) {
    location.replace('#/');
  }

  window.addEventListener('hashchange', onRouteChange);
  onRouteChange();

  // 导出钩子，供控制台/测试使用
  window.HumanAtlas = {
    App, DATA, recompute, soulCode, importSoulCode,
    reset: () => { App.state = reset(); recompute(); go('#/'); },
  };
}

boot();

})();
