/* ============================================================
   telemetry.js — 静默作答遥测：耗时 / 改选 / 阅读基线
   全程不向用户暴露"被监控"的任何提示。
   ============================================================ */



/** 每题的遥测记录存在 state.telemetry[qid] = { ms, changes, first, ts } */
function ensureTelemetry(state) {
  if (!state.telemetry || typeof state.telemetry !== 'object') state.telemetry = {};
  return state.telemetry;
}

/**
 * 脏样本阈值（v4.4 改为动态）
 *
 * 旧实现一刀切 25000ms。但 160–220 字的长题，正常逐字阅读就要 18–22 秒，
 * 真正犹豫、反复权衡的人很容易到 30–40 秒 —— 这些恰恰是最有价值的 H_lat 样本，
 * 却会被当成「切屏发呆」丢掉，导致面具厚度里的「犹豫修饰度」常年偏低。
 *
 * 现在按题面长度给阈值：
 *   · 筹码 / 金字塔（拖滑块、反复排序）  → 120s
 *   · 其余题型                            → max(55s, 字数 × 480ms)
 * 160 字 → 76.8s，220 字 → 105.6s。
 *
 * DIRTY_MS 保留为「绝对下限」，任何题都不会低于它。
 */
const DIRTY_MS = 55000;
const DIRTY_CEILING_MS = 120000;
const HIDDEN_MS = 1200;   // 单次切屏超过 1.2s 才计入扣除

/** 单题的发呆阈值（毫秒）。需在 questionChars 定义之后调用，故用函数声明提升。 */
function dirtyLimitOf(q) {
  if (!q) return DIRTY_MS;
  if (q.type === 'budget_100' || q.type === 'pyramid_top3') return DIRTY_CEILING_MS;
  const chars = questionChars(q);
  return Math.min(DIRTY_CEILING_MS, Math.max(DIRTY_MS, chars * 480));
}

function recordAnswer(state, {
  questionId,
  question = null,
  ms = 0,
  changes = 0,
  readMs = 0,
  hiddenMs = 0,
}) {
  const t = ensureTelemetry(state);
  const prev = t[questionId] || {};
  const net = Math.max(0, Math.round(ms));
  const limit = dirtyLimitOf(question);
  t[questionId] = {
    ms: net,
    readMs: Math.max(0, Math.round(readMs || net)),
    hiddenMs: Math.max(0, Math.round(hiddenMs || prev.hiddenMs || 0)),
    changes: Math.max(prev.changes || 0, Math.round(changes)),
    // 净耗时超过该题的动态上限 ⇒ 脏样本，剔出阅读基线与犹豫分
    dirty: net > limit,
    limitMs: Math.round(limit),
    ts: Date.now(),
  };
  return t[questionId];
}

/**
 * 切屏 / 失焦计时器
 * 用法：const timer = createFocusTimer();
 *       ...用户作答...
 *       timer.net()  → 扣掉切屏与失焦后的净毫秒
 *       timer.hidden() → 累计被隐藏的毫秒
 */
function createFocusTimer() {
  const startedAt = Date.now();
  let hiddenAcc = 0;
  let hiddenSince = 0;

  const isHidden = () => typeof document !== 'undefined'
    && (document.visibilityState === 'hidden' || (typeof document.hasFocus === 'function' && !document.hasFocus()));

  let hidden = isHidden();
  if (hidden) hiddenSince = startedAt;

  const onChange = () => {
    const now = isHidden();
    if (now && !hidden) {
      hidden = true;
      hiddenSince = Date.now();
    } else if (!now && hidden) {
      hidden = false;
      if (hiddenSince && Date.now() - hiddenSince > HIDDEN_MS) {
        hiddenAcc += Date.now() - hiddenSince;
      }
      hiddenSince = 0;
    }
  };

  const listeners = [];
  if (typeof document !== 'undefined') {
    document.addEventListener('visibilitychange', onChange);
    listeners.push(['visibilitychange', onChange]);
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('blur', onChange);
    window.addEventListener('focus', onChange);
    listeners.push(['blur', onChange], ['focus', onChange]);
  }

  const settle = () => {
    if (hidden && hiddenSince && Date.now() - hiddenSince > HIDDEN_MS) {
      return hiddenAcc + (Date.now() - hiddenSince);
    }
    return hiddenAcc;
  };

  return {
    net() {
      return Math.max(0, Date.now() - startedAt - settle());
    },
    hidden() {
      return settle();
    },
    dispose() {
      if (typeof document !== 'undefined') document.removeEventListener('visibilitychange', onChange);
      if (typeof window !== 'undefined') {
        window.removeEventListener('blur', onChange);
        window.removeEventListener('focus', onChange);
      }
      listeners.length = 0;
    },
  };
}

function addChange(state, questionId) {
  const t = ensureTelemetry(state);
  if (!t[questionId]) t[questionId] = { ms: 0, readMs: 0, changes: 0, ts: Date.now() };
  t[questionId].changes = (t[questionId].changes || 0) + 1;
  return t[questionId].changes;
}

function getTelemetry(state, questionId) {
  return state.telemetry?.[questionId] || { ms: 0, readMs: 0, changes: 0 };
}

/**
 * 个人阅读基线：中位阅读速度（毫秒 / 字）
 * 只采纳"已作答且时长合理"的样本，避免首题、切后台导致基线失真。
 */
function readingBaseline(state, questions = []) {
  const samples = [];
  for (const q of questions) {
    const rec = state.telemetry?.[q.id];
    if (!rec || !rec.ms) continue;
    if (rec.dirty) continue;          // 切屏/发呆样本不进基线
    if (rec.ms < 600) continue;
    // 用该题自己的动态上限做二次校验，兼容旧存档里没有 limitMs 的记录
    if (rec.ms > dirtyLimitOf(q)) continue;
    const chars = questionChars(q);
    if (chars < 20) continue;
    samples.push(rec.ms / chars);
  }
  const v = median(samples);
  // 合理区间夹逼：0.08s/字（极快）~ 0.60s/字（很慢）
  return samples.length >= 3 ? clamp(v, 80, 600) : clamp(v || 260, 80, 600);
}

/** 题干 + 上下文 + 全部选项的字数 */
function questionChars(q) {
  let n = (q.prompt || '').replace(/\s/g, '').length;
  n += (q.context || '').replace(/\s/g, '').length;
  if (Array.isArray(q.options)) {
    for (const o of q.options) n += (o.text || '').replace(/\s/g, '').length;
  }
  if (q.scale) {
    n += (q.scale.left || '').length + (q.scale.right || '').length;
  }
  if (Array.isArray(q.items)) {
    for (const it of q.items) n += (it.label || '').length;
  }
  if (Array.isArray(q.values)) {
    // v4.4 修复：q.values 是 {key,label,effects} 对象数组，
    // 旧实现 join('') 会得到 "[object Object][object Object]…"，
    // 把字数算成上百，进而把发呆阈值和阅读基线一起带偏。
    for (const v of q.values) {
      const t = typeof v === 'string' ? v : (v?.label || '');
      n += t.replace(/\s/g, '').length;
    }
  }
  return Math.max(12, n);
}

/** 长题干（>45 字）且 <1200ms ⇒ 盲选低信度 */
function isBlindPick(q, rec) {
  if (!rec || !rec.ms) return false;
  const chars = questionChars(q);
  if (chars <= 45) return false;
  return rec.ms < 1200;
}

/**
 * 高修饰犹豫捕捉：在"暗面 / 利益博弈 / 敏感"题目上，
 * 耗时超过 2.2 倍个人期望且最终落在高社会赞许选项。
 */
function hesitationScore(q, rec, baseline, chosenOption) {
  if (!rec || !rec.ms || !q.is_sensitive) return 0;
  const chars = questionChars(q);
  const expected = Math.max(400, baseline * chars);
  const ratio = rec.ms / expected;
  const changes = rec.changes || 0;

  const sdValue = Number(chosenOption?.social_desirability ?? 0);
  const highSd = sdValue >= 2 || sdValue >= 1.5;

  if (!highSd) return 0;
  if (ratio <= 2.2 && changes < 2) return 0;

  const over = Math.max(0, ratio - 1);
  const raw = over + 0.35 * changes;
  return Math.min(1.5, Math.max(0.15, raw));
}

/** 单卷遥测摘要（用于报告页脚的可信度小字） */
function volumeTelemetrySummary(state, volume) {
  const qs = volume.questions || [];
  let total = 0;
  let quick = 0;
  let changed = 0;
  let sensCount = 0;
  for (const q of qs) {
    const rec = getTelemetry(state, q.id);
    if (!rec.ms) continue;
    total += 1;
    if (isBlindPick(q, rec)) quick += 1;
    if (rec.changes > 0) changed += 1;
    if (q.is_sensitive) sensCount += 1;
  }
  return {
    answered: total,
    blind: quick,
    changed,
    sensitive: sensCount,
    avgMs: total ? Math.round(qs.reduce((a, q) => a + (getTelemetry(state, q.id).ms || 0), 0) / total) : 0,
    reliability: total ? clamp(1 - (quick / total) * 0.75, 0, 1) : 1,
  };
}

/* ───────── src/core/scoring.js ───────── */
/* ============================================================
   scoring.js — 全局池加权归一化 / Z 尖峰 / 面具厚度 M / 四档分级

   v4.2 修复要点（对应审计清单）：
     BUG-01  单选/多选题里「只在部分选项出现的维度」被整题跳过
             → 现在先用 getQuestionDims() 收集该题【全部】合法维度，
               未选中选项视为贡献 0，正常计入低分，不再漏算或虚高到 100。
     BUG-02  pyramid_top3 对只在 1–2 张卡出现的维度返回 NaN
             → questionRange 补齐 0 参与三顺位极值计算。
     BUG-03  budget_100 负增益区间反了被丢弃；线性映射把「远高于均值」
             的分配算成低分
             → 改用相对均值居中映射 scoreBudgetItem()。
     BUG-04  先按卷求分再算术平均，导致附加题稀释主测题
             → 改为全局池单次遍历，并按 (hi-lo) 振幅加权。
   新增：个人内部相对尖峰 Z_d，用于打破「中庸魔咒」。

   v4.2.2 追加修复：
     · 区间中心改为「该题选项上的期望值」，消除「只在一个选项出现」
       的维度被系统性压到 30 分的问题。
     · budget_100 同维多滑块合并计分（v10_q15 / v16_q15），
       基准取 100×k/N 而非 100/N，避免倾注点数被摊薄。
     · 筹码题统一 base:0 / gain:1，反向语义用显式 reverse:true 表达。
   ============================================================ */




const TYPE_WEIGHT = {
  forced_choice: 1.4,
  impulse_3s: 1.2,
  stealth_scale: 0.85,
  budget_100: 1.3,
  pyramid_top3: 1.3,
};

const TIERS = [
  { id: 1, min: 80, max: 100, name: '极显锋芒', sub: '核心主导态' },
  { id: 2, min: 60, max: 80, name: '清晰倾向', sub: '稳定显性态' },
  { id: 3, min: 40, max: 60, name: '弹性灰度', sub: '情境平衡态' },
  { id: 4, min: 0, max: 40, name: '反向深潜', sub: '低分特质态' },
];

const MASK_TIERS = [
  { id: 'low', max: 30, name: '本真赤诚层', desc: '表里高度一致，极少为了迎合他人而扭曲自我表达。' },
  { id: 'mid', max: 60, name: '体面调节层', desc: '具备成熟的社交分寸感，能自如切换职场外衣与私下本我。' },
  { id: 'high', max: 101, name: '精密防卫层', desc: '对外展示极度克制得体的形象，内心却压抑着强烈反差张力。' },
];

function tierOf(score) {
  const s = clamp(score, 0, 100);
  if (s >= 80) return TIERS[0];
  if (s >= 60) return TIERS[1];
  if (s >= 40) return TIERS[2];
  return TIERS[3];
}

function maskTierOf(m) {
  const v = clamp(m ?? 0, 0, 100);
  return MASK_TIERS.find((t) => v < t.max) || MASK_TIERS[MASK_TIERS.length - 1];
}

/* ------------------------------------------------------------
   1. 该题可能影响到的全部维度（含未选中的选项）
   ------------------------------------------------------------ */

function getQuestionDims(q, validDimSet) {
  const dims = new Set();
  const add = (obj) => {
    if (!obj || typeof obj !== 'object') return;
    for (const k of Object.keys(obj)) {
      // 白名单过滤：任何拼错的键（如历史遗留的 fw_open）在这里被静默剔除
      if (!validDimSet || validDimSet.has(k)) dims.add(k);
    }
  };

  if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
    for (const opt of q.options || []) add(opt.effects);
  } else if (q.type === 'stealth_scale') {
    add(q.effects);
  } else if (q.type === 'budget_100') {
    for (const item of q.items || []) {
      if (item.dim && (!validDimSet || validDimSet.has(item.dim))) dims.add(item.dim);
      add(item.effects);
    }
  } else if (q.type === 'pyramid_top3') {
    for (const v of q.values || []) add(v.effects);
  }
  return Array.from(dims);
}

/* ------------------------------------------------------------
   2. 把作答翻译为维度原始贡献
   ------------------------------------------------------------ */

function answerContributions(q, value) {
  const out = {};
  if (value === undefined || value === null) return out;

  if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
    const opt = (q.options || []).find((o) => o.key === value);
    if (!opt) return out;
    for (const [d, v] of Object.entries(opt.effects || {})) out[d] = (out[d] || 0) + Number(v || 0);
    return out;
  }

  if (q.type === 'stealth_scale') {
    const n = clamp(Number(value) || 4, 1, 7);
    const t = (n - 1) / 6;
    for (const [d, range] of Object.entries(q.effects || {})) {
      if (Array.isArray(range)) {
        out[d] = (Number(range[0]) || 0) + ((Number(range[1]) || 0) - (Number(range[0]) || 0)) * t;
      } else if (typeof range === 'object' && range) {
        const lo = Number(range.low) || 0;
        const hi = Number(range.high) || 0;
        out[d] = lo + (hi - lo) * t;
      } else {
        out[d] = Number(range) || 0;
      }
    }
    return out;
  }

  if (q.type === 'pyramid_top3') {
    const ranks = Array.isArray(value) ? value : [];
    const rankWeights = [3, 2, 1];
    ranks.slice(0, 3).forEach((key, i) => {
      const item = (q.values || []).find((v) => v.key === key);
      if (!item) return;
      const rw = rankWeights[i] ?? 1;
      for (const [d, v] of Object.entries(item.effects || {})) {
        out[d] = (out[d] || 0) + Number(v || 0) * rw;
      }
    });
    return out;
  }

  // budget_100 由 scoreBudgetItem 专门处理，不在这里折算
  return out;
}

/* ------------------------------------------------------------
   3. 单题在维度 d 上的真实 [min, max]
   ------------------------------------------------------------ */

/**
 * 单题在某维度上的作答区间。
 *
 * v4.2.1 关键修正 —— 「期望值居中」：
 *   BUG-01 的修复让未出现在所选选项里的维度按 0 计分，
 *   但如果区间仍用 [min, max] 的中位数做中心，会产生系统性偏差：
 *   某维度只在 4 个选项中的 1 个出现（+2），区间 [0,2]，中点 1。
 *   于是「没选那一个」= 0 → centered = -1（满分反方向），
 *   「选了那一个」= +2 → centered = +1。
 *   均匀作答时该维度的期望值是 0.25×(+1) + 0.75×(−1) = −0.5，
 *   即整卷所有「只在一个选项出现」的维度都会被系统性压到 30 分附近。
 *
 *   修法：把中心从「区间中点」改成「选项上的期望值」，
 *   半程取「离中心最远那个可达值」的距离。
 *   上面这个例子变成 中心 0.5、半程 1.5：
 *     选 A → (2−0.5)/1.5 = +1（强正向证据）
 *     选 B → (0−0.5)/1.5 = −0.33（轻微反向证据）
 *   这才是「没提这件事」应有的分量——它不该等于强烈否认。
 *
 *   振幅 (hi − lo) 仍然用于加权，所以主测题（振幅 4.0）
 *   照旧压过附加题（振幅 0.8），BUG-04 的修复不受影响。
 */
function questionRange(q, dim) {
  if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
    const vals = (q.options || []).map((o) => Number(o.effects?.[dim] ?? 0));
    if (!vals.length) return null;
    const lo = Math.min(...vals);
    const hi = Math.max(...vals);
    if (!(hi > lo)) return null;
    const expected = vals.reduce((a, b) => a + b, 0) / vals.length;
    return { lo, hi, center: expected };
  }

  if (q.type === 'stealth_scale') {
    const r = q.effects?.[dim];
    let a = null;
    let b = null;
    if (Array.isArray(r) && r.length >= 2) {
      a = Number(r[0]) || 0;
      b = Number(r[1]) || 0;
    } else if (r && typeof r === 'object') {
      a = Number(r.low) || 0;
      b = Number(r.high) || 0;
    }
    if (a === null || a === b) return null;
    // 量表是连续作答，期望值就是两端均值
    return { lo: Math.min(a, b), hi: Math.max(a, b), center: (a + b) / 2 };
  }

  if (q.type === 'pyramid_top3') {
    // 所有卡片都参与（缺失按 0），彻底消灭 undefined → NaN
    const vals = (q.values || []).map((v) => Number(v.effects?.[dim] ?? 0));
    if (vals.length < 3 || vals.every((v) => v === 0)) return null;
    const desc = [...vals].sort((a, b) => b - a);
    const asc = [...vals].sort((a, b) => a - b);
    const hi = 3 * desc[0] + 2 * desc[1] + 1 * desc[2];
    const lo = 3 * asc[0] + 2 * asc[1] + 1 * asc[2];
    if (!(hi > lo)) return null;
    // 随机排前三时，每个排位上的期望值都等于卡片均值 → 期望总分 = 6 × 均值
    const m = vals.reduce((a, b) => a + b, 0) / vals.length;
    return { lo, hi, center: 6 * m };
  }

  if (q.type === 'budget_100') {
    // 筹码题走相对均值映射，直接产出 [-1, +1]，这里给一个哨兵区间
    return { lo: -1, hi: 1, center: 0 };
  }

  return null;
}

/* ------------------------------------------------------------
   4. 筹码题：相对均值居中映射
   6 项平均分 100/6 ≈ 16.7 点视为中性（0 分 → 50 分），
   投入达到 2.2 倍均值（≈36.7 点）即视为极强倾向（+1 → 100 分）。
   ------------------------------------------------------------ */

function scoreBudgetItem(pts, itemCount, polarity = 1, expectedPts = null) {
  const n = Math.max(2, itemCount || 6);
  // v4.2.2：同维多滑块合并后，基准不再是 100/N，而是 100×k/N。
  // 由调用方通过 expectedPts 传进来；不传时退回均分基准。
  const expected = Number.isFinite(expectedPts) ? expectedPts : 100 / n;
  // 锚点取 2.2 倍基准：
  //   6 项均分时基准 16.7，锚点 36.7 —— 倾注 25 点 → 71 分（明显偏高但不封顶），
  //   倾注 37 点 → 100 分。锚点抬到 2.5 会把 25 点压到 67，反而更接近「压扁」，
  //   与本次整改的目标相反，所以保留 2.2。
  //   同维多滑块合并后（k>1）基准是 100×k/N，锚点自然抬到 100，不受影响。
  const highAnchor = Math.min(100, expected * 2.2);

  let centered;
  if (pts <= expected) {
    // 0 点不判死刑，留 0.85 的温和底线
    centered = -0.85 * (1 - pts / expected);
  } else {
    centered = Math.min(1, (pts - expected) / Math.max(1e-6, highAnchor - expected));
  }
  return clamp(centered * (polarity < 0 ? -1 : 1), -1, 1);
}

/* ------------------------------------------------------------
   5. 全局池加权算分（不再逐卷求平均）
   ------------------------------------------------------------ */

function scorePool(state, questions, opts = {}) {
  const validDimSet = opts.validDimSet || null;
  /**
   * 证据收缩的先验权重。
   * 默认 1.2：只被 1–2 题测到的维度向 50 拉，避免「答对一次就满分」。
   * 传 0 则关闭收缩 —— 镜像撕裂度（mirrorTear）必须关掉，
   * 因为它比的是「同一维度在明线 / 暗线上的差值」，
   * 两侧如果都被拉向 50，差值会被系统性压小，G_mirror 永远偏低。
   */
  const priorW = opts.priorW === undefined ? 1.2 : Number(opts.priorW);
  const num = {};
  const den = {};
  const counts = {};

  for (const q of questions) {
    const ans = state.answersByVolume?.[q.volume_id ?? q.volumeId];
    const value = ans?.[q.id]?.value;
    if (value === undefined || value === null) continue;

    const tele = state.telemetry?.[q.id];
    const baseW = Number(q.weight) || TYPE_WEIGHT[q.type] || 1;
    const qWeight = isBlindPick(q, tele) ? baseW * 0.4 : baseW;

    // ---- 筹码题 ----
    // v4.2.2：同一维度可能有多个滑块（v10_q15 有 3 项都指 dd_order，
    // v16_q15 有 2 项指 hsp_sensory）。旧实现逐项独立映射，
    // 每项都按 100/N 作基准 → 该维度的实际可投入点数是 3 倍，
    // 却在按 1 倍基准打分，于是被系统性压扁。
    // 现在先按 dim 聚合：合并点数 + 合并期望值，再统一映射。
    if (q.type === 'budget_100') {
      const items = q.items || [];
      const map = typeof value === 'object' ? value : {};
      const N = Math.max(2, items.length);

      // 1) 按 dim 分组
      //    注意：没有 item.dim 但有 item.effects 的项也要参与（只贡献联动维度）
      const groups = new Map();
      const effectOnly = [];   // { effects, weightBaseline }
      for (const item of items) {
        if (!item.dim) {
          if (item.effects && Object.keys(item.effects).length) effectOnly.push(item);
          continue;
        }
        if (validDimSet && !validDimSet.has(item.dim)) {
          if (item.effects && Object.keys(item.effects).length) effectOnly.push(item);
          continue;
        }
        let g = groups.get(item.dim);
        if (!g) {
          g = {
            dim: item.dim,
            keys: [],
            effects: {},
            polarity: 1,
          };
          groups.set(item.dim, g);
        }
        g.keys.push(item.key);
        // 极性：显式 reverse/polarity 优先，其次 gain 符号
        if (item.reverse === true || item.polarity === -1) g.polarity = -1;
        else if (item.polarity === 1) g.polarity = 1;
        else if (Number(item.gain) < 0) g.polarity = -1;
        // 附带维度取该组内的最大幅值，避免同维多滑块把联动维度重复计权
        for (const [d, f] of Object.entries(item.effects || {})) {
          if (validDimSet && !validDimSet.has(d)) continue;
          const factor = Number(f) || 0;
          if (Math.abs(factor) > Math.abs(g.effects[d] || 0)) g.effects[d] = factor;
        }
      }

      // 2) 逐组打分
      const effW = qWeight * 1.3;
      for (const g of groups.values()) {
        const pts = g.keys.reduce((a, k) => a + Number(map[k] ?? 0), 0);
        const expected = (100 * g.keys.length) / N;
        const centered = scoreBudgetItem(pts, N, g.polarity, expected);

        num[g.dim] = (num[g.dim] || 0) + effW * centered;
        den[g.dim] = (den[g.dim] || 0) + effW;
        counts[g.dim] = (counts[g.dim] || 0) + 1;

        // 附带维度联动：以「相对均值的偏离」为强度，避免被基准值污染
        for (const [d, f] of Object.entries(g.effects)) {
          const factor = Number(f) || 0;
          if (!factor) continue;
          num[d] = (num[d] || 0) + effW * centered * factor;
          // v4.4：分母按 |factor| 加权。
          // 旧实现固定 +effW，导致 factor=0.4 的弱联动与 factor=1.5 的强联动
          // 在同一个维度上获得相同话语权，弱联动被系统性高估。
          den[d] = (den[d] || 0) + effW * Math.abs(factor);
          counts[d] = (counts[d] || 0) + 1;
        }
      }

      // 2b) 只贡献联动维度、本身没有 dim 的滑块
      //     它们仍占用了用户的点数，强度按「该滑块点数相对均值的偏离」计算。
      for (const item of effectOnly) {
        const pts = Number(map[item.key] ?? 0);
        const centered = scoreBudgetItem(pts, N, 1, 100 / N);
        for (const [d, f] of Object.entries(item.effects || {})) {
          if (validDimSet && !validDimSet.has(d)) continue;
          const factor = Number(f) || 0;
          if (!factor) continue;
          num[d] = (num[d] || 0) + effW * centered * factor;
          den[d] = (den[d] || 0) + effW * Math.abs(factor);
          counts[d] = (counts[d] || 0) + 1;
        }
      }
      continue;
    }

    // ---- 常规题型 ----
    const contrib = answerContributions(q, value);
    const dims = getQuestionDims(q, validDimSet);

    for (const d of dims) {
      const range = questionRange(q, d);
      if (!range) continue;
      const { lo, hi } = range;
      if (!(hi > lo)) continue;

      // 中心 = 该题选项上的期望值；半程 = 离中心最远的可达距离
      const center = Number.isFinite(range.center) ? range.center : (hi + lo) / 2;
      const half = Math.max(center - lo, hi - center) || (hi - lo) / 2;
      const raw = Number(contrib[d] ?? 0);
      const centered = clamp((raw - center) / half, -1, 1);

      // 振幅加权：主测题（振幅 4.0）自然压过附加题（振幅 0.8）
      const dimWeight = qWeight * clamp(hi - lo, 0.4, 4);

      num[d] = (num[d] || 0) + dimWeight * centered;
      den[d] = (den[d] || 0) + dimWeight;
      counts[d] = (counts[d] || 0) + 1;
    }
  }

  // ---- 证据收缩（shrinkage）----
  // 只被 1–2 道题测到的维度，不该仅凭一次极端作答就宣称 100 分或 0 分。
  // 给分母加一个「先验权重」，把低证据维度向 50 拉。
  const PRIOR_W = Math.max(0, priorW);
  const scores = {};
  const evidence = {};
  for (const d of Object.keys(den)) {
    if (den[d] <= 0) continue;
    const n = num[d] / (den[d] + PRIOR_W);
    scores[d] = clamp(round(50 + 50 * n, 1), 0, 100);
    // 证据强度：0–1，用于报告页标注可信度
    evidence[d] = round(den[d] / (den[d] + PRIOR_W), 2);
  }

  // ---- 个人内部相对尖峰 Z_d ----
  const vals = Object.values(scores);
  const avg = vals.length ? mean(vals) : 50;
  const variance = vals.length
    ? vals.reduce((a, v) => a + (v - avg) ** 2, 0) / vals.length
    : 0;
  const std = Math.max(6, Math.sqrt(variance));

  const zScores = {};
  for (const [d, s] of Object.entries(scores)) {
    zScores[d] = round((s - avg) / std, 2);
  }

  return { scores, zScores, counts, evidence, mean: round(avg, 1), std: round(std, 1) };
}

/* ------------------------------------------------------------
   6. 某卷的全部题
   ------------------------------------------------------------ */

function questionsOfVolume(DATA, volId) {
  const v = DATA.volumes[volId];
  if (!v) return [];
  return (v.questions || []).map((q) => ({
    ...q,
    volumeId: volId,
    volume_id: v.volume_id || volId,
  }));
}

function allQuestions(DATA) {
  const out = [];
  for (const volId of Object.keys(DATA.volumes)) out.push(...questionsOfVolume(DATA, volId));
  return out;
}

/** 单卷计分（报告页局部用，逻辑与全局池一致） */
function scoreQuestions(state, questions, validDimSet) {
  return scorePool(state, questions, { validDimSet });
}

/**
 * 分层计分：表显层（明线自评）vs 暗线层（stealth / 高压投射）。
 */
function layeredScores(state, DATA) {
  const valid = new Set(DATA.dimOrder);
  const all = allQuestions(DATA);

  const surface = scorePool(state, all.filter((q) => q.layer !== 'stealth'), { validDimSet: valid }).scores;
  const depth = scorePool(state, all.filter((q) => q.layer === 'stealth'), { validDimSet: valid }).scores;

  const keys = Object.keys(surface).filter((d) => Number.isFinite(depth[d]));
  if (!keys.length) return { keys: [], surface, depth, gMirror: null };

  const gMirror = mean(keys.map((d) => Math.abs(surface[d] - depth[d])));
  return { keys, surface, depth, gMirror: round(gMirror, 1) };
}

function answeredQuestions(state, DATA, volId) {
  const v = DATA.volumes[volId];
  if (!v) return { questions: [], answered: [] };
  const list = questionsOfVolume(DATA, volId);
  const ans = state.answersByVolume?.[volId] || {};
  return { questions: list, answered: list.filter((q) => ans[q.id]?.value !== undefined) };
}

/* ------------------------------------------------------------
   面具厚度 M
   ------------------------------------------------------------ */

/** 1) 社会期许偏移率 D_sd */
function socialDesirabilityIndex(state, questions) {
  const vals = [];
  for (const q of questions) {
    const ans = state.answersByVolume?.[q.volume_id ?? q.volumeId]?.[q.id]?.value;
    if (ans === undefined || ans === null) continue;

    if (Array.isArray(q.options)) {
      const sds = q.options.map((o) => Number(o.social_desirability)).filter(Number.isFinite);
      if (sds.length < 2) continue;
      const lo = Math.min(...sds);
      const hi = Math.max(...sds);
      if (hi <= lo) continue;
      const opt = q.options.find((o) => o.key === ans);
      if (!opt) continue;
      vals.push(clamp(((Number(opt.social_desirability) - lo) / (hi - lo)) * 100, 0, 100));
    } else if (q.type === 'stealth_scale' && q.scale?.sdHigh) {
      const n = clamp(Number(ans) || 4, 1, 7);
      const towardRight = (n - 1) / 6;
      const t = q.scale.sdHigh === 'right' ? towardRight : 1 - towardRight;
      vals.push(clamp(t * 100, 0, 100));
    }
  }
  return vals.length ? mean(vals) : null;
}

/** 2) 敏感题犹豫修饰度 H_lat */
function hesitationIndex(state, questions) {
  const baseline = readingBaseline(state, questions);
  const sens = questions.filter((q) => q.is_sensitive);
  if (!sens.length) return { value: null, baseline, samples: 0 };

  let acc = 0;
  let n = 0;
  for (const q of sens) {
    const ans = state.answersByVolume?.[q.volume_id ?? q.volumeId]?.[q.id]?.value;
    if (ans === undefined || ans === null) continue;
    n += 1;

    const rec = getTelemetry(state, q.id);
    // 脏样本（切屏 / 长时间发呆）已由 telemetry 打标，剔出犹豫分
    if (!rec.ms || rec.dirty) continue;

    const chars = questionChars(q);
    const expected = Math.max(400, baseline * chars);
    const ratio = rec.ms / expected;
    const changes = rec.changes || 0;

    let sdHigh = false;
    if (Array.isArray(q.options) && q.options.length) {
      const hi = Math.max(...q.options.map((o) => Number(o.social_desirability) || 0));
      const opt = q.options.find((o) => o.key === ans);
      sdHigh = hi > 0 && Number(opt?.social_desirability || 0) >= hi;
    } else if (q.type === 'stealth_scale' && q.scale?.sdHigh) {
      const v = clamp(Number(ans) || 4, 1, 7);
      sdHigh = q.scale.sdHigh === 'right' ? v >= 6 : v <= 2;
    }

    if (!sdHigh) continue;
    if (ratio <= 2.2 && changes < 2) continue;
    acc += Math.min(1.5, Math.max(0, ratio - 1) + 0.35 * changes);
  }
  const value = n ? clamp((100 / n) * acc, 0, 100) : null;
  return { value, baseline, samples: n };
}

/** 3) 跨卷镜像撕裂度 G_mirror */
function mirrorTear(state, DATA) {
  const valid = new Set(DATA.dimOrder);
  const allQ = allQuestions(DATA);

  const pairs = [];
  const seen = new Set();
  for (const q of allQ) {
    if (q.layer !== 'stealth') continue;
    const key = q.mirror_key || '';
    if (!key || seen.has(key)) continue;
    seen.add(key);

    const explicitQs = allQ.filter((x) => x.mirror_key === key && x.layer !== 'stealth' && x.volumeId !== 'vol8');
    const stealthQs = allQ.filter((x) => x.mirror_key === key && x.layer === 'stealth');
    if (!explicitQs.length || !stealthQs.length) continue;

    // 关闭证据收缩：比的是两侧差值，收缩会把差值一起压平
    const a = scorePool(state, explicitQs, { validDimSet: valid, priorW: 0 }).scores;
    const b = scorePool(state, stealthQs, { validDimSet: valid, priorW: 0 }).scores;
    const dims = Object.keys(a).filter((d) => Number.isFinite(b[d]));
    if (!dims.length) continue;

    const diff = mean(dims.map((d) => Math.abs(a[d] - b[d])));
    pairs.push({ mirrorKey: key, diff, dims });
  }

  if (!pairs.length) return { value: null, pairs };
  const raw = clamp(mean(pairs.map((p) => p.diff)), 0, 100);
  const TEAR_FULL_SCALE = 45;
  return { value: clamp((raw / TEAR_FULL_SCALE) * 100, 0, 100), raw, pairs };
}

/**
 * 综合面具厚度。
 * 未完成 Vol.8 时 G_mirror 不参与，前两项自适应重归一化。
 */
function maskIndex(state, DATA) {
  const all = allQuestions(DATA);

  const dsd = socialDesirabilityIndex(state, all);
  const hlat = hesitationIndex(state, all);
  const tear = mirrorTear(state, DATA);

  const parts = [];
  if (dsd !== null) parts.push({ k: 'D_sd', v: dsd, w: 0.35 });
  if (hlat.value !== null) parts.push({ k: 'H_lat', v: hlat.value, w: 0.25 });
  if (tear.value !== null && (state.completedVolumes || []).includes('vol8')) {
    parts.push({ k: 'G_mirror', v: tear.value, w: 0.4 });
  }

  if (!parts.length) {
    return {
      value: null, tier: null, dsd, hlat: hlat.value, mirror: tear.value,
      parts, baseline: hlat.baseline,
    };
  }

  const totalW = parts.reduce((a, p) => a + p.w, 0);
  const m = clamp(parts.reduce((a, p) => a + p.v * p.w, 0) / totalW, 0, 100);

  return {
    value: round(m, 1),
    tier: maskTierOf(m),
    dsd: dsd === null ? null : round(dsd, 1),
    hlat: hlat.value === null ? null : round(hlat.value, 1),
    mirror: tear.value === null ? null : round(tear.value, 1),
    mirrorPairs: tear.pairs,
    parts,
    baseline: round(hlat.baseline, 1),
  };
}

/* ------------------------------------------------------------
   价值金字塔 / 压力退行态
   ------------------------------------------------------------ */

/**
 * 核心价值金字塔的 8 个合法键。
 * HA4- 存档码里 Top3 只存 0–7 的索引，超出这个白名单的键无法编码（会写成 255）。
 * 所以这里必须只认这 8 个。
 */
const CORE_VALUE_KEYS = [
  'freedom', 'dignity', 'wealth', 'intimacy',
  'security', 'breakthrough', 'fairness', 'ease',
];

/**
 * v4.4 修复：跨卷污染。
 * 十六卷里有 9 道 pyramid_top3，其中只有 vol4 的 v4_q20 用的是核心 8 价值；
 * Vol.9–16 的分别是认知功能栈 / 道德基础 / 九型 / 图式 / 金钱 / 冲突 / 神经，
 * 键名完全不在 CORE_VALUE_KEYS 里。
 * 旧实现遍历全部 16 卷，若用户先做了扩展卷，topValues 会被写入 'jung_ni' 之类的键，
 * 编码时全变成 255 → 存档码里的价值金字塔永远是空的。
 */
function extractTopValues(state, DATA) {
  if (Array.isArray(state.topValues) && state.topValues.length) {
    const clean = state.topValues.filter((k) => CORE_VALUE_KEYS.includes(k));
    if (clean.length) return clean.slice(0, 3);
  }

  const out = [];
  for (const volId of Object.keys(DATA.volumes)) {
    for (const q of DATA.volumes[volId].questions || []) {
      if (q.type !== 'pyramid_top3') continue;
      // 快速跳过：该题的卡片键与核心价值无交集，说明不是价值金字塔
      const keys = (q.values || []).map((v) => v.key);
      if (!keys.some((k) => CORE_VALUE_KEYS.includes(k))) continue;

      const ans = state.answersByVolume?.[volId]?.[q.id]?.value;
      if (!Array.isArray(ans)) continue;
      ans.forEach((k) => {
        if (CORE_VALUE_KEYS.includes(k) && !out.includes(k)) out.push(k);
      });
    }
  }
  return out.slice(0, 3);
}

function pressureStyle(state, DATA) {
  const vol = DATA.volumes.vol8;
  if (!vol) return null;
  const styles = {};
  for (const q of vol.questions || []) {
    if (q.kind !== 'pressure') continue;
    const ans = state.answersByVolume?.vol8?.[q.id]?.value;
    if (!ans) continue;
    const opt = (q.options || []).find((o) => o.key === ans);
    if (!opt || !opt.style) continue;
    styles[opt.style] = (styles[opt.style] || 0) + (Number(q.weight) || 1);
  }
  const list = Object.entries(styles).sort((a, b) => b[1] - a[1]);
  if (!list.length) return null;
  const total = list.reduce((a, [, v]) => a + v, 0);
  return {
    key: list[0][0],
    share: round((list[0][1] / total) * 100, 1),
    distribution: Object.fromEntries(list.map(([k, v]) => [k, round((v / total) * 100, 1)])),
  };
}

/* ------------------------------------------------------------
   汇总：全局池一次算完
   ------------------------------------------------------------ */

function computeAll(state, DATA) {
  const dimOrder = DATA.dimensions.dims.map((d) => d.id);
  const valid = new Set(dimOrder);

  // 全局池（修复 BUG-04：不再逐卷求平均再平均）
  const pool = scorePool(state, allQuestions(DATA), { validDimSet: valid });

  const scores = {};
  for (const d of dimOrder) {
    scores[d] = Number.isFinite(pool.scores[d]) ? pool.scores[d] : null;
  }
  const zScores = {};
  for (const d of dimOrder) {
    zScores[d] = Number.isFinite(pool.zScores[d]) ? pool.zScores[d] : null;
  }

  // 逐卷分数保留，仅供单卷报告与图表使用
  const perVolume = {};
  for (const volId of Object.keys(DATA.volumes)) {
    perVolume[volId] = scorePool(state, questionsOfVolume(DATA, volId), { validDimSet: valid });
  }

  const evidence = {};
  for (const d of dimOrder) {
    evidence[d] = Number.isFinite(pool.evidence?.[d]) ? pool.evidence[d] : 0;
  }

  const mask = maskIndex(state, DATA);
  const topValues = extractTopValues(state, DATA);
  const pressure = pressureStyle(state, DATA);

  return {
    scores,
    zScores,
    evidence, 
    perVolume,
    dimOrder,
    mask,
    topValues,
    pressure,
    userMean: pool.mean,
    userStd: pool.std,
    answeredCount: Object.keys(scores).filter((d) => Number.isFinite(scores[d])).length,
  };
}

function normalizeScores(raw, dimOrder) {
  const out = {};
  for (const d of dimOrder) {
    const v = raw?.[d];
    out[d] = Number.isFinite(v) ? clamp(v, 0, 100) : null;
  }
  return out;
}

/* ============================================================
   emblemsSvg.js — 十六卷专属几何纹章
   · 单线、极简、无填充色块；只用 currentColor 描边
   · 大厅卡片右上角作低透明度水印，卷首仪式页居中展示
   · viewBox 统一 64×64，线宽按 strokeWidth 参数缩放
   ============================================================ */



const S = 64;
const C = S / 2;

/** 环形刻度：n 条，r1→r2 */
function ticks(n, r1, r2, opacity = 0.5, len = 0.6) {
  const out = [];
  for (let i = 0; i < n; i += 1) {
    const a = (Math.PI * 2 * i) / n - Math.PI / 2;
    out.push(svg('line', {
      x1: C + Math.cos(a) * r1,
      y1: C + Math.sin(a) * r1,
      x2: C + Math.cos(a) * r2,
      y2: C + Math.sin(a) * r2,
      opacity: i % Math.round(n / 4 || 1) === 0 ? opacity * 1.7 : opacity * len,
    }));
  }
  return out;
}

/** 正多边形顶点 */
function poly(n, r, rot = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < n; i += 1) {
    const a = (Math.PI * 2 * i) / n + rot;
    pts.push([C + Math.cos(a) * r, C + Math.sin(a) * r]);
  }
  return pts;
}

const d = (pts, close = true) => pts
  .map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(2)} ${y.toFixed(2)}`)

   ------------------------------------------------------------ */

/**
 * @param {string} volId  'vol1' … 'vol16'
 * @param {Object} opt { size, strokeWidth, color, opacity, title }
 * @returns {SVGElement}
 */
function emblemSvg(volId, opt = {}) {
  const draw = EMBLEMS[volId] || EMBLEMS.vol1;
  const node = svg('svg', {
    viewBox: `0 0 ${S} ${S}`,
    class: opt.class || 'emblem',
    role: opt.title ? 'img' : 'presentation',
    'aria-label': opt.title || undefined,
    'aria-hidden': opt.title ? undefined : 'true',
    width: opt.size || undefined,
    height: opt.size || undefined,
  });

  if (opt.color) node.style.color = opt.color;
  if (Number.isFinite(opt.opacity)) node.style.opacity = String(opt.opacity);

  const g = svg('g', {
    fill: 'none',
    stroke: 'currentColor',
    'stroke-width': opt.strokeWidth || 1.1,
    'stroke-linecap': 'round',
    'stroke-linejoin': 'round',
  });

  for (const child of draw()) g.appendChild(child);
  node.appendChild(g);
  return node;
}

const EMBLEM_IDS = Object.keys(EMBLEMS);

emblemSvg;

let activeScrim = null;

function closeDialog() {
  if (activeScrim) {
    activeScrim.remove();
    activeScrim = null;
    document.body.style.overflow = '';
  }
}

function openDialog({ title, sub, body, foot, wide = false }) {
  closeDialog();

  const scrim = el('div', {
    class: 'scrim',
    role: 'dialog',
    'aria-modal': 'true',
    'aria-label': title,
    onclick: (e) => { if (e.target === scrim) closeDialog(); },
  });

  const dlg = el('div', { class: `dialog${wide ? ' dialog--wide' : ''}` });

  const head = el('div', { class: 'dialog__head' }, [
    el('h2', { text: title }),
    el('button', {
      class: 'dialog__x', type: 'button', 'aria-label': '关闭',
      text: '×',
      onclick: closeDialog,
    }),
  ]);

  dlg.appendChild(head);
  if (sub) dlg.appendChild(el('p', { class: 'dialog__sub', text: sub }));
  if (body) dlg.appendChild(el('div', { class: 'dialog__body' }, [body]));
  if (foot) dlg.appendChild(el('div', { class: 'dialog__foot' }, foot));

  scrim.appendChild(dlg);
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  activeScrim = scrim;

  const onKey = (e) => {
    if (e.key === 'Escape') {
      closeDialog();
      window.removeEventListener('keydown', onKey);
    }
  };
  window.addEventListener('keydown', onKey);

  return { scrim, dlg };
}

/* ------------------------------------------------------------
   进度盘
   ------------------------------------------------------------ */

function progressDial(doneCount, total) {
  const size = 168;
  const r = 74;
  const C = 2 * Math.PI * r;
  const frac = clamp(doneCount / Math.max(1, total), 0, 1);
  const segs = Math.max(8, total);

  const wrap = el('div', { class: 'dial' });
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', `0 0 ${size} ${size}`);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined) continue;
      n.setAttribute(k, String(v));
    }
    return n;
  };

  s.appendChild(mk('circle', {
    cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--border)', 'stroke-width': 1,
  }));

  // 刻度环
  const tickCount = segs * 4;
  for (let i = 0; i < tickCount; i += 1) {
    const a = (Math.PI * 2 * i) / tickCount - Math.PI / 2;
    const r1 = r + 8;
    const r2 = r + (i % 4 === 0 ? 13 : 10.5);
    s.appendChild(mk('line', {
      x1: size / 2 + Math.cos(a) * r1,
      y1: size / 2 + Math.sin(a) * r1,
      x2: size / 2 + Math.cos(a) * r2,
      y2: size / 2 + Math.sin(a) * r2,
      stroke: 'var(--border)',
      'stroke-width': 0.7,
      opacity: i % 4 === 0 ? 0.9 : 0.45,
    }));
  }

  const arc = mk('circle', {
    cx: size / 2, cy: size / 2, r,
    fill: 'none',
    stroke: 'var(--gold)',
    'stroke-width': 2,
    'stroke-linecap': 'round',
    'stroke-dasharray': `${C}`,
    'stroke-dashoffset': `${C}`,
    transform: `rotate(-90 ${size / 2} ${size / 2})`,
  });
  s.appendChild(arc);

  for (let i = 0; i < segs; i += 1) {
    const a = (Math.PI * 2 * i) / segs - Math.PI / 2;
    const rr = r - 1;
    const x = size / 2 + Math.cos(a) * rr;
    const y = size / 2 + Math.sin(a) * rr;
    const on = i < doneCount;
    s.appendChild(mk('circle', {
      cx: x, cy: y,
      r: on ? 3.2 : 2,
      fill: on ? 'var(--gold)' : 'var(--bg-card)',
      stroke: on ? 'var(--gold)' : 'var(--border-strong)',
      'stroke-width': 1,
    }));
  }

  wrap.appendChild(s);

  const center = el('div', { class: 'dial__center' }, [
    el('div', { class: 'dial__value', text: `${doneCount}` }),
    el('div', { class: 'dial__unit', text: `OF ${total} VOLUMES` }),
  ]);
  wrap.appendChild(center);

  requestAnimationFrame(() => {
    arc.style.transition = 'stroke-dashoffset 1200ms cubic-bezier(0.22,0.61,0.36,1)';
    arc.style.strokeDashoffset = `${C * (1 - frac)}`;
  });

  return wrap;
}

function volumeCard(vol, { state, dimMap, onOpen }) {
  const done = state.completedVolumes.includes(vol.volume_id);
  const started = hasProgress(state, vol.volume_id);
  const ansCount = answeredCount(state, vol.volume_id);
  const total = vol.questions.length;
  const pct = round((ansCount / total) * 100, 1);

  const status = done ? 'done' : started ? 'progress' : 'sealed';
  const statusText = done ? '已归档' : started ? `已答 ${ansCount}/${total}` : '未启封';

  const card = el('button', {
    class: 'vol-card',
    type: 'button',
    style: { '--vc': vol.theme_color },
    dataset: { state: status },
    onclick: () => onOpen(vol.volume_id),
  });

  card.appendChild(el('span', { class: 'vol-card__edge' }));

  // 专属几何纹章：右上角低透明度水印
  const emblem = emblemSvg(vol.volume_id, {
    class: 'vol-card__emblem',
    strokeWidth: 1.05,
  });
  card.appendChild(emblem);

  // 大号卷号
  card.appendChild(el('span', {
    class: 'vol-card__numeral',
    text: String(vol.index).padStart(2, '0'),
  }));

  card.appendChild(el('div', { class: 'vol-card__top' }, [
    el('span', { class: 'vol-card__no', text: `VOL ${String(vol.index).padStart(2, '0')}` }),
    el('span', { class: 'vol-card__state', dataset: { s: status }, text: statusText }),
  ]));

  card.appendChild(el('h3', { class: 'vol-card__title', text: vol.title }));
  card.appendChild(el('p', { class: 'vol-card__sub', text: vol.subtitle }));

  // 维度一律走中文短标签，绝不暴露英文 id
  const named = (vol.dimensions || []).map((d) => dimMap[d]?.name).filter(Boolean);
  if (named.length) {
    card.appendChild(el('p', {
      class: 'vol-card__dims',
      text: named.slice(0, 3).join(' · ')
        + (named.length > 3 ? ` 等 ${named.length} 维` : ''),
    }));
  }

  const foot = el('div', { class: 'vol-card__foot' }, [
    el('span', { class: 'vol-card__meta', text: `${total} 题 · 约 ${vol.estimated_minutes} 分钟` }),
    el('span', {
      class: 'vol-card__cta',
      text: done ? '查看报告' : started ? '继续作答' : '启封',
    }),
  ]);
  card.appendChild(foot);

  if (started && !done) {
    const bar = el('div', { class: 'vol-card__bar' });
    const fill = el('i');
    fill.style.width = `${pct}%`;
    bar.appendChild(fill);
    card.appendChild(bar);
  }

  return card;
}

  pyramid_top3: '价值金字塔',
};

const TYPE_HINT = {
  impulse_3s: '凭第一直觉作答，不必权衡',
  stealth_scale: '',
  forced_choice: '',          // 按选项数量动态生成，见 hintOf()
  budget_100: '总分必须恰好为 100',

};

/**
 * 题目提示语。
 * 选择题的「两项 / 每项」必须跟着选项数量走 —— 四个选项下面写「两项都可以是体面的」
 * 会立刻露怯，是很容易被一眼识破的穿帮。
 */
function hintOf(q) {
  if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
    const n = (q.options || []).length;
    if (q.type === 'impulse_3s') return '凭第一直觉作答，不必权衡';
    if (n === 2) return '两点都可以是体面的，选更贴近你的那个';
    if (n === 3) return '三种都说得通，选更像你的那个';
    return '每个选项都是体面的，选更贴近你的那个';
  }
  return TYPE_HINT[q.type] || '';
}

function renderForcedChoice(q, value, onPick, vc) {
  const list = el('div', { class: 'opt-list' });

  (q.options || []).forEach((o, i) => {
    const isSel = value === o.key;
    const btn = el('button', {
      class: `opt${isSel ? ' is-sel' : ''}`,
      type: 'button',
      onclick: () => onPick(o.key),
    }, [
      el('span', { class: 'opt__key', text: o.key }),
      el('span', { class: 'opt__text', text: o.text }),
    ]);
    btn.dataset.k = o.key;
    list.appendChild(btn);
  });

  return list;
}

/** 7 档语义：让用户在悬停 / 选中时立刻知道这一档意味着什么 */
const SCALE_WORDS = [
  '强烈偏向左侧',
  '明显偏向左侧',
  '略偏左侧',
  '居中平衡',
  '略偏右侧',
  '明显偏向右侧',
  '强烈偏向右侧',
];

function renderStealthScale(q, value, onPick) {
  // 当前已选档位：唯一事实来源。悬停只做「预览」，不改这个值。
  let selected = Number.isFinite(Number(value)) ? Number(value) : null;
  let hovering = null;

  const wrap = el('div', { class: 'scale-wrap' });

  const poles = el('div', { class: 'scale-poles' }, [
    el('div', { class: 'scale-pole', text: q.scale?.left || '偏向左侧' }),
    el('div', { class: 'scale-pole scale-pole--r', text: q.scale?.right || '偏向右侧' }),
  ]);
  wrap.appendChild(poles);

  const dots = el('div', { class: 'scale-dots' });
  const caption = el('div', { class: 'scale-caption' });

  /* 提示文字只能由「悬停预览」或「已选档位」推导，不允许留任何残留状态。
     早期版本只监听 pointerenter，键盘按 6 时 caption 会停在之前悬停的第 3 档，
     出现「选中第 6 个点却写略偏左侧」的错位。 */
  const syncCaption = () => {
    const shown = hovering !== null ? hovering : selected;
    if (shown === null) {
      caption.textContent = '在两端之间，点选更贴近你的位置';
      caption.classList.remove('is-live');
    } else {
      caption.textContent = SCALE_WORDS[shown - 1] || '';
      caption.classList.add('is-live');
    }
  };

  const syncDots = () => {
    dots.querySelectorAll('.scale-dot').forEach((d) => {
      d.classList.toggle('is-sel', Number(d.dataset.k) === selected);
    });
  };

  for (let i = 1; i <= 7; i += 1) {
    const dot = el('button', {
      class: `scale-dot${selected === i ? ' is-sel' : ''}`,
      type: 'button',
      'aria-label': `第 ${i} 档：${SCALE_WORDS[i - 1]}`,
      onclick: () => onPick(i),
    }, [el('span')]);
    dot.dataset.k = String(i);
    dot.addEventListener('pointerenter', () => { hovering = i; syncCaption(); });
    dot.addEventListener('pointerleave', () => { hovering = null; syncCaption(); });
    dot.addEventListener('focus', () => { hovering = i; syncCaption(); });
    dot.addEventListener('blur', () => { hovering = null; syncCaption(); });
    dots.appendChild(dot);
  }
  wrap.appendChild(dots);

  /* 对外暴露：鼠标点击、键盘数字键、回退修改都走这条路，
     保证「选中态」与「提示文字」永远同步。 */
  wrap.setScale = (next) => {
    const n = Number(next);
    selected = Number.isFinite(n) && n >= 1 && n <= 7 ? n : null;
    hovering = null;
    syncDots();
    syncCaption();
  };

  // 容器整体离开时兜底清空悬停预览，避免极端情况下残留
  wrap.addEventListener('pointerleave', () => { hovering = null; syncCaption(); });

  syncCaption();
  wrap.appendChild(caption);

  return wrap;
}

function renderImpulse(q, value, onPick) {
  const holder = el('div', { class: 'impulse-halo is-live' });

  const meter = el('div', { class: 'impulse-meter' }, [el('i')]);
  holder.appendChild(meter);

  const hint = el('div', { class: 'q-hint' }, [
    el('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' }),
    el('span', { text: '这是发生在头三秒的事，不是深思熟虑后的结论' }),
  ]);

  setTimeout(() => holder.classList.remove('is-live'), 5400);

}

function renderBudget(q, value, onChange) {
  const map = {};
  (q.items || []).forEach((it) => {
    map[it.key] = Number(value?.[it.key] ?? 0);
  });

  const wrap = el('div', { class: 'budget' });

  const totalBox = el('div', { class: 'budget__total' });
  const totalVal = el('b', { text: '0' });
  const totalUnit = el('span', { text: '/ 100 点' });
  const totalMsg = el('div', { class: 'budget__msg', text: '' });
  totalBox.appendChild(totalVal);
  totalBox.appendChild(totalUnit);
  totalBox.appendChild(totalMsg);
  wrap.appendChild(totalBox);

  const rows = [];

  const update = () => {
    const total = Object.values(map).reduce((a, b) => a + Number(b || 0), 0);
    totalVal.textContent = `${total}`;
    totalBox.className = `budget__total ${total === 100 ? 'is-ok' : 'is-off'}`;
    totalMsg.textContent = total === 100
      ? '已用尽'
      : total > 100
        ? `超出 ${total - 100} 点`
        : `还剩 ${100 - total} 点`;
    rows.forEach((r) => { r.val.textContent = `${map[r.key]}`; });
    onChange({ ...map });
  };

  // 把某一项设为 value，超出 100 的部分从其它项按比例回吸
  const applyValue = (key, next) => {
    map[key] = Math.max(0, Math.min(100, Math.round(next)));

    const total = Object.values(map).reduce((a, b) => a + Number(b || 0), 0);
    if (total > 100) {
      let over = total - 100;
      const others = (q.items || []).filter((x) => x.key !== key).map((x) => x.key);
      for (const k of others) {
        if (over <= 0) break;
        const take = Math.min(map[k], over);
        map[k] -= take;
        over -= take;
      }
    } else if (total < 100) {
      // 不足 100 时补给该行，让用户「拖一下就到底」这件事变得可预期
      map[key] = Math.max(0, Math.min(100, map[key]));
    }
    rows.forEach((r) => { if (r.input.value !== String(map[r.key])) r.input.value = String(map[r.key]); });
    update();
  };

  (q.items || []).forEach((it) => {
    const val = el('div', { class: 'budget-row__val', text: `${map[it.key]}` });

    const input = el('input', {
      type: 'range',
      min: '0',
      max: '100',
      step: '1',
      value: String(map[it.key] || 0),
      'aria-label': it.label,
    });

    input.addEventListener('input', () => applyValue(it.key, Number(input.value)));

    const dec = el('button', {
      class: 'budget-nudge',
      type: 'button',
      text: '−5',
      'aria-label': `${it.label} 减 5`,
      onclick: () => applyValue(it.key, map[it.key] - 5),
    });

    const inc = el('button', {
      class: 'budget-nudge',
      type: 'button',
      text: '+5',
      'aria-label': `${it.label} 加 5`,
      onclick: () => applyValue(it.key, map[it.key] + 5),
    });

    const row = el('div', { class: 'budget-row' }, [
      el('div', { class: 'budget-row__label', text: it.label }),
      el('div', { class: 'budget-row__track' }, [
        dec,
        el('div', { class: 'budget-row__range' }, [input]),
        inc,
      ]),
      val,
    ]);

    rows.push({ key: it.key, input, val, row });
    wrap.appendChild(row);
  });

  update();

  const tools = el('div', {
    style: { display: 'flex', gap: '10px', marginTop: '6px', flexWrap: 'wrap' },
  }, [
    el('button', {
      class: 'btn btn--xs',
      type: 'button',
      text: '平均分配',
      onclick: () => {
        const n = (q.items || []).length;
        const base = Math.floor(100 / n);
        const rest = 100 - base * n;
        (q.items || []).forEach((it, i) => {
          map[it.key] = base + (i < rest ? 1 : 0);
        });
        rows.forEach((r) => { r.input.value = String(map[r.key]); });
        update();
      },
    }),
    el('button', {
      class: 'btn btn--xs',
      type: 'button',
      text: '全部清零',
      onclick: () => {
        (q.items || []).forEach((it) => { map[it.key] = 0; });
        rows.forEach((r) => { r.input.value = '0'; });
        update();
      },
    }),
  ]);
  wrap.appendChild(tools);

  return wrap;
}

function renderPyramid(q, value, onChange) {
  let picked = Array.isArray(value) ? [...value] : [];
  const items = q.values || [];

  const wrap = el('div', { class: 'pyramid' });

  const pool = el('div', { class: 'pyramid__pool' });
  const slotsBox = el('div', { class: 'pyramid__slots' });

  const refresh = () => {
    // 池子
    pool.innerHTML = '';
    items.forEach((it) => {
      const isPicked = picked.includes(it.key);
      const btn = el('button', {
        class: `pyr-item${isPicked ? ' is-picked' : ''}`,
        type: 'button',
        text: it.label,
        onclick: () => {
          const idx = picked.indexOf(it.key);
          if (idx >= 0) picked.splice(idx, 1);
          else if (picked.length < 3) picked.push(it.key);
          else toast('只能选三项，先取消一个');
          refresh();
          onChange([...picked]);
        },
      });
      pool.appendChild(btn);
    });

    // 槽位
    slotsBox.innerHTML = '';
    for (let i = 0; i < 3; i += 1) {
      const key = picked[i];
      const item = items.find((x) => x.key === key);
      const slot = el('div', { class: `pyr-slot${item ? ' is-filled' : ' is-empty'}` }, [
        el('span', { class: 'pyr-slot__rank', text: `0${i + 1}` }),
        el('span', {
          class: 'pyr-slot__text',
          text: item ? item.label : ['最重要的', '其次', '再一次'][i],
        }),
        item
          ? el('button', {
            class: 'pyr-slot__del',
            type: 'button',
            text: '×',
            'aria-label': `移除 ${item.label}`,
            onclick: () => {
              picked.splice(i, 1);
              refresh();
              onChange([...picked]);
            },
          })
          : el('span'),
      ]);
      slotsBox.appendChild(slot);
    }
  };

  // 键盘操作专用：就地更新，不重建整张题卡（原先会重置计时器）
  wrap.setPicked = (next) => {
    const cleaned = (Array.isArray(next) ? next : []).slice(0, 3);
    picked.length = 0;
    picked.push(...cleaned);
    refresh();
  };

  refresh();
  wrap.appendChild(pool);
  wrap.appendChild(slotsBox);

  return wrap;
}

function renderQuiz(root, ctx) {
  const { App, DATA, volId, mode, go: nav, recompute } = ctx;
  const vol = DATA.volumes[volId];
  if (!vol) { nav('#/'); return; }

  if (mode === 'intro') { renderVolumeIntro(root, ctx); return; }

  const state = App.state;
  const qs = vol.questions;
  const answers = () => (state.answersByVolume[volId] ||= {});

  // 定位到续测位置
  let idx = 0;
  const prog = state.inProgress[volId];
  const stored = answers();
  if (prog && Number.isFinite(prog.currentIdx)) {
    idx = clamp(prog.currentIdx, 0, qs.length - 1);
  } else {
    const firstUnanswered = qs.findIndex((q) => stored[q.id]?.value === undefined);
    idx = firstUnanswered < 0 ? 0 : firstUnanswered;
  }

  let current = idx;
  let focus = createFocusTimer();   // 自动扣除切屏 / 失焦时长
  let changesInQuestion = 0;
  let lastInterlude = -1;
  /* 当前题的作答入口。鼠标点击 / 键盘数字键 / 回退修改共用同一条路径，
     保证「选中态」与「下方语义提示」永远同步。
     不能直接在 onKey 里引用 renderQuestion 内的 onPick —— 那会越出作用域。 */
  let pickHandler = null;

  // 自动切题：默认开启，可随时切换；回退修改时不触发
  const AUTO_KEY = 'human-atlas::autoAdvance';
  let autoAdvance = localStorage.getItem(AUTO_KEY) !== '0';
  let advanceTimer = 0;

  const cancelAdvance = () => {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = 0; }
  };

  const scheduleAdvance = () => {
    cancelAdvance();
    advanceTimer = setTimeout(() => {
      advanceTimer = 0;
      if (!autoAdvance) return;
      const card = cardHolder.querySelector('.q-card');
      if (!card) return;
      card.classList.add('is-leaving');
      setTimeout(() => {
        if (current < qs.length - 1) move(1);
        else commit({ advance: true });
      }, 220);
    }, 240);
  };

  const quiz = el('div', { class: 'quiz', style: { '--vc': vol.theme_color, '--accent-vol': vol.theme_color } });
  root.classList.add('view');
  root.appendChild(quiz);

  /* ---------- 顶栏 ---------- */
  const bar = el('div', { class: 'quiz__bar' });
  const barTop = el('div', { class: 'quiz__bar-top' });

  // 极简「← 大厅」图标按钮，与卷名同排，省掉一整行垂直占位
  const backToHub = el('button', {
    class: 'quiz__back',
    type: 'button',
    'aria-label': '返回卷宗大厅',
    title: '返回大厅',
    onclick: () => { commit({ advance: false }); nav('#/'); },
  });
  backToHub.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5l-7 7 7 7"/></svg><span>大厅</span>`;

  const volLabel = el('div', { class: 'quiz__vol' }, vol.isExpress
    ? [
      el('b', { text: vol.title }),
      el('span', { text: 'EXPRESS · 28' }),
    ]
    : [
      el('b', { text: vol.title }),
      el('span', { text: `VOL.${String(vol.index).padStart(2, '0')}` }),
    ]);
  const countLabel = el('div', { class: 'quiz__count' });

  barTop.appendChild(backToHub);
  barTop.appendChild(volLabel);
  barTop.appendChild(countLabel);
  bar.appendChild(barTop);

  const track = el('div', { class: 'track' }, [el('i')]);
  bar.appendChild(track);
  quiz.appendChild(bar);

  /* ---------- 题面容器 ---------- */
  const cardHolder = el('div');
  quiz.appendChild(cardHolder);

  /* ---------- 底部 ---------- */
  const foot = el('div', { class: 'quiz__foot' });
  const backBtn = el('button', {
    class: 'btn btn--ghost',
    type: 'button',
    text: '← 上一题',
    onclick: () => move(-1),
  });
  const nextBtn = el('button', {
    class: 'btn btn--solid',
    type: 'button',
    text: '下一题 →',
    onclick: () => {
      if (!commit({ advance: true })) return;
    },
  });
  const exitBtn = el('button', {
    class: 'btn btn--ghost',
    type: 'button',
    text: '暂时离开',
    onclick: () => {
      commit({ advance: false });
      toast('进度已保存');
      nav('#/');
    },
  });

  foot.appendChild(backBtn);
  foot.appendChild(nextBtn);
  foot.appendChild(el('div', { class: 'spacer' }));
  foot.appendChild(exitBtn);
  const autoBtn = el('button', {
    class: `auto-toggle${autoAdvance ? ' is-on' : ''}`,
    type: 'button',
    'aria-pressed': String(autoAdvance),
    text: autoAdvance ? '自动切题' : '手动确认',
    onclick: () => {
      autoAdvance = !autoAdvance;
      localStorage.setItem(AUTO_KEY, autoAdvance ? '1' : '0');
      cancelAdvance();
      autoBtn.textContent = autoAdvance ? '自动切题' : '手动确认';
      autoBtn.classList.toggle('is-on', autoAdvance);
      autoBtn.setAttribute('aria-pressed', String(autoAdvance));
      toast(autoAdvance ? '选中后自动进入下一题' : '改为手动确认');
    },
  });
  foot.appendChild(autoBtn);

  // 快捷键提示随题型动态变化（选择题 N 项 / 量表 1–7 / 筹码题隐藏数字键）
  const keyPick = el('span', { html: '<kbd>1</kbd>—<kbd>4</kbd> 选择' });
  foot.appendChild(el('div', { class: 'quiz__keyhint' }, [
    keyPick,
    el('span', { html: '<kbd>Enter</kbd> 下一题' }),
    el('span', { html: '<kbd>⌫</kbd> 回退' }),
  ]));
  quiz.appendChild(foot);

  /* ---------- 状态写入 ---------- */
  function persist() {
    save(state, { immediate: true });
  }

  function setValue(q, value) {
    const a = answers();
    const prev = a[q.id];
    if (prev && JSON.stringify(prev.value) === JSON.stringify(value)) return;
    if (prev && prev.value !== undefined) {
      changesInQuestion += 1;
      addChange(state, q.id);
    }
    const elapsed = focus.net();
    const hidden = focus.hidden();
    a[q.id] = {
      value,
      ms: elapsed,
      changes: changesInQuestion,
      at: Date.now(),
    };
    recordAnswer(state, {
      questionId: q.id,
      question: q,          // 用于按题面长度计算动态发呆阈值
      ms: elapsed,
      changes: changesInQuestion,
      readMs: elapsed,
      hiddenMs: hidden,
    });
    state.inProgress[volId] = { currentIdx: current, updatedAt: Date.now() };
    persist();
  }

  function commit({ advance }) {
    const q = qs[current];
    const a = answers();
    const rec = a[q.id];

    const hasValue = rec && rec.value !== undefined
      && !(q.type === 'pyramid_top3' && (!Array.isArray(rec.value) || rec.value.length < 3))
      && !(q.type === 'budget_100' && (!rec.value || Object.values(rec.value).reduce((x, y) => x + Number(y || 0), 0) !== 100));

    if (advance && !hasValue) {
      if (q.type === 'budget_100') toast('把所有 100 点都用完再继续');
      else if (q.type === 'pyramid_top3') toast('请选出三项并排出顺序');
      else toast('先选一个更贴近你的选项');
      return false;
    }

    state.inProgress[volId] = { currentIdx: current, updatedAt: Date.now() };

    if (advance) {
      if (current < qs.length - 1) {
        current += 1;
        changesInQuestion = 0;
        persist();
        renderQuestion();
      } else {
        finish();
      }
    }
    return true;
  }

  function move(delta) {
    cancelAdvance();
    const target = current + delta;
    if (target < 0) return;
    if (target > qs.length - 1) {
      finish();
      return;
    }
    current = target;
    changesInQuestion = 0;
    state.inProgress[volId] = { currentIdx: current, updatedAt: Date.now() };
    persist();
    renderQuestion();
  }

  function finish() {
    const answeredNow = Object.keys(answers()).length;
    if (answeredNow < qs.length) {
      toast(`还有 ${qs.length - answeredNow} 题未作答，先把它们完成`);
      return;
    }

    // 极速模式：把虚拟桶的答案写回原卷，然后进简报页。
    // 不写 completedVolumes —— 28 题不等于完成了任何一整卷。
    if (vol.isExpress) {
      delete state.inProgress[volId];
      persist();
      nav('#/express/result');
      return;
    }

    const firstTime = !state.completedVolumes.includes(volId);
    if (firstTime) {
      state.completedVolumes.push(volId);
    }
    delete state.inProgress[volId];
    persist();
    recompute({ silent: true });
    // 首次完成即封存「初印象快照」，重测后可以对照本能态与修正态
    if (firstTime) {
      sealInitialSnapshot(state, volId, vol.dimensions || []);
      persist();
    }
    nav(`#/report/${volId}`);
  }

  /* ---------- 渲染当前题 ---------- */
  function renderQuestion() {
    const q = qs[current];
    const a = answers();
    const savedValue = a[q.id]?.value;

    // 每题一个全新的计时器，切屏时长不计入
    focus.dispose();
    focus = createFocusTimer();
    changesInQuestion = a[q.id]?.changes || 0;

    countLabel.innerHTML = `<b>${String(current + 1).padStart(2, '0')}</b> / ${String(qs.length).padStart(2, '0')}`;
    track.firstElementChild.style.width = `${((current + 1) / qs.length) * 100}%`;

    backBtn.disabled = current === 0;
    nextBtn.textContent = current === qs.length - 1 ? '完成本卷 →' : '下一题 →';

    cardHolder.innerHTML = '';

    // 微缓冲
    const showInterlude = current > 0 && current % 6 === 0 && lastInterlude !== current;
    if (showInterlude) {
      lastInterlude = current;
      const text = INTERLUDES[(current / 6 - 1) % INTERLUDES.length];
      const inter = el('div', { class: 'interlude' }, [
        el('div', { class: 'interlude__mark' }),
        el('p', { text }),
        el('small', { text: `— ${current} / ${qs.length} —` }),
      ]);
      cardHolder.appendChild(inter);
    }

    const card = el('div', { class: 'q-card' });

    const meta = el('div', { class: 'q-meta' }, [
      el('span', { class: 'q-meta__no', text: `Q ${String(current + 1).padStart(2, '0')}` }),
      el('span', { class: 'q-meta__sep' }),
      el('span', { class: 'q-meta__type', text: TYPE_LABEL[q.type] || q.type }),
      // 极速模式标注题目出处，让人知道这是从哪一卷抽出来的
      vol.isExpress && q._srcTitle
        ? el('span', { class: 'q-meta__src', text: `摘自 ${q._srcTitle}` })
        : null,
    ]);
    card.appendChild(meta);

    if (q.context) {
      const ctxBox = el('div', { class: 'q-context' });
      ctxBox.textContent = q.context;
      card.appendChild(ctxBox);
    }

    card.appendChild(el('h2', { class: 'q-prompt', text: q.prompt }));

    const hint = hintOf(q);
    if (hint) {
      card.appendChild(el('div', { class: 'q-hint' }, [el('span', { text: hint })]));
    }

    // 快捷键提示与当前题型对齐
    if (q.type === 'stealth_scale') {
      keyPick.innerHTML = '<kbd>1</kbd>—<kbd>7</kbd> 选择';
    } else if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
      const n = (q.options || []).length;
      keyPick.innerHTML = n > 1 ? `<kbd>1</kbd>—<kbd>${n}</kbd> 选择` : '';
    } else if (q.type === 'budget_100') {
      keyPick.innerHTML = '拖动滑块分配点数';
    } else if (q.type === 'pyramid_top3') {
      keyPick.innerHTML = '点选顺序即排名';
    }

    let scaleWidget = null;

    const onPick = (value) => {
      setValue(q, value);
      // 立即反映选中态
      cardHolder.querySelectorAll('.opt').forEach((o) => {
        o.classList.toggle('is-sel', o.dataset.k === String(value));
      });
      cardHolder.querySelectorAll('.scale-dot').forEach((d) => {
        d.classList.toggle('is-sel', d.dataset.k === String(value));
      });
      // 量表还要同步下方语义提示（点击 / 键盘 / 回退三条路径共用）
      if (scaleWidget && typeof scaleWidget.setScale === 'function') {
        scaleWidget.setScale(value);
      }

      // 240ms 柔和高亮后自动切题（可在底部开关关闭）
      if (autoAdvance) scheduleAdvance();
    };

    // 交给键盘分支复用
    pickHandler = onPick;

    if (q.type === 'forced_choice') {
      card.appendChild(renderForcedChoice(q, savedValue, onPick));
    } else if (q.type === 'impulse_3s') {
      const wrap = renderImpulse(q, savedValue, onPick);
      // 绑定选择后的高亮
      wrap.querySelectorAll('.opt').forEach((o) => {
        o.addEventListener('click', () => {
          wrap.querySelectorAll('.opt').forEach((x) => x.classList.remove('is-sel'));
          o.classList.add('is-sel');
        });
      });
      card.appendChild(wrap);
    } else if (q.type === 'stealth_scale') {
      const wrap = renderStealthScale(q, savedValue, (v) => {
        onPick(v);
      });
      scaleWidget = wrap;
      card.appendChild(wrap);
    } else if (q.type === 'budget_100') {
      card.appendChild(renderBudget(q, savedValue, (map) => {
        const total = Object.values(map).reduce((x, y) => x + Number(y || 0), 0);
        if (total === 100) setValue(q, { ...map });
        else {
          // 未满 100 也记录草稿，但不覆盖已完成的合法值
          state.inProgress[volId] = { currentIdx: current, updatedAt: Date.now() };
          const a2 = answers();
          if (!a2[q.id] || !a2[q.id].value) {
            a2[q.id] = { value: { ...map }, draft: true, ms: focus.net() };
          }
          persist();
        }
      }));
    } else if (q.type === 'pyramid_top3') {
      card.appendChild(renderPyramid(q, savedValue, (arr) => {
        setValue(q, arr);
      }));
    }

    cardHolder.appendChild(card);

    cardHolder.scrollIntoView({ block: 'nearest' });
    cancelAdvance();
  }

  /* ---------- 键盘 ---------- */
  const onKey = (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    const q = qs[current];

    if (e.key === 'Backspace') {
      e.preventDefault();
      move(-1);
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      commit({ advance: true });
      return;
    }
    if (e.key === 'ArrowRight') { commit({ advance: true }); return; }
    if (e.key === 'ArrowLeft') { move(-1); return; }

    const n = Number(e.key);
    if (!Number.isFinite(n) || n < 1) return;

    if (q.type === 'forced_choice' || q.type === 'impulse_3s') {
      const opt = q.options?.[n - 1];
      if (!opt) return;
      e.preventDefault();
      if (pickHandler) pickHandler(opt.key);
    } else if (q.type === 'stealth_scale') {
      if (n > 7) return;
      e.preventDefault();
      // 走统一入口：选中态 + 语义提示 + 自动切题全部对齐
      if (pickHandler) pickHandler(n);
    } else if (q.type === 'pyramid_top3') {
      const item = q.values?.[n - 1];
      if (!item) return;
      e.preventDefault();
      const cur = answers()[q.id]?.value;
      const arr = Array.isArray(cur) ? [...cur] : [];
      const at = arr.indexOf(item.key);
      if (at >= 0) arr.splice(at, 1);
      else if (arr.length < 3) arr.push(item.key);
      else return;

      setValue(q, arr);
      // 就地刷新金字塔，不重建题卡 ⇒ 计时器不重置，遥测数据保持连续
      const pyr = cardHolder.querySelector('.pyramid');
      if (pyr && typeof pyr.setPicked === 'function') pyr.setPicked(arr);
    }
  };
  window.addEventListener('keydown', onKey);

  // 离开页面时记录
  const cleanup = () => {
    window.removeEventListener('keydown', onKey);
  };
  window.addEventListener('hashchange', cleanup, { once: true });

  renderQuestion();
}

/* ------------------------------------------------------------
   维度解读：一维四面镜 → 当前档位应取的那一面
   ------------------------------------------------------------ */

function mirrorFor(dim, score, MIRRORS) {
  const m = MIRRORS[dim];
  if (!m) return null;
  const s = Number.isFinite(score) ? score : 50;
  const tier = tierOf(s);
  const side = s >= 50 ? 'high' : 'low';
  const face = m[side];
  if (!face) return null;
  return {
    dim,
    name: m.name,
    category: m.category,
    volume: m.volume,
    polar: !!m.polar,
    ...(m.negLabel ? { negLabel: m.negLabel } : {}),
    ...(m.posLabel ? { posLabel: m.posLabel } : {}),
    score: s,
    tier,
    side,
    label: face.label,
    gift_title: face.gift_title,
    gift_desc: face.gift_desc,
    shadow_title: face.shadow_title,
    shadow_desc: face.shadow_desc,
    alchemy_tip: face.alchemy_tip,
  };
}

function mirrorAll(scores, MIRRORS) {
  const out = {};
  for (const dim of Object.keys(MIRRORS)) {
    if (!Number.isFinite(scores[dim])) continue;
    out[dim] = mirrorFor(dim, scores[dim], MIRRORS);
  }
  return out;
}

/* ------------------------------------------------------------
   王牌天赋卡 / 阴影预警卡
   ------------------------------------------------------------ */

/**
 * 王牌天赋卡。
 * v4.2 起综合「绝对分」与「个人内部相对尖峰 Z」：
 *   composite = 0.62 · strength + 0.38 · zNorm
 * 只靠绝对分会永远选出那几个天生就高的维度，
 * 加入 Z 才能把「这个人身上真正突出的那一处」翻出来。
 *
 * @param {Object} zScores 可选的 Z 分数表；缺省时退化为纯绝对分
 */
function topGifts(scores, MIRRORS, limit = 3, zScores = null) {
  const rows = [];
  for (const [dim, s] of Object.entries(scores)) {
    if (!Number.isFinite(s)) continue;
    const m = mirrorFor(dim, s, MIRRORS);
    if (!m) continue;
    // 极显锋芒 / 清晰倾向 → 高分面；反向深潜 → 低分隐藏优势
    const strength = m.side === 'high' ? s : 100 - s;
    const z = Number.isFinite(zScores?.[dim]) ? zScores[dim] : 0;
    // v4.4 修复：strength 在低分侧已翻转为 (100 − s)，zNorm 也必须跟着翻转。
    // 旧实现直接用原始 z，导致「低分隐藏天赋」的 Z 为负（因为 s < μ），
    // zNorm 被压到 50 以下，反而拉低了 composite —— 低分侧的天赋永远选不出来。
    const alignedZ = m.side === 'high' ? z : -z;
    const zNorm = clamp(50 + 25 * alignedZ, 0, 100);
    const composite = zScores ? 0.62 * strength + 0.38 * zNorm : strength;
    rows.push({
      ...m, strength: round(strength, 1), z: round(z, 2), composite: round(composite, 1),
    });
  }
  return sortBy(rows, (r) => r.composite, -1).slice(0, limit);
}

function topShadows(scores, MIRRORS, limit = 3, zScores = null) {
  const rows = [];
  for (const [dim, s] of Object.entries(scores)) {
    if (!Number.isFinite(s)) continue;
    const m = mirrorFor(dim, s, MIRRORS);
    if (!m) continue;
    // 两侧极端化的程度 = 离 50 的距离；越极端，失控风险越高
    const intensity = Math.abs(s - 50) * 2;
    const z = Number.isFinite(zScores?.[dim]) ? zScores[dim] : 0;
    const zNorm = clamp(Math.abs(z) * 26, 0, 100);
    const composite = zScores ? 0.55 * intensity + 0.45 * zNorm : intensity;
    rows.push({ ...m, intensity: round(intensity, 1), z: round(z, 2), composite: round(composite, 1) });
  }
  return sortBy(rows, (r) => r.composite, -1).slice(0, limit);
}

/* ------------------------------------------------------------
   原型匹配
   ------------------------------------------------------------ */

/**
 * 原型匹配。
 *
 * v4.5 修复「单维劫持」：
 *   旧实现把未测维度直接跳过，只用「已测的那几项」求平均。
 *   于是某个原型只要 1 个维度恰好高分，就能凭 100% 的单维平均分
 *   反杀另一个扎实命中 4 个维度的原型。
 *
 * 现在按三步走：
 *   1. 统计 totalW / coveredW，算出覆盖率
 *   2. 硬闸门：coverage >= 0.60 且头号核心维度已测，才有资格进候选池
 *   3. 覆盖率置信惩罚：fit = rawFit × (0.75 + 0.25 × coverage)
 *
 * 若没有任何原型达标，返回 { eligible: false }，由单卷分型接管封面，
 * 绝不硬塞一个跨卷大原型。
 */
const ARCH_COVERAGE_MIN = 0.6;
const ARCH_COMPOSITE_GAP = 8;

function matchArchetype(scores, ARCHETYPES) {
  const list = ARCHETYPES.archetypes || [];
  if (!list.length) return null;

  const graded = list.map((a) => {
    const weights = a.weights || {};
    const negWeights = a.negWeights || {};

    /* ---- 1. 总权重 / 已覆盖权重 / 头号核心维度 ---- */
    let totalW = 0;
    let coveredW = 0;
    let primaryDim = null;
    let primaryMag = -1;

    for (const [dim, w] of Object.entries(weights)) {
      const mag = Math.abs(w);
      totalW += mag;
      if (mag > primaryMag) { primaryMag = mag; primaryDim = dim; }
      if (Number.isFinite(scores[dim])) coveredW += mag;
    }
    for (const [dim, w] of Object.entries(negWeights)) {
      const mag = Math.abs(w);
      totalW += mag;
      if (mag > primaryMag) { primaryMag = mag; primaryDim = dim; }
      if (Number.isFinite(scores[dim])) coveredW += mag;
    }

    const coverage = totalW > 0 ? coveredW / totalW : 0;
    const primaryCovered = primaryDim ? Number.isFinite(scores[primaryDim]) : false;
    const eligible = coverage >= ARCH_COVERAGE_MIN && primaryCovered;

    /* ---- 2. 只用已测维度算原始契合度 ---- */
    let acc = 0;
    let wSum = 0;
    const hits = [];

    for (const [dim, w] of Object.entries(weights)) {
      const sc = scores[dim];
      if (!Number.isFinite(sc)) continue;
      const mag = Math.abs(w);
      // weights 里的负号含义是「该维度越低越像」，按 (100 − sc) 参与累加
      acc += (w < 0 ? 100 - sc : sc) * mag;
      wSum += mag;
      if (mag >= 0.9) hits.push({ dim, score: round(sc, 0), w, inverse: w < 0 });
    }
    for (const [dim, w] of Object.entries(negWeights)) {
      const sc = scores[dim];
      if (!Number.isFinite(sc)) continue;
      const mag = Math.abs(w);
      acc += (100 - sc) * mag;
      wSum += mag;
      if (mag >= 0.9) hits.push({ dim, score: round(sc, 0), w: -mag, inverse: true });
    }

    const rawFit = wSum > 0 ? clamp(acc / wSum, 0, 100) : 0;

    /* ---- 3. 覆盖率置信惩罚 ---- */
    const fit = clamp(rawFit * (0.75 + 0.25 * coverage), 0, 100);

    return {
      ...a,
      fit: round(fit, 1),
      rawFit: round(rawFit, 1),
      coverage: round(coverage, 2),
      primaryDim,
      primaryCovered,
      eligible,
      hitCount: hits.length,
      hits,
    };
  });

  const ranked = sortBy(graded, (r) => r.fit, -1);

  /* 只有达标原型才有资格上封面 */
  const pool = ranked.filter((r) => r.eligible);
  if (!pool.length) {
    return {
      eligible: false,
      best: null,
      runnerUp: null,
      isComposite: false,
      coverage: 0,
      ranked,
      reason: '共同维度不足以支撑任何跨卷原型',
    };
  }

  const best = pool[0];
  const runnerUp = pool[1] || null;
  const isComposite = Boolean(runnerUp && (best.fit - runnerUp.fit) <= ARCH_COMPOSITE_GAP);

  return {
    eligible: true,
    best,
    runnerUp,
    isComposite,
    coverage: best.coverage,
    ranked,
    pool,
  };
}

/* ------------------------------------------------------------
   跨卷交叉规则
   ------------------------------------------------------------ */

function testCondition(cond, scores, mask) {
  // v4.4：mask 可能直接传数值，也可能传 { value, tier } 对象
  const v = cond.dim === 'mask'
    ? (typeof mask === 'number' ? mask : mask?.value)
    : scores[cond.dim];
  if (!Number.isFinite(v)) return false;
  switch (cond.op) {
    case '>=': return v >= cond.val;
    case '>': return v > cond.val;
    case '<=': return v <= cond.val;
    case '<': return v < cond.val;
    default: return false;
  }
}

function matchCrossRules(scores, mask, CROSS_RULES, completedVolumes = []) {
  const out = [];
  for (const rule of CROSS_RULES) {
    const reqs = rule.required_volumes || [];
    if (reqs.some((v) => !completedVolumes.includes(v))) continue;
    const ok = (rule.conditions || []).every((c) => testCondition(c, scores, mask));
    if (!ok) continue;
    const hits = (rule.conditions || [])
      .map((c) => ({
        dim: c.dim,
        name: c.dim === 'mask' ? '社会面具厚度' : null,
        score: c.dim === 'mask' ? mask?.value : scores[c.dim],
      }))
      .filter((h) => Number.isFinite(h.score));
    out.push({ ...rule, hits });
  }
  return out;
}

/* ------------------------------------------------------------

   ------------------------------------------------------------ */

function buildVolumeReport(state, DATA, volId) {
  const vol = DATA.volumes[volId];
  if (!vol) return null;

  const qs = (vol.questions || []);
  const ans = state.answersByVolume?.[volId] || {};
  const answered = qs.filter((q) => ans[q.id]?.value !== undefined);

  const dims = {};
  for (const d of vol.dimensions || []) {
    const v = state.computedScores?.[d];
    if (Number.isFinite(v)) dims[d] = v;
  }

  const mirrors = mirrorAll(dims, DATA.mirrors);
  const gifts = topGifts(dims, DATA.mirrors, 3, state.zScores || null);
  const shadows = topShadows(dims, DATA.mirrors, 3, state.zScores || null);
  const mask = state.maskIndex === null || state.maskIndex === undefined ? null : state.maskIndex;

  return {
    volumeId: volId,
    volume: vol,
    answers: answered,
    total: qs.length,
    answeredCount: answered.length,
    dims,
    mirrors,
    gifts,
    shadows,
    mask,
    maskTier: mask === null ? null : maskTierOf(mask),
    pressure: null,
    keywords: (gifts.length ? gifts : Object.values(mirrors)).slice(0, 3).map((g) => g.gift_title || g.label),
    verdict: buildVolumeVerdict(vol, gifts, shadows, answered.length, qs.length),
  };
}

function buildVolumeVerdict(vol, gifts, shadows, answered, total) {
  const done = answered >= total;
  const giftPart = gifts.length
    ? `在这一卷的坐标里，你最亮的地方是「${gifts[0].gift_title}」——${gifts[0].gift_desc.split('，')[0]}。`
    : '';
  const shadowPart = shadows.length
    ? `需要留意的反面是「${shadows[0].shadow_title}」。它不是缺陷，而是同一股力量在能量不足时显影的另一种形状。`
    : '';
  const prefix = done ? '' : `（本卷已完成 ${answered}/${total} 题，以下解读基于目前作答。）`;
  return `${prefix}${giftPart}${shadowPart}`;
}

/* ------------------------------------------------------------
   全息报告（≥3 卷）
   ------------------------------------------------------------ */

function buildHolographicReport(state, DATA) {
  const scores = state.computedScores || {};
  const completed = state.completedVolumes || [];
  const mask = {
    value: state.maskIndex,
    tier: Number.isFinite(state.maskIndex) ? maskTierOf(state.maskIndex) : null,
  };

  const cross = matchCrossRules(scores, mask, DATA.crossRules, completed);
  const archetype = matchArchetype(scores, DATA.archetypes);
  const dual = dualState(scores, DATA.mirrors, state.pressureStyle || null);
  const manual = useManual(scores, state.pressureStyle || null);

  const values = (state.topValues || []).map((id) => {
    const v = (DATA.dimensions.values || []).find((x) => x.id === id);
    return v ? { id: v.id, name: v.name, desc: v.desc } : { id, name: id, desc: '' };
  });

  return {
    completed,
    totalVolumes: Object.keys(DATA.volumes || {}).length,
    scores,
    zScores: state.zScores || {},
    mask,
    cross,
    archetype,
    dual,
    manual,
    values,
    pressure: state.pressureStyle || null,
    gifts: topGifts(scores, DATA.mirrors, 4, state.zScores || null),
    shadows: topShadows(scores, DATA.mirrors, 3, state.zScores || null),
  };
}

  if (completedCount >= 3) return { stage: 2, name: '交叉读心', desc: '跨卷化学反应已激活' };
  if (completedCount >= 1) return { stage: 1, name: '单点透视', desc: '单卷深度报告可查看' };
  return { stage: 0, name: '未启封', desc: '完成任意一卷即可解锁' };
}

/** 用于存档码 / 分享卡的简短判词 */
function soulVerdict(state, DATA) {
  const scores = state.computedScores || {};
  const arch = matchArchetype(scores, DATA.archetypes);
  if (!arch?.best) return null;
  return {
    name: arch.best.name,
    latin: arch.best.latin,
    verdict: arch.best.verdict,
    keywords: arch.best.keywords,
    fit: round(arch.best.fit, 1),
  };
}

/** 平均值（用于双人对比的总体倾向） */
function meanOfScores(scores, dims) {
  const vals = dims.map((d) => scores[d]).filter(Number.isFinite);
  return vals.length ? round(mean(vals), 1) : null;
}

   typology.js — 单卷分型引擎

   十六卷各自有一套专业心理结构分型，由该卷已测维度动态组合生成，
   零硬编码假结果。与 36 个跨卷原型彻底分家：
     · 单卷报告 → buildVolumeTypology()
     · 全息报告 → matchArchetype()（36 原型 + 覆盖率闸门）
   ============================================================ */



const top = (map, ids) => ids
  .map((id) => ({ id, v: map[id] }))
  .filter((x) => Number.isFinite(x.v))
  .sort((a, b) => b.v - a.v);

const low = (map, ids) => top(map, ids).slice().reverse();

/** 按 Z 分取最高 / 最低两极 */
const zTop = (z, ids, n = 1) => ids
  .map((id) => ({ id, z: z?.[id] }))
  .filter((x) => Number.isFinite(x.z))
  .sort((a, b) => b.z - a.z)
  .slice(0, n);

 * @param {Object} dimMap  DIM_MAP（取中文名）
 * @param {Object} ctx     { pressure, mask }
 * @returns {{ title, tag, anchors } | null}
 */
function buildVolumeTypology(volId, scores, zScores, dimMap, ctx = {}) {
  const build = BUILDERS[volId];
  if (!build) return null;

  const L = {};
  for (const [id, meta] of Object.entries(dimMap || {})) L[id] = meta?.name || id;

  const out = build(scores || {}, zScores || {}, L, ctx);
  if (!out) return null;

  return {
    title: out.title,
    tag: out.tag,
    anchors: (out.anchors || []).map((a) => ({
      id: a.id,
      name: L[a.id] || a.id,
      score: round(clamp(Number(a.v) || 0, 0, 100), 0),
    })),
  };
}
