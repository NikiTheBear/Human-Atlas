  font-family: var(--font-serif);
  font-size: 12.5px;
  text-align: right;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

.jung-row--p1 .jung-row__track i { opacity: 1; }
.jung-row--p2 .jung-row__track i { opacity: 0.78; }
.jung-row--p3 .jung-row__track i { opacity: 0.58; }
.jung-row--p4 .jung-row__track i { opacity: 0.42; }

.jung-stack__shadow {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.jung-shadow-row {
  display: grid;
  grid-template-columns: 38px 96px 34px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  color: var(--text-tertiary);
}

.jung-shadow-row__pos { font-size: 11px; letter-spacing: 0.1em; opacity: 0.8; }
.jung-shadow-row__name { font-family: var(--font-serif); }
.jung-shadow-row__score { text-align: right; font-variant-numeric: tabular-nums; }

.jung-shadow-row__bar {
  height: 2px;
  background: var(--border-hair);
  border-radius: 1px;
  overflow: hidden;
}

.jung-shadow-row__bar i { display: block; height: 100%; opacity: 0.5; }

.jung-stack__note {
  margin: 14px 0 0;
  font-size: 11px;
  line-height: 1.9;
  letter-spacing: 0.03em;
}

.jung-stack__legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-tertiary);
}

/* ============================================================
   v4.2 · 通用四象限（Vol.10 / Vol.16）
   ============================================================ */
.matrix-figure {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.matrix-caption {
  text-align: center;
  max-width: 42ch;
}

.matrix-caption h4 {
  margin: 0 0 6px;
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: 0.1em;
  color: var(--text-primary);
}

.matrix-caption p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.9;
  color: var(--text-secondary);
}

/* ============================================================
   v4.2 · 初印象 × 修正态对照
   ============================================================ */
.snapshot-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 18px;
  border-top: 1px solid var(--border-hair);
  padding-top: 14px;
}

.snapshot-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 34px 18px 34px 56px;
  align-items: center;
  gap: 8px;
  padding: 7px 2px;
  font-size: 12px;
  border-bottom: 1px solid var(--border-hair);
}

.snapshot-row:last-child { border-bottom: none; }

.snapshot-row__name {
  font-family: var(--font-serif);
  color: var(--text-primary);
  letter-spacing: 0.04em;
}

.snapshot-row__was { text-align: right; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.snapshot-row__arrow { text-align: center; color: var(--text-tertiary); opacity: 0.6; }
.snapshot-row__now { text-align: right; color: var(--text-primary); font-variant-numeric: tabular-nums; }

.snapshot-row__delta {
  text-align: right;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.snapshot-row__delta.is-up { color: var(--vol1); }
.snapshot-row__delta.is-down { color: var(--vol2); }
.snapshot-row__delta.is-flat { color: var(--text-tertiary); }

/* 雷达顶点：指针悬停时放大，提示浮层由原生 <title> 提供 */
.radar-dot {
  cursor: default;
  transition: r 180ms var(--ease), opacity 180ms var(--ease);
}

svg:hover .radar-dot { opacity: 0.82; }
.radar-dot:hover { opacity: 1; r: 4.2; }


/* ============================================================
   沉浸答题态：收起顶栏，把整屏让给题目
   ============================================================ */
body.is-immersive .masthead {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  box-shadow: none;
  transition: transform 320ms var(--ease), opacity 240ms var(--ease);
}

body.is-immersive .page--immersive {
  padding-top: 8px;
}

/* 顶栏让位后，sticky 进度条改为贴顶 */
body.is-immersive .quiz__bar {
  top: 0;
  padding-top: 8px;
  background: linear-gradient(var(--bg-page) 76%, transparent);
}

/* 沉浸态下浮动一枚极轻的「退出」返回钮，不占垂直空间 */
body.is-immersive .quiz__back {
  position: relative;
  z-index: 2;
}

/* 极速模式：题目出处小标签 */
.q-meta__src {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  opacity: 0.75;
  padding-left: 4px;
  border-left: 1px solid var(--border);
  margin-left: 2px;
}

/* ============================================================
   极速简报页
   ============================================================ */
.express-result {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 0 60px;
}

.express-hero {
  position: relative;
  padding: 46px 48px 40px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: var(--bg-card);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  margin-bottom: 26px;
}

.express-hero::after {
  content: '';
  position: absolute;
  inset: 11px;
  border: 1px solid color-mix(in srgb, var(--gold) 26%, transparent);
  border-radius: calc(var(--radius-xl) - 11px);
  pointer-events: none;
}

.express-hero__kicker {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
}

.express-hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(28px, 4vw, 40px);
  letter-spacing: 0.02em;
  margin: 0 0 10px;
}

.express-hero p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.85;
}

.express-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--border-hair);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 22px;
}

.express-stat {
  background: var(--bg-card);
  padding: 18px 20px;
}

.express-stat dt {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-tertiary);
  margin-bottom: 8px;
}

.express-stat dd {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 22px;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

@media (max-width: 760px) {
  .express-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .express-hero { padding: 34px 26px 30px; }
  .express-hero::after { inset: 8px; }
}

.express-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 26px;
}

/* ============================================================
   六大关系生态位
   ============================================================ */
.eco-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
  gap: 14px;
}

.eco-card {
  position: relative;
  padding: 22px 22px 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  transition: border-color 260ms var(--ease), box-shadow 260ms var(--ease),
    transform 320ms var(--ease);
}

.eco-card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px);
}

.eco-card.is-best {
  border-color: color-mix(in srgb, var(--gold) 55%, transparent);
  box-shadow: var(--shadow-glow);
}

.eco-card__top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 2px;
}

.eco-card__name {
  font-family: var(--font-serif);
  font-size: 17px;
  letter-spacing: 0.04em;
  color: var(--text-primary);
}

.eco-card__score {
  font-family: var(--font-serif);
  font-size: 24px;
  line-height: 1;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

.eco-card.is-best .eco-card__score { color: var(--gold); }

.eco-card__latin {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  opacity: 0.7;
  margin-bottom: 10px;
}

.eco-card__sum {
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 1.85;
  color: var(--text-secondary);
}

.eco-card__meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  padding-top: 10px;
  border-top: 1px solid var(--border-hair);
}

.eco-card__hits {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.eco-hit {
  font-size: 10.5px;
  letter-spacing: 0.04em;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--vol1) 34%, transparent);
  color: var(--vol1);
  background: color-mix(in srgb, var(--vol1) 6%, transparent);
}

.eco-card__badge {
  position: absolute;
  top: -1px;
  right: 18px;
  transform: translateY(-50%);
  font-size: 10px;
  letter-spacing: 0.14em;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: var(--gold);
  color: var(--text-inverse);
}

/* ============================================================
   关系三幕剧
   ============================================================ */
.act-list { display: grid; gap: 0; }

.act {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr);
  gap: 20px;
  padding: 22px 0;
  border-top: 1px solid var(--border-hair);
}

.act:first-child { border-top: none; }

.act__no {
  font-family: var(--font-serif);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--gold);
  padding-top: 3px;
}

.act__title {
  margin: 0 0 8px;
  font-family: var(--font-serif);
  font-size: 16px;
  letter-spacing: 0.04em;
}

.act__text {
  margin: 0;
  font-size: 13px;
  line-height: 2;

  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    animation: none !important;
    transition: none !important;
  }

  html, body {
    background: #fff !important;
    background-image: none !important;
    color: #1a1c1a;
    font-size: 10.5pt;
    line-height: 1.75;
  }

  body::after { display: none !important; }

  /* chrome off */
  .masthead,
  .report-nav,
  .report-actions,
  .quiz__foot,
  .toast-stack,
  .scrim,
  .colophon,
  .no-print,
  .theme-toggle,
  .btn,
  .mirror-face__foot {
    display: none !important;
  }

  #app, .page, .page--narrow {
    max-width: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .report { padding-top: 0 !important; }

  /* ---------------- 封面 ---------------- */
  .report-cover {
    break-after: page;
    page-break-after: always;
    border: 0 !important;
    border-bottom: 1px solid #d9d4c8 !important;
    border-radius: 0 !important;
    padding: 0 0 18pt !important;
    margin-bottom: 0 !important;
    min-height: 0;
  }

  .report-cover::before { display: none !important; }

  .cover-title {
    font-size: 30pt !important;
    line-height: 1.35 !important;
    margin-bottom: 12pt !important;
  }

  .cover-verdict { font-size: 11pt !important; line-height: 1.95 !important; }

  .gauges {
    border: 1px solid #d9d4c8 !important;
    background: #d9d4c8 !important;
    break-inside: avoid;
  }

  .gauge { padding: 10pt 12pt !important; background: #fff !important; }
  .gauge__value { font-size: 20pt !important; }

  /* ---------------- 章节 ---------------- */
  .rsec {
    break-inside: auto;
    margin-bottom: 20pt !important;
    scroll-margin-top: 0 !important;
    /* main.css 里为了滚动性能设了 content-visibility: auto，
       打印时必须强制展开，否则 A4 分页会漏掉未渲染的区块。 */
    content-visibility: visible !important;
  }

  .rsec__head {
    break-after: avoid;
    page-break-after: avoid;
    margin-bottom: 12pt !important;
    padding-bottom: 6pt !important;
  }

  .rsec__head h2 { font-size: 15pt !important; }

  .rsec__head p { display: none !important; }

  /* 大章节强制换页（section 之间干净分页） */
  .rsec {
    page-break-inside: auto;
  }

  /* 卡片类不跨页 */
  .mirror-card,
  .chart-card,
  .cross-card,
  .manual-card,
  .archetype-plate,
  .dual-state,
  .warn-card,
  .res-card,
  .cmp-verdict,
  .cmp-slot,
  .notice {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* 双面镜：打印时铺平，不做翻转 */
  .mirror-grid {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 10pt !important;
  }

  .mirror-card {
    perspective: none !important;
    min-height: 0 !important;
    cursor: default;
    break-inside: avoid;
  }

  .mirror-card__inner {
    transform: none !important;
    min-height: 0 !important;
    display: grid !important;
    gap: 8pt;
  }

  .mirror-face {
    position: static !important;
    inset: auto !important;
    transform: none !important;
    backface-visibility: visible !important;
    -webkit-backface-visibility: visible !important;
    padding: 12pt !important;
    box-shadow: none !important;
    min-height: 0;
  }

  .mirror-face--back { background: #f7f5f0 !important; }
  .mirror-face h3 { font-size: 12pt !important; }
  .mirror-face__body, .alchemy { font-size: 9pt !important; line-height: 1.7 !important; }

  .chart-card { padding: 12pt !important; }
  .chart-card h3 { font-size: 11pt !important; }
  .chart-grid-2 { grid-template-columns: 1fr !important; gap: 10pt !important; }

  .cross-card { padding: 10pt 12pt !important; margin-bottom: 8pt !important; }
  .cross-card h3 { font-size: 12.5pt !important; }
  .cross-card__insight { font-size: 9.5pt !important; line-height: 1.8 !important; }
  .cross-card__advice { font-size: 9pt !important; padding: 8pt 10pt !important; }

  .manual-grid { grid-template-columns: 1fr 1fr !important; gap: 8pt !important; }
  .manual-card { padding: 10pt 12pt !important; }
  .manual-card p, .manual-card ul { font-size: 9pt !important; line-height: 1.75 !important; }

  .archetype-plate { padding: 18pt 14pt !important; }
  .archetype-plate h2 { font-size: 22pt !important; }
  .archetype-plate p { font-size: 10.5pt !important; }

  .dual-state { grid-template-columns: 1fr 1fr !important; }
  .dual-state > div { padding: 12pt 14pt !important; }
  .dual-state p { font-size: 9.5pt !important; line-height: 1.8 !important; }

  /* 表格 */
  .dim-table { font-size: 9pt !important; }
  .dim-table thead { display: table-header-group; }
  .dim-table tr { break-inside: avoid; page-break-inside: avoid; }
  .dim-table td { padding: 5pt 8pt 5pt 0 !important; }
  .dim-table th { font-size: 7.5pt !important; padding-bottom: 5pt !important; }
  .score-bar { background: #e8e4da !important; }

  /* 长图/图表保持清晰 */
  svg { shape-rendering: geometricPrecision; }

  .page-break {
    break-before: page;
    page-break-before: always;
  }

  /* 军规：打印时去掉所有 overflow 裁剪，防止 SVG 被切断 */
  .chart-card__body,
  .report-cover {
    overflow: visible !important;
  }

  /* 页脚水印 */
  .print-colophon {
    display: block !important;
    margin-top: 16pt;
    padding-top: 8pt;
    border-top: 1px solid #d9d4c8;
    font-size: 7.5pt;
    letter-spacing: 0.14em;
    color: #7d817c;
    text-align: center;
  }

  a[href]::after { content: ''; }
}

ity":1.2},"social_desirability":1}]},{"id":"v1_q12","type":"stealth_scale","stealth_mode":"projection","layer":"explicit","mirror_key":"envy_kindness","is_sensitive":true,"weight":0.85,"prompt":"一位关系不错的朋友，拿到了你暗暗努力了很多年也没拿到的东西。你为他高兴的那部分，大概占多少？","scale":{"left":"几乎全部，那点酸我一秒就压下去了","right":"有，但不多，剩下大部分是说不清的堵","sdHigh":"left"},"effects":{"sin_envy":[-2,2],"virtue_kindness":[2,-2],"big5_compassion":[1.2,-1],"def_project":[-0.8,1]}},{"id":"v1_q13","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"lust_chastity","is_sensitive":true,"weight":1.25,"context":"凌晨十二点四十，一条本来只想看一眼的消息，把你带进了一个很容易上头的话题。手机屏幕的光落在天花板上。","prompt":"这一刻你身体里最诚实的反应是——","options":[{"key":"A","text":"整个人被点着了，睡意瞬间消失，想继续往下走","effects":{"sin_lust":2,"virtue_chastity":-1.6,"mot_hedonism":1.8,"virtue_temperance":-1.2},"social_desirability":0},{"key":"B","text":"有一瞬间的冲动，然后把它当成一个信号记下来就睡了","effects":{"sin_lust":0.2,"virtue_chastity":1,"virtue_temperance":1.2,"cog_logic":0.8},"social_desirability":2},{"key":"C","text":"已经很累，但还是继续滑，像是在借这点刺激撑住自己","effects":{"sin_lust":1.4,"virtue_chastity":-0.8,"sin_gluttony":1.2,"big5_rumination":1.2},"social_desirability":0},{"key":"D","text":"把手机翻过去，替自己按下一个明确的结束键","effects":{"sin_lust":-1.6,"virtue_chastity":1.8,"virtue_temperance":1.6,"big5_order":0.8},"social_desirability":3}]},{"id":"v1_q14","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"gluttony_temperance","is_sensitive":false,"weight":1.4,"prompt":"连续加班两周后的第一个完整休息日，你更可能怎么过？","options":[{"key":"A","text":"把攒了两周的馋和懒一次性兑现，吃到撑，然后什么都不干","effects":{"sin_gluttony":1.8,"virtue_temperance":-1.6,"mot_hedonism":1.8,"big5_order":-1},"social_desirability":0},{"key":"B","text":"补觉、散步、做顿饭，把身体的节奏一点点调回来","effects":{"sin_gluttony":-1.4,"virtue_temperance":1.8,"big5_order":1.2,"big5_alert":0.6},"social_desirability":3},{"key":"C","text":"立刻安排一件新鲜的、没试过的事，不想让这天被浪费","effects":{"sin_gluttony":0.4,"virtue_temperance":0.2,"mot_hedonism":1.4,"big5_open":1.6},"social_desirability":1},{"key":"D","text":"照常打开电脑，休息日和工作日在我这没什么本质区别","effects":{"sin_gluttony":-1,"virtue_temperance":0.8,"virtue_diligence":1.6,"big5_industry":1.4},"social_desirability":2}]},{"id":"v1_q15","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"wrath_patience","is_sensitive":true,"weight":0.85,"prompt":"一个曾经让你很难堪的人，两年后在一次饭局上跟你笑着敬酒，像什么都没发生过。你心里的那条账——","scale":{"left":"早就翻篇了，人是会变的","right":"还留着，只是不再需要他为它付什么","sdHigh":"left"},"effects":{"sin_wrath":[-2,2],"virtue_patience":[2,-2],"def_detach":[-1,1],"big5_rumination":[-1.2,1.2]}},{"id":"v1_q16","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"sloth_diligence","is_sensitive":false,"weight":1.4,"prompt":"一个没有任何人期待你产出结果的周末，你更担心发生哪种情况？","options":[{"key":"A","text":"两天就这么过去了，回想起来一片空白，什么都没留下","effects":{"sin_sloth":-1.2,"virtue_diligence":1.6,"big5_industry":1.4,"big5_order":0.8},"social_desirability":2},{"key":"B","text":"又把自己排满，连休息都变成一项需要交付的任务","effects":{"sin_sloth":0.8,"virtue_diligence":0.6,"big5_order":1.6,"big5_alert":1},"social_desirability":1},{"key":"C","text":"被一种「该做点正事」的愧疚追着，最后什么也没做成","effects":{"sin_sloth":1.6,"virtue_diligence":-1,"big5_rumination":1.6,"def_fawn":0.6},"social_desirability":0}]},{"id":"v1_q17","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"greed_charity","is_sensitive":true,"weight":1.4,"context":"大学时和你成绩、家境都差不多的室友，昨天发了一张新房钥匙的照片，配文只有「小目标达成，感谢好运」。你们上一次聊天是半年前。","prompt":"你猜他按下发送键之前，心里最真实的那一层是——","options":[{"key":"A","text":"终于可以发这一条了。这一步我等太久，也该让一些人看看。","effects":{"sin_greed":1.8,"virtue_charity":-0.8,"sin_pride":1.2,"mot_mastery":1.4},"social_desirability":0},{"key":"B","text":"犹豫了很久，怕看起来像在炫耀，删掉又重写了一遍。","effects":{"sin_greed":0.4,"virtue_charity":1.2,"big5_alert":1.4,"mot_belonging":1.2},"social_desirability":3},{"key":"C","text":"这些年的代价只有自己知道，发出来算是给自己一个交代。","effects":{"sin_greed":-1.6,"virtue_charity":1.8,"light_humanism":1.2,"lv_anchor":1.2},"social_desirability":2},{"key":"D","text":"他根本没想那么多，就是随手拍了张照，发 n_lust":0.4,"virtue_chastity":0.8,"cog_ambiguity":1,"dark_mach":1.4},"social_desirability":2},{"key":"D","text":"先接下来，真到了那一步再决定要不要踩过去","effects":{"sin_lust":1.8,"virtue_chastity":-1.6,"cog_speed":1.4,"val_moral":-1.2},"social_desirability":0}]},{"id":"v1_q21","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"gluttony_temperance","is_sensitive":true,"weight":0.85,"prompt":"回想那些「明明知道该停却没停」的时刻，它们更多出现在——","scale":{"left":"很少，我的刹车基本都在线","right":"白天越是被安排，夜里越容易报复性地不肯睡","sdHigh":"left"},"effects":{"sin_gluttony":[-2,2],"virtue_temperance":[2,-2],"def_fawn":[-1,1.2],"mot_autonomy":[-0.8,1.4]}},{"id":"v1_q22","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"pride_humility","is_sensitive":true,"weight":1.4,"context":"你花了三个月做的东西，被一个外行用非常外行的话公开否定，而且他很有影响力，场面安静了两秒。","prompt":"这两秒钟里，你最想守住的其实是——","options":[{"key":"A","text":"把道理讲到所有人都听懂，让那句否定当场站不住脚","effects":{"sin_pride":1.8,"virtue_humility":-1.4,"big5_assert":1.6,"def_attack":1},"social_desirability":0},{"key":"B","text":"不急着争，先问清他到底在担心什么，也许里面真有一句对的","effects":{"sin_pride":-1.8,"virtue_humility":1.8,"big5_open":1.2,"big5_compliance":1},"social_desirability":3},{"key":"C","text":"表面的体面，笑一下把场面接过去，之后单独找他用结果说话","effects":{"sin_pride":0.8,"virtue_humility":0.4,"covert_control":1.6,"dark_mach":1.4},"social_desirability":2},{"key":"D","text":"自己的判断，即使没人支持，我也知道这东西的分量在哪","effects":{"sin_pride":1.2,"virtue_humility":0.2,"cog_independent":1.8,"mot_autonomy":1},"social_desirability":1}]}]},"vol10":{"volume_id":"vol10","index":10,"title":"秩序与混沌","subtitle":"D&D 九宫格阵营与十二叙事原型底色","theme_color":"#7A4B3A","estimated_minutes":4,"intro":"这一卷不设道德评分表。它只问一件事：当没有摄像头、没有旁人、也看不见后果的时候，你相信什么在维持这个世界——是白纸黑字的规矩，还是此刻站在你面前的这个人。两种答案都有代价，也都有尊严。","dimensions":["dd_order","dd_good"],"questions":[{"id":"v10_q01","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"alignment_order","is_sensitive":false,"weight":1.4,"context":"雨夜十一点，城郊那条直路上一个摄像头都没有。前方路口亮着红灯，五百米内看不到一辆车、一个人。一个外卖骑手从你身边绕过去闯了灯，水花溅了你一裤腿。","prompt":"绿灯还要等四十秒，你站在原地。此刻你更接近哪一种做法？","options":[{"key":"A","text":"快步跟过去，扶住那辆歪在雨里的电动车，帮他把汤码回去。","effects":{"dd_order":-1.4,"dd_good":1.7,"wv_social":0.9},"social_desirability":2},{"key":"B","text":"左右看完确实没车就走过去。灯是用来防碰撞的，此刻这条路上没有碰撞。","effects":{"dd_order":-1.8,"dd_good":-1.2,"cog_independent":1.1},"social_desirability":1},{"key":"C","text":"等完这四十秒。规则不是给摄像头看的，没人盯着的时候，它才真的算数。","effects":{"dd_order":1.9,"dd_good":1.2,"light_kant":1},"social_desirability":2},{"key":"D","text":"照样等，但拍下车牌回家提一单——这条规矩对每个人都该一样重。","effects":{"dd_order":1.7,"dd_good":-1.2,"big5_assert":0.9},"social_desirability":1}]},{"id":"v10_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"alignment_good","is_sensitive":true,"weight":0.85,"prompt":"菜市场收摊前，摊主一边跟隔壁聊天一边给你找钱，多找了二十块。你拎着菜走出去十几米，低头才发现。","scale":{"left":"转身走回去，把那二十块放回秤台边","right":"接着走。这是他自己算错，不是我伸手拿的","sdHigh":"left"},"effects":{"dd_good":[1.8,-1.6],"dd_order":[1.3,-1.2],"val_moral":[1.2,-1],"sin_greed":[-0.9,1.1]}},{"id":"v10_q03","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"alignment_good","is_sensitive":true,"weight":1.4,"context":"你的一位老朋友失业三个月了，一直没跟家里说。今晚他带你去他女朋友家吃饭，饭桌上她随口说起他最近总加班到很晚，他笑着点头。","prompt":"桌下他的膝盖轻轻碰了碰你。你接下来那句话会往哪边走？","options":[{"key":"A","text":"顺着他的话编圆，回头把这事记下来——下次他开口借钱，我有依据。","effects":{"dd_order":-1.2,"dd_good":-1.2,"dark_mach":1.1},"social_desirability":0},{"key":"B","text":"顺着他说下去。这是他的事，什么时候说是他的权利，我只负责不当场拆台。","effects":{"dd_order":-1.5,"dd_good":1.8,"mot_belonging":1},"social_desirability":1},{"key":"C","text":"照实说一句「他最近没上班，具体你问他」，剩下的交给他自己。","effects":{"dd_order":1.9,"dd_good":-1.3,"light_kant":1.1},"social_desirability":2},{"key":"D","text":"把话岔开，聊点别的。我没有撒谎，也不替他决定哪一天该开口。","effects":{"dd_order":1.3,"dd_good":1.4,"cog_ambiguity":1},"social_desirability":3}]},{"id":"v10_q04","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"alignment_good","is_sensitive":true,"weight":1.3,"context":"晚高峰的地铁站台，一个男人因为裤脚被拖把碰到，对着保洁阿姨越说越大声，手指几乎戳到她脸上。周围人都低头看手机。","prompt":"你离他们只有三步，第一秒身体先做出的是——","options":[{"key":"A","text":"走过去站到阿姨侧前半步，一句话不说，就那么平视着他。","effects":{"dd_order":1.2,"dd_good":1.9,"big5_assert":1.1},"social_desirability":3},{"key":"B","text":"先录下来再叫站台工作人员——没记录的事，最后就是各说各话。","effects":{"dd_order":1.9,"dd_good":-1.2,"big5_compliance":0.9},"social_desirability":2},{"key":"C","text":"心里一紧，但把耳机音量调大，加快脚步走进车门。","effects":{"dd_order":-1.2,"dd_good":-1.5,"def_detach":1.1},"social_desirability":1},{"key":"D","text":"直接开口：「人家拖地，你的鞋挡着道了」，语气比他还冲。","effects":{"dd_order":-1.3,"dd_good":1.3,"sin_wrath":1.2},"social_desirability":0}]},{"id":"v10_q05","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"alignment_order","is_sensitive":true,"weight":0.85,"prompt":"老房子的拆迁意向书下来了。家族群里，几位长辈已经商量好怎么分，没人问过一直住在里面照顾奶奶的那个人。轮到你表态时，你心里最想做的更接近——","scale":{"left":"顺着大家的意思，「你们定就好，我没什么意见」","right":"把话挑明：「这七年是谁在照顾，得先听我说完」","sdHigh":"left"},"effects":{"dd_order":[1.6,-1.4],"dd_good":[-1.4,1.6],"big5_compliance":[1.2,-1],"mot_autonomy":[-1,1.2]}},{"id":"v10_q06","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"alignment_order","is_sensitive":true,"weight":1.4,"context":"公司内网的考勤系统有个谁都知道、也没人修的漏洞：补卡申请可以自己审批。这个月你迟到过三次，其中两次确实是自己的问题，扣的钱不算少。","prompt":"页面上那个「自己批自己」的按钮，你会按下它吗？","options":[{"key":"A","text":"三次全补。这套制度本来就没打算跟人讲道理，能过就过。","effects":{"dd_order":-1.9,"dd_good":-1.5,"sin_greed":1},"social_desirability":0},{"key":"B","text":"关掉页面，走正常的补卡流程，批不批由组长自己判断。","effects":{"dd_order":1.9,"dd_good":1.3,"light_kant":1},"social_desirability":2},{"key":"C","text":"照扣，然后把三次截图发给组长，请全组按同一套标准来。","effects":{"dd_order":1.9,"dd_good":-1.2,"val_standard":1},"social_desirability":1},{"key":"D","text":"三次都补，然后把入口告诉全组——凭什么只有我一个人知道。","effects":{"dd_order":-1.2,"dd_good":1.2,"mot_belonging":0.9},"social_desirability":1}]},{"id":"v10_q07","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"alignment_order","is_sensitive":true,"weight":0.85,"prompt":"你和朋友合伙买了台三万多的机器接私活。三个月后他说不做了，设备留给你，那半年的钱「就当帮兄弟一把」。你看着那台还在折旧的机器——","scale":{"left":"「行，机器我留着，钱的事算了」，就当交了一次学费","right":"把账摊开：「按市价折旧折一半，这个数我们今天说清楚」","sdHigh":"left"},"effects":{"dd_order":[-1.5,1.4],"dd_good":[1.2,-1.3],"light_kant":[-1,0.9],"def_detach":[1.1,-0.8]}},{"id":"v10_q08","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"alignment_good","is_sensitive":true,"weight":1.25,"context":"凌晨两点，你下楼扔垃圾，看见一个男人蹲在楼下的电动车旁，手里捏着一截铁片，车锁已经撬开一半，车灯在暗处闪着。","prompt":"他抬头，正好也看见了你。这一秒，你身体里最先动起来的是哪一股？","options":[{"key":"A","text":"退回楼道，打 110，再把单元门反锁——他选的路，后果自负。","effects":{"dd_order":1.9,"dd_good":-1.2,"mot_security":1},"social_desirability":1},{"key":"B","text":"捂住口袋快步走开。半夜这种事，本来就轮不到我来管。","effects":{"dd_order":-1.2,"dd_good":-1.8,"def_detach":0.9},"social_desirability":1},{"key":"C","text":"冲上去吼一句「你干什么」，声音大得整栋楼都听得见。","effects":{"dd_order":-1.6,"dd_good":1.3,"sin_wrath":1},"social_desirability":0},{"key":"D","text":"停住，慢慢举起手机对准他，喊一句「我已经拍了」。","effects":{"dd_order":1.2,"dd_good":1.4,"big5_assert":1.1},"social_desirability":2}]},{"id":"v10_q09","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"alignment_order","is_sensitive":true,"weight":1.4,"context":"医院检验科前排队四十多人，取号屏上还有二十七个。一个抱着发烧孩子的母亲走到你面前，说她只差一张抽血单，问能不能插在你前面。","prompt":"你身后还站着三十多个人。你此刻会怎么处理？","options":[{"key":"A","text":"请她去找护士台，那里有急症通道，比我这里排队要快得多。","effects":{"dd_order":1.9,"dd_good":1.3,"cog_logic":1},"social_desirability":3},{"key":"B","text":"摇头。后面三十几个人里，抱着孩子的可能不止她一个。","effects":{"dd_order":1.5,"dd_good":-1.4,"val_boundary":1},"social_desirability":1},{"key":"C","text":"让她站我前面，但先回头问一声身后的人，有人不同意就作罢。","effects":{"dd_order":1.2,"dd_good":1.8,"big5_compassion":1.1},"social_desirability":2},{"key":"D","text":"让她过去。规矩是给活人用的，孩子这会儿烧到三十九度。","effects":{"dd_order":-1.7,"dd_good":1.6,"wv_social":-0.8},"social_desirability":2}]},{"id":"v10_q10","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"alignment_good","is_sensitive":false,"weight":0.85,"prompt":"凌晨一点，你刷到一条转发过千的众筹：一个陌生父亲说孩子要动手术，还差八万。照片有点糊，没有病历，也没有医院的名字。","scale":{"left":"划过去。我救不了每一个刷到的人，也不知道这是不是真的","right":"随手转五十块。真的假的我都认了，就当这一下没白刷","sdHigh":"right"},"effects":{"dd_good":[-1.5,1.6],"dd_order":[1.3,-1.2],"light_faith":[-1,1.2],"cog_logic":[1.1,-0.9]}},{"id":"v10_q11","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"alignment_order","is_sensitive":true,"weight":1.4,"context":"二手房过户前一夜，中介压低声音跟你说，成交价可以写成两份，税能少交五万多，这条街上一直这么办。你妈在旁边点头，说这笔钱本来是留给装修的。","prompt":"笔就放在桌上，你最后落笔的那份是——","options":[{"key":"A","text":"「写两份吧。」我妈为这五万攒了三年，我没法当着她的面把这份钱推回去。","effects":{"dd_order":-1.7,"dd_good":1.6,"mot_belonging":1},"social_desirability":2},{"key":"B","text":"「按真实价格签，那五万我自己补。」省下来的钱，往后每晚都得替它担一次心。","effects":{"dd_order":1.9,"dd_good":1.3,"light_kant":1},"social_desirability":3},{"key":"C","text":"「按真价签。省下的是给我装修的钱，真要出事，站进去的是我。」","effects":{"dd_order":1.6,"dd_good":-1.3,"val_standard":1.1},"social_desirability":1},{"key":"D","text":"「写两份吧。规矩要真管得住，这条街上早就没人这么干了。」","effects":{"dd_order":-1.9,"dd_good":-1.4,"cog_independent":1},"social_desirability":0}]},{"id":"v10_q12","type":"stealth_scale","stealth_mode":"projection","layer":"stealth","mirror_key":"alignment_good","is_sensitive":true,"weight":0.85,"prompt":"朋友聚会，一个人成了全场玩笑的靶子，连他的口音、他的新工作都被拿出来讲。他自己也在笑。笑声停下来的时候，你坐在哪里？","scale":{"left":"跟着笑。气氛已经到这儿了，认真起来反而扫兴","right":"把话头挪开，或者干脆坐到他旁边去接着聊","sdHigh":"right"},"effects":{"dd_good":[-1.5,1.6],"dd_order":[1.3,-1.3],"big5_compassion":[-1,1.2],"val_boundary":[1,-0.8]}},{"id":"v10_q13","type":"forced_choice","stealth_mode":"normalization","layer":"stealth","mirror_key":"alignment_good","is_sensitive":true,"weight":1.4,"context":"外卖放到你家门口，是一份你没点的餐：整只烤鸭配两个菜，小票上写着另一个单元的门牌号，价钱是你平时一顿的三倍。系统显示「已送达」。","prompt":"骑手已经走远，那份餐还在你手里。你打算怎么办？","options":[{"key":"A","text":"先拍照存证，两个小时没人来认，就当平台送了我一顿。","effects":{"dd_order":1.3,"dd_good":-1.2,"cog_logic":0.9},"social_desirability":1},{"key":"B","text":"直接吃。这一单的钱平台早就赚平了，它记在损耗里，不记在谁头上。","effects":{"dd_order":-1.9,"dd_good":-1.7,"cog_independent":1},"social_desirability":1},{"key":"C","text":"拍照发给平台客服，让他们联系那个单元真正的收件人。","effects":{"dd_order":1.8,"dd_good":1.5,"light_kant":1},"social_desirability":3},{"key":"D","text":"拎到那个单元门口敲门问一句，是谁家点的就还回去。","effects":{"dd_order":-1.2,"dd_good":1.9,"big5_compassion":1},"social_desirability":2}]},{"id":"v10_q14","type":"pyramid_top3","stealth_mode":"ipsative","layer":"explicit","mirror_key":"alignment_values","is_sensitive":false,"weight":1.3,"prompt":"下面八件事，挑出你最不能容忍别人破坏的三件，最不能忍的排第一。不是它们「应该」重要，而是真的发生了你会当场站起来。","values":[{"key":"broken_promise_rule","label":"说好的规矩，被有权力的人一句话推翻","effects":{"dd_order":1.9,"dd_good":1.2}},{"key":"punching_down","label":"成年人把气撒在不能还手的人身上","effects":{"dd_order":1.2,"dd_good":1.9}},{"key":"public_humiliation","label":"有人当众羞辱一个刚说错话的年轻人","effects":{"dd_order":1.3,"dd_good":1.6}},{"key":"locked_by_process","label":"一个人被流程卡在原地，周围没有一个人肯通融","effects":{"dd_order":-1.5,"dd_good":1.6}},{"key":"ungrateful","label":"你帮过的人，转过身就当没这回事","effects":{"dd_order":1.3,"dd_good":-1.4}},{"key":"only_one_following","label":"所有人都在钻空子，只有你还在按流程走","effects":{"dd_order":1.5,"dd_good":-1.3}},{"key":"decided_for_you","label":"有人替你做了决定，还一口一个为你好","effects":{"dd_order":-1.7,"dd_good":-1.2}},{"key":"words_moved_upstairs","label":"你私下说过的话，被人原样搬到了台面上","effects":{"dd_order":-1.3,"dd_good":-1.5}}]},{"id":"v10_q15","type":"budget_100","stealth_mode":"budget","layer":"explicit","mirror_key":"alignment_cost","is_sensitive":false,"weight":1.3,"prompt":"假设你手里有一百点，只能投给你住的这条街。没有一分是白给的：投在哪里，就等于承认你相信什么在支撑它。","items":[{"key":"rule_no_exception","label":"一条连制定者也不能例外的规矩","dim":"dd_order","base":0,"gain":1},{"key":"open_ledger","label":"每一笔账都能被任何人查到的账本","dim":"dd_order","base":0,"gain":1},{"key":"process_owner","label":"出事之后有人按流程负责到底的通道","dim":"dd_order","base":0,"gain":1},{"key":"step_down","label":"给一时过不去的人留一个不被追问的台阶","dim":"dd_good","base":0,"gain":1},{"key":"count_the_silent","label":"把没人替其说话的那部分人算进去","dim":"dd_good","base":0,"gain":1},{"key":"show_up","label":"哪家出了事，第一个到场的那份余力","dim":"dd_good","base":0,"gain":1}]},{"id":"v10_q16","type":"forced_choice","stealth_mode":"projection","layer":"stealth","mirror_key":"alignment_order","is_sensitive":true,"weight":1.4,"context":"小区群里发起联名，要求物业禁止一位老人半夜在垃圾桶边收纸箱，「影响形象，也有消防隐患」。接龙已经排到四十多户，你的头像排在后面。","prompt":"轮到你了。这条接龙，你接不接？","options":[{"key":"A","text":"不接，也不说话。别人家的事，轮不到我替他们表态。","effects":{"dd_order":-1.2,"dd_good":-1.5,"def_detach":1},"social_desirability":1},{"key":"B","text":"接，但加一句：先跟老人谈，给他一个固定时段和堆放点。","effects":{"dd_order":1.9,"dd_good":1.4,"cog_ambiguity":0.8},"social_desirability":3},{"key":"C","text":"不接，回一句：他没堵消防通道，那些纸箱是他这个月的菜钱。","effects":{"dd_order":-1.3,"dd_good":1.8,"big5_assert":1.1},"social_desirability":2},{"key":"D","text":"接。半夜翻桶的声音我确实听过很多次，我的睡眠也是真的。","effects":{"dd_order":1.5,"dd_good":-1.9,"val_boundary":1.1},"social_desirability":0}]}]},"vol11":{"volume_id":"vol11","index":11,"title":"哲人底色","subtitle":"八大哲学流派与海特六大道德基础","theme_color":"#4D5D4E","estimated_minutes":5,"intro":"这一卷不测你读过多少书。它想看清的是：当一件不好的事真的落在你身上，你会用哪一套语言把它解释过去；以及别人踩到哪条线上时，你心里最原始的那一下会先亮起来。请凭第一感觉作答，不必挑更体面的那个答案。","dimensions":["phil_stoic","phil_existential","phil_absurd","phil_cynic","phil_pragmatic","phil_epicurean","phil_nihilism","phil_humanist","mft_care","mft_fairness","mft_loyalty","mft_authority","mft_sanctity","mft_liberty"],"questions":[{"id":"v11_q01","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"phil_stoic","is_sensitive":true,"weight":1.4,"context":"你用了两年、几乎所有的周末，还有一部分积蓄做一件事。就在快收成的前一个月，一条你完全没有参与决定权的政策变动，让它归了零。","prompt":"哭过或者没哭过之后，最先把你从地上扶起来的是哪一种念头？","options":[{"key":"A","text":"结果本来就不完全归我，归我的只有此刻站成什么样，和接下来先做完哪件小事","effects":{"phil_stoic":2,"def_intellectual":1.2,"lv_suffering":1.2,"phil_absurd":-1.2},"social_desirability":2},{"key":"B","text":"没有人承诺过剧本。旧的那本撕了，那就由我重写一版，写砸了也算我自己的","effects":{"phil_existential":2,"mot_autonomy":1.4,"lv_anchor":0.8,"phil_nihilism":-1.2},"social_desirability":3},{"key":"C","text":"推上去的东西总会滚下来。先笑一下，然后去吃一顿很烫很辣的东西","effects":{"phil_absurd":2,"phil_epicurean":1.7,"lv_suffering":-1.2,"phil_stoic":-1.2},"social_desirability":1},{"key":"D","text":"认真到这个地步还是被这样拿走，以后别再把整颗心押在任何一件事上","effects":{"phil_cynic":2,"phil_nihilism":1.4,"light_faith":-1.4,"lv_suffering":-0.8},"social_desirability":0}]},{"id":"v11_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"phil_pragmatic","is_sensitive":true,"weight":0.85,"context":"一个合作了两年的人，把你私下只讲给他听过的一个想法原样拿去用了，署名是他。","prompt":"接下来那几天，你反复回到的其实是哪一层？","scale":{"left":"怎么止损、以后怎么防，他为什么这么做我并不太关心","right":"他当时到底在怕什么、缺什么，才会伸这只手","sdHigh":"left"},"effects":{"phil_pragmatic":[2,-2],"phil_humanist":[-2,2],"phil_cynic":[1.6,-1.6],"mft_care":[-1.2,1.6],"light_faith":[-1,1]}},{"id":"v11_q03","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"phil_humanist","is_sensitive":true,"weight":1.4,"context":"三个人在异国的小城，行程第二天。一个人坚持要去看那座来回六小时的美术馆，另一个人想留在广场晒太阳。你其实更想留下，但你知道那位朋友为这趟旅行攒了很久的钱。","prompt":"你说出口的那句话，更接近——","options":[{"key":"A","text":"「少数服从多数吧。你们去哪我去哪，我没什么特别的偏好」","effects":{"phil_cynic":2,"mft_authority":-1.6,"mft_liberty":1.2,"wv_nature":-1.2},"social_desirability":0},{"key":"B","text":"「那就去。六小时而已，回来剩下的时间再分，谁也不亏」","effects":{"phil_pragmatic":2,"wv_causal":1.2,"cog_global":0.8,"phil_cynic":-1},"social_desirability":2},{"key":"C","text":"「你们定，我都可以。去哪儿都比在原地站着讲道理强」，然后闭嘴","effects":{"phil_stoic":1.8,"cog_logic":1.2,"mft_liberty":1.2,"phil_absurd":0.8},"social_desirability":1},{"key":"D","text":"「他攒了半年就为这个。广场明天还在，他的假期不在了」","effects":{"phil_humanist":2,"mft_care":1.4,"wv_nature":1.2,"phil_cynic":-1.2},"social_desirability":3}]},{"id":"v11_q04","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"mft_loyalty","is_sensitive":true,"weight":1.25,"context":"一桌朋友吃饭，一个认识很多年的人把你当年最狼狈的那件事，当成笑料讲给刚认识的人听。桌上有两个人笑出了声。","prompt":"笑声响起来的那三秒，你身体先做了什么？","options":[{"key":"A","text":"先跟着笑一下，把场面接住，然后整晚没再和他多说一句话","effects":{"mft_loyalty":-1.8,"phil_cynic":1.2,"wv_nature":-1,"val_boundary":1.2},"social_desirability":0},{"key":"B","text":"直接说「这个不好笑」，声音不大，但桌上的人都听见了","effects":{"mft_liberty":1.8,"mft_loyalty":-1,"light_kant":1.2,"sin_pride":0.8},"social_desirability":2},{"key":"C","text":"等他讲完，很平静地补一句：那件事当时对我并不轻","effects":{"mft_care":1.8,"mft_loyalty":1.4,"light_kant":1.2,"virtue_humility":0.8},"social_desirability":3},{"key":"D","text":"心里一下凉了，开始清点这个人到底知道我多少件事","effects":{"mft_loyalty":-1.6,"phil_cynic":1.6,"dark_mach":1.2,"wv_nature":-1},"social_desirability":1}]},{"id":"v11_q05","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"mft_sanctity","is_sensitive":true,"weight":0.85,"context":"外婆过世后的第一个清明，家里按老规矩摆了一桌东西。一个年轻亲戚把供着的那只旧碗拿起来当烟灰缸，说反正也没人用了。","prompt":"你站在旁边，身体里最先冒出来的东西是什么？","scale":{"left":"只是一只旧碗，他没有恶意，人也比碗重要","right":"说不清为什么，胃里先紧了一下，就是不能这样","sdHigh":"right"},"effects":{"mft_sanctity":[-2,2],"mft_liberty":[1.6,-1.6],"phil_humanist":[1.4,-1.4],"phil_cynic":[1.2,-1.2],"mft_care":[1,-0.8]}},{"id":"v11_q06","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"mft_liberty","is_sensitive":true,"weight":1.4,"context":"小区突然贴出通知：为了「统一管理」，所有电动车必须停到八百米外的集中点，晚十点后不得进出。没征求过任何人意见，理由只有一句：上面要求。","prompt":"业主群吵成一片，你更愿意站在哪一边——","options":[{"key":"A","text":"该守的守，但车我照停楼下，谁来说就把道理跟他说完","effects":{"mft_liberty":2,"mft_authority":-1.8,"sin_pride":1.2,"phil_cynic":1.2},"social_desirability":1},{"key":"B","text":"先联合几户按程序推翻它：找物业、找街道、留书面记录","effects":{"phil_pragmatic":1.8,"mft_authority":1,"cog_logic":1.2,"mft_liberty":1.2},"social_desirability":3},{"key":"C","text":"停哪里都行，我只觉得「统一管理」这四个字很好笑","effects":{"phil_cynic":2,"phil_absurd":1.2,"mft_authority":-1.2,"light_faith":-1.2},"social_desirability":0},{"key":"D","text":"规定再蠢也是规定，我照做，省下的力气用在别的地方","effects":{"mft_authority":2,"mft_liberty":-1.8,"phil_stoic":1.4,"wv_social":0.8},"social_desirability":2}]},{"id":"v11_q07","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"mft_authority","is_sensitive":true,"weight":0.85,"context":"你住的楼有一条规矩：夜里十一点后出入要登记。那天你抱着发烧的孩子从医院回来，已经一点多，值班室黑着灯，桌上摊着登记本。","prompt":"你在门口停了半秒，然后会——","scale":{"left":"把值班的人叫醒，登记完再上楼，规矩就是规矩","right":"直接上楼，孩子等不了，规矩本来就该让开","sdHigh":"left"},"effects":{"mft_authority":[2,-2],"mft_care":[-1.4,1.8],"phil_pragmatic":[-1.2,1.4],"light_kant":[1.2,-1.4]}},{"id":"v11_q08","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"phil_existential","is_sensitive":true,"weight":1.3,"context":"一场吵到后半段的对话里，对方忽然说：「和你在一起的这几年，我一直在将就。」你知道这句有一半是气话，但另一半可能是真的。","prompt":"那句话落地的一秒，你脑子里先亮起来的是哪一句？","options":[{"key":"A","text":"原来这几年在他那里是这个版本，那我们把话讲开，怎么改一起说","effects":{"phil_existential":2,"mft_care":1.2,"def_intellectual":1,"lv_suffering":0.8},"social_desirability":3},{"key":"B","text":"有点想笑：两个人都觉得自己在将就，还都以为自己在忍","effects":{"phil_absurd":1.8,"phil_cynic":1.2,"phil_epicurean":1,"mft_care":-0.8},"social_desirability":1},{"key":"C","text":"一阵很冷的安静，什么都感觉不到，只想先把这场对话结束","effects":{"phil_stoic":1.8,"phil_nihilism":1.2,"mft_care":-1.2,"def_intellectual":0.8},"social_desirability":0},{"key":"D","text":"心口疼了一下，先想的是他这几年到底憋了多少没说出口的","effects":{"mft_care":1.8,"phil_humanist":1.6,"phil_stoic":-1,"wv_nature":0.8},"social_desirability":2}]},{"id":"v11_q09","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"mft_fairness","is_sensitive":true,"weight":1.4,"context":"两年前你借给一位很好的朋友一笔钱，说好三个月。他提过两次「下个月一定」，然后再没提。昨天你刷到他晒了块表，配文是「该对自己好一点」。","prompt":"你把手机放下，第一件想做的事更接近哪一种？","options":[{"key":"A","text":"把当初的转账记录找出来发给他，附一句：这笔我们该结一下了","effects":{"mft_fairness":2,"light_kant":1.2,"sin_pride":0.8,"phil_pragmatic":1},"social_desirability":2},{"key":"B","text":"算了。人都会给自己找理由，我以后不再借，也不用演一场戏","effects":{"phil_cynic":2,"phil_nihilism":1.2,"mft_fairness":-1.2,"lv_anchor":0.8},"social_desirability":0},{"key":"C","text":"不催。他真宽裕了自己会想起来，想不起来就当花钱买个明白","effects":{"mft_loyalty":1.8,"phil_cynic":1.2,"mft_fairness":-1.6,"virtue_charity":1},"social_desirability":3},{"key":"D","text":"先算清这笔钱在我这里还剩多少分量，再用不撕破的方式拿回来","effects":{"phil_pragmatic":2,"mft_fairness":1.2,"dark_mach":1.2,"mft_loyalty":-0.8},"social_desirability":1}]},{"id":"v11_q10","type":"stealth_scale","stealth_mode":"projection","layer":"stealth","mirror_key":"phil_nihilism","is_sensitive":false,"weight":0.85,"context":"凌晨三点，你醒着，房间很静。你忽然很清楚地想到：一百年后，今天这些事不会有人记得，连名字都不会。","prompt":"你躺着没有动，那个念头先在你身上变成了什么？","scale":{"left":"一阵说不出的轻松，像有人替我卸掉了一块东西","right":"一阵发凉，然后更想抓紧眼前这几个还活着的人","sdHigh":"right"},"effects":{"phil_nihilism":[1.8,-1.8],"phil_epicurean":[1.6,-1.6],"phil_absurd":[1.6,-1.6],"phil_humanist":[-1.8,1.8],"lv_anchor":[-1.2,1.2]}},{"id":"v11_q11","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"phil_absurd","is_sensitive":false,"weight":1.4,"context":"一场决定明年方向的会上，所有人都在点头通过一个你私下算过、明显撑不住的方案。你提了两句，主持人说「先按这个走」，然后继续往下讲。","prompt":"笔停在纸面上，你心里先冒出来的是哪种声音？","options":[{"key":"A","text":"该说的我说到了，剩下的交给现实，半年后数据会替我说完","effects":{"phil_pragmatic":1.8,"def_intellectual":1.2,"mft_authority":1,"phil_absurd":0.8},"social_desirability":2},{"key":"B","text":"不行，我要把话说完，哪怕这一屋子人今晚都不高兴","effects":{"mft_liberty":1.8,"sin_pride":1.4,"phil_stoic":1,"mft_authority":-1.4},"social_desirability":1},{"key":"C","text":"有点想笑：这样一个东西，也要所有人一起点头才算数","effects":{"phil_absurd":2,"phil_cynic":1.4,"cog_global":1.2,"mft_authority":-1.2},"social_desirability":0},{"key":"D","text":"既然定了，我就做得尽量像样，别让后面接手的人受苦","effects":{"phil_stoic":1.8,"mft_care":1.6,"def_sublimate":1.2,"mft_liberty":-0.8},"social_desirability":3}]},{"id":"v11_q12","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"phil_epicurean","is_sensitive":true,"weight":1.2,"context":"凌晨一点，你躺在床上刷到一条动态：一个和你同龄、起点差不多的人，晒出了刚拿到的东西——一套房，或者一本书的封面，或者一张全家福。屏幕的光落在天花板上。","prompt":"手机举在半空的那三秒，你先感觉到的是什么？","options":[{"key":"A","text":"一阵很具体的酸，手心发凉，然后把手机扣在胸口没再动","effects":{"phil_nihilism":1.6,"phil_stoic":-1.4,"lv_anchor":-1.2,"mot_purpose":1},"social_desirability":0},{"key":"B","text":"笑了一下：他过他的，我过我这一晚，起来给自己煮碗面","effects":{"phil_epicurean":2,"phil_absurd":1.2,"lv_suffering":-1.2,"phil_nihilism":-1},"social_desirability":2},{"key":"C","text":"睡不着了，索性打开电脑，把拖了三个月的事做掉一小块","effects":{"phil_pragmatic":1.8,"mot_purpose":1.4,"phil_epicurean":-1.2,"def_sublimate":1},"social_desirability":3},{"key":"D","text":"忽然觉得这些都没意义，早起、加班、存钱，最后都一样","effects":{"phil_nihilism":2,"phil_cynic":1.2,"phil_epicurean":-0.8,"lv_anchor":0.6},"social_desirability":1}]},{"id":"v11_q13","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"phil_cynic","is_sensitive":true,"weight":0.85,"context":"你帮过一个朋友很大的忙：介绍工作、垫过钱、在他最难的时候陪着。两年后他过得很好，但提起你时，说的都是「也就那样」。","prompt":"那个下午你一个人坐了很久，最后落下来的结论是？","scale":{"left":"大多数人就是这样，善意要省着用，以后只留给很少几个人","right":"他有他的处境，我不打算因为这一句改掉自己的做法","sdHigh":"right"},"effects":{"phil_cynic":[2,-2],"phil_humanist":[-1.8,1.8],"light_faith":[-1.4,1.4],"mft_care":[-1,1.2],"wv_nature":[-1.2,1.2]}},{"id":"v11_q14","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"mft_care","is_sensitive":true,"weight":1.4,"context":"你最好的朋友下周办婚礼。三天前，你在一间餐厅门口看见他的未婚妻和另一个人牵着手走出来，那个人不是他。他这两天还在群里发喜糖的照片。","prompt":"这件事现在压在你手里，你会怎么处理？","options":[{"key":"A","text":"当晚就告诉他，原话讲清，不添一句判断。他有权知道，早比晚好","effects":{"mft_care":2,"mft_sanctity":1.6,"light_kant":1.2,"mft_loyalty":-0.8},"social_desirability":3},{"key":"B","text":"先去找那个人把话说死：三天内自己讲清楚，否则我来讲","effects":{"phil_pragmatic":1.8,"dark_mach":1.2,"mft_loyalty":1.2,"mft_fairness":1},"social_desirability":2},{"key":"C","text":"不说。婚礼是他的选择，我去掀这件事，最后被恨的人是我","effects":{"phil_cynic":1.8,"mft_care":-1.6,"mft_sanctity":-1.4,"mft_loyalty":-1.4},"social_desirability":0},{"key":"D","text":"只跟他说一句：婚礼前有没有什么想跟我讲的。剩下的等他自己开口","effects":{"phil_humanist":1.6,"mft_care":1.2,"mft_sanctity":1,"cog_ambiguity":1.2},"social_desirability":1}]},{"id":"v11_q15","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"mft_liberty","is_sensitive":true,"weight":0.85,"context":"家族群里，几位长辈已经替你商量好了明年的事——工作、房子，甚至和谁见面。他们说得热闹，最后一句是「我们都是为你好」。","prompt":"你打完一行字又删掉，最终的决定更接近——","scale":{"left":"领这份情，但事情按我的来，我会说清楚，不怕他们不高兴","right":"顺着他们的安排走，争这些太累，家里和气更重要","sdHigh":"left"},"effects":{"mft_liberty":[1.8,-1.8],"mft_authority":[-1.8,1.8],"phil_existential":[1.6,-1.4],"mot_autonomy":[1.4,-1.2],"phil_stoic":[-0.8,1]}},{"id":"v11_q16","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"mft_fairness","is_sensitive":false,"weight":1.25,"context":"排了四十分钟的队，前面忽然插进来一个中年男人，手里拎着药袋，眼睛下面两团青黑。后面有人小声骂了一句。","prompt":"看到他插进去的那一刻，你的第一反应是——","options":[{"key":"A","text":"直接开口：后面一队人都在排，请你到后面去","effects":{"mft_fairness":2,"sin_pride":1,"mft_care":-1.2,"phil_stoic":1},"social_desirability":2},{"key":"B","text":"算了，让他先。他手上还拎着药，我这四十分钟不算什么","effects":{"mft_care":2,"phil_humanist":1.2,"mft_fairness":-1.6,"phil_absurd":0.8},"social_desirability":3},{"key":"C","text":"看向收银台，让这件事由店里的人来开口处理","effects":{"phil_pragmatic":1.8,"mft_fairness":1.2,"dark_mach":1,"mft_care":-0.6},"social_desirability":1},{"key":"D","text":"心里骂了一句，嘴上什么也没说，但这半天的好心情没了","effects":{"phil_cynic":1.6,"mft_fairness":1,"lv_suffering":-1,"mft_care":-0.8},"social_desirability":0}]},{"id":"v11_q17","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"phil_stoic","is_sensitive":false,"weight":1.4,"context":"父亲把攒了十几年的养老钱，投进了同乡介绍的一个「稳赚不赔」的项目。你查过，那东西的合同里全是洞。他不听劝，还说你不懂人情。","prompt":"你坐在他对面，最想先做的是哪一件？","options":[{"key":"A","text":"不再争对错，先把能追回的部分一步步追回来，追不回的认了","effects":{"phil_stoic":2,"phil_pragmatic":1.4,"cog_logic":1,"mft_authority":0.8},"social_desirability":3},{"key":"B","text":"该说的说完，剩下的他自己承担。人总要为自己的判断付账","effects":{"phil_cynic":1.8,"phil_nihilism":1.2,"mft_care":-1.4,"val_boundary":1},"social_desirability":0},{"key":"C","text":"先不劝。他需要一个「我还有用」的感觉，这不只是钱的事","effects":{"phil_humanist":2,"mft_care":1.6,"wv_nature":1.2,"phil_pragmatic":-0.8},"social_desirability":2},{"key":"D","text":"吵到底。哪怕今晚翻脸，也得让他把这笔钱拿回来","effects":{"mft_care":1.6,"mft_authority":-1.6,"phil_stoic":-1.2,"sin_pride":1},"social_desirability":1}]},{"id":"v11_q18","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"mft_loyalty","is_sensitive":true,"weight":1.4,"context":"相处半年后，对方提出：既然要认真，就把手机互相开放，随时可以看。「没什么可藏的，才算真的坦诚。」他说得很平静。","prompt":"这句话让你心里先起了一层什么，你更接近哪一种？","options":[{"key":"A","text":"给。他要的是安心，这份安心我给得起，但我大概不会真去翻他的","effects":{"mft_loyalty":2,"mft_care":1.2,"mft_liberty":-1.2,"virtue_humility":0.8},"social_desirability":2},{"key":"B","text":"不给。不是有什么要藏，是两个人之间得留一块不属于彼此的地方","effects":{"mft_liberty":2,"phil_existential":1.6,"mft_loyalty":-1.4,"sin_pride":1},"social_desirability":1}]},{"id":"v11_q19","type":"pyramid_top3","stealth_mode":"ipsative","layer":"explicit","mirror_key":"moral_foundations","is_sensitive":true,"weight":1.3,"prompt":"下面八件事，都是别人可以对你做的「越界」。请挑出你最不能容忍的三件，最不能忍的那件放第一。","values":[{"key":"care","label":"有人当着一屋子人，羞辱一个完全没法还手的人","effects":{"mft_care":1.6,"phil_humanist":0.8,"light_humanism":0.6}},{"key":"fairness","label":"同一件事，别人做没事，你做就被拿出来罚","effects":{"mft_fairness":1.6,"val_moral":0.8,"light_kant":0.5}},{"key":"loyalty","label":"你替他扛下的事，他转头说是自己做的","effects":{"mft_loyalty":1.6,"mft_fairness":0.6,"mft_care":0.4}},{"key":"authority","label":"有人当着所有人，把你当成一个不懂规矩的人来教训","effects":{"mft_authority":1.6,"sin_pride":0.6,"wv_social":0.5}},{"key":"sanctity","label":"有人拿你家里最不能碰的那件事，当笑话讲给外人听","effects":{"mft_sanctity":1.6,"mft_loyalty":0.6,"lv_anchor":0.5}},{"key":"liberty","label":"有人替你把你接下来三年安排好了，还说这都是为你好","effects":{"mft_liberty":1.6,"phil_existential":0.8,"mot_autonomy":0.6}},{"key":"truth","label":"有人用一套漂亮的话，把明明发生过的事说成没发生","effects":{"phil_cynic":1.4,"val_moral":0.6,"mft_fairness":0.5}},{"key":"waste","label":"有人把十分钟能解决的事，拖成一场谁也不肯先动的对峙","effects":{"phil_pragmatic":1.4,"cog_logic":0.5,"phil_absurd":0.4}}]},{"id":"v11_q20","type":"budget_100","stealth_mode":"budget","layer":"explicit","mirror_key":"philo_energy","is_sensitive":false,"weight":1.3,"prompt":"一百点，只能分给下面六样东西。没有哪一样是「应该」要的，只有此刻真的缺的那样，才值得多放一点。","items":[{"key":"stoic","label":"在失控的场面里不慌的那点定力","dim":"phil_stoic","base":0,"gain":1},{"key":"existential","label":"亲手改写意义的那支笔","dim":"phil_existential","base":0,"gain":1},{"key":"epicurean","label":"把普通一晚过得像样的一点力气","dim":"phil_epicurean","base":0,"gain":1},{"key":"humanist","label":"还愿意相信人的那点软","dim":"phil_humanist","base":0,"gain":1},{"key":"fairness","label":"对所有人一样清楚的规则","dim":"mft_fairness","base":0,"gain":1},{"key":"liberty","label":"不被任何人替你决定的那块地方","dim":"mft_liberty","base":0,"gain":1}]}]},"vol12":{"volume_id":"vol12","index":12,"title":"底层执念","subtitle":"九型人格核心恐惧与三大本能副型","theme_color":"#7D4E57","estimated_minutes":6,"intro":"这一卷不给你贴类型号。它只关心：深夜睡不着、钱不够用、被人轻轻推开的那几个时刻，你身上哪一根弦最先响。九种恐惧，三种本能，没有一种是病——它们都曾经在某一年救过你。","dimensions":["enn_1","enn_2","enn_3","enn_4","enn_5","enn_6","enn_7","enn_8","enn_9","inst_sp","inst_sx","inst_so"],"questions":[{"id":"v12_q01","type":"forced_choice","stealth_mode":"mirror","layer":"stealth","mirror_key":"enn_4","is_sensitive":true,"weight":1.4,"context":"凌晨三点，房间里只剩路由器的绿灯亮着。手机屏已经暗了，你没睡着，也不算醒着。","prompt":"下面四种最坏的可能，哪一种一旦在脑子里坐实，会让你整个人凉下去？","options":[{"key":"A","text":"你这一生没留下任何只有你能留下的东西，和地铁里每一张模糊的脸没有区别","effects":{"enn_4":2,"mot_purpose":1,"dark_narc":1},"social_desirability":1},{"key":"B","text":"哪天你倒下，通讯录翻到底，也找不出一个能把银行卡密码和猫托付过去的人","effects":{"enn_6":2,"inst_sp":1.5,"att_anxiety":1.2},"social_desirability":2},{"key":"C","text":"有一天你连把一件事想清楚的力气都没有了，脑子里那几间房一间一间灭灯","effects":{"enn_5":2,"def_detach":1.2,"mot_autonomy":0.8},"social_desirability":1},{"key":"D","text":"你已经很多年没有真正想要过什么，别人问起，你只能说出他期待的那个答案","effects":{"enn_9":2,"def_fawn":1.2,"big5_compliance":1},"social_desirability":1}]},{"id":"v12_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"enn_1","is_sensitive":true,"weight":0.85,"prompt":"你给一个重要的人写了一段很长的话，可能是道歉，也可能是终于说出口的那件事。按下发送后的二十分钟，你在做什么？","scale":{"left":"放下手机去做别的，话已经说出去，剩下的归他","right":"把那段话在脑子里又读了三遍，找有没有哪一句会被理解成别的意思","sdHigh":"left"},"effects":{"enn_1":[-2,2],"big5_rumination":[-1.2,1.6],"schema_approval":[-0.6,1],"att_anxiety":[-0.8,1.2]}},{"id":"v12_q03","type":"forced_choice","stealth_mode":"ipsative","layer":"stealth","mirror_key":"enn_3","is_sensitive":true,"weight":1.4,"context":"部门调整，一个来了半年、资历比你浅的人接走了你做了三年的那摊事，理由写的是「让他练练」。","prompt":"散会后你在洗手间站了两分钟。镜子里冒出来的那句话，更接近哪一句？","options":[{"key":"A","text":"问题不在他，在我——我交出去的东西，已经有一阵连我自己都不想署名","effects":{"enn_1":1.8,"big5_rumination":1.2,"dark_narc":-0.8},"social_desirability":1},{"key":"B","text":"这三年我替所有人补过窟窿、垫过时间，真到这一天，没人替我说一句","effects":{"enn_2":2,"mot_belonging":1.2,"sin_wrath":0.8},"social_desirability":0},{"key":"C","text":"我的全部价值都挂在「有用」两个字上，一旦被换掉，我就什么都不是","effects":{"enn_3":2,"dark_narc":1,"schema_defect":1},"social_desirability":0},{"key":"D","text":"拍板的人从头到尾没问过我一句，我在这套规则里连个位置都没有","effects":{"enn_8":2,"big5_assert":1.2,"covert_control":0.8},"social_desirability":2}]},{"id":"v12_q04","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"inst_sp","is_sensitive":false,"weight":0.85,"prompt":"工资到账的短信和三条自动扣款几乎同时进来。你打开银行 App，通常会做到哪一步？","scale":{"left":"看一眼余额，够这个月用就关掉","right":"把最近三个月每一笔都翻出来对一遍，找出是哪里漏了","sdHigh":"left"},"effects":{"inst_sp":[-2,2],"mot_security":[-1.4,1.6],"big5_alert":[-0.8,1.2],"enn_6":[-0.6,0.8]}},{"id":"v12_q05","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"enn_4","is_sensitive":true,"weight":1.25,"context":"零点四十，你刷到前任发的照片：新家阳台上一盆你没见过的植物，配文只有一个句号。","prompt":"手指停在屏幕上的那三秒，你身上最先发生的是什么？","options":[{"key":"A","text":"把照片放大，看阳台的瓷砖、窗外的楼、玻璃上有没有第二个人影","effects":{"enn_4":1.8,"inst_sx":1.6,"big5_alert":1.2},"social_desirability":0},{"key":"B","text":"心跳快了一下，然后立刻划走，起身去厨房洗了个杯子","effects":{"enn_4":-1.2,"def_detach":1.8,"inst_sx":-1.2},"social_desirability":2},{"key":"C","text":"截图存进相册，说不清为什么，但就是不想让它从眼前消失","effects":{"enn_4":1.4,"att_anxiety":1.2,"big5_rumination":1.2},"social_desirability":1},{"key":"D","text":"忽然很想找个人说话，打开通讯录，从上往下滑了两遍","effects":{"inst_sx":1.4,"mot_belonging":1.6,"att_anxiety":1},"social_desirability":1}]},{"id":"v12_q06","type":"forced_choice","stealth_mode":"ipsative","layer":"stealth","mirror_key":"enn_6","is_sensitive":true,"weight":1.4,"context":"周六晚上你翻到三个好友的合照，同一家店、同一晚。群里上一次说话是十天前，没人提过这件事。","prompt":"你把手机放下，又拿起来。此刻你更可能是哪一种？","options":[{"key":"A","text":"在群里发一句「下次记得叫我呀」加个笑脸，然后真的不再主动开口","effects":{"enn_6":1.6,"inst_so":1.4,"def_fawn":1},"social_desirability":2},{"key":"B","text":"直接问一句「你们上周聚了？怎么没叫我」，问完把手机放下去做别的","effects":{"enn_6":-1.2,"big5_assert":1.4,"big5_alert":-0.8},"social_desirability":1},{"key":"C","text":"不问，但接下来一阵子，他们再约你时，你总能找到一个推掉的理由","effects":{"enn_6":1.2,"def_detach":1.2,"inst_so":-1.2,"att_avoidance":1},"social_desirability":0},{"key":"D","text":"先在脑子里把最近两次聊天回放一遍，找自己哪句话可能说得不合适","effects":{"enn_6":1.8,"schema_defect":1.2,"def_fawn":1.2},"social_desirability":1}]},{"id":"v12_q07","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"inst_so","is_sensitive":false,"weight":0.85,"prompt":"一个不算熟的饭局散场，大家在路边互相扫码。你的手机伸出去了几次？","scale":{"left":"只加散场前真正聊得来的那一两个，其余笑笑就过去了","right":"基本上一圈都扫了，还会顺手记下每个人在忙什么","sdHigh":"right"},"effects":{"inst_so":[-2,2],"big5_social":[-1.6,1.6],"mot_belonging":[-1,1.2],"enn_3":[-0.8,0.8]}},{"id":"v12_q08","type":"forced_choice","stealth_mode":"normalization","layer":"stealth","mirror_key":"enn_3","is_sensitive":true,"weight":1.4,"context":"你花两小时随手帮朋友改了一份东西，他发朋友圈说是「大神手笔」，底下三十多个赞。","prompt":"你刷到这条的时候，心里第一念更接近——","options":[{"key":"A","text":"有点心虚，想在评论区补一句「其实我没花多少时间」，把话说实","effects":{"enn_1":1.6,"virtue_humility":1.2,"light_kant":0.8},"social_desirability":2},{"key":"B","text":"收着，顺手截图存进自己的作品集，这种机会本来就不该浪费","effects":{"enn_3":1.8,"mot_mastery":1.2,"dark_narc":0.8},"social_desirability":1},{"key":"C","text":"有点别扭，他夸的那个人，好像和我认识的我并不是同一个","effects":{"enn_4":1.6,"schema_defect":1.2,"dark_narc":0.6},"social_desirability":1},{"key":"D","text":"说不上什么感觉，反正是顺手帮忙，他能高兴一下也挺好","effects":{"enn_9":1.4,"enn_3":-1.2,"def_fawn":0.8},"social_desirability":2}]},{"id":"v12_q09","type":"stealth_scale","stealth_mode":"ipsative","layer":"explicit","mirror_key":"enn_9","is_sensitive":false,"weight":0.85,"context":"四个人站在路口讨论去哪吃，已经站了二十分钟。有人开始说「都行」，有人开始刷手机。","prompt":"这种时候，你身上那根弦更靠近哪一端？","scale":{"left":"直接拍板走进最近那家，不好吃下次再换","right":"说一句「我都行」，然后等一个看起来最想说话的人先开口","sdHigh":"left"},"effects":{"enn_9":[-2,2],"big5_compliance":[-1.2,1.4],"big5_assert":[1.4,-1.2],"mot_autonomy":[1.2,-0.8]}},{"id":"v12_q10","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"enn_8","is_sensitive":true,"weight":1.25,"context":"晚高峰地铁，一个人从后面挤过来，手肘撞在你胸口，还回头白了你一眼说「看着点」。","prompt":"身体先于脑子反应的那一下，你做了什么？","options":[{"key":"A","text":"立刻撞回去半步，声音抬起来：撞我的是你，你还白我一眼","effects":{"enn_8":2,"def_attack":1.6,"big5_assert":1.2,"enn_9":-1.2},"social_desirability":0},{"key":"B","text":"什么都没说，但站定不动，眼睛一直看着他，直到他先转开","effects":{"enn_8":1.2,"big5_assert":0.8,"sin_pride":0.8},"social_desirability":1},{"key":"C","text":"侧身让开，心里说算了，但手心在抖，到站前一句话都不想说","effects":{"enn_9":1.6,"enn_8":-1.4,"big5_rumination":1.2},"social_desirability":2},{"key":"D","text":"掏出手机对着他，说你再讲一遍，先把证据留下来再说","effects":{"covert_control":1.6,"def_intellectual":1,"enn_8":0.6},"social_desirability":1}]},{"id":"v12_q11","type":"forced_choice","stealth_mode":"ipsative","layer":"stealth","mirror_key":"enn_7","is_sensitive":false,"weight":1.4,"context":"一个机会落到你面前：钱多一倍，但要搬去另一个城市签两年，中间几乎请不了长假。","prompt":"你用来推掉它的四条理由，底下各压着一种怕。哪一条最像你？","options":[{"key":"A","text":"接下来两年就被写死了，谁知道两年后我还想不想过这种日子","effects":{"enn_7":2,"mot_autonomy":1.4,"def_detach":0.8},"social_desirability":1},{"key":"B","text":"这边有人是真的需要我，我要是走了，他这阵子会很难过下去","effects":{"enn_2":2,"mot_belonging":1.4,"def_fawn":1},"social_desirability":2},{"key":"C","text":"去了等于把现在的成绩清零，还要重新证明一次我是谁","effects":{"enn_3":1.8,"sin_pride":1,"mot_mastery":1},"social_desirability":1},{"key":"D","text":"条件是他们定的，规则也是他们定的，我不喜欢被人这么安排","effects":{"enn_8":1.8,"big5_assert":1.2,"mot_autonomy":1},"social_desirability":0}]},{"id":"v12_q12","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"enn_5","is_sensitive":true,"weight":0.85,"context":"周日晚上八点，一个熟人打来电话。不是急事，你知道他一开口就会聊四十分钟。","prompt":"手机在你手里震着，你会怎么处理？","scale":{"left":"接起来，一边听一边把该做的家务做完","right":"让它响完，过两分钟回一条「刚在忙，怎么了」","sdHigh":"left"},"effects":{"enn_5":[-2,2],"def_detach":[-1.4,1.6],"big5_social":[1.4,-1.4],"enn_2":[1.2,-1],"mot_autonomy":[-1.2,1.2]}},{"id":"v12_q13","type":"budget_100","stealth_mode":"budget","layer":"explicit","mirror_key":"ennea_energy","is_sensitive":true,"weight":1.3,"prompt":"一百点「我不能失去」的分量，只能发给下面六样。分得越多，说明它真的消失时你越撑不住。点数要分完，一项也不能剩。","items":[{"key":"shelter","label":"一个写着自己名字的住处，和随时能动的现金","dim":"inst_sp","base":0,"gain":1},{"key":"one_person","label":"一个人知道我所有底细还愿意留下","dim":"inst_sx","base":0,"gain":1},{"key":"circle","label":"一个圈子里有我的位置，有人会想起我","dim":"inst_so","base":0,"gain":1},{"key":"needed","label":"有人真的需要我，我对某个人不可替代","dim":"enn_2","base":0,"gain":1},{"key":"no_push","label":"我说不的时候，没有人敢硬来","dim":"enn_8","base":0,"gain":1},{"key":"no_storm","label":"日子平顺，不用面对撕破脸的场面","dim":"enn_9","base":0,"gain":1}]},{"id":"v12_q14","type":"pyramid_top3","stealth_mode":"ipsative","layer":"explicit","mirror_key":"ennea_values","is_sensitive":false,"weight":1.3,"prompt":"如果只能拿十年去换三样东西，请按顺序点选。第一个位置，你留给哪一样？","values":[{"key":"own_work","label":"一件只有我做得出来的东西","effects":{"enn_4":1.6,"mot_purpose":0.8,"enn_3":0.6}},{"key":"no_report","label":"不必向任何人报备的日程","effects":{"inst_sp":1.2,"mot_autonomy":1.4,"enn_8":0.4}},{"key":"still_here","label":"一个十年后还在的人","effects":{"inst_sx":1.6,"mot_belonging":1,"enn_6":0.8}},{"key":"remembered","label":"这个名字被这个行业记住","effects":{"enn_3":1.8,"inst_so":1.2,"sin_pride":0.6}},{"key":"calm_body","label":"一副不再紧绷的身体和神经","effects":{"inst_sp":1.8,"enn_7":0.6,"big5_alert":-0.8}},{"key":"trusted","label":"一句「这事交给你我放心」","effects":{"enn_1":1.6,"enn_6":1.2,"virtue_diligence":1}},{"key":"my_terms","label":"所有事都按我的条件来","effects":{"enn_8":1.8,"mot_autonomy":1,"dark_narc":0.6}},{"key":"full_house","label":"一屋子人，谁都不用假装","effects":{"inst_so":1.6,"enn_9":1.2,"big5_compassion":0.8}}]},{"id":"v12_q15","type":"stealth_scale","stealth_mode":"projection","layer":"explicit","mirror_key":"inst_sx","is_sensitive":true,"weight":0.85,"context":"你和一个人聊到凌晨两点，说了一些从来没对别人说过的事。第二天醒来，光从窗帘缝里进来。","prompt":"你躺着还没睁眼。第一个念头是什么？","scale":{"left":"想马上再见到他，昨晚那种浓度让人有点上瘾","right":"有一点想收回来，昨晚给出去太多了","sdHigh":"left"},"effects":{"inst_sx":[2,-2],"att_avoidance":[-1.6,1.8],"def_detach":[-1.2,1.4],"big5_compassion":[1.2,-0.8]}},{"id":"v12_q16","type":"forced_choice","stealth_mode":"mirror","layer":"stealth","mirror_key":"enn_4","is_sensitive":true,"weight":1.4,"context":"医院走廊，你陪妈妈等一张复查报告。旁边一位阿姨一直在讲女儿在哪座城市、年薪多少。你妈听着，忽然转头问你一句：「你那个工作，还行吧？」","prompt":"那句话落地之后，你最怕被自己看见的是什么？","options":[{"key":"A","text":"你的体面是一层层补上去的，中间有一块地方空着，一戳就塌","effects":{"enn_3":1.8,"dark_narc":1,"schema_defect":1.2},"social_desirability":0},{"key":"B","text":"你忙着给她倒水、把外套叠好，其实是怕自己在这张长椅上没位置","effects":{"enn_2":1.8,"inst_so":1.2,"def_fawn":1},"social_desirability":1},{"key":"C","text":"你早就想站起来走开，只是没走，甚至不敢承认自己一直想走","effects":{"enn_9":1.8,"big5_compliance":1.2,"def_detach":1},"social_desirability":0},{"key":"D","text":"你一直觉得自己和这条走廊里的人不是同一类，这念头既让你骄傲又孤单","effects":{"enn_4":1.8,"sin_pride":0.8,"att_avoidance":0.8},"social_desirability":1}]},{"id":"v12_q17","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"enn_1","is_sensitive":false,"weight":1.2,"context":"早上出门，你发现对门又把两袋垃圾堆在你家门边的墙角。这已经是这个月第三次。","prompt":"你站在门口，手上还拎着要丢的袋子。哪个动作最先出现？","options":[{"key":"A","text":"敲门，把话说清楚：这袋麻烦你拿进去，这个月第三次了","effects":{"enn_1":1.8,"big5_assert":1.2,"sin_wrath":0.8},"social_desirability":1},{"key":"B","text":"自己顺手带下楼，心里记下这家人，以后不再打招呼","effects":{"enn_9":1.4,"enn_1":-1.2,"def_detach":0.8},"social_desirability":2},{"key":"C","text":"拍照，发给物业，附一句「麻烦按规定处理一下」","effects":{"covert_control":1.6,"enn_1":1,"def_intellectual":0.8},"social_desirability":2},{"key":"D","text":"什么都不做，但接下来一整天，一想到那两袋东西就烦躁","effects":{"enn_1":1.4,"big5_rumination":1.6,"sin_wrath":1},"social_desirability":0}]},{"id":"v12_q18","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"enn_2","is_sensitive":true,"weight":0.85,"context":"夜里十一点半，一个关系不错但很久没联系的人发来两个字：在吗。","prompt":"你看到这条 :"A","text":"先把地基钉死，房子买了，往后十年我就有一个退不掉的坐标","effects":{"inst_sp":1.8,"enn_7":-1.4,"mot_security":1.2},"social_desirability":2},{"key":"B","text":"空一年，先把自己从那台机器里捞出来，钱以后还能再挣","effects":{"enn_7":1.8,"mot_autonomy":1.4,"inst_sp":-1.4},"social_desirability":1},{"key":"C","text":"劈成两半，一半按住不动，一半买时间，两边都不彻底","effects":{"enn_6":1.4,"big5_alert":1,"inst_sp":0.6},"social_desirability":2},{"key":"D","text":"两个都先不选，放着，等一个更清楚的说法自己出现","effects":{"enn_6":1.2,"enn_9":1.2,"big5_rumination":0.8},"social_desirability":1}]},{"id":"v12_q22","type":"forced_choice","stealth_mode":"projection","layer":"stealth","mirror_key":"inst_sx","is_sensitive":true,"weight":1.4,"context":"在一起三个月，某天他忽然说：我总觉得有一块地方，你不让我进去。","prompt":"这句话落在桌上的时候，你心里更接近——","options":[{"key":"A","text":"他说得对，可那块地方是我最后一块自己的地盘，我不想交出去","effects":{"enn_5":1.8,"mot_autonomy":1.4,"att_avoidance":1.2},"social_desirability":1},{"key":"B","text":"有点慌，立刻解释「我没有」，然后把最近所有的事都告诉他","effects":{"enn_2":1.6,"att_anxiety":1.4,"def_fawn":1.2},"social_desirability":1},{"key":"C","text":"心里一沉：又来了，每次快到这一步，就会有人要得更多","effects":{"att_avoidance":1.8,"inst_sx":-1.2,"def_detach":1.2},"social_desirability":0},{"key":"D","text":"觉得被看见了，甚至有点感动，我自己都没发现我一直这样","effects":{"enn_4":1.4,"inst_sx":1.2,"big5_compassion":1},"social_desirability":2}]}]},"vol13":{"volume_id":"vol13","index":13,"title":"童年剧本","subtitle":"十大隐形人生陷阱与早期图式","theme_color":"#5E5066","estimated_minutes":5,"intro":"这一卷不追究谁对谁错。有些台词在你还没学会说话时就被念过，后来它们学会了自己播放，在深夜、在饭桌上、在对方晚回消息的那半小时里。十八个普通场景只做一件事：把那段还在自动重播的旧录音找出来，听清它究竟在说什么。","dimensions":["schema_abandonment","schema_deprivation","schema_defect","schema_mistrust","schema_isolation","schema_std","schema_sacrifice","schema_approval","schema_entitlement","schema_negativity"],"questions":[{"id":"v13_q01","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"schema_sacrifice","is_sensitive":false,"weight":0.85,"prompt":"周六早上，伴侣把两天的行程排得满满当当，兴致很高地问你「都准备好了吧」——而你其实只想在家躺着。","scale":{"left":"当场说实话，把行程砍掉一半，哪怕他会有点失望","right":"笑着答应下来，把自己的状态压到最下面，两天全程配合","sdHigh":"left"},"effects":{"schema_sacrifice":[-1.8,2],"def_fawn":[-1,1.2],"val_boundary":[1.2,-1]}},{"id":"v13_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"schema_deprivation","is_sensitive":true,"weight":0.85,"prompt":"深夜十一点半，你刚经历完一件很难受的事。手机握在手里，通讯录翻了两屏。","scale":{"left":"真有一两个人，我会直接打过去，把话说明白","right":"翻到最后还是锁了屏，说了也只是被敷衍两句","sdHigh":"left"},"effects":{"schema_deprivation":[-1.8,2],"att_avoidance":[-1,1.2],"mot_belonging":[-1,0.9]}},{"id":"v13_q03","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"schema_mistrust","is_sensitive":false,"weight":1.4,"context":"一起合租过两年的阿哲开口借一笔钱，大约是你两个月工资，说三个月后还，没提利息，也没提借条。","prompt":"转账页面停在输入金额那一格，你心里那杆秤最后偏向哪一边？","options":[{"key":"A","text":"借，不设期限也不要借条。他开这个口已经很难，这两年我信得过","effects":{"schema_mistrust":-2,"light_humanism":1.2,"virtue_kindness":0.8},"social_desirability":3},{"key":"B","text":"借，但分两次给。先给一半看他怎么处理这件事，剩下的再谈","effects":{"schema_mistrust":1.7,"covert_control":1.4,"def_intellectual":0.8},"social_desirability":0},{"key":"C","text":"直说自己也有压力，能拿出一个不心疼的数，剩下的明说没有","effects":{"schema_mistrust":-1.7,"val_boundary":1.4,"def_intellectual":0.9},"social_desirability":2},{"key":"D","text":"嘴上先应着，回头用「最近手头也紧」把这件事慢慢拖过去","effects":{"schema_mistrust":1.8,"def_fawn":1,"covert_control":1.2},"social_desirability":1}]},{"id":"v13_q04","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"schema_entitlement","is_sensitive":false,"weight":1.4,"context":"六个人吃完饭，账单里有一瓶六百八的红酒，是其中两个人点的，你一口没喝。服务员把账单放在桌子中间。","prompt":"你把账单拿过来，一眼看见那瓶自己一口没喝的红酒，心里那个念头是：","options":[{"key":"A","text":"把那瓶酒单独划出来记在那两人头上，剩下的平摊，谁也不欠谁","effects":{"schema_entitlement":-1.7,"val_boundary":1.2,"light_kant":1},"social_desirability":2},{"key":"B","text":"什么也不提，按人头平摊，几十块钱的事不值得让一桌人尴尬","effects":{"schema_entitlement":-1.7,"big5_compliance":1.2,"virtue_kindness":1},"social_desirability":3},{"key":"C","text":"照单平摊，心里却记了一笔：我一口没喝，凭什么替别人买单","effects":{"schema_entitlement":1.7,"big5_rumination":1.4,"def_detach":1},"social_desirability":1},{"key":"D","text":"既然规则是平摊，就按规则用一次，顺手给自己加杯想试的酒","effects":{"schema_entitlement":1.9,"sin_greed":1.3,"light_kant":-1},"social_desirability":0}]},{"id":"v13_q05","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"schema_approval","is_sensitive":true,"weight":1.4,"context":"年夜饭桌上，你姑姑端着酒杯说：「你看你表弟，房子都买了，你也该定下来了。」","prompt":"一桌人的笑意还没落下来，你嘴里先出去的那句话，骨子里是什么味道？","options":[{"key":"A","text":"把话岔开，给她夹一筷子菜，说大过年的，先聊点高兴的事","effects":{"schema_approval":1.8,"def_fawn":1.2,"big5_compliance":1},"social_desirability":1},{"key":"B","text":"顺着她的话说表弟确实厉害，再平静地讲自己在按什么节奏走","effects":{"schema_approval":-1.6,"val_boundary":1.4,"virtue_humility":1},"social_desirability":2},{"key":"C","text":"笑着把这两年的成绩报一遍给她听，让全桌都知道你也没闲着","effects":{"schema_approval":2,"sin_pride":1.3,"schema_std":0.8},"social_desirability":3},{"key":"D","text":"低头吃饭，一晚上都在想自己哪里不如人，散场后在车里坐很久","effects":{"schema_approval":1.7,"schema_std":1.3,"big5_rumination":1.2},"social_desirability":0}]},{"id":"v13_q06","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"schema_abandonment","is_sensitive":true,"weight":1.25,"context":"周三下午，对方发来一句「晚上回来我们谈谈」，之后再没有别的消息。","prompt":"到晚上推门之前，你脑子里跑得最快的是哪一幕？","options":[{"key":"A","text":"把这半年的事过了一遍，先找出自己最可能做错的那三件","effects":{"schema_abandonment":1.9,"big5_rumination":1.4,"def_fawn":1},"social_desirability":1},{"key":"B","text":"有点慌，但马上告诉自己：谈就谈，最坏的结果我已经想清楚","effects":{"schema_abandonment":1.6,"schema_negativity":1.4,"big5_alert":1},"social_desirability":0},{"key":"C","text":"照常把手上的事做完，等晚上听他说，没发生的事想也没用","effects":{"schema_abandonment":-1.9,"big5_alert":-0.9,"mot_autonomy":1},"social_desirability":3},{"key":"D","text":"心里先凉了一下，然后开始默默算：如果分开，房子怎么分","effects":{"schema_abandonment":1.6,"schema_mistrust":1.4,"def_detach":1.2},"social_desirability":1}]},{"id":"v13_q07","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"schema_isolation","is_sensitive":true,"weight":1.4,"context":"你和一个朋友聊了大半年要一起做的副业。上个星期他开业了，你是从别人转发的海报上看到的。合伙人不是你。","prompt":"那张海报你已经点开过第三次了。","options":[{"key":"A","text":"点了个赞，然后告诉自己往后这类事不用再等，也别多想","effects":{"schema_isolation":1.8,"def_detach":1.2,"att_avoidance":1},"social_desirability":0},{"key":"B","text":"心里有点难受，但第二天照常约他吃饭，一个字都不问","effects":{"schema_isolation":-1.6,"mot_belonging":1.2,"big5_compassion":0.9},"social_desirability":2},{"key":"C","text":"直接问他当时是怎么想的，不猜也不憋着，语气还挺轻松","effects":{"schema_isolation":-1.9,"val_boundary":1.4,"mot_belonging":1.2},"social_desirability":3},{"key":"D","text":"把这个人的分档往下调了一格，不说破，但往后有钱的事不会再找他","effects":{"schema_isolation":1.7,"def_detach":1.3,"schema_mistrust":0.9},"social_desirability":1}]},{"id":"v13_q08","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"schema_negativity","is_sensitive":true,"weight":0.85,"prompt":"凌晨两点，你摸到脖子上有个小硬块——不疼，也不会自己消掉。今晚剩下的几个小时，你打算怎么过完？","scale":{"left":"搜索框已经打开，最坏的那种病从头看到尾，天亮前没合眼","right":"记在备忘录里，白天去挂个号，今晚先把觉睡完","sdHigh":"right"},"effects":{"schema_negativity":[2,-1.8],"big5_alert":[1.4,-1.2],"big5_rumination":[1.3,-0.9]}},{"id":"v13_q09","type":"stealth_scale","stealth_mode":"projection","layer":"stealth","mirror_key":"schema_std","is_sensitive":true,"weight":0.85,"prompt":"你爸在电话里说，隔壁老张的儿子今年带父母去了趟欧洲，说完停了一下，然后问你最近忙不忙，语气很轻。","scale":{"left":"顺着他的话聊两句，说说自己这半年过得怎么样","right":"挂了电话就开始算自己还差多少，一晚上都不太想说话","sdHigh":"left"},"effects":{"schema_std":[-1.6,2],"schema_approval":[-1,1.2],"big5_rumination":[-0.8,1.1]}},{"id":"v13_q10","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"schema_abandonment","is_sensitive":true,"weight":1.25,"context":"凌晨的急诊，你一个人挂着水。第一瓶快见底了，走廊里只有推车的轮子声。","prompt":"护士把表推过来，指了指第一栏：「紧急联系人，后面那格写关系。」","options":[{"key":"A","text":"一个不算太熟的朋友。他不会觉得我麻烦，也不会问太多","effects":{"schema_abandonment":1.9,"schema_deprivation":1.2,"def_fawn":1},"social_desirability":1},{"key":"B","text":"家里人。填完就发定位过去，说清楚我在几楼几床","effects":{"schema_abandonment":-1.8,"mot_belonging":1.2,"att_anxiety":-0.8},"social_desirability":3},{"key":"C","text":"空着交了回去。这种事我自己能处理，不必半夜叫醒谁","effects":{"schema_abandonment":1.7,"att_avoidance":1.4,"def_detach":1.2},"social_desirability":1},{"key":"D","text":"一个一定会来的人，然后在等他的四十分钟里把音量开到最大","effects":{"schema_abandonment":1.6,"att_anxiety":1.4,"big5_alert":1},"social_desirability":2}]},{"id":"v13_q11","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"schema_deprivation","is_sensitive":true,"weight":1.4,"context":"在一起三年，纪念日那天他加班到十点，进门时手里拎着一袋便利店的关东煮，说「今天太忙了，明天补」。","prompt":"你接过那袋东西，心里浮起来的念头更接近下面哪一种？","options":[{"key":"A","text":"说没关系，热了一起吃。那点落差我自己消化掉就好","effects":{"schema_deprivation":1.7,"schema_sacrifice":1,"def_fawn":1},"social_desirability":2},{"key":"B","text":"告诉他我今天想要的不只是关东煮，并且说清楚想要什么","effects":{"schema_deprivation":-1.8,"val_boundary":1.4,"light_kant":1},"social_desirability":1},{"key":"C","text":"什么也不说，接下来一周都淡淡的，等他自己发现哪里不对","effects":{"schema_deprivation":1.8,"schema_mistrust":1,"covert_control":0.8},"social_desirability":0},{"key":"D","text":"其实没觉得缺什么，两个人在厨房吃完，还觉得这样也挺好","effects":{"schema_deprivation":-1.7,"mot_belonging":1.2,"big5_compassion":1.2},"social_desirability":3}]},{"id":"v13_q12","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"schema_entitlement","is_sensitive":false,"weight":0.85,"prompt":"三个月前买的耳机坏了，保修刚过十四天。店员语气很客气，说按规定只能自费修。","scale":{"left":"我在这家店买了五年，就为了这十四天跟我讲规定？","right":"算了，规定写在那里，这十四天我自己认","sdHigh":"right"},"effects":{"schema_entitlement":[2,-1.8],"val_boundary":[1.4,-1],"big5_compliance":[-1,1.2]}},{"id":"v13_q13","type":"forced_choice","stealth_mode":"mirror","layer":"explicit","mirror_key":"schema_defect","is_sensitive":true,"weight":1.4,"context":"小学三年级那次家长会，老师当着所有人的面念了你的名字和名次。你妈回家的路上一直没说话。","prompt":"这个画面留到今天，长成了你身上的一种反应：","options":[{"key":"A","text":"记得很清楚，那种脸热到现在还会在我开口发言前冒出来","effects":{"schema_defect":2,"big5_rumination":1.4,"schema_approval":1},"social_desirability":1},{"key":"B","text":"记得，但我已经不拿她那把尺子量自己，那是她的焦
