c":"缺少缓冲会让某次判断失误变成不可逆的代价，恢复期可能长达数年。","alchemy_tip":"留一条只用来活着、不用来选择的底线。冒险可以大胆，生存必须留有余地。"}},"mot_purpose":{"name":"意义引擎","volume":"vol6","category":"motive","high":{"label":"需要事情有回响的人","gift_title":"能穿越长期无回报的信念","gift_desc":"你能在没有掌声的阶段持续投入，因为你要的不是认可，而是那件事真的发生了。","shadow_title":"被宏大叙事拖住日常","shadow_desc":"过度追求意义，会让你对身边具体的人和具体的小事失去耐心。","alchemy_tip":"把意义拉回到半径一米内：今天你让谁的具体处境变好了一点。"},"low":{"label":"把日子过好的实在派","gift_title":"不被宏大叙事绑架的清醒","gift_desc":"你关心具体的生活质量，因此很少为了一个抽象目标牺牲真实的幸福。","shadow_title":"在某个深夜突然的空","shadow_desc":"当物质与体验都到位，仍可能遇到那个问题：这些到底为了什么。","alchemy_tip":"不必急着找宏大答案。先做一件对别人有具体用处的事，意义常常在那之后出现。"}},"mot_hedonism":{"name":"丰盈引擎","volume":"vol6","category":"motive","high":{"label":"被鲜活体验驱动的人","gift_title":"极高的生活感受力","gift_desc":"你能把普通的下午过得有滋味，这种能力是多数成功学永远教不会的。","shadow_title":"用体验回避需要面对的事","shadow_desc":"不断追逐新鲜感，容易让重要但不有趣的事长期搁置，代价在几年后集中出现。","alchemy_tip":"每周留一天给「不好玩但重要」的事，其余六天尽情活得有滋味。"},"low":{"label":"延迟满足的克制者","gift_title":"极强的长期投入能力","gift_desc":"你能为更远的目标放弃当下的愉快，这种能力是复利的前提。","shadow_title":"把享受推迟到永远不会到来","shadow_desc":"一直在为以后准备，可能到了有能力享受的时候，已经失去了感受的能力。","alchemy_tip":"把享受设成一项不可取消的固定支出，每月一次，不需要理由。"}},"att_anxiety":{"name":"依恋焦虑轴","volume":"vol7","category":"attachment","high":{"label":"需要确定被选择的人","gift_title":"极深的投入与关系敏锐度","gift_desc":"你在意得非常真，能第一时间察觉到关系里的细微变化，这种投入本身就是稀有品质。","shadow_title":"用反复确认消耗掉那份爱","shadow_desc":"不确定会让你反复测试对方，久了对方会累，你会更不安，形成加速下沉的循环。","alchemy_tip":"把「他是不是不在乎」换成「我现在需要一个具体的回应」。要具体的东西，比要安心更有效。"},"low":{"label":"关系里的稳定底盘","gift_title":"不靠确认也能安心","gift_desc":"你能在不被回应的时候依然稳得住，因此不会因为一点距离就毁掉一段本来很好的关系。","shadow_title":"对伴侣的焦虑不够敏感","shadow_desc":"你的稳定在对方眼里有时等于「你根本不在意」，容易被误读成冷淡。","alchemy_tip":"主动给一次具体而明确的表达。你觉得不必说的话，往往正是对方最需要听到的。"}},"att_avoidance":{"name":"依恋回避轴","volume":"vol7","category":"attachment","high":{"label":"需要呼吸空间的人","gift_title":"极致的精神主权与自我修复力","gift_desc":"你不依附任何人也能活得丰盈体面，独立人格极强，独处时反而更接近真实的自己。","shadow_title":"亲密恐惧与推开真爱","shadow_desc":"关系越走近越想逃，用冷淡和忙于工作掩饰内心对失控的恐惧，最后推走的往往是最对的人。","alchemy_tip":"在想退的时候先说一句「我需要一点时间，不是不要你」。给退后加上一句说明，关系就不会断裂。"},"low":{"label":"愿意把自己交出去的人","gift_title":"毫无保留的深度连接力","gift_desc":"你敢于敞开软肋去爱与被爱，能营造极富温度的归属感，这是很多人学不会的能力。","shadow_title":"过度融合与边界模糊","shadow_desc":"容易把伴侣的情绪波动当成自己的全部世界，一旦关系动摇，整个人的地基也会跟着摇。","alchemy_tip":"保留一件只属于你、与关系无关的事。亲密是两个完整的人靠近，不是两块泥融成一团。"}},"def_intellectual":{"name":"理智化防御","volume":"vol7","category":"defense","high":{"label":"用结构消化痛苦的人","gift_title":"极高的情绪稳定与洞察力","gift_desc":"你能把混乱的感受翻译成清楚的语言，因此在危机里格外可靠，也常成为别人的定海神针。","shadow_title":"把感受也变成了待分析的材料","shadow_desc":"过度分析会让你离真实的痛越来越远，久了会发现自己什么都能解释，却什么都感觉不到。","alchemy_tip":"在分析之前，先允许自己难受十分钟，什么都不解释。感受需要被经历，不是被理解。"},"low":{"label":"直接感受的人","gift_title":"不被道理绕开真实情绪","gift_desc":"你不会用逻辑把自己从痛里救出来，因此你的情绪是真的，你的关系也是真的。","shadow_title":"在混乱里缺少抓手","shadow_desc":"当情绪过强时容易整个人被卷走，缺少一个能把自己拉回来的结构。","alchemy_tip":"给自己准备一套极简的情绪处理流程（写下来、散步、找人）。不必分析，但需要一个出口。"}},"def_detach":{"name":"情感隔离防御","volume":"vol7","category":"defense","high":{"label":"能瞬间拔掉情绪插头的人","gift_title":"危机中的绝对清醒","gift_desc":"在别人崩溃时你能继续把事情处理完，这种能力让很多灾难被及时止住。","shadow_title":"连快乐也一起被关掉了","shadow_desc":"抽离是全域的，你在关掉痛的同时也关掉了热度，久了会觉得生活像隔着一层玻璃。","alchemy_tip":"在安全的关系里，练习让情绪停留超过三分钟。抽离是技能，但不必全天开启。"},"low":{"label":"情绪随时在线的人","gift_title":"极高的情绪真实度与连接力","gift_desc":"你不会假装没事，因此别人能真的知道你发生了什么，关系也因此真实。","shadow_title":"被情绪淹没而无法处理事情","shadow_desc":"在真正需要冷静的时刻，情绪会先把你冲走，导致该做的事没做成。","alchemy_tip":"练习一个「先处理事情三十分钟」的动作。情绪不会消失，只是稍后才处理。"}},"def_sublimate":{"name":"升华转化防御","volume":"vol7","category":"defense","high":{"label":"把痛变成作品的人","gift_title":"极强的自我转化能力","gift_desc":"你能把最难的部分变成手艺、作品或身体的力量，这种转化是许多人一生学不会的。","shadow_title":"用产出回避真正的面对","shadow_desc":"把所有情绪都投进工作，可能会让你在专业上很强，却在关系里始终缺席。","alchemy_tip":"定期确认一件事：除了产出，你还有没有别的方式处理难过。"},"low":{"label":"痛的时候无法运转的人","gift_title":"不把情绪工具化的诚实","gift_desc":"你不会拿痛苦去换效率，因此你的感受是完整的，也不会把关系变成项目。","shadow_title":"在低谷时产出全面停摆","shadow_desc":"情绪来了就什么也做不了，长期可能造成实际损失与机会流失。","alchemy_tip":"准备一个极低门槛的「维持动作」：哪怕每天只做十分钟。它能在低谷时保住连续性。"}},"def_attack":{"name":"先发反击防御","volume":"vol7","category":"defense","high":{"label":"被侵犯时立刻还手的人","gift_title":"极强的边界保护力","gift_desc":"你不允许自己被踩，因此很少有人敢在你身上试第二次，这在复杂环境里是硬实力。","shadow_title":"误伤与关系的高损耗","shadow_desc":"反应快过判断，容易在还没弄清对方意图时就先伤回去，冤枉了不少本无恶意的人。","alchemy_tip":"把「立刻反击」改成「先问一句」。问完再决定要不要动手，你的力量一点不会减少。"},"low":{"label":"把攻击性收起来的人","gift_title":"极低的关系摩擦","gift_desc":"你很少让人难堪，因此身边的人在你这里感到安全，愿意靠近。","shadow_title":"该还手时手抬不起来","shadow_desc":"长期不反击，会让某些人得寸进尺，最后由别人来替你划那条线。","alchemy_tip":"练习一句固定的句式：「这句话我不接受」。不需要愤怒，只需要说出来。"}},"def_fawn":{"name":"讨好安抚防御","volume":"vol7","category":"defense","high":{"label":"能读出空气的人","gift_title":"极高的情境感知力","gift_desc":"你能在别人开口前就知道他需要什么，这种能力让你在关系与协作里极其被需要。","shadow_title":"用顺从来换取安全","shadow_desc":"长期优先安抚他人，会让你自己的需求被系统性地忽略，最后连你都说不清自己想要什么。","alchemy_tip":"每天练习一次「不解释的拒绝」。一句话就够，不必给理由。"},"low":{"label":"不靠讨好生存的人","gift_title":"清楚的需求与边界","gift_desc":"你不会为了让人舒服而变形，因此你的关系更真，也更少积累隐性的怨。","shadow_title":"错过关系里那些细微的讯号","shadow_desc":"不太读空气，可能让你在别人已经很难受时还继续推进自己的事。","alchemy_tip":"在每次重要对话里，多问一句「你现在是什么感觉」。一句话就能修复很多错位。"}},"def_project":{"name":"反向投射防御","volume":"vol7","category":"defense","high":{"label":"先假定别人有意图的人","gift_title":"极高的防备与识人敏锐度","gift_desc":"你不太会被表象骗，能比别人更早感觉到那层没说出口的动机。","shadow_title":"把自己的阴影分给别人","shadow_desc":"把自己难以承认的部分归因于外界的恶意，会让你在无害的场合也保持戒备，越活越孤。","alchemy_tip":"当判断「他在针对我」时，先问一句：这会不会是我自己也在想的事。"},"low":{"label":"先按善意理解别人的人","gift_title":"让人放松的信任底色","gift_desc":"你不把自己的阴影分给别人，因此别人在你这里不需要过度防御，关系能更快变深。","shadow_title":"对隐性敌意的察觉偏迟","shadow_desc":"习惯善意解读，可能让你在被算计之后仍然替对方找理由。","alchemy_tip":"保留善意，但也保留记录。把让你反复不舒服的事写下来，事实会告诉你答案。"}},"jung_te":{"name":"外倾思维","volume":"vol9","category":"jung","high":{"label":"把混乱压成清单的人","gift_title":"把想法变成能交付的现实","gift_desc":"你天生会把散乱的信息压成目标、期限和责任人。别人还在讨论要不要做，你已经写出了第一步。团队里最稀缺的从来不是点子，而是这种把想法变成日期的能力。","shadow_title":"把人也当成了流程里的一格","shadow_desc":"效率和可衡量会悄悄吃掉别的东西：一句没有产出的倾诉、一个暂时无用的念头，都被你判为浪费。久了你会发现自己很能干，但身边的人只敢向你汇报，不敢对你说真话。","alchemy_tip":"每周留一次三十分钟的对话，全程只提问、不给方案；对方说完之后，先把他的原话复述一遍，再开口。"},"low":{"label":"不靠排序也能安身的人","gift_title":"对过程本身的信任","gift_desc":"你不需要把一切排成表才敢开始，也能容忍一件事暂时没有结论。这让你在混乱里比别人松弛，更容易看见那些无法被量化、却真正重要的东西。","shadow_title":"该拍板的时候一直在准备","shadow_desc":"当事情需要一个明确的决定、一个日期、一次拒绝，你容易继续搜集信息。不是不会，是不喜欢承担那句「就按这个办」的重量，于是决定权被别人替你做了。","alchemy_tip":"遇到悬了一个月还没定的事，强制写下：最晚本周五给出答复，哪怕答案是「先不做」。"}},"jung_ti":{"name":"内倾思维","volume":"vol9","category":"jung","high":{"label":"非把道理抠到底的人","gift_title":"不被行话说服的判断力","gift_desc":"你对一个说法是否自洽有近乎生理的不适感。别人靠资历和气氛推动结论，你能指出中间断掉的那一环。这种能力让你很难被骗，也很难被漂亮话收买。","shadow_title":"想明白了，事情已经过去","shadow_desc":"内部推演的收益只有你自己看得见。等你把逻辑理清、漏洞补齐，窗口可能已经关了。更麻烦的是，别人听到的往往不是严谨，而是「你为什么总在挑刺」。","alchemy_tip":"下一次把分析压成三句话加一个建议，先说结论后说理由，限时两分钟讲完，讲完就停。"},"low":{"label":"可以先走再想的人","gift_title":"不被逻辑卡住的行动力","gift_desc":"你不需要把每一步想通才敢迈出去，能在信息不全时先动起来，靠真实反馈修正方向。这让你比很多人更早拿到世界给出的答案，也少了许多原地打转。","shadow_title":"被一句顺耳的话带走","shadow_desc":"当一个说法讲得足够流畅、说话的人足够可信，你容易跳过验证。不是偷懒，而是逐条拆解让你疲惫，代价是有时会为一个站不住的判断付出很久。","alchemy_tip":"在重要决定上固定加一句自问：「如果这句话是错的，我最早能在什么时候发现？」把答案写下来。"}},"jung_fe":{"name":"外倾情感","volume":"vol9","category":"jung","high":{"label":"先看屋里气氛的人","gift_title":"让一个房间变暖的能力","gift_desc":"你进门三十秒内就知道谁不自在、谁在硬撑。你能把话递到该说的人嘴边，让一场快要冷掉的饭重新热起来。这种社交温度，很多人一辈子学不会。","shadow_title":"把自己排在了名单最后","shadow_desc":"长期优先照顾在场每个人的感受，你会慢慢分不清哪些是自己真的想要，哪些只是不想让人失望。累到某个点，你会突然对所有人升起一股说不出口的怨。","alchemy_tip":"每次聚会回家路上写一句「今天我真正想要的是___」，不分享、不解释，写满十分钟就合上。"},"low":{"label":"不替所有人收拾气氛的人","gift_title":"不被群体情绪牵着走","gift_desc":"别人的脸色不会轻易改写你的判断。你能在一个都在附和的房间里保持自己的节奏，也因此少做了许多违心的妥协，和事后不得不反悔的承诺。","shadow_title":"被读成了冷淡","shadow_desc":"你只是没把注意力放在气氛上，别人收到的却是「他不在乎」。很多关系的裂缝不是因为冲突，而是因为你没听懂那些没有说出口的暗示。","alchemy_tip":"记住一件具体的事：在场有人明显沉下去时，说一句「你今天好像不太一样」，只这一句就够。"}},"jung_fi":{"name":"内倾情感","volume":"vol9","category":"jung","high":{"label":"心里有一把私秤的人","gift_title":"不被说服的价值坐标","gift_desc":"你对「这件事对不对」有一手判断，且不需要别人同意。这让你在所有人都往一个方向走时，能停下来问一句这是不是我要的，也因此很难被收买。","shadow_title":"把感受存成了沉默的账","shadow_desc":"你的在意很少说出口，只在心里记。等到某天绷不住，对方听到的是突然的爆发，而你听到的是攒了很久的一笔旧账。中间那些本可以早说的话全都没有说。","alchemy_tip":"把「我不舒服」改写成一句具体请求，例如「你刚才那句话我不接受，我需要你先听完我再回应」。"},"low":{"label":"不急着表态的人","gift_title":"能容纳模糊立场的余地","gift_desc":"你不急着给每件事贴一个对错，能接受自己暂时没有立场。这让你在复杂处境里不轻易伤人，也给彼此留出了后来改变、慢慢靠近的空间。","shadow_title":"把别人的期待当成了自己的","shadow_desc":"因为不常回到自己的感受，你容易照着外部标准回答「我想要什么」。几年后回头看，会发现自己过得很体面，却很少有哪一段是真正为自己选的。","alchemy_tip":"每周找一个不会被任何人评价的时刻，回答一个问题：如果没人会知道，我还会做这件事吗？"}},"jung_ne":{"name":"外倾直觉","volume":"vol9","category":"jung","high":{"label":"一眼看见五六条岔路","gift_title":"把可能性提前打开的能力","gift_desc":"别人看见一条路，你看见它分出的五六条岔路。你擅长在毫无关联的东西之间搭桥，很多别人想不到的入口，都是你先看见、先试过的。","shadow_title":"开了太多头，很少收口","shadow_desc":"可能性本身就会给你快感，于是你不断开新坑，在最需要枯燥推进的那一段失去兴趣。三年后手上有很多漂亮的开始，很少有一个能拿出手的完成。","alchemy_tip":"同一时间最多允许两个新项目；想开第三个之前，先把其中一个推进到能给别人看的程度。"},"low":{"label":"走一条路就走到底的人","gift_title":"把一件事做深的定力","gift_desc":"你不被新鲜的岔路带走，能在同一条路上反复打磨，直到它真的成形。这种专注本身就是稀缺品，很多真正的专业度只能这样一寸一寸长出来。","shadow_title":"对已经变了的局面反应慢","shadow_desc":"当环境悄悄换了规则，你会继续按原来那条路走，因为换路看起来成本太高。真正危险的不是守旧，而是没意识到自己已经在守旧，还把它叫作坚持。","alchemy_tip":"每季度找一个完全不在你这行的人聊半小时，只问一句：你最近看到我这个行业哪里变了？"}},"jung_ni":{"name":"内倾直觉","volume":"vol9","category":"jung","high":{"label":"从碎片里看见一条线","gift_title":"提前看见结局的洞察","gift_desc":"你能把散落很久的线索收成一句话，往往在事情发生前就隐约知道它会往哪走。这种预感不神秘，它来自你一直在后台默默整合的那些东西。","shadow_title":"把结论当成了事实","shadow_desc":"因为那条线在你脑内太清晰，你容易跳过验证直接按它行动，也很难向别人解释自己依据什么。当判断落空时，代价往往比你预想的要大。","alchemy_tip":"每个重要的预感都写成一句可被证伪的话，标上验证日期；到期回看，只记它中了几次。"},"low":{"label":"更信手里的具体证据","gift_title":"贴着现实走的清醒","gift_desc":"你不太相信没有证据的预感，更愿意看具体的数字和当下的反应。这让你很少被宏大的叙事带跑，判断通常更贴着地面、更经得起追问。","shadow_title":"到最后一刻才看见全局","shadow_desc":"好处是踏实，代价是常在处理已经发生的麻烦。因为你只在细节冒头时才拼图，那些本可以提前绕开的坑，往往要等整个人掉进去才被看见。","alchemy_tip":"做每个决定时加一句推演：照现在的走法继续三年会变成什么样。写三行，不必给谁看。"}},"jung_se":{"name":"外倾感觉","volume":"vol9","category":"jung","high":{"label":"先动手再说的人","gift_title":"把想法按进现实的手感","gift_desc":"你相信身体和现场，不靠纸上推演。你能在一件事还模糊的时候先做出来，用手感替代空想，这种落地的能力让很多东西真的被你做成过。","shadow_title":"用刺激盖住难受","shadow_desc":"当不舒服的情绪上来，你容易用更快、更满、更强烈的感官把它盖过去：喝酒、刷手机、立刻出门。盖得住当下那一阵，盖不住累积下来的东西。","alchemy_tip":"情绪最催你「马上做点什么」的那十五分钟，只做一件不带刺激的事：走一段路，或者洗一次碗。"},"low":{"label":"让身体先等一等的人","gift_title":"不被当下牵着走的定力","gift_desc":"你不会被眼前的强烈感官牵走，能为了更远的东西忍受此刻的枯燥。这让你在很多需要熬的阶段比别人稳，也少做了许多事后后悔的冲动决定。","shadow_title":"活在了脑子里","shadow_desc":"当身体长期只被当作运载工具，你会慢慢失去对真实生活的触感：吃什么无所谓，去哪儿都行。日子过得正确，却很少有哪一刻是活生生被记住的。","alchemy_tip":"每周安排两小时只跟身体有关的事：走路、游泳、做饭，全程不戴耳机、不设任何目的。"}},"jung_si":{"name":"内倾感觉","volume":"vol9","category":"jung","high":{"label":"记得那碗汤的味道","gift_title":"把经验存成可用的底本","gift_desc":"你记得很多别人早就忘掉的细节：一句话的语气、某年冬天的温度。这些记忆在你身上沉淀成可靠的参照，让你在相似的处境里比谁都稳。","shadow_title":"用过去解释现在","shadow_desc":"熟悉会让你安心，也会让你把新的处境继续按旧剧本读。当一个人已经变了、一件事已经不同，你可能还在用三年前的解法，回应今天的他。","alchemy_tip":"在熟悉的关系里每季度问一次：现在的你和去年比，哪里不一样了。听完先不要反驳，也不要补充。"},"low":{"label":"不被过去拽住的人","gift_title":"轻装往前走的能力","gift_desc":"你不会被旧账和旧习惯绑住，能干脆地放下已经不适合的东西。这种轻装让你换城市、换行业、换关系时都比别人快，也更少被旧事拖住脚。","shadow_title":"把重要的东西也一起丢了","shadow_desc":"习惯性向前看，会让你忽略身体早就在报警、关系早就在变薄。等到某天回头看，才发现有些东西不是被谁拿走的，是你在路上一点点丢掉的。","alchemy_tip":"每月固定一天写下三件「还在，但很久没管」的事：一个人、一个习惯、一处身体的不适。"}}};

const ARCHETYPES = {"archetypes":[{"id":"AR01","name":"古典守门人","latin":"The Classical Gatekeeper","keywords":["原则一致","愤怒有据","体面刚硬"],"verdict":"你的锋芒极少为了私利出鞘，几乎全部来自对双标与恃强凌弱的不可容忍。你相信世界至少应该讲道理，并且愿意为这句话付出代价。","weights":{"light_kant":1.4,"val_moral":1.3,"sin_wrath":1.1,"wv_social":1,"light_humanism":0.8},"negWeights":{"dark_mach":-0.6},"psych_tag":"高原则底线 × 义愤驱动型"},{"id":"AR02","name":"丝绒棋手","latin":"The Velvet Strategist","keywords":["温和外壳","局势洞察","不动声色"],"verdict":"你的善意是真的，你的计算也是真的。你懂得用体面降低摩擦，同时在没人注意的地方把局势推向自己需要的位置。","weights":{"dark_mach":1.4,"covert_control":1.3,"big5_compliance":1,"light_faith":0.6},"negWeights":{"big5_assert":-0.3},"psych_tag":"高谋略 × 高妥协表象协同型"},{"id":"AR03","name":"精密发条","latin":"The Precision Clockwork","keywords":["极高可靠","提前预演","长期绷紧"],"verdict":"你是那种让人放心到忘记说谢谢的人。代价是你几乎从未真正松开过，连休息时都在核对有没有漏掉什么。","weights":{"big5_order":1.4,"big5_industry":1.3,"big5_alert":1.2,"big5_rumination":0.8},"negWeights":{"sin_sloth":-0.5},"psych_tag":"高秩序 × 高反刍的过载自驱型"},{"id":"AR04","name":"旷野旅人","latin":"The Open-Field Wanderer","keywords":["主权优先","留有余地","不被定义"],"verdict":"你极度渴望不被安排，但绝不做毫无退路的裸奔。你会默默把底牌攒够，只为买断自己人生的选择权。","weights":{"mot_autonomy":1.5,"val_boundary":1.3,"mot_security":0.9,"cog_ambiguity":0.7},"negWeights":{"big5_compliance":-0.6},"psych_tag":"高自主 × 高安全需求的双锚型"},{"id":"AR05","name":"玻璃罩观察者","latin":"The Bell-Jar Observer","keywords":["滴水不漏","情绪自持","深处封锁"],"verdict":"在绝大多数场合你都是最冷静体面的成年人。但越是滴水不漏的外壳，越说明你把真实的部分锁在了极深的地方。","weights":{"def_intellectual":1.4,"def_detach":1.3,"big5_rumination":0.6,"att_avoidance":1},"negWeights":{"big5_compassion":-0.4},"psych_tag":"理智隔离 × 情感疏离的旁观型"},{"id":"AR06","name":"深夜补偿者","latin":"The Nocturnal Compensator","keywords":["白昼顺从","夜间夺权","感官代偿"],"verdict":"白天你在关系与工作里过度配合，到了深夜，大脑会通过熬夜、食物或消费，把你白天让出去的控制权抢回来一点。","weights":{"sin_gluttony":1.3,"def_fawn":1.4,"mot_autonomy":0.9,"virtue_temperance":-1},"psych_tag":"高放纵代偿 × 高讨好白昼割裂型"},{"id":"AR07","name":"酸质攀登者","latin":"The Ascetic Climber","keywords":["横向敏感","野心精准","转化力强"],"verdict":"每次看到同龄人跃迁时泛起的不甘，其实是你潜能发出的警报。把视线从对方身上拉回自己的清单，这股能量会让你跑得很快。","weights":{"sin_envy":1.2,"mot_mastery":1.4,"def_sublimate":1.2,"big5_industry":0.9},"psych_tag":"高比较敏感 × 高成就驱动型"},{"id":"AR08","name":"门廊观望者","latin":"The Porch Watcher","keywords":["珍视深度","畏惧束缚","留一盏灯"],"verdict":"你内心无比珍视灵魂共振的关系，却又极度畏惧被束缚与受伤。你理想的爱人不是藤蔓，而是各具风骨、始终为你留灯的人。","weights":{"att_avoidance":1.4,"mot_belonging":1.2,"def_detach":0.9,"light_faith":0.5},"psych_tag":"高回避依恋 × 高归属渴求型"},{"id":"AR09","name":"敏感刺猬","latin":"The Sensitive Hedgehog","keywords":["标准极高","渴望被看见","嘴硬心软"],"verdict":"理性上你觉得多数人配不上你的标准，情感上却极度渴望被某个人毫无保留地偏爱。这份拉扯是你最高频的内耗源。","weights":{"sin_pride":1.4,"att_anxiety":1.3,"dark_narc":0.8,"big5_rumination":0.7},"psych_tag":"高焦虑 × 高先发反击型"},{"id":"AR10","name":"优雅省力者","latin":"The Elegant Minimalist","keywords":["厌恶重复","抓核心","点燃即爆发"],"verdict":"你并非能力不足，而是对低水平重复存在生理排斥。碰到真正点燃你好奇心的难题，你能爆发出常人难以企及的巧劲。","weights":{"sin_sloth":1.2,"cog_global":1.3,"big5_open":1.1,"cog_diverge":0.8},"psych_tag":"高全局抽象 × 低勤勉投入型"},{"id":"AR11","name":"临床手术刀","latin":"The Clinical Scalpel","keywords":["果断止损","外冷内热","长痛不如短痛"],"verdict":"你做决定干脆冷峻，甚至显得不近人情。但你相信长痛不如短痛，用果断止损保护更大的善意。","weights":{"dark_psycho":1.4,"light_humanism":1.1,"cog_logic":1.2,"def_detach":0.8},"psych_tag":"低共情 × 高人性信念的矛盾型"},{"id":"AR12","name":"清醒享乐派","latin":"The Lucid Hedonist","keywords":["坦荡谈钱","体验至上","用资源换自由"],"verdict":"你毫不羞于谈论资源积累，但终极目的绝非守财。你要的是用厚实的物质底盘，把时间与审美自由赎回来。","weights":{"sin_greed":1.2,"mot_hedonism":1.4,"mot_mastery":0.9,"big5_aesthetic":0.8},"psych_tag":"高贪婪驱力 × 低幸福取向型"},{"id":"AR13","name":"可能性成瘾者","latin":"The Possibility Addict","keywords":["概念饥饿","跨界联想","广度优先"],"verdict":"你被陌生事物持续吸引，因此总能在两个看似无关的领域之间找到可迁移的结构。问题是，你很少把其中一件做到能被别人看见。","weights":{"big5_open":1.5,"cog_diverge":1.2,"cog_ambiguity":1,"big5_aesthetic":0.7},"psych_tag":"高开放性 × 高发散破局型"},{"id":"AR14","name":"证据匠人","latin":"The Evidence Artisan","keywords":["细节精度","交付可靠","不画空饼"],"verdict":"你相信具体的数据与真实的细节，因此做出来的东西经得起检查。你唯一的风险是：世界有时会因为方向错了，而让完美的工艺白费。","weights":{"cog_global":-1.2,"big5_order":1.3,"big5_industry":1.3,"cog_logic":1},"psych_tag":"高秩序 × 高勤勉的实证型"},{"id":"AR15","name":"带刺理想者","latin":"The Thorned Idealist","keywords":["对不公过敏","当场开口","不肯犬儒"],"verdict":"你的怒火很少来自私利，几乎全被双标与虚伪瞬间点燃。你骨子里住着一个不肯向现实低头的古典侠客。","weights":{"sin_wrath":1.4,"val_standard":1.2,"big5_assert":1.1,"light_kant":1},"psych_tag":"高道德底线 × 高易怒张力型"},{"id":"AR16","name":"深海稳压器","latin":"The Deep Stabilizer","keywords":["情绪极稳","危机定盘","低戏剧性"],"verdict":"你的情绪底盘极稳，是危机中最可靠的那根柱子。你的盲区在于：稳定有时会让别人不敢告诉你，他们其实已经很痛。","weights":{"big5_rumination":-1.4,"def_detach":1.1,"big5_alert":-0.9,"mot_security":0.8},"psych_tag":"低反刍 × 高情感隔离的稳态型"},{"id":"AR17","name":"灰度务实者","latin":"The Grey Pragmatist","keywords":["灰度操作","结果优先","效率极高"],"verdict":"你理解世界不是非黑即白，因此能在多方利益中找出可行路径。你唯一需要警惕的，是底线在一次次「这次特殊」里悄悄后退。","weights":{"wv_social":-1.3,"val_moral":-1.2,"cog_speed":1.1,"val_standard":-1},"psych_tag":"低社会契约 × 低道德绝对型"},{"id":"AR18","name":"先予者","latin":"The First-Giver","keywords":["善意默认","低防备","关系简单"],"verdict":"你愿意先把人当成善的，因此别人在你这里不必先证明自己。你的代价是，在被真正伤害时会先怀疑是不是自己想多了。","weights":{"light_faith":1.5,"wv_nature":1.2,"big5_compassion":1,"def_project":-1},"psych_tag":"高善意 × 高妥协顺从型"},{"id":"AR19","name":"顺流读风者","latin":"The Air Reader","keywords":["情境敏锐","先安抚","自己最后"],"verdict":"你能在别人开口前就知道他需要什么，这种能力让你被深深需要。代价是你自己的需求，被系统性地排在了最后一位。","weights":{"def_fawn":1.5,"big5_compliance":1.2,"att_anxiety":0.9,"big5_assert":-0.8},"psych_tag":"高服从 × 高共情的接应型"},{"id":"AR20","name":"主权者","latin":"The Self-Sovereign","keywords":["不依附","自我修复","随时能走"],"verdict":"你不依附任何人也能活得体面，这种完整感极其稀有。你需要留意的是，独立有时会变成一面你不敢让人翻过来的墙。","weights":{"mot_autonomy":1.5,"att_avoidance":1.2,"val_boundary":1.2,"big5_social":-0.6},"psych_tag":"高自主 × 高回避的独立型"},{"id":"AR21","name":"长程苦行者","latin":"The Long-Haul Ascetic","keywords":["延迟满足","耐受枯燥","复利信仰"],"verdict":"你能穿过别人熬不过的枯燥期，因此复利会在你身上显现。风险在于，你可能把享受无限推迟到永远不会到来的那一天。","weights":{"big5_industry":1.5,"mot_hedonism":-1.2,"virtue_temperance":1.1,"lv_suffering":0.9},"psych_tag":"高勤勉 × 低享乐的自律型"},{"id":"AR22","name":"重建者","latin":"The Rebuilder","keywords":["创伤转化","意义炼金","厚度"],"verdict":"苦难在你这里不会白发生，你从中提取出了别人拿不到的东西。你要小心的是，不要把痛苦误认成成长的唯一路径。","weights":{"lv_suffering":1.4,"def_sublimate":1.3,"mot_purpose":1.1,"big5_rumination":0.7},"psych_tag":"高升华转化 × 低逃避倾向型"},{"id":"AR23","name":"静默引擎","latin":"The Quiet Engine","keywords":["低噪音","持续交付","不争名"],"verdict":"你不靠外放证明自己，只靠一次次真的做成。你需要练的只有一件事：在关键场合让自己被完整地听见。","weights":{"big5_assert":-1.1,"big5_industry":1.4,"virtue_diligence":1.1,"big5_social":-0.7},"psych_tag":"低表达 × 高勤勉的内驱型"},{"id":"AR24","name":"棋局野心家","latin":"The Ambitious Player","keywords":["向上驱动","结果导向","需要被看见"],"verdict":"你对更高位置有真实的渴望，也愿意为此付出代价。你需要区分清楚：你想要的到底是那件事，还是那件事带来的注视。","weights":{"mot_mastery":1.5,"dark_narc":1.1,"dark_psycho":0.9,"covert_control":0.8},"psych_tag":"高自尊 × 高成就渴求型"},{"id":"AR25","name":"危机制图师","latin":"The Crisis Cartographer","keywords":["高压下最清醒","预演最坏","替人兜底"],"verdict":"别人在压力里崩塌的时候，你的脑子反而第一次彻底安静下来。你不是喜欢危机，你只是在危机里才终于知道该做什么——这让你的日常显得有点松散，也让所有人在关键时刻第一个想到你。","weights":{"jung_te":1.2,"dd_order":1.1,"hsp_emotional":0.9,"enn_6":1},"negWeights":{"time_present_fate":-0.7},"psych_tag":"高压秩序 × 高情绪高敏型"},{"id":"AR26","name":"静默调停者","latin":"The Quiet Arbiter","keywords":["不站队","气氛优先","自己的立场最晚出现"],"verdict":"你能同时听懂两边在气什么，于是两边都愿意跟你讲。你的代价是：在一屋子人里，你永远是最后一个被问到'你自己想怎样'的人——有时候你自己也想不起来了。","weights":{"enn_9":1.3,"tki_accommodating":1.1,"pac_child":0.8,"jung_fe":1},"negWeights":{"big5_assert":-0.8},"psych_tag":"高避冲突 × 高外倾情感型"},{"id":"AR27","name":"量化守夜人","latin":"The Quantified Watchman","keywords":["记账即安心","风险先算","不轻易欠人情"],"verdict":"你把世界翻译成一张可以核对的表：余额、进度、还剩多少天。这不是贪，这是你唯一信得过的安慰剂。当数字健康时你几乎无所不能，当数字失控时你会整夜睡不着。","weights":{"money_vigilance":1.4,"mot_security":1.2,"time_future":1,"enn_6":0.9},"negWeights":{"time_present_hed":-0.7},"psych_tag":"高金钱警觉 × 未来秩序锚定型"},{"id":"AR28","name":"引擎型","latin":"The Engine","keywords":["耐受极高","越闹越清醒","恢复期全靠硬扛"],"verdict":"你几乎是靠肾上腺素运行的：陌生、嘈杂、高压的场景不会让你退，只会把你调到一个更快的档位。你唯一需要警惕的不是崩溃，而是你太擅长在崩溃前把事做完。","weights":{"hss_intensity":1.3,"hss_novelty":1.2,"pac_child":0.8,"sin_gluttony":0.8},"negWeights":{"hsp_sensory":-0.9},"psych_tag":"高刺激耐受 × 高新奇寻求型"},{"id":"AR29","name":"深海接收器","latin":"The Deep Receiver","keywords":["细节极清","需要安静","被说太敏感"],"verdict":"你能接收到别人根本不知道存在的信号：一句语气里的偏移、房间里灯光的色温。这让你判断极准，也让你在普通的一天里就被消耗掉别人一周的量。","weights":{"hsp_sensory":1.4,"hsp_emotional":1.2,"big5_aesthetic":0.9,"def_detach":0.7},"negWeights":{"hss_novelty":-0.6},"psych_tag":"高感官高敏 × 高情绪高敏型"},{"id":"AR30","name":"旧图守持者","latin":"The Map Keeper","keywords":["经验即锚","很少重复犯错","环境一变就慢半拍"],"verdict":"你记得住所有先例：上次那件事是怎么成的、哪句话在哪个场合说错过。这套庞大的经验库让你稳，也让你在一个规则全换掉的地方显得过分谨慎。","weights":{"jung_si":1.4,"enn_6":1.1,"money_vigilance":0.8,"big5_order":0.9},"negWeights":{"jung_ne":-0.7},"psych_tag":"高经验内倾 × 高忠诚恐惧型"},{"id":"AR31","name":"自撰者","latin":"The Self-Author","keywords":["自己定义意义","讨厌被安排","没有下班时间"],"verdict":"任何别人递过来的活法，你都会先拆开看看是不是真的适合自己。这让你活得比多数人自由，也让你必须不停地为自己的选择重新找理由——包括已经做过一百次的选择。","weights":{"phil_existential":1.4,"mot_autonomy":1.2,"enn_4":1,"mft_liberty":0.9},"negWeights":{"dd_order":-0.6},"psych_tag":"高存在主义 × 高自主反对安排型"},{"id":"AR32","name":"无证圣徒","latin":"The Unlicensed Saint","keywords":["不信流程","私下守得很严","自己扛"],"verdict":"你不太相信制度会替你办好一件事，但你对自己的要求比任何制度都严。于是你常常在一堆人分工不清的烂摊子里，独自承担了那个没人认领的责任。","weights":{"val_moral":1.3,"light_kant":1.1,"tki_competing":0.7},"negWeights":{"dark_mach":-1},"psych_tag":"低制度信任 × 高道德严格型"},{"id":"AR33","name":"转译者","latin":"The Translator","keywords":["先降噪","只谈事实","不喜欢情绪推拉"],"verdict":"一屋子人在互相指责的时候，你已经把问题拆成了三件可执行的事。你救了很多人，也常常被误解成冷漠——因为你给出的从来不是安慰，是出口。","weights":{"pac_adult":1.4,"tki_collaborating":1.2,"jung_te":0.9,"cog_logic":0.9},"negWeights":{"pac_child":-0.7},"psych_tag":"高成人自我态 × 高协作冲突型"},{"id":"AR34","name":"不服管者","latin":"The Unruled","keywords":["反感被安排","反抗很快","把小事推成对立"],"verdict":"你对'有人替你决定'的敏感度远超常人，哪怕那条指令本身完全合理。你不是难搞，你只是必须先确认这件事是'我选的'，才愿意去做。","weights":{"mft_liberty":1.3,"mot_autonomy":1.3,"sin_wrath":0.8},"negWeights":{"big5_compliance":-1.1},"psych_tag":"高自由道德 × 高自主反对管控型"},{"id":"AR35","name":"高电压者","latin":"The Voltage Seeker","keywords":["安静即失重","情绪浓度要高","长期透支"],"verdict":"你需要很强的信号才能确定自己在线：激烈的对话、通宵的项目、让人心跳加速的决定。平静对你不是休息，是一种'我是不是不在了'的错觉。","weights":{"hss_intensity":1.3,"sin_gluttony":1,"time_present_hed":1,"mot_hedonism":0.9},"negWeights":{"virtue_temperance":-0.9},"psych_tag":"高强度寻求 × 高放纵代偿型"},{"id":"AR36","name":"预演室","latin":"The Rehearsal Room","keywords":["预演最坏","风险雷达永远开着","没事也紧绷"],"verdict":"任何一件悬而未决的事，在你脑内都已经被推到最坏的结果，并且演练过三套应对。这份能力真的救过你，代价是你几乎没有'事情还没发生'的那段时间。","weights":{"schema_negativity":1.3,"hsp_emotional":1,"big5_alert":1.1,"enn_6":0.9},"negWeights":{"phil_epicurean":-0.6},"psych_tag":"高灾难预期 × 高情绪高敏型"}]};

const CROSS_RULES = [{"id":"CR_01","required_volumes":["vol2","vol3"],"conditions":[{"dim":"dark_mach","op":">=","val":62},{"dim":"big5_compliance","op":">=","val":62}],"title":"丝绒手套里的棋手","tag":"表里策略协同","insight":"外表极其温和体面，从不轻易得罪人；但内心对每一场人际博弈的利益脉络都门清。你是最高级的温和策略家——用善意做盾，用智谋破局，很多局面在你手里是被无声推动的。","advice":"警惕长期维持温和表象带来的隐性情绪积压。在真正信赖的人面前，允许自己偶尔露出锋芒，否则你会发现自己被所有人喜欢，却没人真的认识你。"},{"id":"CR_02","required_volumes":["vol1","vol7"],"conditions":[{"dim":"sin_pride","op":">=","val":62},{"dim":"att_anxiety","op":">=","val":62}],"title":"敏感的孤傲刺猬","tag":"自尊与渴望的拉扯","insight":"理性上觉得大多数人都配不上你的标准，情感上却极度渴望被某个人毫无保留地偏爱和看见。嘴硬心软是你最高频的内耗源——你会用推开的方式测试对方会不会留下。","advice":"把测试的次数减半，把直接说出口的次数加倍。真正愿意留下的人，不需要被推开那么多次来证明。"},{"id":"CR_03","required_volumes":["vol1","vol5"],"conditions":[{"dim":"sin_sloth","op":">=","val":58},{"dim":"cog_global","op":">=","val":62}],"title":"高维度的优雅偷懒者","tag":"拒绝低水平重复","insight":"你并不是能力不足，而是对低价值重复劳动存在生理级排斥。一旦碰到真正点燃好奇心的难题，你能爆发出远超常人的创造力与巧劲。你的问题从来不是懒，而是没有被值得的事点燃。","advice":"与其逼自己变勤快，不如把手上那件枯燥的事重新设计一次：找出真正决定结果的 20%，其余尽量简省或交出去。"},{"id":"CR_04","required_volumes":["vol1","vol4"],"conditions":[{"dim":"sin_wrath","op":">=","val":58},{"dim":"val_moral","op":">=","val":60}],"title":"带刺的理想主义守门人","tag":"愤怒的纯度高","insight":"你的怒火极少源于私人小便宜，几乎全部被「双标、虚伪、恃强凌弱」瞬间点燃。你骨子里住着一位不肯向犬儒低头的古典侠客，你的攻击性其实是你的道德感在发烫。","advice":"你的愤怒是对的，但表达方式会决定它被听见还是被误解。把「你怎么能这样」换成「这件事违反了哪条规则」，你的力量会翻倍。"},{"id":"CR_05","required_volumes":["vol2"],"conditions":[{"dim":"big5_industry","op":">=","val":65},{"dim":"big5_rumination","op":">=","val":60}],"title":"永不停歇的精密发条","tag":"可靠的代价","insight":"靠谱到让所有人放心，代价是自己长期绷紧神经。你总在提前预演所有可能出错的细节，连休息时都在隐隐觉得「是不是漏了什么」。","advice":"给自己设一个「无法被推翻的休息时段」，并把它写进日程。你的崩溃不会来自外部压力，只会来自从不承认自己累。"},{"id":"CR_06","required_volumes":["vol4","vol6"],"conditions":[{"dim":"mot_autonomy","op":">=","val":68},{"dim":"mot_security","op":">=","val":60}],"title":"带降落伞的旷野旅人","tag":"自由与退路并存","insight":"你极度渴望不被定义、随时说走就走，但绝不做毫无退路的裸奔冒险。你会默默攒足底牌和存款，只为买断自己人生的选择权。真正的自由对你来说是「随时可以走」，而不是「已经走了」。","advice":"你的策略是对的，只是要留意别把「准备」变成新的牢笼。给「出发」设一个具体日期，而不是一个条件。"},{"id":"CR_07","required_volumes":["vol7"],"conditions":[{"dim":"def_intellectual","op":">=","val":62},{"dim":"def_detach","op":">=","val":58}],"title":"玻璃罩里的观察者","tag":"情绪的双重隔离","insight":"在绝大多数场合你都是最冷静体面的成年人，情绪从不失控。但越是滴水不漏的外壳，越说明你把真实的委屈锁进了极深的地下室——你甚至已经习惯到不觉得它在那里。","advice":"每周留一次「不加分析」的时间：只说发生了什么、我感觉到什么，不允许自己解释原因。感受需要被经过，不是被理解。"},{"id":"CR_08","required_volumes":["vol1","vol7"],"conditions":[{"dim":"sin_gluttony","op":">=","val":58},{"dim":"def_fawn","op":">=","val":58}],"title":"白昼乖巧、深夜失控的补偿者","tag":"控制权的夜间回收","insight":"白天在职场和关系里过度顺从、压抑真实诉求，到了深夜独处时，大脑就会通过报复性熬夜、美食或消费，疯狂抢回对身体的控制权。那不是意志力问题，而是白天让出去的主权在夜里索要利息。","advice":"别先改夜里的手，先改白天的嘴。每天多说一次「这个我不太想」，夜里的失控会自动减轻。"},{"id":"CR_09","required_volumes":["vol1","vol4"],"conditions":[{"dim":"sin_greed","op":">=","val":60},{"dim":"lv_happiness","op":"<=","val":45}],"title":"清醒的享乐务实家","tag":"用资源赎回时间","insight":"你毫不羞于谈论搞钱与资源积累，但你的终极目的绝非当守财奴——你要用充沛的物质底盘，把时间与审美自由赎回来尽情体验人间。你赚钱是为了不必再为钱做选择。","advice":"每隔一段时间问自己：我现在攒的这个数字，对应的是哪一种自由？如果答不上来，那个数字就只是焦虑的形状。"},{"id":"CR_10","required_volumes":["vol3"],"conditions":[{"dim":"dark_psycho","op":">=","val":60},{"dim":"light_humanism","op":">=","val":62}],"title":"外冷内热的现实手术刀","tag":"果断与善意的共存","insight":"你做决定极度干脆冷峻，甚至显得不近人情。但你内心其实深切关怀人的尊严——你相信「长痛不如短痛」，用果断止损保护更大的善意。被你切掉的人常常很久以后才明白你在保护什么。","advice":"决定可以冷，说明必须热。在你拍板之后，花三分钟告诉那个人你为什么这么做——不然你的善意永远只有你自己知道。"},{"id":"CR_11","required_volumes":["vol1","vol6"],"conditions":[{"dim":"sin_envy","op":">=","val":58},{"dim":"mot_mastery","op":">=","val":65}],"title":"以酸涩为燃料的攀登者","tag":"比较能量的正向转化","insight":"每次看到同龄人跃迁时泛起的不甘，其实是你内在潜能发出的警报——它在告诉你「那个东西你也想要」。只要把视线从对方身上拉回自己的行动清单，这股能量会让你进步神速。","advice":"给「酸」设一个转化动作：泛酸的当天，必须为那个渴望做一件具体的小事。情绪不转化就会变成内耗。"},{"id":"CR_12","required_volumes":["vol6","vol7"],"conditions":[{"dim":"att_avoidance","op":">=","val":62},{"dim":"mot_belonging","op":">=","val":58}],"title":"站在门廊上的深情观望者","tag":"渴望与恐惧并存","insight":"你内心无比珍视灵魂共振的深厚关系，却又极度畏惧被束缚与受伤。你理想中的爱人不是时刻黏连的藤蔓，而是各具风骨、却始终为你留一盏灯的同行者。你站在门口，是因为门里太重要。","advice":"在想退的那一刻，先说出那句「我需要一点空间，不是不要你」。很多关系的断裂不是因为距离，而是因为距离没有被解释。"},{"id":"CR_13","required_volumes":["vol3","vol4"],"conditions":[{"dim":"dark_mach","op":">=","val":60},{"dim":"wv_social","op":"<=","val":45}],"title":"规则之外的现实主义者","tag":"灰度操作者","insight":"你不相信纸面规则能解决问题，更相信真实的人性与利益结构。你能在别人还在讲道理的时候，直接找到那个真正能推动事情的支点。这是一种很硬的能力，也是一种很重的责任。","advice":"把自己当成那个「有能力绕过规则的人」时，务必同时成为那个「最不愿意滥用它的人」。否则你最终会失去所有愿意相信你的人。"},{"id":"CR_14","required_volumes":["vol2","vol5"],"conditions":[{"dim":"big5_open","op":">=","val":65},{"dim":"cog_diverge","op":">=","val":60}],"title":"可能性成瘾者","tag":"广度过剩的代价","insight":"你被新的可能持续吸引，脑子里同时在跑五个项目，每一个都足够精彩。你的问题从来不是没有想法，而是没有一个想法被完整地做到能被别人看见。","advice":"给自己立一条铁律：任何时刻只允许三个进行中的项目。想开第四个，必须先关掉一个。"},{"id":"CR_15","required_volumes":["vol4","vol6"],"conditions":[{"dim":"lv_anchor","op":"<=","val":45},{"dim":"mot_security","op":">=","val":62}],"title":"向外建构的稳固者","tag":"以成就换安全感","insight":"你的安全感建立在外部的稳定结构上：位置、收入、被认可的身份。这让你非常可靠，也让你在结构动摇时，动摇的不只是生活，而是整个自我。","advice":"在外部成就之外，建立一处完全不需要任何人评价的价值来源。它不必宏大，但必须是你的。"},{"id":"CR_16","required_volumes":["vol7"],"conditions":[{"dim":"att_anxiety","op":">=","val":62},{"dim":"def_attack","op":">=","val":58}],"title":"用愤怒索要靠近的人","tag":"攻击性下的依恋","insight":"你的怒火很多时候不是真的在生气，而是在说「你为什么不看我」。攻击是你最快能引起对方反应的方式，也是最容易把对方推远的方式。","advice":"在发火之前，试着说出下面这句更难的话：「我现在有点怕你不理我。」它比任何一句指责都更有力量。"},{"id":"CR_17","required_volumes":["vol3","vol7"],"conditions":[{"dim":"light_faith","op":"<=","val":42},{"dim":"def_project","op":">=","val":58}],"title":"先假定恶意的防御者","tag":"投射回路","insight":"你习惯先假设别人有意图，因此在无害的场合也保持戒备。这套系统确实保护过你，但它也在持续筛掉那些本来真的没有恶意的人。","advice":"当判断「他在针对我」时，加一个动作：把这件事讲给一个旁观者听。第三方视角能校正大部分投射。"},{"id":"CR_18","required_volumes":["vol1","vol2"],"conditions":[{"dim":"virtue_kindness","op":">=","val":62},{"dim":"big5_compliance","op":">=","val":60}],"title":"把世界让给别人的好人","tag":"善意与失语的合流","insight":"你能真心为别人鼓掌，也习惯把自己的位置往后挪。这两件事叠加，会让你在很多场合成为那个「很好，但没人记得」的人。","advice":"欣赏别人和主张自己并不冲突。练习在你夸完别人之后，补一句关于你自己的。世界不会因为你要位置就讨厌你。"},{"id":"CR_19","required_volumes":["vol5","vol7"],"conditions":[{"dim":"cog_logic","op":">=","val":62},{"dim":"def_intellectual","op":">=","val":60}],"title":"把心装进分析框架的人","tag":"理解的替代","insight":"你处理情绪的方式是理解它。这套系统让你在很多场合极其稳，但也让你的痛被处理得太干净——干净到你根本不知道自己其实一直在痛。","advice":"在解释之前，先允许自己什么都不懂地难受十分钟。理解是后来的事，感受必须先发生。"},{"id":"CR_20","required_volumes":["vol6","vol2"],"conditions":[{"dim":"mot_hedonism","op":">=","val":65},{"dim":"big5_industry","op":"<=","val":45}],"title":"把日子过成假期的人","tag":"体验优先的代价","insight":"你的感受力极高，能把普通的日子过得有滋味，这是很多人努力半生也换不回来的。但那些不好玩却重要的事，正在你的清单上静静堆积。","advice":"每周固定一天处理「不好玩但重要」的事，其余六天尽情活得有滋味。两件事不冲突，只是需要被分开安排。"},{"id":"CR_21","required_volumes":["vol1","vol3"],"conditions":[{"dim":"virtue_patience","op":">=","val":62},{"dim":"covert_control","op":">=","val":58}],"title":"不动声色的温和操盘手","tag":"以柔代刚","insight":"你很少发火，也很少真的放手。你用耐心和分寸把局面引向你要的方向，别人甚至感觉不到被推动。这是极高段位的软实力，也是一种别人说不清为什么的疲惫感来源。","advice":"每周至少有一次，把「安排」换成「直接说我要什么」。坦白比技巧更省力，也更让人愿意长期待在你身边。"},{"id":"CR_22","required_volumes":["vol2","vol7"],"conditions":[{"dim":"big5_alert","op":">=","val":62},{"dim":"att_avoidance","op":">=","val":58}],"title":"提前离场的人","tag":"风险预演与抽离","insight":"你会在关系里提前看到所有可能出问题的地方，于是先一步抽身。你把它叫做理性，但很多时候，那是害怕在同一个人身上再输一次。","advice":"在决定离开之前，把「可能发生的坏事」写下来，并标注概率。你会发现大部分恐惧，只存在于你的预演里。"},{"id":"CR_23","required_volumes":["vol4","vol7"],"conditions":[{"dim":"val_boundary","op":">=","val":62},{"dim":"att_avoidance","op":">=","val":60}],"title":"以自由为名的守门人","tag":"独立的双重动机","insight":"你说是为了自由，其实有一半是为了安全。真正的独立是「我可以选择依靠」，而你的版本更像「我不能依靠任何人」——前者是力量，后者是伤口。","advice":"对一个人主动求助一次，只一件小事。你会发现依赖不会让你失去自己，只会让你多一个支点。"},{"id":"CR_24","required_volumes":["vol1","vol6"],"conditions":[{"dim":"sin_pride","op":">=","val":60},{"dim":"mot_mastery","op":">=","val":62}],"title":"不允许自己平庸的人","tag":"高标准驱动","insight":"你对自己的要求远高于对别人的，因此你的成就往往很好，你的疲惫也往往很深。你最大的敌人不是竞争者，是那个永远觉得「还不够」的自己。","advice":"每完成一件事，强制停留三天再开始下一件。你需要练习「已经够了」的感觉，否则抵达永远不会带来满足。"},{"id":"CR_25","required_volumes":["vol5","vol2"],"conditions":[{"dim":"cog_speed","op":">=","val":62},{"dim":"big5_order","op":"<=","val":45}],"title":"先跑起来再修路的人","tag":"迭代优先","insight":"你不等条件齐备就出发，因此比别人更早拿到真实的反馈。代价是，你留下的一些尾巴，需要别人替你收拾。","advice":"把手上的决定分成可逆与不可逆两类。可逆的尽管快，不可逆的必须先慢下来——这是唯一需要你破例的地方。"},{"id":"CR_26","required_volumes":["vol4","vol3"],"conditions":[{"dim":"wv_nature","op":">=","val":62},{"dim":"light_faith","op":">=","val":62}],"title":"愿意先给出信任的人","tag":"善意的复利与风险","insight":"你默认人是善的，因此别人在你这里不必先证明自己。这种低成本建立关系的能力极其稀有，代价是你在真正的恶意面前反应偏慢。","advice":"保留先给信任的习惯，但给自己加一条规则：同一个人透支两次之后，把信任降级为观察。善意不必是一次性的。"},{"id":"CR_27","required_volumes":["vol6","vol1"],"conditions":[{"dim":"mot_purpose","op":">=","val":62},{"dim":"virtue_charity","op":">=","val":58}],"title":"把意义放在别人身上的人","tag":"利他的双刃","insight":"你的意义感来自「我所做的事对别人有用」。这让你非常有温度，也让你在没人需要你的时候，突然不知道自己是谁。","advice":"建立一件只对你自己有意义的事。它不该被任何人需要，也不该被任何人评价。"},{"id":"CR_28","required_volumes":["vol3","vol5"],"conditions":[{"dim":"covert_control","op":">=","val":62},{"dim":"cog_global","op":">=","val":60}],"title":"在结构层面下棋的人","tag":"系统级影响力","insight":"你不太争一时的对错，你改的是规则本身。你能看到一件事背后的结构，然后悄悄把那个结构挪到你希望的方向。这种能力很少被看见，却决定了大部分结果。","advice":"结构性的影响力需要透明来托底。让别人知道你在改什么，否则你会在某天发现所有人都在防着你。"},{"id":"CR_29","required_volumes":["vol7","vol1"],"conditions":[{"dim":"def_sublimate","op":">=","val":60},{"dim":"sin_sloth","op":"<=","val":42}],"title":"把痛烧成燃料的人","tag":"创伤的升华","insight":"你的难过几乎不会白费，它会变成作品、手艺或身体的力量。这是一种被很多人羡慕的能力，但它也可能让你在关系里始终缺席——因为你总是在处理，而不是在经历。","advice":"定期确认一件事：除了产出，你还有没有别的方式处理难过。人需要被接住，不是只需要被转化。"},{"id":"CR_30","required_volumes":["vol2","vol6"],"conditions":[{"dim":"big5_social","op":"<=","val":42},{"dim":"mot_belonging","op":">=","val":58}],"title":"要很少的人，要得很深","tag":"低数量高浓度","insight":"你不需要很多朋友，但你需要有几个人是真的懂你。你的人际圈很小，密度却极高——一旦有人被你放进内圈，你会给出远超平均的忠诚。","advice":"主动维护那几个人。高浓度的关系最怕的不是冲突，而是长期没人先开口。"},{"id":"CR_31","required_volumes":["vol8"],"conditions":[{"dim":"mask","op":">=","val":60}],"title":"精密防卫层的建造者","tag":"面具厚度校准","insight":"你在高压下与常态下的选择出现了明显落差。这不一定意味着你在骗人——更可能意味着你早已学会：真实的那一面，只在极少数人面前才安全地拿出来。","advice":"面具本身不是问题，只有一副面具才是问题。为自己找一个可以摘下来的房间，哪怕只有一个人在里面。"},{"id":"CR_32","required_volumes":["vol8","vol7"],"conditions":[{"dim":"mask","op":">=","val":55},{"dim":"def_intellectual","op":">=","val":58}],"title":"连崩溃都要体面的人","tag":"高压下的自我管理","insight":"你连在最难受的时候，都还在管理自己的形象。外人看到的是稳定，你自己知道那是一场持续的、从不被看见的维持工作。","advice":"找一个人，允许自己在他面前不体面一次。你会发现天没有塌，而那个人反而更靠近你了。"},{"id":"CR_33","required_volumes":["vol4","vol5"],"conditions":[{"dim":"cog_independent","op":">=","val":62},{"dim":"wv_social","op":">=","val":58}],"title":"讲原则的异见者","tag":"双重少数","insight":"你既坚持规则，又不肯随大流。这让你在大多数群体里都显得有点不好相处，也让你成为那种在关键时刻唯一说真话的人。","advice":"你的价值需要被理解才能生效。把「我不同意」升级为「我不同意，因为这样会伤到谁」——同样的立场，接受度完全不同。"},{"id":"CR_34","required_volumes":["vol2","vol7"],"conditions":[{"dim":"big5_compassion","op":">=","val":62},{"dim":"def_fawn","op":">=","val":58}],"title":"天生的情绪承接地","tag":"共情与讨好的重叠","insight":"你能第一时间感觉到别人的难受，并且下意识地去安抚。这两件事叠在一起，会让你长期成为所有人的情绪出口，而没有人问过你今天怎么样。","advice":"共情不等于负责。练习在心里加一句「这是他的，不是我的」，然后只做你能做的那一部分。"},{"id":"CR_35","required_volumes":["vol3","vol1"],"conditions":[{"dim":"dark_narc","op":">=","val":60},{"dim":"sin_envy","op":">=","val":55}],"title":"需要被看见的竞争者","tag":"光环与比较","insight":"你既需要站在中心，又对别人的高光格外敏感。这两件事同时运转时，你会活得很累——因为总有人在某个地方比你更亮。","advice":"把「他凭什么」换成「我要什么」。前者永远有答案，后者才是你能改变的部分。"},{"id":"CR_36","required_volumes":["vol9","vol2"],"conditions":[{"dim":"jung_ni","op":">=","val":60},{"dim":"jung_ne","op":">=","val":58}],"title":"两条直觉并线跑的人","tag":"功能栈内部冲突","insight":"Ni 与 Ne 同时偏高是罕见配置：你既会被一个'终将收束成一条主线'的预感驱动，又忍不住同时向五个方向发散。你脑子里常常同时存在一个长远隐喻和七八条支线，它们互不承认对方。","advice":"给每一次直觉冲动贴一个标签：这是'收束型'还是'发散型'。发散型只允许记录，不许立刻行动；收束型才配得上你的执行力。"},{"id":"CR_37","required_volumes":["vol9","vol5"],"conditions":[{"dim":"jung_ti","op":">=","val":60},{"dim":"cog_ambiguity","op":">=","val":62}],"title":"要求逻辑闭环的模糊耐受者","tag":"认知风格张力","insight":"你能忍受大量未确定的信息，却无法接受其中出现一个没拧紧的螺丝。这让你成为很好的探索者，同时很难成为让人放松的合作者——你能一边说'先别急着定',一边在心里给每句话打分。","advice":"把'这里逻辑不通'延后 24 小时再说。你会发现大部分漏洞在你重新看的时候已经自己闭合了。"},{"id":"CR_38","required_volumes":["vol10","vol3"],"conditions":[{"dim":"dd_order","op":">=","val":58},{"dim":"dark_mach","op":">=","val":60}],"title":"把规则当杠杆的人","tag":"秩序 × 策略","insight":"你尊重规则，但你更清楚规则的确切边界在哪里——因为你要在边界内侧把事办成。这种组合在组织里极其有效，也极其容易让人在你背后议论'他太会了'。","advice":"每季度主动放弃一次'技术上完全站得住'的便利。信任的账户需要定期存入，而不是只取不存。"},{"id":"CR_39","required_volumes":["vol10","vol4"],"conditions":[{"dim":"dd_order","op":"<=","val":45},{"dim":"val_moral","op":">=","val":60}],"title":"不信任制度的好人","tag":"混沌 × 原则","insight":"你对机构与流程高度怀疑，却在私人道德上极其严格。你宁愿自己扛下麻烦，也不愿把判断权交给一个你不认识的体系——这在很多时刻是对的，也让你长期处于'没人替我兜底'的疲惫里。","advice":"挑一件风险极低的小事，完整地交给流程走完。不是为了相信制度，是为了让身体知道：不是每件事都必须你亲自盯着。"},{"id":"CR_40","required_volumes":["vol11","vol13"],"conditions":[{"dim":"phil_stoic","op":">=","val":60},{"dim":"schema_deprivation","op":">=","val":58}],"title":"用哲学缝合早年缺口的人","tag":"意义 × 图式","insight":"你有一套非常成熟的自我解释系统：不可控的事不归我管，我只负责自己的姿态。但在这套系统底层，有一处'我的情感需求本来就不该被满足'的旧设定，它让克制看起来像美德。","advice":"练习一次不体面的需要：明确告诉某个人'我今天想被陪一下'。不带理由，不带交换条件。"},{"id":"CR_41","required_volumes":["vol11","vol15"],"conditions":[{"dim":"phil_cynic","op":">=","val":58},{"dim":"tki_avoiding","op":">=","val":58}],"title":"看透了所以懒得吵","tag":"犬儒 × 回避","insight":"你的沉默不是软弱，而是一种判断：这场对话不会有结果，说下去只是消耗。问题在于，对方接收到的信号永远是'他不在乎'，于是误会一层层加厚。","advice":"把'懒得说'换成一句极短的实话：'这件事我有不同看法，今天不想展开。'让沉默有主语。"},{"id":"CR_42","required_volumes":["vol12","vol7"],"conditions":[{"dim":"enn_4","op":">=","val":58},{"dim":"att_anxiety","op":">=","val":58}],"title":"要独特，又要被确认","tag":"九型 × 依恋","insight":"你希望自己是不可替代的那一个，同时又需要有人反复确认你没有被替换掉。这两个需求会互相拆台：越想独特，越难开口要确认；越缺确认，越把独特演成一种防御。","advice":"把'他是不是觉得我谁都可以'翻译成'我需要一次具体的、被选中的证据'。要证据，不要情绪。"},{"id":"CR_43","required_volumes":["vol12","vol2"],"conditions":[{"dim":"enn_5","op":">=","val":58},{"dim":"big5_social","op":"<=","val":45}],"title":"靠撤退充电的观察者","tag":"九型 × 大五","insight":"你的能量来自观察而不是参与。人多时你不是不喜欢那些人，只是每一句对话都在消耗你的处理带宽。你不讨厌热闹，你只是需要一个不必回应的位置。","advice":"把'我需要先走一下'提前说出来，而不是等到电量耗尽才消失。提前告知比事后解释便宜得多。"},{"id":"CR_44","required_volumes":["vol13","vol12"],"conditions":[{"dim":"schema_sacrifice","op":">=","val":58},{"dim":"enn_2","op":">=","val":58}],"title":"先把自己给出去的人","tag":"图式 × 九型","insight":"你习惯在别人开口之前就替他想到，并且把这当成一种能力而不是负担。长期下来，你会发现自己的人际关系里有一种奇怪的失衡：你给了很多，却很少真正被照顾。","advice":"下次想主动帮忙前，先等对方开口一次。允许自己成为那个'没被请求就不出手'的人。"},{"id":"CR_45","required_volumes":["vol14","vol6"],"conditions":[{"dim":"money_vigilance","op":">=","val":60},{"dim":"mot_security","op":">=","val":62}],"title":"把安全感存成数字的人","tag":"金钱脚本 × 动机","insight":"数字对你不是欲望的度量，而是风险的度量。你存下的不是钱，是一种'万一出事我还有退路'的确定感。代价是：你可能永远觉得不够，因为风险永远算不完。","advice":"给储蓄设一个明确的'够了'阈值，写下来。达到以后，把增量专门花在让自己开心的东西上。"},{"id":"CR_46","required_volumes":["vol14","vol4"],"conditions":[{"dim":"time_present_hed","op":">=","val":60},{"dim":"lv_happiness","op":">=","val":58}],"title":"把钱换成当下的体验派","tag":"时间观 × 人生观","insight":"你更愿意把资源换成此刻的鲜活，而不是账户里一个更大的数字。这不是短视——你只是很早就发现，很多体验过期不再补发。需要留意的是那些真正有复利的东西，它们恰好都不够刺激。","advice":"每月固定一笔'无聊但会复利'的投入（体检、学习、关系维护），金额可以很小，但要自动扣款。"},{"id":"CR_47","required_volumes":["vol15","vol3"],"conditions":[{"dim":"pac_adult","op":">=","val":58},{"dim":"covert_control","op":">=","val":58}],"title":"用理性完成掌控的人","tag":"PAC × 隐性掌控","insight":"冲突里你几乎不提高音量，你只把事实摆到对方无法反驳的位置。这种方式极有效，也极容易让人感到'被处理了'——因为他们确实是被处理了。","advice":"在把事实摆完以后，多问一句'你怎么看'。给对方一个真实的输入口，而不是一个形式上的。"},{"id":"CR_48","required_volumes":["vol15","vol1"],"conditions":[{"dim":"pac_child","op":">=","val":58},{"dim":"sin_wrath","op":">=","val":58}],"title":"一生气就变回小孩","tag":"PAC × 情绪","insight":"你的愤怒来得快、去得也快，但说出口的话往往留下了不可回收的痕迹。那不是你真实的立场，那是一个被踩到的人在用最原始的方式喊停。","advice":"把'你根本…'换成'我现在很生气，需要十分钟'。把情绪命名出来，比把情绪扔出去有效。"},{"id":"CR_49","required_volumes":["vol16","vol2"],"conditions":[{"dim":"hsp_sensory","op":">=","val":58},{"dim":"big5_social","op":">=","val":58}],"title":"在人群里最敏锐，也最耗电","tag":"神经边缘 × 大五","insight":"你在社交里表现得很自如，甚至比多数人更会读空气——因为你的接收器一直开在最灵敏档。代价是散场后需要一整段无人打扰的时间，才能把自己收回来。","advice":"把'散场后的独处时间'写进日程，像会议一样不可挪用。提前安排，比临时崩溃便宜。"},{"id":"CR_50","required_volumes":["vol16","vol6"],"conditions":[{"dim":"hss_novelty","op":">=","val":58},{"dim":"hsp_sensory","op":">=","val":58}],"title":"既想冲又怕吵的矛盾体","tag":"HSP × HSS","insight":"你的神经系统同时对'新鲜'和'过载'敏感：未知让你兴奋，噪音让你崩溃。所以你最容易在热闹现场的电量断崖式归零，然后在黑暗的房间里躺两天。","advice":"给任何高强度体验预留'恢复日'。不是事后补救，是出发前就写进计划。"},{"id":"CR_51","required_volumes":["vol13","vol1"],"conditions":[{"dim":"schema_approval","op":">=","val":58},{"dim":"virtue_kindness","op":">=","val":60}],"title":"用好人身份换安全的人","tag":"图式 × 美德","insight":"你的体贴是真的，但其中有一部分来自一个旧设定：只要我是好人，就不会被丢下。这让你的善意带上了隐隐的紧绷——你其实一直在等一句'你很好'。","advice":"做一件不被任何人知道的好事，并且不给它任何解释。练习一次不领报酬的善。"},{"id":"CR_52","required_volumes":["vol11","vol1"],"conditions":[{"dim":"mft_liberty","op":">=","val":60},{"dim":"sin_wrath","op":">=","val":55}],"title":"被管着就浑身难受的人","tag":"道德基础 × 情绪","insight":"你对'被别人替你决定'有近乎生理性的反感。这种反感让你反抗得很快，也让你在很多时候把一个本可以协商的小事直接推到对立面。","advice":"在发火前先试着提一次反建议。不是为了赢，是为了让对抗变成谈判。"},{"id":"CR_53","required_volumes":["vol9","vol7"],"conditions":[{"dim":"jung_fe","op":">=","val":58},{"dim":"def_fawn","op":">=","val":58}],"title":"把气氛当成自己的责任","tag":"Fe × 防御","insight":"你一进门就能读出房间的温度，并且会自动开始调温。这套能力让你在哪儿都被喜欢，也让你把'别人不舒服'默认记在自己账上。","advice":"在一次聚会里刻意不调温：允许场面尴尬三分钟，什么都不做，看会发生什么。"},{"id":"CR_54","required_volumes":["vol9","vol3"],"conditions":[{"dim":"jung_te","op":">=","val":58},{"dim":"dark_psycho","op":">=","val":58}],"title":"只看结果的执行者","tag":"Te × 黑暗三角","insight":"你判断一件事的标准极其干净：它有没有成。这套标准让你效率惊人，也让你在需要照顾情绪的时刻显得格外冷——不是你不懂，是你觉得那不是重点。","advice":"在每一次给出结论前，加一句'我知道这对你来说不容易'。不改变结论，只改变它被接收的方式。"},{"id":"CR_55","required_volumes":["vol10","vol16"],"conditions":[{"dim":"dd_order","op":">=","val":58},{"dim":"hsp_sensory","op":">=","val":58}],"title":"需要确定性的高敏者","tag":"秩序 × 神经边缘","insight":"你的秩序需求有一半来自神经系统：不可预测的环境对你是真实的生理消耗，而不只是心理不适。所以你提前规划，常常不是控制欲，是自我保护。","advice":"把'计划'与'必须'分开。保留一件完全不确定的小事在日程里，练一次不被变化整垮。"},{"id":"CR_56","required_volumes":["vol12","vol15"],"conditions":[{"dim":"enn_9","op":">=","val":58},{"dim":"tki_accommodating","op":">=","val":58}],"title":"用让步换取平静的人","tag":"九型 × 冲突","insight":"你退让的速度快到别人来不及察觉，连你自己也常以为'我本来就无所谓'。但那些没有说出口的立场不会消失，它们会变成一种长期的低烧式疲惫。","advice":"每周挑一件小事，明确说出'我更想这样'。从不需要辩论的小事开始练。"},{"id":"CR_57","required_volumes":["vol14","vol13"],"conditions":[{"dim":"money_avoid","op":">=","val":58},{"dim":"schema_defect","op":">=","val":55}],"title":"不敢谈钱的人","tag":"金钱脚本 × 图式","insight":"你不查账、不谈价、不问欠款，因为一旦把数字摆到桌面上，你就得面对'我是不是不值得这么多'的旧问题。回避钱，其实是在回避那个问题。","advice":"做一件极小的、与钱有关的正面动作：查一次账单、问一次报价。让数字回到数字。"},{"id":"CR_58","required_volumes":["vol16","vol1"],"conditions":[{"dim":"hss_intensity","op":">=","val":58},{"dim":"sin_gluttony","op":">=","val":55}],"title":"靠高强度确认自己还活着","tag":"刺激寻求 × 欲望","insight":"你需要强刺激才能感到'在线'：熬夜、极限运动、情绪浓烈的对话。安静对你不是休息，是失重。代价是身体长期在透支模式下运转。","advice":"给自己安排一次'低强度但有质感'的体验：一顿慢饭、一段长途步行。让身体重新认识平静。"},{"id":"CR_59","required_volumes":["vol11","vol12"],"conditions":[{"dim":"phil_existential","op":">=","val":58},{"dim":"enn_4","op":">=","val":58}],"title":"靠自我定义活着的人","tag":"哲学 × 九型","insight":"你不接受任何现成的人生剧本，也正因为如此，你必须不停地为自己造意义——这件事既是你最迷人的部分，也是最耗人的部分，因为它没有下班时间。","advice":"给自己留一块不需要被赋予意义的地方：一件纯粹消磨时间的事。允许自己无意义地待着。"},{"id":"CR_60","required_volumes":["vol10","vol11"],"conditions":[{"dim":"dd_order","op":">=","val":58},{"dim":"mft_sanctity","op":">=","val":58}],"title":"守着某种不可让渡的人","tag":"秩序 × 圣洁","insight":"你相信有些东西不该被交易、被讨论、被'务实处理'。这套底线让你在很多场合显得不合时宜，也让你在最难的时候仍然认得自己。","advice":"把这条底线明确写成一句话。写下来以后你会发现，真正需要它的时候并不多，但每次都很关键。"},{"id":"CR_61","required_volumes":["vol9","vol12"],"conditions":[{"dim":"jung_si","op":">=","val":58},{"dim":"enn_6","op":">=","val":58}],"title":"靠旧经验站稳的人","tag":"Si × 九型","insight":"你对'上次是怎么做的'有极强的记忆，并把它当作抵御不确定的锚。这让你很少犯同样的错，也让你在环境彻底换掉时适应得比别人慢。","advice":"每季度主动做一件'没有先例'的事。小到换一条通勤路线，大到换一种工作方式。"},{"id":"CR_62","required_volumes":["vol15","vol13"],"conditions":[{"dim":"tki_competing","op":">=","val":58},{"dim":"schema_mistrust","op":">=","val":55}],"title":"先假定要打，再决定要不要谈","tag":"冲突 × 图式","insight":"你在冲突开始前就已经进入备战状态：先想清楚对方的弱点，再决定要不要给台阶。这套反应来自一个旧结论——示弱会被利用。","advice":"在一次低风险的分歧里，先说出自己的真实需求，而不是先摆阵。看一次不设防会发生什么。"},{"id":"CR_63","required_volumes":["vol14","vol15"],"conditions":[{"dim":"money_worship","op":">=","val":58},{"dim":"pac_parent","op":">=","val":58}],"title":"用资源说话的人","tag":"金钱 × PAC","insight":"你习惯用'我能提供什么'来确立自己在关系里的位置，语气里常带着一种不自觉的居高。那不是傲慢，那是你唯一学会的、可靠的表达关心的方式。","advice":"试着用一次不花钱的方式表达在意：一句具体的关心，一次纯粹的陪伴。"},{"id":"CR_64","required_volumes":["vol13","vol16"],"conditions":[{"dim":"schema_negativity","op":">=","val":58},{"dim":"hsp_emotional","op":">=","val":58}],"title":"提前把最坏演一遍的人","tag":"图式 × 神经边缘","insight":"你的预演能力极强：任何一件事在你脑内都会先跑一遍最坏版本。这在真正出事时救过你，也让你在没事的时候照样紧绷。","advice":"给每一次预演加一个收尾动作：写下'如果真的发生，我第一步做什么'。有了第一步，脑子就肯停。"},{"id":"CR_65","required_volumes":["vol12","vol13","vol7"],"conditions":[{"dim":"enn_1","op":">=","val":58},{"dim":"schema_std","op":">=","val":58}],"title":"对自己最严的那位审查官","tag":"九型 × 图式","insight":"你对自己的标准高到连自己都很少达标。别人看到的自律，其实是一套随时在扣分的内部审查系统——它让你优秀，也让你几乎没有真正放松的时刻。","advice":"每天记录一件'做到 70 分就交出去'的事。练习一次不完美地完成。"}];

const PAIR_RULES = {"coreDims":["wv_nature","wv_causal","wv_social","val_moral","val_boundary","val_standard","light_humanism","light_kant","light_faith","dark_mach","lv_happiness","lv_anchor","jung_ni","jung_fi","phil_stoic","phil_existential","mft_care","mft_fairness","money_vigilance","time_future","dd_order","dd_good"],"complementDims":["big5_open","big5_order","big5_social","big5_assert","big5_industry","big5_compassion","cog_global","cog_diverge","cog_logic","cog_ambiguity","cog_independent","cog_speed","jung_ne","jung_te","jung_fe","hsp_sensory","hss_novelty","tki_collaborating","pac_adult","schema_std"],"resonance":[{"id":"RS_01","dims":["wv_nature","light_faith"],"op":"bothHigh","threshold":60,"title":"同一种世界观底色","text":"你们都默认人是善的，都愿意先给出信任。这段关系最舒服的地方是：谁都不必先证明自己，防御成本极低。"},{"id":"RS_02","dims":["val_moral"],"op":"bothHigh","threshold":60,"title":"共享同一套底线","text":"你们对「什么不能做」有一致的答案。这意味着你们即使吵架，也不会在价值观层面互相否定。"},{"id":"RS_03","dims":["lv_suffering"],"op":"bothHigh","threshold":58,"title":"都能从难里取出东西","text":"你们都不把痛苦浪漫化，但都相信它值得被转化。因此你们在低谷期不会互相拖入抱怨，而会一起想办法。"},{"id":"RS_04","dims":["att_anxiety"],"op":"bothLow","threshold":45,"title":"谁都不需要反复确认","text":"你们在关系里都不焦虑，不需要对方持续证明在乎。这让你们能各自忙很久，见面时依然自然。"},{"id":"RS_05","dims":["def_detach"],"op":"bothHigh","threshold":58,"title":"冷静的双人组","text":"你们都能在情绪上来时先抽离，因此几乎不会互相情绪绑架。代价是，问题可能被同时搁置，很久都没有人真的去处理。"},{"id":"RS_06","dims":["mot_autonomy"],"op":"bothHigh","threshold":62,"title":"两座互不吞并的岛","text":"你们都需要自己的空间，也都尊重对方的。这段关系不会因为黏得太紧而窒息，只需要注意别在自由里慢慢走散。"},{"id":"RS_07","dims":["big5_order"],"op":"bothHigh","threshold":62,"title":"同步的秩序感","text":"你们对生活的处理方式接近：有计划、有预期、讨厌临时变卦。日常摩擦极少，但一起遇到突发时会同时烦躁。"},{"id":"RS_08","dims":["cog_speed"],"op":"bothHigh","threshold":60,"title":"两个都先做再说的人","text":"你们的决策节奏一致，都更愿意先做起来再修。好处是不会互相拖，风险是没人在关键时刻踩刹车。"},{"id":"RS_09","dims":["mot_belonging"],"op":"bothHigh","threshold":62,"title":"把彼此放进内圈","text":"你们都需要深度关系，并且都愿意为此投入。这段关系对双方来说都是少数的、真正重要的那一种。"},{"id":"RS_10","dims":["jung_ni","jung_ti"],"op":"bothHigh","t /* ============================================================
   storage.js — 本地存档 / 断点续存 / HA3- 灵魂存档码编解码
   ============================================================ */

const LS_KEY = 'human-atlas::state::v4';
const LS_LEGACY_KEY = 'human-atlas::state::v3';
const LS_THEME = 'human-atlas::theme';
const LS_META = 'human-atlas::meta';
const SCHEMA_VERSION = '4.0';
const CODE_PREFIX = 'HA4-';
const LEGACY_PREFIX = 'HA3-';

/** 十六卷全集（编码顺序 = bit 位序，禁止重排） */
const ALL_VOLUMES = [
  'vol1', 'vol2', 'vol3', 'vol4', 'vol5', 'vol6', 'vol7', 'vol8',
  'vol9', 'vol10', 'vol11', 'vol12', 'vol13', 'vol14', 'vol15', 'vol16',
];

/** 第一辑 · 本源八卷 / 第二辑 · 破圈深水八卷 */
const CORE_VOLUMES = ALL_VOLUMES.slice(0, 8);
const EXPANSION_VOLUMES = ALL_VOLUMES.slice(8);

function emptyState() {
  return {
    version: SCHEMA_VERSION,
    nickname: '',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    completedVolumes: [],
    inProgress: {},
    answersByVolume: {},
    computedScores: {},
    maskIndex: null,
    topValues: [],
    initialSnapshot: {},
    flags: {},
    telemetry: {},
  };
}

function safeParse(raw, fallback) {
  try {
    const v = JSON.parse(raw);
    return v ?? fallback;
  } catch {
    return fallback;
  }
}

/* ------------------------------------------------------------
   基础读写
   ------------------------------------------------------------ */

function load() {
  if (typeof localStorage === 'undefined') return emptyState();
  // v4 起换 key，但会尝试读取 v3 的存档并迁移（老用户不该因为加了 8 卷就丢进度）
  let raw = localStorage.getItem(LS_KEY);
  if (!raw) {
    raw = localStorage.getItem(LS_LEGACY_KEY);
     if (raw) localStorage.setItem(LS_KEY, raw);
  }
  const parsed = raw ? safeParse(raw, null) : null;
  if (!parsed || typeof parsed !== 'object') return emptyState();

  const state = { ...emptyState(), ...parsed };
  state.version = SCHEMA_VERSION;

  // 结构纠偏：任何字段形态不合规即重置为安全默认值
  if (!Array.isArray(state.completedVolumes)) state.completedVolumes = [];
  if (!state.inProgress || typeof state.inProgress !== 'object') state.inProgress = {};
  if (!state.answersByVolume || typeof state.answersByVolume !== 'object') state.answersByVolume = {};
  if (!state.computedScores || typeof state.computedScores !== 'object') state.computedScores = {};
  if (!Array.isArray(state.topValues)) state.topValues = [];
  if (!state.telemetry || typeof state.telemetry !== 'object') state.telemetry = {};
  if (!state.flags || typeof state.flags !== 'object') state.flags = {};

  state.completedVolumes = state.completedVolumes.filter((v) => ALL_VOLUMES.includes(v));
  // 初印象快照：结构纠偏
  if (!state.initialSnapshot || typeof state.initialSnapshot !== 'object') state.initialSnapshot = {};
  return state;
}

/* ------------------------------------------------------------
   存档写入
   每次作答都会调用 save()。全量 JSON.stringify + localStorage.setItem
   在 152 题全部答完后约 2.1MB 的字符串处理，是长会话里主要的抖动源。
   这里做两件事：
     1. 串行化结果缓存 —— 内容没变就不重复 stringify
     2. 合并写入 —— 用 requestIdleCallback 把写盘推到空闲帧
   ------------------------------------------------------------ */

let saveTimer = 0;
let lastSerialized = '';

function serialize(state) {
  // answersByVolume / telemetry 是对象，键序由写入顺序决定，
  // 同一份 state 的两次 stringify 结果稳定，因此可以直接比字符串。
  return JSON.stringify(state);
}

function writeNow(state) {
  const payload = serialize(state);
  if (payload === lastSerialized) return;
  try {
    localStorage.setItem(LS_KEY, payload);
    lastSerialized = payload;
  } catch (err) {
    console.warn('[storage] 写入失败', err);
  }
}

function save(state, { immediate = false } = {}) {
  if (typeof localStorage === 'undefined') return state;
  state.updatedAt = Date.now();

  clearTimeout(saveTimer);

  if (immediate) {
    writeNow(state);
    return state;
  }

  // 空闲时再写：滚动、输入、过渡动画期间不阻塞主线程
  const idle = typeof requestIdleCallback === 'function'
    ? requestIdleCallback
    : (fn) => setTimeout(fn, 60);

  saveTimer = setTimeout(() => {
    idle(() => writeNow(state), { timeout: 400 });
  }, 160);

  return state;
}

function reset() {
  if (typeof localStorage === 'undefined') return emptyState();
  localStorage.removeItem(LS_KEY);
  localStorage.removeItem(LS_META);
  return emptyState();
}

function clearVolumeProgress(state, volId) {
  state.completedVolumes = state.completedVolumes.filter((v) => v !== volId);
  delete state.inProgress[volId];
  delete state.answersByVolume[volId];
  return state;
}

/* ------------------------------------------------------------
   主题 / 元信息
   ------------------------------------------------------------ */

function loadTheme() {
  if (typeof localStorage === 'undefined') return 'light';
  const t = localStorage.getItem(LS_THEME);
  if (t === 'light' || t === 'dark') return t;
  if (typeof window !== 'undefined' && window.matchMedia) {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  return 'light';
}

function saveTheme(theme) {
  if (typeof localStorage === 'undefined') return;
  localStorage.setItem(LS_THEME, theme);
}

function loadMeta() {
  if (typeof localStorage === 'undefined') return { archives: [] };
  return safeParse(localStorage.getItem(LS_META), { archives: [] });
}

function saveMeta(meta) {

  try {
    localStorage.setItem(LS_META, JSON.stringify(meta));
  } catch { /* ignore */ }
}

/* ------------------------------------------------------------
   Base64url helpers（兼容无 padding）
   ------------------------------------------------------------ */

const B64U = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

function bytesToB64url(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i += 3) {
    const b0 = bytes[i];
    const b1 = bytes[i + 1];
    const b2 = bytes[i + 2];
    out += B64U[b0 >> 2];
    out += B64U[((b0 & 3) << 4) | ((b1 ?? 0) >> 4)];
    if (b1 === undefined) break;
    out += B64U[((b1 & 15) << 2) | ((b2 ?? 0) >> 6)];
    if (b2 === undefined) break;
    out += B64U[b2 & 63];
  }
  return out;
}

function b64urlToBytes(str) {
  const clean = str.replace(/[^A-Za-z0-9\-_]/g, '');
  const bytes = [];
  let buf = 0;
  let bits = 0;
  for (const ch of clean) {
    const idx = B64U.indexOf(ch);
    if (idx < 0) continue;
    buf = (buf << 6) | idx;
    bits += 6;
    if (bits >= 8) {
      bits -= 8;
      bytes.push((buf >> bits) & 0xff);
    }
  }
  return new Uint8Array(bytes);
}

const enc = (str) => new TextEncoder().encode(str);
const dec = (bytes) => new TextDecoder().decode(bytes);

function checksum(bytes) {
  let h = 0x1f;
  for (let i = 0; i < bytes.length; i += 1) {
    h = (h * 31 + bytes[i]) & 0xff;
  }
  return h;
}

/* ------------------------------------------------------------
   HA4- 灵魂存档码（v4 · 十六卷 127 维）

   布局（字节）：
     0        : 版本号 4
     1,2      : 已完成卷位掩码（uint16 LE，bit0=vol1 … bit15=vol16）
     3        : 年月戳高字节 —— year - 2000
     4        : 年月戳低字节 —— month (1-12)
     5        : 面具厚度 M（0-100，255 = 未知）
     6,7,8    : Top3 价值索引（0-7，255 = 空）
     9..9+N-1 : N 个维度分数（0-100，255 = 未测，顺序 = dimensions.dims）
     其后      : 昵称 UTF-8（≤12 字符，中文占 3 字节）
     末尾      : 校验和 1 byte

   时间胶囊：3、4 字节存「年月」，跨年对照时能画「过去的我 vs. 现在的我」。

   HA3- 仍可解码（老用户/老分享码），按 60 维 + 1 字节卷掩码读取，
   因为注册表前 60 位就是本源八卷的维度，位序完全对齐。
   ------------------------------------------------------------ */

const VALUE_IDS = ['freedom', 'dignity', 'wealth', 'intimacy', 'security', 'breakthrough', 'fairness', 'ease'];

function stampBytes(state) {
  const t = Number.isFinite(state.createdAt) ? new Date(state.createdAt) : new Date();
  const y = Math.max(0, Math.min(255, t.getFullYear() - 2000));
  const m = Math.max(1, Math.min(12, t.getMonth() + 1));
  return [y, m];
}

function encodeSoulCode(state, dimOrder = []) {
  let doneMask = 0;
  ALL_VOLUMES.forEach((v, i) => {
    if ((state.completedVolumes || []).includes(v)) doneMask |= 1 << i;
  });

  const body = [4, doneMask & 0xff, (doneMask >> 8) & 0xff];

  const [yy, mm] = stampBytes(state);
  body.push(yy, mm);

  body.push(Number.isFinite(state.maskIndex) ? Math.round(state.maskIndex) : 255);

  const top3 = (state.topValues || []).slice(0, 3).map((v) => {
    const idx = VALUE_IDS.indexOf(v);
    return idx >= 0 ? idx : 255;
  });
  while (top3.length < 3) top3.push(255);
  body.push(...top3);

  const scores = dimOrder.map((id) => {
    const s = state.computedScores?.[id];
    if (!Number.isFinite(s)) return 255;
    return Math.max(0, Math.min(100, Math.round(s)));
  });
  body.push(...scores);

  const nameBytes = enc((state.nickname || '').slice(0, 12));
  body.push(...nameBytes);

  const bytes = new Uint8Array(body.length + 1);
  bytes.set(body, 0);
  bytes[body.length] = checksum(Uint8Array.from(body));

  return CODE_PREFIX + bytesToB64url(bytes);
}

function decodeHA3(payload, dimOrder) {
  const bytes = b64urlToBytes(payload);
  if (bytes.length < 67) return { ok: false, error: '存档码长度异常，可能被截断' };
  if (checksum(bytes.subarray(0, bytes.length - 1)) !== bytes[bytes.length - 1]) {
    return { ok: false, error: '校验失败，请检查是否完整复制' };
  }
  if (bytes[0] !== 3) return { ok: false, error: `不支持的存档版本 v${bytes[0]}` };

  const doneMask = bytes[1];
  const completedVolumes = ALL_VOLUMES.filter((_, i) => i < 8 && (doneMask & (1 << i)));

  const computedScores = {};
  for (let i = 0; i < 60; i += 1) {
    const b = bytes[6 + i];
    if (b !== 255 && dimOrder[i]) computedScores[dimOrder[i]] = b;
  }

  return {
    ok: true,
    legacy: true,
    state: {
      version: SCHEMA_VERSION,
      nickname: dec(bytes.subarray(66, bytes.length - 1)).replace(/\u0000/g, '').trim(),
      updatedAt: Date.now(),
      createdAt: Date.now(),
      completedVolumes,
      inProgress: {},
      answersByVolume: {},
      computedScores,
      maskIndex: bytes[2] === 255 ? null : bytes[2],
      topValues: [bytes[3], bytes[4], bytes[5]]
        .filter((i) => i !== 255 && i < VALUE_IDS.length)
        .map((i) => VALUE_IDS[i]),
      initialSnapshot: {},
      flags: {},
      telemetry: {},
    },
  };
}

function decodeSoulCode(code, dimOrder = []) {
  const raw = String(code || '').trim().replace(/\s+/g, '');
  const upper = raw.toUpperCase();

  if (upper.startsWith(LEGACY_PREFIX)) return decodeHA3(raw.slice(4), dimOrder);
  if (!upper.startsWith(CODE_PREFIX)) {
    return { ok: false, error: `存档码需以 ${CODE_PREFIX} 开头` };
  }

  const bytes = b64urlToBytes(raw.slice(4));
  const headerLen = 9;
  if (bytes.length < headerLen + 1) return { ok: false, error: '存档码长度异常，可能被截断' };

  if (checksum(bytes.subarray(0, bytes.length - 1)) !== bytes[bytes.length - 1]) {
    return { ok: false, error: '校验失败，请检查是否完整复制' };
  }
  if (bytes[0] !== 4) return { ok: false, error: `不支持的存档版本 v${bytes[0]}` };

  const dimCount = Math.max(0, Math.min(dimOrder.length, bytes.length - headerLen - 1));

  const doneMask = bytes[1] | (bytes[2] << 8);
  const completedVolumes = ALL_VOLUMES.filter((_, i) => doneMask & (1 << i));

  const year = 2000 + bytes[3];
  const month = Math.max(1, Math.min(12, bytes[4] || 1));
  const createdAt = new Date(year, month - 1, 15).getTime();

  const computedScores = {};
  for (let i = 0; i < dimCount; i += 1) {
    const b = bytes[headerLen + i];
    if (b !== 255 && dimOrder[i]) computedScores[dimOrder[i]] = b;
  }

  const tail = bytes.subarray(headerLen + dimCount, bytes.length - 1);

  return {
    ok: true,
    legacy: false,
    state: {
      version: SCHEMA_VERSION,
      nickname: dec(tail).replace(/\u0000/g, '').trim(),
      updatedAt: createdAt,
      createdAt,
      stamp: `${year}-${String(month).padStart(2, '0')}`,
      completedVolumes,
      inProgress: {},
      answersByVolume: {},
      computedScores,
      maskIndex: bytes[5] === 255 ? null : bytes[5],
      topValues: [bytes[6], bytes[7], bytes[8]]
        .filter((i) => i !== 255 && i < VALUE_IDS.length)
        .map((i) => VALUE_IDS[i]),
      initialSnapshot: {},
      flags: {},
      telemetry: {},
    },
  };
}

/* ------------------------------------------------------------
   全量 JSON 备份
   ------------------------------------------------------------ */

function exportJSON(state) {
  return JSON.stringify(
    {
      app: 'human-atlas',
      schema: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      state,
    },
    null,
    2,
  );
}

function importJSON(text) {
  const parsed = safeParse(text, null);
  if (!parsed) return { ok: false, error: 'JSON 解析失败' };
  const state = parsed.state ?? parsed;
  if (!state || typeof state !== 'object' || !state.version) {
    return { ok: false, error: '不是有效的图谱备份文件' };
  }
  const merged = { ...emptyState(), ...state, version: SCHEMA_VERSION };
  if (!Array.isArray(merged.completedVolumes)) merged.completedVolumes = [];
  if (!merged.answersByVolume || typeof merged.answersByVolume !== 'object') merged.answersByVolume = {};
  if (!merged.inProgress || typeof merged.inProgress !== 'object') merged.inProgress = {};
  return { ok: true, state: merged };
}

/* ------------------------------------------------------------
   统计辅助
   ------------------------------------------------------------ */

function completion(state) {
  return (state.completedVolumes?.length || 0) / ALL_VOLUMES.length;
}

function answeredCount(state, volumeId) {
  const ans = state.answersByVolume?.[volumeId];
  return ans ? Object.keys(ans).length : 0;
}

function hasProgress(state, volumeId) {
  const prog = state.inProgress?.[volumeId];
  if (prog && Number.isFinite(prog.currentIdx)) return true;
  return answeredCount(state, volumeId) > 0;
}

/* ------------------------------------------------------------
   初印象快照
   每卷首次完成时封存一份只读副本，重测后可以对照「本能态 / 修正态」。
   ------------------------------------------------------------ */

function hasInitialSnapshot(state, volumeId) {
  return Boolean(state.initialSnapshot?.[volumeId]?.scores);
}

function sealInitialSnapshot(state, volumeId, dimIds) {
  if (hasInitialSnapshot(state, volumeId)) return state.initialSnapshot[volumeId];
  const scores = {};
  for (const d of dimIds || []) {
    const v = state.computedScores?.[d];
    if (Number.isFinite(v)) scores[d] = v;
  }
  if (!Object.keys(scores).length) return null;
  state.initialSnapshot ||= {};
  state.initialSnapshot[volumeId] = {
    sealedAt: Date.now(),
    scores,
    maskIndex: Number.isFinite(state.maskIndex) ? state.maskIndex : null,
    topValues: [...(state.topValues || [])],
  };
  return state.initialSnapshot[volumeId];
}

function initialSnapshotOf(state, volumeId) {
  return state.initialSnapshot?.[volumeId] || null;
}

/** 清空某卷作答（保留初印象快照），用于「封存初印象并重测」 */
function retakeVolume(state, volumeId) {
  state.completedVolumes = (state.completedVolumes || []).filter((v) => v !== volumeId);
  if (state.inProgress) delete state.inProgress[volumeId];
  if (state.answersByVolume) delete state.answersByVolume[volumeId];
  return state;
}

function snapshotForArchive(state) {
  return {
    nickname: state.nickname,
    savedAt: Date.now(),
    completedVolumes: [...(state.completedVolumes || [])],
    answersByVolume: JSON.parse(JSON.stringify(state.answersByVolume || {})),
    computedScores: { ...(state.computedScores || {}) },
    maskIndex: state.maskIndex,
    topValues: [...(state.topValues || [])],
    flags: { ...(state.flags || {}) },
    telemetry: JSON.parse(JSON.stringify(state.telemetry || {})),
  };
}

/* ============================================================
   utils.js — 轻量 DOM / 数值 / 交互工具
   ============================================================ */

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'style' && typeof v === 'object') {
      for (const [prop, val] of Object.entries(v)) {
        // CSS 自定义属性必须用 setProperty，Object.assign 无法写入
        if (prop.startsWith('--')) node.style.setProperty(prop, String(val));
        else node.style[prop] = val;
      }
    }
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, String(v));
  }
  const list = Array.isArray(children) ? children : [children];
  for (const c of list) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number'
      ? document.createTextNode(String(c))
      : c);
  }
  return node;
}

function qs(sel, root = document) { return root.querySelector(sel); }
function qsa(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

const clamp = (v, lo = 0, hi = 100) => Math.min(hi, Math.max(lo, v));
const round = (v, d = 0) => {
  const p = 10 ** d;
  return Math.round((Number(v) || 0) * p) / p;
};
const lerp = (a, b, t) => a + (b - a) * t;

const sum = (arr) => arr.reduce((a, b) => a + b, 0);
const mean = (arr) => (arr.length ? sum(arr) / arr.length : 0);

function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

const uniq = (arr) => Array.from(new Set(arr));

function sortBy(arr, fn, dir = 1) {
  return [...arr].sort((a, b) => {
    const va = fn(a); const vb = fn(b);
    if (va === vb) return 0;
    return (va > vb ? 1 : -1) * dir;
  });
}

function debounce(fn, ms = 200) {
  let t = 0;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function go(hash) {
  if (location.hash === hash) {
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  } else {
    location.hash = hash;
  }
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  const parts = raw.split('/').filter(Boolean);
  return { parts, path: parts.join('/') };
}

function prefersReduced() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function uid(prefix = 'id') {
  return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
}

/* ---------- clipboard / download ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (_) {
    return false;
  }
}

function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function downloadText(filename, text, mime = 'text/plain;charset=utf-8') {
  downloadBlob(filename, new Blob([text], { type: mime }));
}

function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const mime = /:(.*?);/.exec(head)[1];
  const bin = atob(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(message, ms = 2400) {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;
  const node = el('div', { class: 'toast', text: message });
  stack.appendChild(node);
  clearTimeout(toastTimer);
  setTimeout(() => {
    node.classList.add('is-out');
    setTimeout(() => node.remove(), 340);
  }, ms);
}

/* ---------- date ---------- */
function formatDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function formatDateShort(ts) {

  const p = (n) => String(n).padStart(2, '0');

function svg(tag, attrs = {}) {
