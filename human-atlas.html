"gift_desc":"你真心欣赏别人的好，因此身边人不必在你面前缩小自己，这种安全感会带来极深的连接。","shadow_title":"过度体谅导致的自我隐形","shadow_desc":"习惯先看见别人的光，容易忽略自己的需求，久了会累积一种「没人在看我」的委屈。","alchemy_tip":"欣赏他人与主张自己并不冲突。练习在你夸完别人之后，加一句关于你自己的。"},"low":{"label":"标准优先的评价者","gift_title":"不被情感滤镜干扰的判断力","gift_desc":"你能就事论事地评估，不因喜欢而放宽标准，这在需要客观的场合极其珍贵。","shadow_title":"让人不敢靠近的冷感","shadow_desc":"习惯性指出不足，会让身边人逐渐减少分享，你也就失去了那些本可以很深的连接。","alchemy_tip":"在给出评价之前，先说一句具体的、真实的欣赏。同样的内容，接受度会完全不同。"}},"sin_gluttony":{"name":"放纵代偿","volume":"vol1","category":"sin","high":{"label":"用感官填补空洞的代偿者","gift_title":"对自己状态的敏锐体感","gift_desc":"你很早就能察觉「我需要被补偿了」，这份体感让你比多数人更懂得如何把自己捞回来。","shadow_title":"白天越顺从，夜里越失控","shadow_desc":"白天在关系与工作里压抑真实诉求，深夜就用熬夜、食物或消费抢回一点控制权。","alchemy_tip":"真正要修的不是夜里的手，是白天的嘴。白天多说出一次「我不太想」，夜里就会少一次报复。"},"low":{"label":"低代偿依赖的稳态者","gift_title":"不靠外物调节情绪的能力","gift_desc":"情绪低落时你有自己的恢复路径，不必依赖食物、购物或屏幕来把自己哄好。","shadow_title":"对身体信号的钝感","shadow_desc":"太能扛会让人忘记自己已经累了，直到身体用更激烈的方式让你停下来。","alchemy_tip":"把「我还能扛」换成「我现在的电量是多少」。定期问自己一次，比硬撑更可持续。"}},"virtue_temperance":{"name":"克制秩序","volume":"vol1","category":"virtue","high":{"label":"有闸门的高能量者","gift_title":"长期主义的稳定底盘","gift_desc":"你能把冲动转化为可持续的节奏，因此能在别人反复重启的地方走得更远。","shadow_title":"过度控制带来的僵硬","shadow_desc":"习惯性收紧会让你在需要即兴与放松的场合显得紧绷，也让身边人不易靠近。","alchemy_tip":"给自己留出不必高效的时间。真正的秩序包含休息，而不是把休息也排进任务表。"},"low":{"label":"弹性边界的随性者","gift_title":"对变化的天然适应力","gift_desc":"你不容易被计划绑住，遇到突发状况能迅速调整，这在动荡环境里是一种优势。","shadow_title":"慢性失控的累积成本","shadow_desc":"每一次「就这一次」都在悄悄降低底线，几年后会发现自己在很多事上已经无法自律。","alchemy_tip":"不要一次立十条规矩，只守住一条不可让的线。守住一条，其余的会慢慢跟上。"}},"sin_wrath":{"name":"愤怒烈度","volume":"vol1","category":"sin","high":{"label":"锋利边界的守卫者","gift_title":"掀翻不合理桌子的爆发力","gift_desc":"你对冒犯与不公绝不姑息，在需要有人站出来的时刻，你往往是那个真的开口的人。","shadow_title":"情绪劫持与事后懊悔","shadow_desc":"怒火上头时容易说出极具杀伤力的话，伤及无辜或误伤合作，代价常常远超当下那口气。","alchemy_tip":"把「说出来」推迟二十分钟，但不要取消它。怒火需要出口，只是不必在最高温的时候出口。"},"low":{"label":"高阈值的不动声色者","gift_title":"深海般的宽容与稳态","gift_desc":"极少被外界挑衅牵着走，总能用温和化解戾气，是混乱场合里让人安心的存在。","shadow_title":"隐性压抑与被动攻击","shadow_desc":"不敢表达正当怒火，委屈积压过久会演变成冷暴力、疏远或莫名的躯体不适。","alchemy_tip":"愤怒是边界被侵犯的信号，不是品格缺陷。练习在感到不舒服的当下就说一句「这样我不太舒服」。"}},"virtue_patience":{"name":"宽容稳态","volume":"vol1","category":"virtue","high":{"label":"能容纳复杂的长线者","gift_title":"极低的情绪摩擦成本","gift_desc":"你能把人和事分开看，因此不会因为一次冲突就断掉一段关系，这种容量会带来长期回报。","shadow_title":"该翻脸时的迟疑","shadow_desc":"过度宽容会让你在应该明确划线时继续退让，最终由对方来替你决定边界。","alchemy_tip":"宽容的前提是对方知道你在宽容。把「算了」换成「这次我理解，但下次不行」。"},"low":{"label":"不轻易原谅的记忆者","gift_title":"清楚的底线与自我保护","gift_desc":"你记得谁在什么时候做过什么，因此不容易在同一个地方被伤害两次。","shadow_title":"长期携带的旧账","shadow_desc":"未处理的旧账会占用大量心理内存，让你在新的关系里也带着防备。","alchemy_tip":"不必强迫自己原谅，但要区分「还没放下」和「还在等他付出代价」。前者可以慢慢来，后者要先停。"}},"sin_sloth":{"name":"逃避惯性","volume":"vol1","category":"sin","high":{"label":"高阻抗启动的省力派","gift_title":"反内卷直觉与捷径天赋","gift_desc":"痛恨无意义重复，天生擅长抓核心 20% 关键点，能用更少的动作拿到同样的结果。","shadow_title":"执行瘫痪与愧疚内耗","shadow_desc":"想得极美却迟迟不启动，陷入「拖延、自责、更逃避」的死循环，最后连想做的心情也被磨掉。","alchemy_tip":"把启动门槛降到荒谬的程度：只做两分钟。拖延怕的从来不是难度，而是开始。"},"low":{"label":"低阻力的行动者","gift_title":"恐怖的持续推进引擎","gift_desc":"耐得住枯燥，用高密度行动碾压焦虑，是团队里最可靠的那种人。","shadow_title":"战术勤奋掩盖战略迷茫","shadow_desc":"一旦停下来就充满罪恶感，容易陷入盲目瞎忙，用忙碌回避真正该做的选择。","alchemy_tip":"每季度留出一天完全不做事，只问一个问题：我现在忙的这件事，三年后还重要吗。"}},"virtue_diligence":{"name":"勤勉推进","volume":"vol1","category":"virtue","high":{"label":"能把事做完的可靠者","gift_title":"可信赖的交付信誉","gift_desc":"你答应的事会真的发生，这种确定性在长期协作里比任何才华都稀缺。","shadow_title":"用完成度换掉了可能性","shadow_desc":"过度执着于把事情做完，可能让你一直在做「该做的」，而不是「真正值得做的」。","alchemy_tip":"定期砍掉一件正在做但不重要的事。勤勉最大的浪费，是把力气用在对的方向之外。"},"low":{"label":"重选择轻执行的策略者","gift_title":"不被琐事吞掉的方向感","gift_desc":"你更愿意花时间判断值不值得，因此较少陷入低价值的苦劳，方向感往往不错。","shadow_title":"想得比做得多","shadow_desc":"判断做得很好，但落地经常掉链子，长期下来会让信任度打折。","alchemy_tip":"为每个决定配一个「最小可交付动作」，在 48 小时内必须完成。让判断长出腿。"}},"dd_order":{"name":"秩序倾向","volume":"vol10","category":"alignment","polar":true,"negLabel":"混沌","posLabel":"秩序","high":{"label":"把承诺当成承重墙的人","gift_title":"可以被依靠的稳定结构","gift_desc":"你在的地方，规则不只是纸上的字，而是别人能安心睡觉的东西。答应过的事会自动进入你的日程，一团乱麻到你手上会慢慢收成流程。这种可靠很稀缺，它让别人敢把重要的事交给你。","shadow_title":"把灵活读成失守","shadow_desc":"当规则和你真正在意的人撞在一起，你会先守规则，事后再发现代价落在了一个具体的人身上。你也容易把「没按流程」听成「不尊重你」，于是错过那些本来只需一句变通就能救回来的事。","alchemy_tip":"下次规则与人冲突时，先写一行字：这条规矩当初是为了保护谁。如果那个人此刻正被它伤到，就允许自己开一次例外，并把这个例外写进记录——秩序才不会变成石头。"},"low":{"label":"在规则缝隙里呼吸的人","gift_title":"对现场极其敏感的判断力","gift_desc":"你相信世界是靠人当下的判断撑住的，而不是靠条文。你反应快，能在别人还在找依据的时候先动起来，也极少被「一直都是这么办的」这类话唬住，很多僵局是被你这样的人推开的。","shadow_title":"每一次例外都在消耗信用","shadow_desc":"你心里清楚哪些规矩可以绕，但别人只看见结果不一致。临场改主意多了，别人会开始不敢跟你约远期的事；而你自己也会发现，那些「这次特殊」加起来，正是你生活里最乱的部分。","alchemy_tip":"挑出三件你绝对不临场改的事，写下来并提前告诉身边的人，其余的都留给自己灵活处理。有了这三根桩，你的自由才不会被人当成不靠谱。"}},"dd_good":{"name":"良善倾向","volume":"vol10","category":"alignment","polar":true,"negLabel":"自利","posLabel":"良善","high":{"label":"先看见具体那个人","gift_title":"让人愿意卸下防备的在场感","gift_desc":"你很难对眼前的具体痛苦保持抽象。别人跟你说话时会不自觉说多两句，因为你真的在听；你也不太需要理由才去帮人，那种「不忍」是你身上最原始的动力来源。","shadow_title":"被不忍慢慢耗尽","shadow_desc":"你的边界常被自己的善意先推倒。别人一句为难，你就把自己的计划往后挪；久了你会发现，被帮的人未必更亲近你，而你手里该留的那点力气，已经先给光了。","alchemy_tip":"帮忙前先报一个额度：这次能给出多少时间、多少钱、几次。说出口的额度比默默牺牲更能保护关系，也让你下次还能继续帮。"},"low":{"label":"先算清代价再伸手","gift_title":"不被情绪绑架的清醒","gift_desc":"你看得见人情的重量，也不会假装它不存在。别人用眼泪、用「就这一次」来借你的资源时，你能稳住不动，这种清醒让你很少被人当成提款机，也很少在事后恨自己心软。","shadow_title":"把关系都过成了账","shadow_desc":"长期按代价衡量之后，你会发现自己身边的关系都带上了刻度：谁值得、谁不值得。真正需要有人在场的时刻，你可能会先在脑子里算完一笔账才伸手，而那时门已经关了一半。","alchemy_tip":"每周做一件明确没有回报的小事，只记在私下的本子上不告诉对方。让「不必交换」这件事在你身上保留一点肌肉记忆。"}},"phil_stoic":{"name":"斯多葛底色","volume":"vol11","category":"philosophy","high":{"label":"把力气用在能改的那一半","gift_title":"在失控里保持体面的定力","gift_desc":"你能把事件和情绪拆开，先看清哪一部分真的归自己管。这让身边的人在混乱时愿意站到你旁边，你的判断也很少被一时的难受带偏，能撑很久。","shadow_title":"把「不在意」当成万能止血贴","shadow_desc":"过度克制会让你连该说的话也一起咽下去。别人看到的是冷静，你自己知道那是把感受提前判了无期，久了连高兴也会跟着一起变平，人还在，热度没了。","alchemy_tip":"下次难受时先说一句「我现在很不舒服」，再讲道理。给情绪三十秒发言权，克制才不会变成隔离。"},"low":{"label":"把感受放在第一位的人","gift_title":"不跟自己演戏的诚实","gift_desc":"你不会用道理压住真实的难受，该疼就疼，该高兴就高兴。这种诚实让你的关系有温度，也让你比别人更早知道自己真正的界限在哪里，不必靠猜。","shadow_title":"被第一波情绪带着走","shadow_desc":"事情刚发生时，你容易先被情绪推着反应。说出去的话、发出去的消息，往往要等到第二天才后悔，真正该处理的那部分反而被搁在后面，代价不小。","alchemy_tip":"给自己设一个二十四小时的延迟：不作决定、不发长消息，只记录。等情绪落下来再看，答案通常已经不一样。"}},"phil_existential":{"name":"存在主义","volume":"vol11","category":"philosophy","high":{"label":"自己给自己写剧本的人","gift_title":"把空白变成选择的能力","gift_desc":"你不指望世界先给出意义，遇到断掉的路会先问「那我现在想让它变成什么」。这种把主动权收回来的能力，让很多低谷反而成了你的转折点。","shadow_title":"把每件事都变成自我审判","shadow_desc":"所有结果都被你算成自己的选择，于是失败不只是失败，还变成「我不够」。这种全权负责有时会压得你不敢休息，也不敢承认有些事真的不由你决定。","alchemy_tip":"划一张纸：左边写「我选的」，右边写「不是我能定的」。每周填一次，你会松一口气，也不会失去主动权。"},"low":{"label":"顺着给定的路走的人","gift_title":"能在既有框架里活得踏实","gift_desc":"你不需要凡事重新发明意义，接住已有的角色与安排也能过得充实。这种稳定让你在变动的环境里成为别人的锚，事情交到你手上往往就能真正落地。","shadow_title":"很久没问过自己想要什么","shadow_desc":"习惯接受安排之后，你可能会在某个深夜突然答不上「我到底想怎么样」。不是没有欲望，是那份欲望太久没有被叫出来过，久到你已经不确定还在不在。","alchemy_tip":"挑一件完全没有理由、也不产出结果的小事，只因为你想做而做。一个月做三次，那点属于自己的手感会慢慢回来。"}},"phil_absurd":{"name":"荒诞主义","volume":"vol11","category":"philosophy","high":{"label":"笑着推石头的人","gift_title":"在无解里继续生活的幽默","gift_desc":"你看得清事情有多荒唐，却没有因此停下，还能在最难看的时候找到一点可笑的余地。这种幽默不是逃，是你把生活重新拿回手里的方式，也很难学。","shadow_title":"用玩笑绕开真正要处理的事","shadow_desc":"笑得太快，会让别人以为你没事，也会让你自己错过该处理的裂缝。有些事被反复讲成段子之后，就再也没有被认真谈过一次，连你自己都进不去了。","alchemy_tip":"把最近常拿来开玩笑的那件事写下来，问一句：除了好笑，我还在躲什么。找出一个具体动作，这周做掉。"},"low":{"label":"认真对待每件事的人","gift_title":"不靠反讽也能活下去的认真","gift_desc":"你不把生活当笑话，愿意正面接住每一件事的重量。这份认真让你做出来的东西有分量，也让身边的人敢把真正重要的部分交到你手上。","shadow_title":"把自己绷得太紧","shadow_desc":"什么都要有个说法、有个结果，会让一些本来可以放过的小事变成持续的消耗。你也需要允许世界荒谬一下，不必每一次都立刻去把它纠正过来。","alchemy_tip":"每周留一个「不计意义」的时段：散步、看一部烂片、做一件没用的事，不产出也不解释。"}},"phil_cynic":{"name":"犬儒底色","volume":"vol11","category":"philosophy","high":{"label":"先看穿，再决定要不要信","gift_title":"不被漂亮话带走的清醒","gift_desc":"你对动机有种近乎生理的敏感，能比别人早一步看见话术背后的算计。这让你少踩很多坑，也让你在关键时刻不被集体的热情裹着往前走。","shadow_title":"在事情发生之前就先不信","shadow_desc":"看穿得太快，会让你把还没展开的善意也一起挡在门外。久了你会发现，被你识破的人越来越多，愿意真的靠近你的人越来越少，而你并不想这样。","alchemy_tip":"把两件事分开：这一次他撒了谎，和他这个人永远不值得。每次下判断只针对这一件，不要顺手给人判终身。"},"low":{"label":"愿意先信一次的人","gift_title":"给关系留出开始的机会","gift_desc":"你倾向于先按善意理解别人，因此别人在你这里不必先证明自己。这种底色让很多本来会错过的关系真的开始了，也让你活得不那么费力、不那么冷。","shadow_title":"对隐性的算计反应偏慢","shadow_desc":"习惯把人往好处想，可能让你在被利用之后还在替对方找理由。你需要的不是变冷，而是留住那些让你反复不舒服的细节，让它们有机会说话。","alchemy_tip":"准备三行记录：时间、事情、我的感受。同样的不舒服出现三次，就不必再解释，直接调整距离。"}},"phil_pragmatic":{"name":"实用主义","volume":"vol11","category":"philosophy","high":{"label":"先看能不能用的人","gift_title":"把混乱整理成下一步的能力","gift_desc":"别人还在争论对错时，你已经在找最小可行的那个动作。这种务实让很多僵住的场面真的动起来，也让你在资源有限的时候依然拿得出结果，靠得住。","shadow_title":"把人也算进了成本表","shadow_desc":"凡事都问「这有什么用」，久了会连关系里那些没有产出的部分也一起省掉。你可能得到很多结果，却在某个夜里发现自己没什么想说的话，也没什么想见的人。","alchemy_tip":"每月做一件明确「没用」的事：陪人聊两小时不谈正事，或者修一件不打算再用的旧物。允许无效率，你才不会被效率反过来用。"},"low":{"label":"先问这件事对不对的人","gift_title":"守住那些不能拿来换的东西","gift_desc":"你不会因为有效就去做，也不会因为没用就不做。这种对原则的坚持让身边的人知道你的底线在哪里，也让你在利益面前不必事后解释自己为什么那样选。","shadow_title":"在需要变通的场合卡住","shadow_desc":"有时候坚持正确，会让你错过本可以两全的做法。很多问题没有干净的答案，只有更小的伤害，这时纯粹的对错会变成一种奢侈，也会让身边的人更累。","alchemy_tip":"遇到两难先问一句：这里最小的伤害是什么。把「正确」换成「更少人受伤」，你的原则反而能保住更多人。"}},"phil_epicurean":{"name":"伊壁鸠鲁","volume":"vol11","category":"philosophy","high":{"label":"会给自己日子的人","gift_title":"把普通一天过好的能力","gift_desc":"你知道怎么在一顿热饭、一段安静的下午里把电量补回来，不靠外部认可也能活得像样。这种自给自足的快乐，很多人到中年才勉强学会一点点。","shadow_title":"把舒服当成不出门的理由","shadow_desc":"太习惯待在舒适的一小块地方，会让一些本该去争、去试的事被一再推迟。舒服久了会变成一道很软的墙，你没觉得被困，但确实已经很久没往外走。","alchemy_tip":"每季度安排一次明确不舒服的事：一场陌生的场合、一次长途、一个你不擅长的挑战。让身体记住不适不会致命。"},"low":{"label":"停不下来的人","gift_title":"不靠安慰也能往前走的劲","gift_desc":"你不太需要额外的犒赏来支撑自己，目标本身就能推着你往前走。这种耐力让你在别人松懈的时候还在推进，也确实拿出了别人不容易拿出的东西。","shadow_title":"把休息也变成一项任务","shadow_desc":"连放松都要有理由，久了身体会用失眠、暴躁或者突然的空掉来提醒你。你可能已经很久没有真正什么都不做过了，也忘了那是什么感觉。","alchemy_tip":"每周固定一个「什么都不产出」的晚上，写进日程，像开会一样不可取消。休息要当成正事，你才会真的休息。"}},"phil_nihilism":{"name":"虚无底色","volume":"vol11","category":"philosophy","high":{"label":"看到底的人才敢轻装","gift_title":"不被虚假意义绑架的自由","gift_desc":"你很早就知道没有谁在终点等着给你打分，因此不太会被「应该」两个字吓住。这份底色让你活得比别人轻，也让你在旁人都慌的时候格外稳得住。","shadow_title":"提前撤掉了所有重量","shadow_desc":"「什么都无所谓」说久了，会连真正在意的东西也不敢承认。你用这句话提前挡住了失望，同时也挡住了那些本来能让你热起来、愿意早起的事。","alchemy_tip":"写下一件你其实很在乎、但从没承认过的事。不用为它找意义，只要承认它对你重要，就已经足够。"},"low":{"label":"需要意义才能呼吸的人","gift_title":"把在乎当成燃料的能力","gift_desc":"你需要一件事值得，才愿意把力气放进去。这种在乎让你的投入有分量，也让你在漫长而重复的日子里依然能找到继续下去的理由，不容易散掉。","shadow_title":"被意义绑架，一刻不敢停","shadow_desc":"一旦某件事显得没意义，你可能会整个人塌下去。这种结构让你很难经历空窗期，也容易在别人只是休息的时候，替自己判上一场不轻的刑。","alchemy_tip":"练习一件「没有意义但可以做」的事：浇水、擦桌子、走一段路。让手先动起来，意义可以晚一点到。"}},"phil_humanist":{"name":"人本浪漫","volume":"vol11","category":"philosophy","high":{"label":"还愿意为人留位置的人","gift_title":"能看见具体那个人的能力","gift_desc":"你不太会把人简化成标签或立场，遇到冲突时先想到对方也是个会疼的人。这种眼光让你成为很多人愿意讲真话的对象，你的判断也更少走偏。","shadow_title":"替别人的处境承担过头","shadow_desc":"太容易理解别人，会让你在明明该划界的时候继续退让。理解不等于接受，但你的身体常常来不及区分这两件事，最后累的是你，被怪的可能也是你。","alchemy_tip":"在理解对方之后加一句「但我不能接受这个」。共情之后仍然说出自己的位置，才是完整的善意。"},"low":{"label":"先看规则与结果的人","gift_title":"不被情绪裹住的判断力","gift_desc":"你能在别人都在讲感受的时候把标准摆出来，这让你处理事情干净、可预期。很多需要有人做恶人的场合，正因为你在，整件事才没有彻底烂掉。","shadow_title":"错过那些没说出口的部分","shadow_desc":"按规则办事很省力，但有些人真正想说的从来不在字面上。你可能站在完全正确的位置上，却让对方觉得从头到尾没有被看见，这比被反对更伤人。","alchemy_tip":"每次重要对话结束前多问一句「你还有别的想说的吗」。这一句常常比前面所有分析都有用。"}},"mft_care":{"name":"道德·关爱","volume":"vol11","category":"moralfound","high":{"label":"别人疼的时候你会先动","gift_title":"把别人的处境接进身体的能力","gift_desc":"你对痛苦的信号极其灵敏，别人还在犹豫要不要管的时候你已经站过去了。这不是软弱，是一种很硬的道德直觉，很多人正是靠它才熬过最难的那段。","shadow_title":"把所有人的重量都背在自己身上","shadow_desc":"管得太多，会让你在该退的场合继续承担，最后疲惫、怨气，以及那句说不出口的「那我呢」一起堆起来，反而把原本好好的关系伤到了。","alchemy_tip":"帮忙之前先问一句「你希望我做什么」。有时对方要的是被听见，不是被拯救，你的力气可以省下一半。"},"low":{"label":"先分清责任归属的人","gift_title":"不被情绪绑架的边界感","gift_desc":"你不会因为对方难受就立刻接手他的人生，这种清楚让你能长期待在一段关系里而不被耗空。你给的是一个位置，不是无限兜底，反而更持久。","shadow_title":"在该伸手的时刻慢了半拍","shadow_desc":"习惯先分清责任，可能让你在别人真正需要的时候显得冷淡。有些痛苦不管理由如何，都需要有一个人先过去，晚一步，门可能就关上了，而你不在场。","alchemy_tip":"给自己一条最小动作：看到有人明显撑不住时，先做一件小事，不必判断他是否值得，做完再谈责任。"}},"mft_fairness":{"name":"道德·公平","volume":"vol11","category":"moralfound","high":{"label":"对双标过敏的人","gift_title":"一视同仁的硬骨头","gift_desc":"同一件事对不同人用不同标准，会让你生理上不舒服。这种敏感让你在群体里成为那个把规则说清楚的人，也让别人知道在你这里走关系没有用。","shadow_title":"用公平的名义要求世界整齐","shadow_desc":"过分追求对等，可能让你忽略起点本来就不一样。有时候坚持「一人一份」，恰好是最不公的那一刀，还会让你以为自己站在了正确的一边。","alchemy_tip":"下次说「这不公平」之前，先问一句：他们的起点一样吗。公平有时是按需要分，不是按人头分。"},"low":{"label":"看情境决定标准的人","gift_title":"懂得为具体处境留余地","gift_desc":"你不迷信一套通用的尺子，愿意为眼前这个人破一次例。这种灵活让你在复杂的人情里游得动，也让你真的帮到过那些「按规矩不该帮」的人。","shadow_title":"标准随人而变，久了没人信你","shadow_desc":"每次都能找到理由通融，会让你的判断变得很难预期。别人不知道你的线在哪里，也就不会真的把重要的事交到你手上，哪怕你每次都出于好意。","alchemy_tip":"写下三条你不打算为任何人破的底线，其余都可以谈。有这一小块不动的，你的灵活才不会变成随意。"}},"mft_loyalty":{"name":"道德·忠诚","volume":"vol11","category":"moralfound","high":{"label":"认了就站到底的人","gift_title":"愿意为一段关系付代价","gift_desc":"你把人分得很清楚，自己人出事时不会先算划不划算。这种站队让身边的人有底气，也让你在这世上真的拥有几个可以托付的关系，不是通讯录。","shadow_title":"为了自己人把标准调低","shadow_desc":"护得太紧，会让你在该说真话的时候替他遮掩。久了你会发现，你护住的是这段关系的表面，输掉的是自己判断的准头，还有说真话的能力。","alchemy_tip":"给最亲近的人也说一次实话，哪怕会不舒服。真正的忠诚是让他不至于变成更糟的人，不是替他挡住所有后果。"},"low":{"label":"谁对就站谁的人","gift_title":"不被关系绑住的判断力","gift_desc":"你不会因为熟就改变结论，这种清楚让你在混乱的场合里可信。别人知道来问你会得到真话，而不是一句照顾面子的场面话，这本身就是稀缺资源。","shadow_title":"在最需要站队时缺席","shadow_desc":"每次都站在正确那一边，会让身边的人觉得你随时可以走。有些时刻人不需要判断，只需要知道你没有走，而你恰好在那时候讲了道理。","alchemy_tip":"在关系还没出事的时候，明确说一次「你出事我会在」。忠诚不必等到考验那天才表达。"}},"mft_authority":{"name":"道德·权威","volume":"vol11","category":"moralfound","high":{"label":"认秩序的人","gift_title":"让共同体转起来的那根梁","gift_desc":"你尊重位置、程序和前人留下的规矩，知道有些秩序不是用来限制人，而是让很多人能一起把事做成。这份可靠让你成为人群里被依赖的那一类。","shadow_title":"把「上面说了」当成理由","shadow_desc":"太习惯服从，会让你在规则明显不对的时候也继续执行。等到回头看，你会发现自己参与过一些当时根本没想清楚的事，而且没人替你担。","alchemy_tip":"遇到明显有问题的指令，先问一句「这条是为了解决什么」。不必对抗，但要保留一次属于自己的判断。"},"low":{"label":"不服就当场说的人","gift_title":"不给位置加光环的平等感","gift_desc":"你不太在意头衔，谁说得对就听谁的。这种平视让年轻人愿意在你面前开口，也让你不容易被一个身份唬住，能在关键处说出别人不敢说的那句。","shadow_title":"把一切规矩都当成压制","shadow_desc":"习惯性抵触权威，可能让你错过那些真正有用的经验。有些规矩背后，是别人付过很大代价才换来的答案，你的反抗可能刚好从它旁边绕过去，还浑然不觉。","alchemy_tip":"每次想反驳之前，先问一句「这条规矩解决过什么问题」。听懂之后再决定要不要反对，反抗会更有分量。"}},"mft_sanctity":{"name":"道德·圣洁","volume":"vol11","category":"moralfound","high":{"label":"有些东西不能拿来开玩笑","gift_title":"守得住底线的洁净感","gift_desc":"你心里有一小块不能碰的地方，它让你在什么都可被解构的年代仍然保有一点敬畏。这种坚持让你这个人有分量，也让一些界线在你这里真的守住了。","shadow_title":"用纯洁的名义把人分等级","shadow_desc":"太在意干净与不洁，容易让你对犯过错的人失去耐心。有些界线是为了保护人，有些只是为了让自已显得更高一点，这两件事很难自己分辨。","alchemy_tip":"下次觉得某人「脏」的时候，先问一句：他做了什么，还是他只是和我不同。把判断落在行为上，不落在人身上。"},"low":{"label":"什么都可谈的人","gift_title":"不设禁区的开放度","gift_desc":"你不容易被冒犯，也不太需要一块神圣的地方来安放自己。这种开放让你在陌生环境里适应得快，也让别人在你面前不必小心措辞，能松下来说话。","shadow_title":"没有一条线是不能退的","shadow_desc":"什么都不算越界，久了会发现自己也不知道在守什么。真正被踩到的那一刻，你可能连反应都慢了半拍，要过几天才慢慢明白哪里不对，那时已经晚了。","alchemy_tip":"写下三件「就算别人不理解，我也不会让步」的事。不必多，但要有，那是你在这个世界上站住的地方。"}},"mft_liberty":{"name":"道德·自由","volume":"vol11","category":"moralfound","high":{"label":"不许别人替我决定的人","gift_title":"把主权看得比方便重要","gift_desc":"你受不了被安排、被代表、被以「为你好」的名义推着走。这种反抗让很多不合理的事在你这里真的卡住了，也让你活得比多数人更接近自己。","shadow_title":"把任何约束都读成控制","shadow_desc":"反抗成了默认反应，会让你在该合作的时候也先竖一道墙。有些限制只是暂时的代价，不是永久的主权丧失，但你已经在门口先拒绝了。","alchemy_tip":"遇到约束先分两类：这条限制保护了谁。答得出来的先配合一次再谈改进，答不出来的再反对。"},"low":{"label":"能在框架里相处的人","gift_title":"不靠对抗也能守住自己","gift_desc":"你知道什么时候该让一步，也知道让步不等于失去自己。这种弹性让你在集体里过得下去，同时不必把每件小事都升级成一场关于主权的战争。","shadow_title":"一步步退到自己都不认识的地方","shadow_desc":"每次都想着「这次算了」，久了会发现真正决定你生活的人其实是别人。主权不是不争，是在还来得及的时候争那一次，而你总是等到来不及。","alchemy_tip":"挑一件你一直在忍的小事，这周明确说一次不同意见。不用赢，只要让「我的意思」重新出现在桌上。"}},"enn_1":{"name":"1号·完美者","volume":"vol12","category":"enneagram","high":{"label":"先把错处找在自己身上","gift_title":"替所有人守住最后一道工序","gift_desc":"你能在所有人都说可以了的时候，还看得见那处没对齐的地方。事情交到你手上很少出岔子，因为你替大家守住了最后一道工序，也替他们记住了那个容易被省掉的步骤。","shadow_title":"那把尺子最后总是先量自己","shadow_desc":"一句话发出去，你会把它拆成五种读法，然后在心里替对方也替自己各生一遍气。标准变成了不许出错，出错就等同于不配，于是你很少真的休息过。","alchemy_tip":"下次发完一段重要的话，把手机反扣在桌上，设一个二十分钟的计时器。响之前不修改、不补第二条，让它就那么待着。"},"low":{"label":"不靠反复核对也能做对","gift_title":"让事情先跑起来的松手能力","gift_desc":"你不必把每个细节磨到发亮才敢交出去，事情能先跑起来，错了再修。这让你比别人更早拿到真实反馈，也让你身边的人不必在你面前反复解释自己为什么没做到最好。","shadow_title":"标准松了，别人替你补","shadow_desc":"差不多就行这句话说得太顺，代价往往落在别处：一份要返工的文件，一个被你答应又忘掉的期限。别人不好意思提，你自己也不容易发现，直到某天有人不再把事情交给你。","alchemy_tip":"挑一件本周要交出去的东西，交付前问自己一句：这上面有没有一处，是我明知不对但懒得改的。有，就现在改掉那一处。"}},"enn_2":{"name":"2号·给予者","volume":"vol12","category":"enneagram","high":{"label":"先看见别人缺什么的人","gift_title":"在别人开口之前就递到","gift_desc":"你能从一句含糊的话里听出对方真正缺什么，不等他说完就已经在做。被照顾的人往往说不清为什么在你身边会松下来，只是知道你记得他的忌口、他的期限、他上次没说完的半句话。","shadow_title":"给出去的东西后面拖着账","shadow_desc":"你很少直接要，但你一直在记：谁在你最难的时候出现过，谁没有。账不平的时候你不说，只慢慢收回温度，对方只觉得你突然冷了，说不出是从哪一句开始冷的。","alchemy_tip":"想替别人做事之前，先在心里问一句：如果这个人永远不会知道是我做的，我还做吗。答案是否，就把这件事放下。"},"low":{"label":"不靠被需要来确认存在","gift_title":"不把帮忙变成交换","gift_desc":"你帮人的时候不预留回报，也不等对方回头记你一份好。这让你身边的人轻松，他们接受你的好意时不必先算一遍以后怎么还，关系因此干净，也经得起长时间不来往。","shadow_title":"把自己的需要藏得太深","shadow_desc":"你很少开口要什么，别人因此默认你什么都能自己扛。久了你会发现，那些围着你的人都在讲自己的事，没有一个人知道你这半年过得怎么样，而这部分是亲手关上的。","alchemy_tip":"这周找一个人，说一句能被执行的话：我这周很累，你能不能帮我做一件小事。说到具体那件事为止，不要只说最近有点难。"}},"enn_3":{"name":"3号·成就者","volume":"vol12","category":"enneagram","high":{"label":"把想法做成看得见的成果","gift_title":"让努力被看见的能力","gift_desc":"你不满足于把事情做完，你要它站起来、能被别人一眼看懂。提案、作品、一场汇报，你会替它挑最准的那个说法。很多人做的事并不比你少，差的就是这一步。","shadow_title":"一停下来就不知道我是谁","shadow_desc":"你的价值感挂在那份成绩上，成绩在就稳，成绩一撤就空。忙的时候感觉不到这个空，只有假期的第三天下午，或者被换掉的那个下午，它才整个露出来。","alchemy_tip":"每周留两小时做一件没有产出、也不能发出去的事，比如散步、煮一锅汤。做完不总结、不发出去，只记一句当时身体的感觉。"},"low":{"label":"不靠成绩单定位自己的人","gift_title":"做事不必被看见也成立","gift_desc":"你能在没有掌声的地方把事情做好，做完就放下，不需要谁盖章。这让你在没人注意的岗位上待得住，也让你更容易说实话，因为你不必为了保住形象而绕弯。","shadow_title":"好东西烂在自己手里","shadow_desc":"你不太愿意把自己推出去，觉得做过就够了，让别人去说。结果是同一件事，别人拿到了机会，你只留下过程。不是不会做，是不习惯在关键的那一刻替自己说一句。","alchemy_tip":"下次做完一件事，主动给能决定它的人发一条消息：我做完了，这是结果，以及我认为值得看的三点。不要等被发现。"}},"enn_4":{"name":"4号·独特者","volume":"vol12","category":"enneagram","high":{"label":"总在确认自己和别人不一样","gift_title":"能碰到别人绕开的那一层","gift_desc":"你对气氛里最细的那点变化有接近生理的反应，也愿意往别人绕开的地方看。因此你能说出一个房间里没人敢说的那句话，也能在别人只看到表面时，看见他真正在痛什么。","shadow_title":"把不一样当成了身份证","shadow_desc":"为了确认自己不是泛泛之一，你有时会拒绝那些真能让你好起来的东西：一份稳定的工作，一个不戏剧化的人。平淡被读成平庸，于是你反复回到熟悉的疼里，好证明自己是深的。","alchemy_tip":"发现自己因为某件事太平淡而不想开始时，先做十五分钟再评价。把评价往后放，让身体先接触到那件事本身。"},"low":{"label":"不靠独特来认领自己","gift_title":"把自己当普通人也能过","gift_desc":"你不必靠与众不同来确认自己存在，能安安稳稳做一个普通的人、做普通的事。这让你少了许多自我消耗，也更容易和别人站在一起，而不是站在旁边看他们。","shadow_title":"忽略了自己真正想要什么","shadow_desc":"你很少停下来问自己喜不喜欢，久了会发现对很多事都只有一个中性答案，说不上好也说不上坏。别人问起，你能说出应该想要的那个，说不出真正想要的那个。","alchemy_tip":"睡前写三行：今天哪一刻身体是松的，哪一刻是紧的，紧的那次旁边站着谁。只记录，不解释，第二天不用回看。"}},"enn_5":{"name":"5号·观察者","volume":"vol12","category":"enneagram","high":{"label":"先退到能看清的位置","gift_title":"在信息不足时保持清醒","gift_desc":"你习惯先把事情看清楚再表态，所以很少被气氛推着走。别人急着站队的时候，你还在核对前提。这种慢，让你在混乱里给出的判断往往比谁都快地站得住。","shadow_title":"看得清，却一直没进场","shadow_desc":"退后本来是为了看清楚，久了却变成不用被要求。电话让它响完，聚会找理由不去，等你想回到人群里，发现入口已经被自己收窄了，而你也说不清是从哪一次开始。","alchemy_tip":"那个四十分钟的电话，这周挑一次接起来，先不挂断，听到第二十分钟。如果实在撑不住，就说一句我二十分钟后要出门，把边界说出来而不是消失。"},"low":{"label":"随时可以被找到的人","gift_title":"不怕被打断的在场能力","gift_desc":"你能在被打断、被临时叫走、被别人的情绪占掉一个晚上之后，依然接得上自己。这种弹性让你在关系里显得靠得住，别人找你的时候不必先算你会不会嫌麻烦。","shadow_title":"把独处当成了浪费","shadow_desc":"你的时间总是留给别人，安静下来反而不知道做什么。久了会发现自己的判断越来越依赖别人的反应，因为那些本可以一个人想清楚的事，你一直没有给自己那个下午。","alchemy_tip":"这周在日程里先占掉两小时，写上一个具体的事（读一本、走一段路），在被别人占走之前先标成已定。"}},"enn_6":{"name":"6号·忠诚者","volume":"vol12","category":"enneagram","high":{"label":"先想最坏那一种可能","gift_title":"提前看见漏洞的本能","gift_desc":"你总比大家早一步想到会出什么事，所以很多麻烦根本没发生。团队里那个被嫌想太多的人往往是你，而被你拦下来的那次事故，没人知道它本来会发生。","shadow_title":"预案做完了，人还没开始过","shadow_desc":"你把大量力气花在预演失败上，真的走到那一步时反而没了力气。更常见的是，一件事还没开始，你已经因为设想中的反对而先放低了声音，最后真的没成。","alchemy_tip":"想完最坏情况后，加一步：写下它发生的具体概率和一个已经能做的准备。写完就停，不在同一个问题上想第二遍。"},"low":{"label":"先走一步再说的人","gift_title":"不靠保证也能往前","gift_desc":"你不需要先确定有人接着才敢跳，能带着不确定往前走。这让你比多数人更早开始，也少了很多在等待中消耗掉的年份，事情在你手里常常是先做起来再变清楚的。","shadow_title":"风险来的时候没有预警","shadow_desc":"你不太会提前想坏事，于是当它真的来了，你容易整个人被按在原地，第一反应是这不可能。不是承受力差，是从来没为它留过一个位置。","alchemy_tip":"重要的事动手之前，花五分钟写一句：如果三个月后它砸了，最可能是因为什么。只写这一句，然后开始。"}},"enn_7":{"name":"7号·活跃者","volume":"vol12","category":"enneagram","high":{"label":"总在给下一步留路口","gift_title":"把沉闷重新点亮的能力","gift_desc":"你能在一个已经僵住的场合里找到新的入口，让别人重新有兴趣说话。这种对可能性的敏感，让你在别人只看到一条路的时候，手里总是同时握着三四条。","shadow_title":"用新鲜感绕开还没消化的事","shadow_desc":"遇到不好受的部分，你的第一反应是换一个地方、换一批人、换一个计划。事情看上去都过去了，只有你自己知道，某个夜里它会从另一个入口回来。","alchemy_tip":"下次想马上换计划的时候，先把那件不舒服的事写在纸上，定一个具体时间处理它，再决定要不要换。"},"low":{"label":"守着一件事做很久的人","gift_title":"在一件事上待得住","gift_desc":"你不必靠不断换新的刺激才活得下去，能在一段关系、一份工作里待上很多年。时间因此在你这边积累，别人看到的是运气，其实是你没走。","shadow_title":"该走的时候还坐在原地","shadow_desc":"当一件事已经不再给你任何东西，你容易因为怕折腾而继续待着。日子不算坏，只是每年都差不多，而你把这叫做稳定，不再问自己还想要什么。","alchemy_tip":"给现在最熟悉的那件事设一个复查日期，写在日历上。到那天只回答一个问题：如果今天重新选，我还选它吗。"}},"enn_8":{"name":"8号·挑战者","volume":"vol12","category":"enneagram","high":{"label":"不等人来定规矩的人","gift_title":"在没人出头时站出去","gift_desc":"一个房间陷入沉默时，你通常是最先开口的那个。你不需要先获得允许才行动，也不怕把话说得直接。因此那些被默认掉的不公平，在你手上常常真的会改。","shadow_title":"把身体先顶在了前面","shadow_desc":"很多事你已经反应完了才想该不该反应。对方那句话可能只是累，你的音量已经上去了；事后你知道自己过了，但当时那一瞬间，退让看起来比冲上去危险得多。","alchemy_tip":"下次被撞、被冒犯的那三秒里，先做一个具体动作：把重心放回双脚，呼吸一次，再决定要不要开口。只给自己三秒，不要不给。"},"low":{"label":"不去打不必打的仗","gift_title":"把冲突成本算得很低","gift_desc":"你不会为了一个位置去挣得面红耳赤，能在一群人抢的时候先退到一边。这让你少了许多无谓的硬碰硬，也让你在需要合作的时候，比那些时刻要赢的人更容易被人靠近。","shadow_title":"该争的时候手是软的","shadow_desc":"有些东西不让就会被拿走：一个本来属于你的位置、一份应得的价钱。你心里明白，但开口那一刻总差一口气，最后看着它被别人理所当然地收走。","alchemy_tip":"把最常忍让的那件事写下来，包括具体金额或具体分工，然后发一句确认：这件事我需要按这个来。不解释理由。"}},"enn_9":{"name":"9号·调停者","volume":"vol12","category":"enneagram","high":{"label":"先让场面不要太难看的人","gift_title":"让两边都能下台的能力","gift_desc":"你有种罕见的本事：能让两个已经快吵起来的人重新坐下来。你知道什么时候不说话，什么时候递一句台阶，一个房间里因为你少了很多真的碎掉的东西。","shadow_title":"把自己的意见也埋了","shadow_desc":"说不清从哪一年开始，你都行变成了默认答案。等着等着，那个最想说话的人一直不是你，到最后你也不太确定自己到底想去哪里、想和谁去。","alchemy_tip":"下次四人站在路口时，你先说一句具体的：我想吃那家。不必说服任何人，只把你的那一个选项放到桌上。"},"low":{"label":"不怕把话讲明的人","gift_title":"不让事情无辜地拖着","gift_desc":"你不需要用沉默去维持表面的和平，能直接把分歧说出来。这让你身边的人不用猜你在想什么，也让你手上的事情很少因为没人拍板而烂在原地。","shadow_title":"赢了道理，凉了气氛","shadow_desc":"你只关心事情对不对，容易忽略在场的人已经不舒服了。有些关系不是因为分歧断的，而是在你把一件小事抬到很高的时候，对方默默不说话了。","alchemy_tip":"说不同意见前，先加一句具体的承认：你说的这一点我听到了，然后再说你的。只多这一句，不删后面的内容。"}},"inst_sp":{"name":"自保本能","volume":"vol12","category":"instinct","high":{"label":"先确认退路在不在","gift_title":"把生活的地基钉得牢固","gift_desc":"你对钱、身体、住处这些底层条件有一种近乎本能的心里有数，知道每个月多少钱能站住，也记得自己上一次体检是什么时候。台风来的那天，你家有蜡烛、有水、有现金。","shadow_title":"把安全存成了不敢花","shadow_desc":"存款够两年了，你还在一笔一笔对着账看，好像任何一个数字的缺口都意味着坠落。钱和体力变成了只能存不能用的东西，而身体的紧绷并不因为你存得多就松下来。","alchemy_tip":"设一个具体数字：当存款超过这个数时，当月必须花一笔在只能让身体舒服的事上，例如按摩、一双好鞋。把它们写在同一张纸上。"},"low":{"label":"注意力不在退路上","gift_title":"不被匮乏锁死的行动力","gift_desc":"你不会先把所有退路堵好了才敢往前走，能为了一个机会把钱、把安稳先放一边。这让你敢做那些必须冒一点险才能做成的事，也让你不被一个数字绑住二十年。","shadow_title":"身体先报警，账才发现","shadow_desc":"体检报告上的箭头、信用卡账单、房东发来的消息，常常都是最后才被你看到。不是不在乎，是这些事在你视野里本来就不占位置，直到它们大到无法不看。","alchemy_tip":"在手机日历里固定两个日期：每月发薪后第二天看一次账单，每半年一次体检。只做这两件事，不要求自己变成会算账的人。"}},"inst_sx":{"name":"一对一冲动","volume":"vol12","category":"instinct","high":{"label":"一个晚上只装得下一个人","gift_title":"把一个人看到底的能力","gift_desc":"你能把全部注意力放在一个人身上，听他说话时手机反扣、眼睛不漂。被这样对待的人会记得很久，因为大多数人一辈子很少被真正地看进去一次，而你可以。","shadow_title":"浓到对方接不住","shadow_desc":"你给出的浓度常常超过对方准备好的位置，于是同一段关系里，你已经开始想下周，他还在考虑要不要回消息。你不是太粘，只是把全部筹码放到了一张桌子上。","alchemy_tip":"下次想说下次什么时候见之前，先问一句你现在方便安排吗。把节奏交给对方一次，然后真的等他的回答。"},"low":{"label":"注意力是铺开的","gift_title":"不被一个人掏空的稳定","gift_desc":"你的注意力不会被某一个人全部占走，能在几段关系、几件事之间保持均衡。这让你不会因为一个人的冷淡就整个人塌下去，也让你在别人烧得最旺的时候依然是那个稳的。","shadow_title":"很少有人真的进来过","shadow_desc":"你很少让自己真的掉进一个人里面，所以很多关系停在很舒服、但也很浅的地方。不是不真诚，是那个可以一次聊到凌晨两点的位置，你一直没留给谁。","alchemy_tip":"这周约一个你在意的人单独吃一次饭，不看手机，不问工作，只聊你们各自最近真正在想的那件事。"}},"inst_so":{"name":"社交本能","volume":"vol12","category":"instinct","high":{"label":"进门先看自己在哪个位置","gift_title":"让一群人愿意聚到你身边","gift_desc":"你能记住谁和谁熟、谁上次没被叫、谁这阵子在忙什么，然后把人放到合适的位置上。很多后来成了事的关系，最早都是因为你在中间递了一句话。","shadow_title":"被漏掉一次就记很久","shadow_desc":"那个没被叫上的聚会，会在你心里待上很久。你不会直接问，只在群里发一个笑脸，然后真的不再主动开口。被漏掉的不是一顿饭，是那个位置。","alchemy_tip":"下次发现自己被漏掉，直接问一句：你们上周聚了？怎么没叫我。问完就去做别的事，不要看他的回复时间。"},"low":{"label":"不靠位置确认存在","gift_title":"不被圈子裹着的自由","gift_desc":"你不需要在一个圈子里有位置才能安心，被叫上就去，没被叫上也不往心里放。这让你少了许多看人脸色的力气，也让你在需要说真话时不至于先掂量会不会被排挤。","shadow_title":"圈子里的人已经走远了","shadow_desc":"你不在意那些细微的邀请和回访，久了很多本来能走得深的人就慢慢淡了。不是谁的错，只是关系需要有人反复推一下，而你几乎没有推过那一下。","alchemy_tip":"每月挑一个人，发一条与事情无关的消息，只问一句最近怎么样，不提任何需求，发完就把手机放下。"}},"schema_abandonment":{"name":"被抛弃图式","volume":"vol13","category":"schema","high":{"label":"总在等第二只靴子落下的人","gift_title":"对关系里每一次偏移的敏锐","gift_desc":"你能在对方语气差半度的时候就听出变化，因此很少错过真正需要回应的时刻。这种敏锐让你总是最先伸手的那一个，也让你在一段关系里格外用力，几乎从不让自己松懈下来。","shadow_title":"用反复确认把对方推到门外","shadow_desc":"一点点延迟就被你读成撤离的前兆，于是你查、你问、你先一步难过起来。对方要应付的其实不是你的需要，而是那份随时可能到来的恐慌，时间久了谁都会累，也谁都不敢走得太近。","alchemy_tip":"下次心里升起「他要走了」时，先做一件具体的事：把「你是不是不想理我」换成「今晚能不能给我打个电话」。要一个可执行的动作，不要一个保证。"},"low":{"label":"不靠确认也能待在关系里的人","gift_title":"给关系留出呼吸的余量","gift_desc":"对方晚回消息、临时改计划，你不会立刻把它翻译成抛弃。这份从容让关系留出了呼吸的余量，也让对方不必时时自证忠诚，亲密反而因此更能持续下去。","shadow_title":"错过别人正在发出的求救","shadow_desc":"你的稳定有时会让对方的失落无处安放：他已经在往后退，你却以为一切如常。等到你终于察觉的时候，两个人之间已经隔了很远，中间那段路谁都没有走过。","alchemy_tip":"每周主动问一次「最近有没有什么事你没跟我说」。不必追问，只要把那扇门打开着，让对方知道说了也不会被嫌麻烦。"}},"schema_deprivation":{"name":"情感剥夺图式","volume":"vol13","category":"schema","high":{"label":"习惯自己消化的人","gift_title":"极强的自我照料与不添麻烦","gift_desc":"你很早就学会一个人把难处处理完，不给任何人添负担。这种自足让你在混乱里格外稳，也让你成为别人可以放心依靠的那一个，只是很少有人问过你自己靠什么撑着。","shadow_title":"把「没人会来」当成事实","shadow_desc":"你不是没有需要，而是提前把需要收了起来。久了连你自己都分不清是「真的不需要」还是「不敢开口要」，关系里于是总差着那一口该说却没有说出来的话。","alchemy_tip":"挑一个具体的人，练一句话：「我现在不太好，你能不能听我说十分钟。」说之前不要先替对方拒绝你，也不要补一句「不方便就算了」。"},"low":{"label":"会开口要的人","gift_title":"让关心有地方落下","gift_desc":"你相信自己的需要值得被回应，所以别人帮得上忙。这份直白让关系里有来有往，而不是一个人在最难的那几天里独自硬扛，扛完了还要装作什么都没发生。","shadow_title":"把被照顾当成默认配置","shadow_desc":"习惯被接住之后，容易忽略对方也有耗尽的时候。你需要的那双手偶尔也需要有人扶一把，只是他不会自己说，而你常常要等到事情过去之后才想起来问。","alchemy_tip":"每次被照顾之后，问一句「你今天还好吗」。让流动是双向的，关系才不会在不知不觉里被压向一边。"}},"schema_defect":{"name":"缺陷羞耻图式","volume":"vol13","category":"schema","high":{"label":"总觉得自己有一处见不得光","gift_title":"极高的自我要求与体面感","gift_desc":"你对自己的挑剔，让你极少失态，呈现出来的部分总是干净、可靠、经得起细看。这种自律在专业场合里本身就是一种说服力，别人愿意把重要的事交到你手上。","shadow_title":"把被看见等同于被审判","shadow_desc":"你藏起来的东西其实不是缺点，而是「我本来就不够好」这个早已写好的结论。于是夸奖进不来，亲近也进不来，谁靠得近一点，你的第一反应是先紧张起来。","alchemy_tip":"找一件你一直遮着的小事，对一个安全的人说出口，说完什么都不解释。你会发现天没有塌，对方看你的眼神也没有变。"},"low":{"label":"允许自己有瑕疵的人","gift_title":"不靠完美换取位置","gift_desc":"你能在别人面前承认不会、承认自己搞砸了，因此关系里少了一层表演。别人靠近你时不必先通过一道审核，也不必担心哪句话说错就被你记很久。","shadow_title":"对分寸的钝感","shadow_desc":"不太在意外界眼光是一种自由，偶尔也会让你错过那些本该郑重一点的场合。这不是错，只是需要有人提醒你把音量调回来，而那个人往往不好意思开口。","alchemy_tip":"重要场合之前问自己一句：「这里有没有一件事，值得我多花十分钟认真对待。」只挑一件，做完就好。"}},"schema_mistrust":{"name":"不信任图式","volume":"vol13","category":"schema","high":{"label":"先留退路的人","gift_title":"极强的风险嗅觉与自保能力","gift_desc":"你不太会被漂亮话带走，总能比别人早半步看见裂缝。很多坑是你提前绕开的，只是绕开这件事从来不出现在任何人的账面上，也没有人会为此谢你一句。","shadow_title":"把每份好意都过一遍秤","shadow_desc":"你在保护自己的同时，也把真心挡在了门外。对方递过来的东西，你先想的是「他到底要什么」，这样问过几次之后，就没有人愿意再递第二次了。","alchemy_tip":"选一个已经通过时间检验的人，做一次小额度的托付：借一次钱，或者交出去一件私事，然后什么都不查、不旁敲侧击地打听。"},"low":{"label":"愿意先给出信任的人","gift_title":"让人放松的敞亮","gift_desc":"你不预设别人有企图，因此别人在你面前也不必设防。很多关系之所以能变深，只因为先迈出那一步的人是你，而且迈得自然，没有一点试探的痕迹。","shadow_title":"在需要设防时慢半拍","shadow_desc":"善意解读是你的底色，也是你最大的漏洞。有些人正是顺着这份底色进来的，等你看清的时候，成本已经付了出去，退也退不回来，只能自己慢慢消化。","alchemy_tip":"不必变冷，只加一条：把让你反复不舒服的三件事写下来。同一件事出现三次以上，就不是误会，是模式。"}},"schema_isolation":{"name":"社交疏离图式","volume":"vol13","category":"schema","high":{"label":"在人群里独自站着的人","gift_title":"不依附群体的独立判断","gift_desc":"你不需要被圈子认证也能确认自己是谁，因此不太会为了合群去说违心的话。这种清醒在人人都怕掉队的场合里相当稀缺，也让你成为少数几个说真话的人。","shadow_title":"把「不属于」提前变成事实","shadow_desc":"你常常还没被拒绝就先退出了，于是每一次都是你先离席。孤独有一半是别人给的，另一半是你自己先关上的那扇门，而这两半在深夜里长得一模一样。","alchemy_tip":"这一周由你发起一次见面，时间地点你定。不用等被邀请——「被邀请」这件事，本来就轮不到你决定。"},"low":{"label":"能自然嵌进人群的人","gift_title":"把陌生变熟的社交天赋","gift_desc":"你在任何一张桌上都能找到话说，别人也愿意把手上的事托给你。这种连接力让你的人生里很少出现真正的空场，也很少需要一个人熬过什么难关。","shadow_title":"把热闹当成归属","shadow_desc":"被需要的感觉有时会盖过「这真的是我想要的关系吗」这个问题。热闹并不等于被看见，散场之后那种空落，常常被你自己用下一场约填过去。","alchemy_tip":"每月留一个只和自己过的晚上，不社交。用它校准一件事：我留下这些关系，是因为想要，还是因为怕空。"}},"schema_std":{"name":"严苛标准图式","volume":"vol13","category":"schema","high":{"label":"永远差一点的人","gift_title":"极高的完成度与专业骨气","gift_desc":"你对自己下手比对谁都狠，因此交付出去的东西经得起翻检。很多别人做不到的水准，是你不肯放过自己换来的；代价则是那些交不出去的夜晚，和几次本该高兴却高兴不起来的时刻。","shadow_title":"用「还不够」取消了所有庆祝","shadow_desc":"标准本该指向事情，久了却指向你这个人。成绩出来那天你只看见缺口，于是日子成了一场永远到不了终点、也发不出奖的考试，考卷还是你自己出的。","alchemy_tip":"每完成一件事，先写下三条「这次做到了的」，再去改。顺序一旦反过来，你才会记得自己究竟走过哪些地方。"},"low":{"label":"对自己宽容的人","gift_title":"不被标准绑架的自由","gift_desc":"你能接受「够用就好」，因此不容易被无止境的自我要求吞掉。该享受的时候你是真的在享受，而不是一边吃一边在心里算今天到底有没有辜负。","shadow_title":"标准调低之后没人再替你抬","shadow_desc":"没人催的地方，你也就顺势放下了。一些本来可以走得更远的事停在「还行」那一格，几年之后再想起来会有一点可惜，但也说不上后悔。","alchemy_tip":"挑一件你真正在意的事，给它设一条比「够用」高一点点、但明确写下来的线。只高一点点，高太多你会直接放弃。"}},"schema_sacrifice":{"name":"自我牺牲图式","volume":"vol13","category":"schema","high":{"label":"先照顾别人的人","gift_title":"极强的照料能力与被信赖感","gift_desc":"你能提前想到别人的需要，把场面照顾得妥帖。很多人正是因为你在，才没有在某个时刻塌下去，这份功劳却常常记不到你头上，你也不习惯开口去要，好像一提就成了计较。","shadow_title":"用付出换取留下的资格","shadow_desc":"你把「有用」当成被爱的前提，于是很难说出「我不想」。久了别人只记得你能扛，没有人问过你累不累，你偶尔说出来，语气也像在撒娇，于是没人当真。","alchemy_tip":"这一周做一次不解释的拒绝：「这次我不参加。」不补理由，不补一句抱歉，也不在事后偷偷观察对方的脸色。"},"low":{"label":"先照顾好自己的人","gift_title":"清楚自己边界的稳","gift_desc":"你知道自己的余量在哪里，因此不会用透支去换关系。这种清楚让亲密能够长久，而不是靠一个人不断消耗自己维持下去，最后两个人都觉得委屈。","shadow_title":"在别人最需要时显得冷","shadow_desc":"你守住了自己，也可能错过了对方开口的那一刻。不是不爱，只是回应来得太晚，晚到他已经决定把话收回去，不再指望你会先问那一句。","alchemy_tip":"在说「我也没办法」之前，多问一句「你现在最需要我做什么」。一句话，代价很小，却能改写整件事的走向。"}},"schema_approval":{"name":"寻求认可图式","volume":"vol13","category":"schema","high":{"label":"靠别人的眼睛确认自己的人","gift_title":"极高的场合感与被喜欢的本事","gift_desc":"你读得懂气氛，知道什么时候该说什么，因此几乎在任何场合都不会让人不适。这种分寸感是天生的社交资本，也最容易被低估，因为它是看不见的。","shadow_title":"把评价权交到所有人手里","shadow_desc":"一句无心的比较就能改写你一整天。你努力的方向常常不是「我想要」，而是「别让人失望」，久了自己都听不见自己的声音，只剩下别人的表情。","alchemy_tip":"每次发出一条消息、交出一件东西之前，问自己一句：「如果没有人夸我，我还做不做？」答案会告诉你，你站在谁的位置上。"},"low":{"label":"不太需要掌声的人","gift_title":"稳定的内在坐标","gift_desc":"你做的事不必被看见才算数，因此不太会因为别人一句话就改道。这种稳定让人放心，也让人不敢在你面前随口许诺，因为他们知道你会当真。","shadow_title":"错过该争取的注视","shadow_desc":"不主动也不表现，有些机会就落到了更会开口的人手里。不是你不够好，只是没有人知道你做成了什么，也没有机会知道，最后连你自己都记不清了。","alchemy_tip":"一年里至少两次，把做成的事明确讲给能给你机会的人听。不是炫耀，是让事实被知道——沉默不会替你转达。"}},"schema_entitlement":{"name":"权利夸大图式","volume":"vol13","category":"schema","high":{"label":"对自己那一份格外敏感的人","gift_title":"极强的边界感与不吃亏的清醒","gift_desc":"你清楚什么该是自己的，因此不容易被人糊弄。在规则常被人情稀释的场合，你往往是那个把尺子重新摆回桌上的人，只是这份较真不太讨人喜欢。","shadow_title":"把「我应得」修成了默认条款","shadow_desc":"规则顺你时你引用规则，不顺时你引用交情。你可能真的没占过便宜，但身边的人开始学着防你，一些原本一定会叫上你的事，后来也就不叫了。","alchemy_tip":"下次觉得「这本来就该给我」时，先把同一把尺子用在别人身上量一次。量得出一致，那才叫原则；量不出，那就是偏好。"},"low":{"label":"容易让出自己那份的人","gift_title":"极低的摩擦与体面的退让","gift_desc":"你不爱争，很多小事你都愿意让一步。这种不计较让关系顺畅，也让你在人群里显得松弛，谁都愿意跟你坐在同一桌，不必担心哪句话惹到你。","shadow_title":"把自己该得的也让掉了","shadow_desc":"你退得太自然，别人就默认你不需要。长期下来，你会在某个深夜忽然把那笔账算清，然后一个人难受很久，却已经找不出一个合适的机会把话说完。","alchemy_tip":"找一件具体的小事把话说完：「这次按人头分，我那份请算清楚。」不必生气，也不必长篇解释，说完就过去。"}},"schema_negativity":{"name":"灾难预期图式","volume":"vol13","category":"schema","high":{"label":"先想到最坏那种的人","gift_title":"极强的风险预演与兜底能力","gift_desc":"你会在事情发生之前把最坏的情况走一遍，因此很少被打个措手不及。很多灾难是被你提前想出来的那套方案挡在门外的，没有人知道它曾经差点进来。","shadow_title":"把预演当成已经发生","shadow_desc":"大脑分不清推演和现实，你在还没出事的时候就已经付过一次代价。长期下来身体先替你记账：睡不好只是最早的一条，后面还有别的，只是你已经习惯了，不再当成问题。","alchemy_tip":"担忧升起时写两行：最坏是什么，我现在能做的最小一步是什么。写完只做那一步，剩下的今晚不许再想。"},"low":{"label":"先假设没事的人","gift_title":"不被想象消耗的当下","gift_desc":"你不会提前替未来受苦，因此当下的力气都还留在手上。这种松弛让身边的人也跟着放松，很多难事在你这里没有那么吓人，也真的就过去了。","shadow_title":"对真实的风险反应偏慢","shadow_desc":"有些信号本来值得多看一眼，你却习惯把它归到「应该没事」。耽误的那几天有时候就是全部的差别，事后回想很难不后悔，也很难说清是哪一步慢的。","alchemy_tip":"给重要的事设一个「最晚检查日」，写进日历并设提醒。不焦虑，但也不靠运气，让该看的那一眼准时发生。"}},"money_avoid":{"name":"金钱回避","volume":"vol14","category":"money","high":{"label":"让账单在门外过夜的人","gift_title":"不被数字追着跑的松弛","gift_desc":"你不把每一笔钱都换算成安全感，也不会睁眼就去查余额。这份松弛让你在所有人被账单追着跑的时候还睡得着，也让你更愿意把钱花在人和经历上，而不是攒成一个不敢碰的数字。","shadow_title":"把不知道当成没事","shadow_desc":"「不看就不算发生过」曾经真的管用，可越堆越厚的账单不会因为没人打开就变小。等到必须面对的那天，你要处理的不只是数字，还有被推迟的整整一年，和那句「我怎么又拖到现在」。","alchemy_tip":"发薪日当晚设一个十五分钟的闹钟，只做一件事：把本月三笔最大的支出抄在同一张纸上。不做预算、不设目标，写完就把纸收起来。"},"low":{"label":"当天就把数字看清的人","gift_title":"把不确定变成可处理","gift_desc":"账单来了你会当场打开，数字难看也先看清楚。这种对现实的正面接触，让你很少被复利式的麻烦追上，也让你在别人慌成一团的时候，手里已经有一张写好的清单。","shadow_title":"把生活过成一张未闭合的表","shadow_desc":"每一笔都要对上、每一件都要归档，久了你会发现自己很难真正花掉一笔钱。原本用来减少焦虑的习惯，慢慢变成了必须时刻在线的值班，连休个假都要先把账算一遍才敢出门。","alchemy_tip":"这个月挑一笔两百块以内的支出，故意不记账、不核对，月底只看总额。用一次可控的不核对，验证「不查也没有出事」。"}},"money_worship":{"name":"金钱崇拜","volume":"vol14","category":"money","high":{"label":"认钱是硬通货的人","gift_title":"对真实规则的不装","gift_desc":"你不太信漂亮话，知道很多事最后都要落到资源上。这份清醒让你少走许多靠情怀硬撑的弯路，也让你在别人还在等一个说法的时候，已经开始攒能换回选择权的东西。","shadow_title":"把值得换算成价格","shadow_desc":"当钱成了唯一的尺，你会不自觉地把人也放上去称：这场聚会值不值、这段关系有没有回报。算得越准，越难遇到那种说不出好处、却让人愿意留下来的时刻。","alchemy_tip":"这周做一件明确没有回报的事：帮一个不会给你带来资源的人一次，事后一句也不提。做完在日历上打一个点，看看你难受了多久才过去。"},"low":{"label":"钱够用就回头过日子","gift_title":"把注意力还给生活本身","gift_desc":"你不会把每一分力气都换成账户里的数字，更愿意把时间放在没法折现的地方。这让你身上有一种不紧的味道，也让身边的人不必时时掂量自己值多少才配坐在这张桌上。","shadow_title":"用「算了」代替算账","shadow_desc":"不在意钱听起来洒脱，但它也可能是一种回避：不查、不比、不问，于是该谈的薪水没谈、该收的钱没收。等到真需要用钱的那天，你才发现自己在这些事上一直没在场。","alchemy_tip":"下次有人问期望薪资或报价，先别说「都行」，给出一个具体数字，然后闭嘴十秒，让沉默留在对方那边。"}},"money_status":{"name":"金钱地位","volume":"vol14","category":"money","high":{"label":"心里有一杆秤的人","gift_title":"对等与体面的分寸感","gift_desc":"你记得谁请过什么，也懂得用相当的分量还回去。这种分寸让关系里的往来不失衡，别人跟你相处不必担心占了便宜或吃了亏，人情因此能长久地转下去。","shadow_title":"吃一顿饭也要把账平掉","shadow_desc":"被请一次就欠下一笔，于是你急着回请、急着抹平，连别人的好意都变成了一件待办。收不下那份不求对等的心意，日子久了，身边的人会觉得自己给不了你什么。","alchemy_tip":"下次被人请客，只说一句「谢谢，这顿我记着」，其余什么都不做。把回请推到一个月以后，让那笔没结清的账在身上多待一会儿。"},"low":{"label":"不看价签看人","gift_title":"能把好意原样收下","gift_desc":"别人请你，你能安心道谢；礼物贵贱也不太影响你对一个人的判断。这种不设秤的相处，让靠近你的人不必先掂量自己的分量，关系因此轻得多，也真得多。","shadow_title":"把场面上该有的分寸丢了","shadow_desc":"不在意排场是好事，但完全不看场合，容易在需要表示重视的时刻显得随意：该到场的没到、该回的话没回。你不是不重视，只是从没让对方看出来你在重视。","alchemy_tip":"挑一件对方真正在意的小事（不是价格），下次见面带上：他提过的那本书、他家里人的近况，问得具体一点。"}},"money_vigilance":{"name":"金钱警觉","volume":"vol14","category":"money","high":{"label":"找零不对会当场数的人","gift_title":"很难被占便宜的清醒","gift_desc":"数目对不对，你几乎本能地知道。这份警觉让你躲过许多小额、累积起来却不小的损失，也让你在合作里成为那个会去核对条款的人，账目上少有说不清的地方。","shadow_title":"把每个人都当成潜在错账","shadow_desc":"警觉一旦过了头，交易就变成了提防：多找的二十要还、少给的一块要问，连朋友的客气都想验一遍。省下的是钱，耗掉的是那种不必设防的相处，和几句本来能说出口的闲话。","alchemy_tip":"给自己定一条线：单笔五十元以下的差错，不追问、不纠正、不记账。把这条额度写在钱包的便签上，超过了才开口。"},"low":{"label":"多找了也懒得回头","gift_title":"对交易不设防的从容","gift_desc":"你不会在每一笔买卖里假设对方要占你便宜，因此很少被小钱牵动情绪。这份从容让你在人群里显得大方好相处，也让你省下了大量本该花在别处的注意力。","shadow_title":"合同签完才想起没看条款","shadow_desc":"不当回事的性子，在小事上是美德，在金额大的地方就是漏洞：分期的手续费、自动续费、朋友之间的口头借款。等发现的时候，往往已经过了还能改的那一步。","alchemy_tip":"把手机里所有自动续费列一遍，只留还在用的三个，其余当场取消；再加一条：超过月收入一成的支出，隔一晚再签字。"}},"time_past_neg":{"name":"消极过去时间观","volume":"vol14","category":"time","high":{"label":"把旧事翻了很多遍","gift_title":"不会重复同一个坑","gift_desc":"你记得那些难堪的细节，也记得自己当时错在哪一步。这份记忆让你比同龄人更早学会避开某些人和某些局面；代价之外，它确实替你挡过很多次，只是当年没人教你怎么放下。","shadow_title":"用旧伤口解释今天","shadow_desc":"过去的事在你这里不会自然褪色，于是今天一句普通的话，也可能被听成当年的语气。你不是敏感，只是那套反应还留在岗位上，把新的关系当成了旧的现场来处理。","alchemy_tip":"挑一件反复回想的事，写成三行：当时发生了什么、当时的我能做什么、现在的我能做什么。第三行必须落到本周能做完的一件具体事上。"},"low":{"label":"不把旧账带进今天","gift_title":"让过去真的过去","gift_desc":"你能把不愉快留在它发生的年份，不用它来解释眼前的人。这种能力让关系有重新开始的机会，也让你不必每隔几年就回去和同一件事再打一遍，打完还要重新收拾自己。","shadow_title":"同一个地方摔第二次","shadow_desc":"不回头看，有时是真的放下了，有时只是懒得看。于是同样的模式换个面孔又来一次：相似的合伙人、相似的争执，而你依然觉得这一次不一样，直到它再一次走到同一个结局。","alchemy_tip":"把最近三次让你后悔的决定摆在一起，只找共同点：发生的时间、对方的样子、你当时的状态。找出一条规律，就只改那一件事。"}},"time_past_pos":{"name":"积极过去时间观","volume":"vol14","category":"time","high":{"label":"记得从前温度的人","gift_title":"把关系和根脉留住","gift_desc":"你对旧人旧地有真实的牵挂，会记得谁在你最难的时候出现过。这份念旧让你身上有连续性，也让那些和你走散多年的人，仍愿意在需要的时候回头找你一次。","shadow_title":"把从前住成了现在的家","shadow_desc":"回忆太暖，今天的普通日子就容易显得寡淡。你会在比较里悄悄给现在扣分：那时候的朋友更真、那时候的自己更敢。久了，眼前的一切都在和一个已经不存在的版本竞争。","alchemy_tip":"翻出一段你反复回看的旧时光，把它接到今天：约那位老友吃一顿现在的饭，不谈当年，只谈各自眼下在忙什么。"},"low":{"label":"不回头看的人","gift_title":"轻装往前走的自由","gift_desc":"你不太翻旧照片，也不靠回忆取暖，注意力基本都在眼前。这让你不容易被过去绑住，换城市、换行业、换一段关系，都比别人快一些，也少了许多临行前的拉扯。","shadow_title":"把来路一起丢了","shadow_desc":"不念旧的好处是轻，代价是薄：老朋友的电话越来越像打扰，家里的旧事一问三不知。等你真的想回头找点什么，会发现能证明你从哪里来的东西已经所剩无几。","alchemy_tip":"这个月给一个两年没联系、你却真心感激过的人发条消息，只说一件具体的小事：他当年哪句话、哪个动作帮到了你。"}},"time_present_hed":{"name":"享乐当下时间观","volume":"vol14","category":"time","high":{"label":"今晚还没散的人","gift_title":"把日子过成当下的能力","gift_desc":"你能真的坐在一顿饭里，不去想明天的会。这种在场的本事，让你比别人更常尝到生活的好，也让你成为那个能把一桌人的疲惫重新调暖的人。","shadow_title":"用开心盖住没处理的事","shadow_desc":"享受本身没有问题，问题在于它有时被用来顶替难做的事：该拒的局照去，该算的账明天再说。开心的次数越来越密，需要的剂量也跟着变大，安静下来的那半小时反而最难熬。","alchemy_tip":"下次想说「今晚先不管了」之前，先花十分钟把最不想碰的那件事做出一个开头，再出门。玩的时候不把它带在身上。"},"low":{"label":"先想后果再举杯","gift_title":"不被即时快乐牵走","gift_desc":"你能把快乐往后排，先把该做的事处理掉。这份自制让你在别人还在为周末兴奋时已经推进了正事，也让你的生活有一种稳稳的、不容易塌下来的节奏。","shadow_title":"把享受留到以后再说","shadow_desc":"你总在等一个更合适的时机：忙完这阵、存够那笔、等孩子大一点。可合适的时机很少自己走到门口，等你回头看，那些本该庆祝的日子一个都没有留下来，连照片都没拍。","alchemy_tip":"在日历上锁死一个具体时段（比如下周三晚），写上一个纯粹为了享受的安排，先付钱或先约人，让它不能被工作顶掉。"}},"time_present_fate":{"name":"宿命当下时间观","volume":"vol14","category":"time","high":{"label":"认命但日子照过","gift_title":"对不可控事物的平静","gift_desc":"你知道有些事不由自己，因此不会在摇号、行情、别人的选择上耗尽力气。这份认，让你比别人少了很多无用的较劲，也让你在真正的坏消息面前撑得更稳、睡得更沉。","shadow_title":"还没试就先说了看明白","shadow_desc":"把「不由我」用得太早，会变成一种提前投降：还没问就断定对方不会答应，还没改就说这行没机会。省下的是失望，交出去的却是本来还能动的那一格。","alchemy_tip":"挑一件你已经判定「没办法」的事，做一次低成本试探：发一封邮件、问一个人、递一份申请。把它当实验，结果不写进自我评价。"},"low":{"label":"不信命只信下一步","gift_title":"把结果从别人手里拿回来","gift_desc":"你默认事情可以靠动作改变，所以卡住时会先找可控的那一格。这份不信让你比别人多试了几次，也多拿到几次本来轮不到你的机会，代价是很少有机会真正松手。","shadow_title":"把每件不顺都记在自己账上","shadow_desc":"既然一切都能改，那没改好就只能是自己的问题。你很少允许自己说「这件事本来就难」，于是失败不只带来损失，还带来一场对自己的长时间审问，问到最后只剩疲惫。","alchemy_tip":"一件没成的事，写下两栏：我能改的三件事、我改不了的三件事。第二栏写满三条才准收笔，写的过程中不许出现「还不够努力」。"}},"time_future":{"name":"未来导向时间观","volume":"vol14","category":"time","high":{"label":"总在准备下一件事","gift_title":"提前把路铺好的能力","gift_desc":"你习惯提前想三步，存钱、练身体、学新东西都从很远的地方开始算。这份长线让你在别人被突发状况打乱时手里仍有缓冲，也让你确实走到了当初说要去的地方。","shadow_title":"永远活在「等这阵过去」","shadow_desc":"目标一个接一个，每个完成都只是下一段的入场券。你很少停下来验收自己已经走了多远，于是日子变成一条走廊，尽头那扇门总在你快走到时又往前挪了一米。","alchemy_tip":"每完成一个阶段目标，强制安排一件与下一个目标无关的事：休两天、吃一顿贵的、告诉一个人。让「到达」有一次具体的样子。"},"low":{"label":"先过好这一周","gift_title":"不被计划绑住的适应力","gift_desc":"你不太做五年规划，遇到变化却能很快调整方向。这份灵活让你在环境突然改规则时比别人少受折磨，也让你更早看见那些原本不在计划里、却真能走通的出路。","shadow_title":"钱和时间都没有留出余地","shadow_desc":"只顾眼前不全是洒脱，也可能是没给未来的自己留位置：没有应急的钱，也没有能换赛道的技能。等事情真的压过来，你能选的选项会比想象中少很多，而且每一个都很贵。","alchemy_tip":"开一个只进不出的账户，设成发薪日自动转出固定一笔（一百也行），此后不看余额，每月只确认一次转出成功。"}},"tki_competing":{"name":"竞争型","volume":"vol15","category":"conflict","high":{"label":"先把立场摆到桌上","gift_title":"敢在僵局里先开口","gift_desc":"你能在所有人绕圈子的时候把话说到明处：我要这个，不要那个。僵局因此有了一个可以推的着力点，也省下了别人反复猜你意思的那几个小时。","shadow_title":"把人说停了，事还悬着","shadow_desc":"争到最后对方不说话了，你以为事情解决了，其实他只是把账收进心里。久了你会发现，赢下来的每一场都还站着，愿意当面反对你的人却越来越少。","alchemy_tip":"把立场说完之后加一句：「我想听你反对的部分，你最不同意哪一点。」然后在他说话时不要打断，让他把话说完再开口。"},"low":{"label":"不抢那口气的余地","gift_title":"不争也能让场子稳住","gift_desc":"你不必每件事都赢，也不必让每句话都落在自己这边。别人在你面前不用先掂量会不会被顶回来，那些本来不敢说的小意见，反而愿意在你这里先说出来。","shadow_title":"你的那份从没上过桌","shadow_desc":"你把它让过去了，可没有一次是真的不在意。你的要求从没被摆到桌面，别人按他们的方案安排你，然后你怪他们不懂你。那份没说出口的版本，一直只有你自己看过。","alchemy_tip":"这周挑一件你本来会点头的事，回一句：「这个我不行，我要先按我的来。」只说这一件，不解释理由，也不用先道歉。"}},"tki_collaborating":{"name":"协作型","volume":"vol15","category":"conflict","high":{"label":"先摸出两边卡在哪","gift_title":"听得见要求背后的东西","gift_desc":"你不满足于听对方要求什么，你想知道他要的东西后面还压着什么。别人被你的问题问得慢下来，第一次把自己真正的顾虑说全，然后你们找到的那个办法，通常比双方原来提的都好。","shadow_title":"每件小事都开成会谈","shadow_desc":"不是每件事都值得开一场深谈。对方只想快点了结，你却要摸清来龙去脉，于是一个十分钟能散的分歧，被你留成了三小时的会。有人说你难缠，其实你只是舍不得放手。","alchemy_tip":"开口深谈前先问一句：「这件事你今晚想解决，还是想聊透。」他说今晚，就只谈今晚能定的那一版，剩下的写下来留到下次。"},"low":{"label":"容得下没谈完的分歧","gift_title":"让分歧先悬着也不慌","gift_desc":"你能让一部分分歧就那样悬着，不急着给它一个说法。不是每句话都要谈到底，也不是每个不舒服都要立刻交代来历。这份松弛让关系有了余地，谁也不必随时准备接受审问。","shadow_title":"用算了代替说清楚","shadow_desc":"你把不追究当成了处理。话题绕过去，事情留在原地，一次两次看不出来，第三十次它会自己找上来，而且带着前面二十九次的份量。对方以为你不在意，其实你在意得很。","alchemy_tip":"找一件搁置超过两个月的事，今晚说一句话：「这件事我一直没提，但我心里有它。」说完先停住，不急着给方案。"}},"tki_compromising":{"name":"妥协型","volume":"vol15","category":"conflict","high":{"label":"各退一步先把今晚过完","gift_title":"找得出今晚能过的那版","gift_desc":"你擅长在两个人都不肯动的时候找出一个今晚能过下去的版本。它不漂亮，但能让饭吃完、觉睡下、第二天还愿意坐下来。很多关系靠的正是这种把僵局折成可行的能力。","shadow_title":"各退一步，谁都没要到","shadow_desc":"太早折价，两个人都没拿到真正要的东西，只是各自少说了几句。表面成交，底下留着一笔谁都没认的账，下次同一件事再吵，你会发现谈的其实是上次那笔没结完的账。","alchemy_tip":"下次说各退一步之前，先让两个人各说一句：「如果只能保住一样，我最想保住哪一样。」把这个说出来，再谈退哪一步。"},"low":{"label":"不为省事把价折掉","gift_title":"不肯把一个中间数当答案","gift_desc":"你不肯把没弄清的事匆匆折成一个中间数。宁可这一场谈得久一点、难看一点，也不愿意两个人握完手各自后悔。你相信有些东西一旦被折价，就再也不好按原价摆回来了。","shadow_title":"什么都得对，日子变硬","shadow_desc":"你守的那条线，有时自己也说不清是从哪来的。小事被抬成原则，谁提折中就像在侮辱你，日子于是变硬，能商量的地方越来越少，最后连亲近的人也开始绕开你走。","alchemy_tip":"下次争到一半，问自己一句：「这条线是我今天要保的，还是我三年前就摆在那儿的。」答不上来，就先让一步试试。"}},"tki_avoiding":{"name":"回避型","volume":"vol15","category":"conflict","high":{"label":"认得出哪一仗不该打","gift_title":"退开半步，保住后路","gift_desc":"你知道哪一仗不值得打。有些话不必在气头上说，有些人不必当场驳倒，有些场面退开半步反而保住了后面的余地。这份判断替你省下过很多本来会留下的伤口。","shadow_title":"那件事一直留在房间里","shadow_desc":"那件事并没有因为你不说而消失，它在房间里待着，每次你路过都得绕一下。对方慢慢学会了不指望你出面，等你想谈的时候，已经没有人相信你会真的坐下来。","alchemy_tip":"把你要回避的那件事写在一张纸上，只写一句：「我需要二十分钟，二十分钟后我回来谈这件事。」说完真的回到桌边。"},"low":{"label":"不让话在心里过夜","gift_title":"有事当场说掉","gift_desc":"有事你更愿意当面说掉，不让它在心里过夜。该问的当场问，该表的拖不到明天，别人跟你相处省掉了大量猜测。很多被你及时说出来的一句话，本来会长成半年的隔阂。","shadow_title":"小事也要当场掀开","shadow_desc":"不是所有不适都需要当场处理。你把可以自然淡掉的事掀开来，把一次沉默读成一次立场，情绪跟着被反复点着。到最后累的是你，被追着解释的却是身边的人。","alchemy_tip":"下次想立刻追问时，把要问的那句话写在备忘录里，设一个明早九点的提醒。第二天还觉得要说，再说。"}},"tki_accommodating":{"name":"迁就型","volume":"vol15","category":"conflict","high":{"label":"先把对面的人顺过来","gift_title":"能把场面从爆点拉回来","gift_desc":"你懂得在火上浇一点水。对方正在往上冲的时候，你先让半步，把语气放软，让这一场不至于烧掉后面还能谈的东西。有人靠这份退让把火压下去，也有人因此没丢掉一段本来会断的关系。","shadow_title":"让出去的分都记着账","shadow_desc":"让的时候你没说什么，只是记了一笔。攒到某个时刻，你用疲倦、冷淡、拖延去收这笔利息，对方只觉得你忽然变了，说不出是哪一天开始的，你自己也未必说得清。","alchemy_tip":"答应的那一刻加一句具体条件：「这次可以，但下次提前一天跟我说。」把让出去的东西，换成一个能被记住的说法。"},"low":{"label":"说得出那句不","gift_title":"好意后来变成真心的","gift_desc":"你说得出那句不。不必先把场面弄僵，也不用事后解释半小时，一句这次不行就够了。因为你的同意不是默认设置，所以你真的点头时，别人才知道那是有分量的。","shadow_title":"把体贴当成示弱","shadow_desc":"你把让步看成输，把体贴看成示弱，于是每一件小事都守着。身边的人在你面前不敢松、不敢软、不敢先低头，一段本来可以有来有回的关系，被守成了一条单行道。","alchemy_tip":"这周主动让一次，并且说出口：「这次按你的来。」不要补任何条件或解释，让这句话就停在那里。"}},"pac_parent":{"name":"父母自我态","volume":"vol15","category":"pac","high":{"label":"乱起来的时候有个顺序","gift_title":"慌乱的场合有人定调","gift_desc":"乱起来的时候，你的声音能让事情有个先后的顺序。谁该做什么、什么时候做、底线在哪里，你一句话就摆出来了。慌乱的场合里总有人需要这个，也常常是你在扮演它。","shadow_title":"为你好变成替你活","shadow_desc":"为你好这三个字，用久了会替别人做决定。你替他判断什么该难过、什么不值得、该怎么做才对，他一开口就先听到评判。于是有的人变小了，有的人掉头就走。","alchemy_tip":"下次给建议前先问一句：「你是想让我听，还是想让我出主意。」他说想让你听，就只问问题，把建议留到明天。"},"low":{"label":"不急着替人下定义","gift_title":"把答案留给对方自己摸","gift_desc":"你不急着替别人定义他的处境，也不抢着给一个正确说法。对方在你面前可以自己慢慢摸到答案，说错也不被你纠正。这种不介入，让很多人第一次把话讲完整。","shadow_title":"该定调时你退在后面","shadow_desc":"该有人站出来的时候，你退在后面。规矩没人定，调子没人收，混乱里每个人都在等别人先说。你把不评判当成尊重，可有些场面需要的恰恰是一句就按这个来。","alchemy_tip":"下次一群人卡在没人拍板的地方，你直接说一句：「先按这个做，周五再看要不要改。」给出日子，不留活口。"}},"pac_adult":{"name":"成人自我态","volume":"vol15","category":"pac","high":{"label":"只说这一次，这一件事","gift_title":"把语气拉平还能把话说完","gift_desc":"你能把语气拉平，只说这一次、这一件事。对方拿旧账来翻，你会把它放回去，然后接着谈眼前这口碗。这种能力让吵架有终点，也让两个人不至于把十年的账一次算完。","shadow_title":"永远冷静，像在开会","shadow_desc":"永远冷静也会伤人。你把情绪挡在门外，把每一次冲突开成会议，对方递过来的难受总被你转成一条待办。久了他会觉得跟你说话要提交材料，而不是在跟一个人相处。","alchemy_tip":"下次谈完正事，补一句没有信息量的话：「刚才那几句我听着也不舒服。」不给方案，不分析，说完就停。"},"low":{"label":"身上还留着热的反应","gift_title":"不必每句话都过筛子","gift_desc":"你允许自己有反应，不必每句话都经过过滤器。高兴就笑，不服就顶回去，难受写在脸上。别人因此知道你在哪里，也知道哪句话真的碰到了你，不用靠猜。","shadow_title":"话先出口，理由后补","shadow_desc":"你说完那句话才想它落在哪里，然后花更多时间收拾残局。有些关系不是被大事弄坏的，是被几句来不及想的话一句一句磨薄的，等你看出来，已经薄得透光。","alchemy_tip":"下次回消息前，把要发的那段先打在备忘录里读一遍，再决定要不要复制过去。只加这一步，不改内容。"}},"pac_child":{"name":"儿童自我态","volume":"vol15","category":"pac","high":{"label":"说不愿意说得直接","gift_title":"反应是真的，不掺水","gift_desc":"你的反应是真的。高兴是真的，不愿意也是真的，别人不用费力猜你的脸色。很多僵住的场面，是被一句直白的我不愿意推动的，那句话你说得出来，而且说得不假。","shadow_title":"难受成了通行证","shadow_desc":"难受一旦变成通行证，别人就得先处理你的情绪，才有资格谈事情。一不顺就翻脸或用受伤说话，久了大家学会绕着你走，你想被听见，反而越来越难被听见。","alchemy_tip":"下次难受上来时，先说一句：「我现在情绪很大，给我十分钟。」十分钟后回来，只说这件事里最具体的那一项。"},"low":{"label":"委屈不靠情绪去说","gift_title":"难受着也把事情说完","gift_desc":"你不靠情绪去表达需要。难受的时候仍能把事情说完，把要求说清楚，不用等人来猜，也不用先哭一场才被当回事。这让你的话在着急的场合里依然能被听见。","shadow_title":"难过被你说成了道理","shadow_desc":"委屈被你说成了道理。你把所有的难受翻译成逻辑，讲得越清楚，别人越不知道你其实很难过。他们只看见一个有道理的你在辩论，看不见那个坐在对面需要被安慰的人。","alchemy_tip":"下次讲完道理，加一句：「这件事让我有点难过。」不要接着解释为什么，也不要马上补一条更完整的论证。"}},"hsp_sensory":{"name":"感官高敏","volume":"vol16","category":"neuro","high":{"label":"随身带着一台放大器","gift_title":"一台高分辨率的接收器","gift_desc":"你能分出空调的低频、隔壁的键盘、窗帘漏进来的那点光，也能尝出一杯咖啡里多放了半勺糖。别人自动滤掉的东西，在你这里是一条完整的信息流。对质地、分寸和节奏的直觉，就是这样一点点长出来的。","shadow_title":"一天结束，你已经被声音用完了","shadow_desc":"对别人而言正常的一天，对你是持续的消耗：地铁轰鸣、超市顶灯、连着三场会。你不是不想撑，是系统一直没关过机。最后常被读成矫情或玻璃心，其实只是电用完了。","alchemy_tip":"把「我是不是太敏感」换成「这个环境的分贝对我的系统而言太高」，然后立刻改一个参数：换座位、戴降噪耳机、把顶灯关掉只留一盏侧灯。先承认是环境的问题，再动手动它。"},"low":{"label":"在嘈杂里也能睡着的人","gift_title":"天生的滤噪本领","gift_desc":"你能在开着电视的客厅里读完一章书，也能在硬座上睡着。多数环境对你只是背景，不会长期占住注意力的带宽。这份钝感让你在混乱的现场比别人更能干活，也更少被拖垮。","shadow_title":"身体报警，你总是最后一个听见","shadow_desc":"你对细微信号不敏感，饿了、困了、肩颈僵了都能被忽略很久；对面那个人语气里的退让，也容易漏掉。不是不在乎，是接收阈值高，等你察觉，往往已经晚了一步。","alchemy_tip":"每天设两个固定闹钟，标注「查体」，响的时候只回答三件事：现在渴不渴、身上哪块最紧、上一句话有没有让我不舒服。各写一行字，不用当场处理。"}},"hsp_emotional":{"name":"情绪高敏","volume":"vol16","category":"neuro","high":{"label":"一进门就收到全场情绪","gift_title":"能读到没有说出口的那半句","gift_desc":"别人还在客套，你已经听出那句玩笑底下的失落。你能分辨一个人是真松弛还是在硬撑，因此常常是第一个给出准确回应的人。这种精度不是学来的，是你一直在实时接收。","shadow_title":"别人淋了一场雨，你湿了两天","shadow_desc":"一场别人的坏情绪会整晚留在你身上，第二天开会你还在替他难受。你分不清哪些是共情、哪些是被灌进来的，久了会出现一种说不清来源的疲惫，和没来由的烦躁。","alchemy_tip":"情绪从别人那里涌来时，先做一个身体动作：站起来，脚掌压地十秒，然后问「这份情绪里，哪一部分是我的」。答不上来的部分写在一张纸上，写完撕掉，不带走。"},"low":{"label":"不容易被情绪卷走的人","gift_title":"在风眼里保持常温","gift_desc":"身边的人炸了，你的心率仍然稳。你可以在别人的情绪风暴里继续把事说清楚，不跟着一起沉下去。危机现场最稀缺的往往不是共情，而是这种不跟着乱的人。","shadow_title":"看上去什么都无所谓","shadow_desc":"你不是没有感受，只是它在内部走得很慢、很轻，别人等不到那个回应就先失望了。亲近的人会说「跟你说没用」，而这句话本身，你也常常要过很久才觉得疼。","alchemy_tip":"对方在说难受的事时，不要急着给方案。先照着说一句「听起来你这周挺难的」，然后停三秒，不补话、不解释。练的就是这三秒的空白。"}},"hss_novelty":{"name":"新奇寻求","volume":"vol16","category":"neuro","high":{"label":"总想打开下一扇门","gift_title":"在陌生里快速上手","gift_desc":"换城市、换工具、换行业，你比别人少一层恐惧。陌生对你是燃料：新环境会让注意力瞬间变亮，学得快、上手快，也因此常常比别人更早看见新的可能。","shadow_title":"抽屉里全是开了头的计划","shadow_desc":"新鲜感一退，你就想去找下一个入口。真正难受的不是没能力，而是每件事进入重复期，你就本能地离开。几年过去，手上有很多漂亮的开始，很少有能交出去的完成。","alchemy_tip":"同一时间只允许两个新项目在跑；想开第三个时，先给手上这个写一份「别人能接手」的说明。写不出来，就说明它还没到可以离开的时候。"},"low":{"label":"同一条路越走越顺的人","gift_title":"低功耗也能跑很久","gift_desc":"你不需要靠新鲜感供电，熟悉的路对你不是无聊，是省电。你能在同一套流程里待很久，把它磨到别人做不到的细度，长期积累下来，复利很惊人。","shadow_title":"局面已经变了，你还在按老办法","shadow_desc":"环境换了规则，你的第一反应是加倍认真地做原来那件事。守成本身没错，麻烦的是把「不想折腾」说成「这样最稳」，于是窗口在你想清楚之前就关上了。","alchemy_tip":"每季度挑一件正在做的事，只改一个变量试两周：换工具、换顺序，或者换一个渠道。两周后写三行——哪里变好、哪里变差、留还是撤。"}},"hss_intensity":{"name":"强度寻求","volume":"vol16","category":"neuro","high":{"label":"要很响才觉得活着","gift_title":"敢把油门踩到底","gift_desc":"别人退后半步的时候，你会把自己整个投进去：通宵赶一个项目、全力打一场球、爱一个人不留余地。高强度的时刻是你最清醒的时候，很多别人做不到的事就是这样被做成的。","shadow_title":"用更猛的刺激压住空","shadow_desc":"一安静下来你就不舒服，于是不断加码：更多酒、更快的节奏、更剧烈的情绪。恢复被一再往后推，身体最后用失眠、心悸和一次突然的垮掉，替你把账要回来。","alchemy_tip":"每次高强度体验出发前，先在日历上把恢复日写好：通宵后的第二天不排任何会议，只留睡觉和走路。是提前写进日历，而不是等崩溃后再补。"},"low":{"label":"把音量调低也能满意","gift_title":"在低刺激里待得住","gift_desc":"你不需要把音量调到最大才有感觉：一顿家常饭、一段安静的散步就能把电充满。这让你的消耗更低、恢复更快，也不容易被那些成瘾性的东西拽住。","shadow_title":"把「想要」也一起调成了静音","shadow_desc":"长期低功耗有个代价：你容易把「我不需要那么多」和「我不敢要」混成一件事。当真正想要的东西出现，你可能连伸手都省了，只告诉自己现在这样也挺好。","alchemy_tip":"每月写下一件「其实我想要，但觉得太麻烦」的事，然后只做它的最小版本：想学琴就先约一节体验课，想出门就先订一晚住宿。"}},"big5_open":{"name":"概念探索欲","volume":"vol2","category":"big5","high":{"label":"被未知持续吸引的探索者","gift_title":"跨界联想与第一性原理","gift_desc":"你习惯把陌生的东西拆开来看，因此总能在两个看似无关的领域之间发现可迁移的结构。","shadow_title":"广度过剩而深度不足","shadow_desc":"不断被新的可能性吸引，容易在每个领域都停在入门层，缺少一件真正做完的作品。","alchemy_tip":"给自己的好奇心设一个「封顶项目」：每年必须有一件事，从好奇做到交付。"},"low":{"label":"深挖既有领域的守成型","gift_title":"极高的领域纵深与稳定性","gift_desc":"你不被新鲜感牵着走，能在一条线上反复打磨，最终形成别人难以复制的专业手感。","shadow_title":"对范式转移的迟钝","shadow_desc":"当环境规则已经变了，你仍倾向于用旧的地图走路，容易在转折点被甩下。","alchemy_tip":"每半年主动读一篇完全在你的领域之外的东西，只为了检查自己脚下这块地还在不在。"}},"big5_aesthetic":{"name":"审美体验敏锐","volume":"vol2","category":"big5","high":{"label":"被质感击中的人","gift_title":"极高的美学分辨率","gift_desc":"你能感知到别人忽略的光线、比例与语气，这种敏锐让作品有质感，也让人愿意待在你身边。","shadow_title":"对粗糙环境的高痛感","shadow_desc":"当周围的一切都「不够对」时，你会明显消耗，这种敏感有时会变成对现实的不耐。","alchemy_tip":"把审美从「忍受不了」转成「可以创造」。看到不对的地方，试着动手改一点，而不是转身走开。"},"low":{"label":"功能优先的实用主义者","gift_title":"不被形式消耗的效率","gift_desc":"你不为氛围所动，能直接抓住功能与结果，因此在需要落地时格外干脆。","shadow_title":"缺少让人记住的那一层","shadow_desc":"东西都对，但没有让人愿意多看一眼的部分，长期下来会影响你被记住的概率。","alchemy_tip":"在每个交付物里，只加一处「不必要但让人喜欢」的细节。一处就够。"}},"big5_order":{"name":"秩序与计划感","volume":"vol2","category":"big5","high":{"label":"把混乱压缩成流程的架构者","gift_title":"极强的系统化能力","gift_desc":"你能把混沌变成步骤，让别人接得住你的工作，这种可复制性是团队最缺的东西。","shadow_title":"对意外的低容忍","shadow_desc":"计划被打乱时的烦躁，有时会超出事情本身的严重性，也会让身边的人感到压力。","alchemy_tip":"在计划里主动留出百分之二十的空档，不是为了更高效，而是为了让意外有一个合法位置。"},"low":{"label":"与不确定共处的即兴者","gift_title":"在混乱中依然能行动的弹性","gift_desc":"你不必先有完整的计划才能开始，因此在真正动荡的环境里往往比计划派走得更远。","shadow_title":"重复犯同一类错误","shadow_desc":"因为不留记录、不做复盘，同样的坑会以不同形式反复出现。","alchemy_tip":"不必建立复杂系统，只做一个极简记录：每次踩坑写一行。一行，就足够避免重复。"}},"big5_industry":{"name":"目标韧性与自律","volume":"vol2","category":"big5","high":{"label":"能长期对抗枯燥的推进者","gift_title":"把长期主义变成日常","gift_desc":"你不需要每次都靠激情启动，靠机制就能把自己带到终点，这是极少数人才有的能力。","shadow_title":"用忙碌回避停工焦虑","shadow_desc":"一旦停下来就觉得自己在退步，休息反而变成了另一种消耗。","alchemy_tip":"把休息也当成一项有截止时间的工作。做完就真的结束，而不是心虚地继续。"},"low":{"label":"靠热情驱动的爆发型","gift_title":"在真正感兴趣的事上的超高产出","gift_desc":"被点燃时你能在短时间内达到别人几个月的量，这种爆发力很难被训练出来。","shadow_title":"热情退潮后的长期停摆","shadow_desc":"一旦新鲜感消失，进度会迅速冻结，很多事停在 60% 就再也没有回去。","alchemy_tip":"把 60% 的事集中列出来，只挑一件，用最短路径推到 100%。完成感比新刺激更能续命。"}},"big5_social":{"name":"社交充能倾向","volume":"vol2","category":"big5","high":{"label":"在人群中充电的连接者","gift_title":"天然的场域激活能力","gift_desc":"你能让一屋子人放松下来，这种能力在需要协作、需要破冰的场合极其稀缺。","shadow_title":"独处能力的退化","shadow_desc":"长时间独处时会明显不安，容易用社交填满空白，从而回避真正需要面对的事。","alchemy_tip":"每周留一段完全不社交的时间。不是为了效率，是为了确认你一个人时也站得住。"},"low":{"label":"低耗能的独立观察者","gift_title":"深度独处带来的思考密度","gift_desc":"你能在自己的世界里待很久而不焦虑，因此能产生别人在噪音里想不出来的东西。","shadow_title":"关键场合的存在感流失","shadow_desc":"你的判断很准，但因为不主动表达，很多机会会落到声音更大的人手里。","alchemy_tip":"不需要变成外向的人，只需要在关键的三次场合里，让自己被完整地听见。"}},"big5_assert":{"name":"表达主导与存在感","volume":"vol2","category":"big5","high":{"label":"愿意占据中心的位置","gift_title":"把观点变成共识的推动力","gift_desc":"你敢于在不确定时先开口，因此很多事因你而启动，团队也因你而有了方向。","shadow_title":"无意中挤压他人的表达空间","shadow_desc":"你的存在感太强时，安静的人会越来越少说话，你会因此失去一半的信息。","alchemy_tip":"在每次会议里，刻意留一次不发言的机会，并点名问一个平时不开口的人。"},"low":{"label":"安静但不缺判断的观察者","gift_title":"低噪音下的高信息密度","gift_desc":"你不急着表达，因此能看到更多细节，说出口的话往往比别人的更有分量。","shadow_title":"被误读为没有想法","shadow_desc":"沉默在别人眼里常常等于「没意见」，你的判断可能在你不在场时被替代。","alchemy_tip":"把「等我想清楚再说」改成「我先说一个粗的版本」。粗糙的表达也比沉默更容易被记住。"}},"big5_compassion":{"name":"情绪共情力","volume":"vol2","category":"big5","high":{"label":"能接住他人情绪的人","gift_title":"极高的情绪托底能力","gift_desc":"你不需要别人解释就能感受到他的难受，这种能力让很多人愿意把最脆弱的部分交给你。","shadow_title":"情绪边界被反复穿透","shadow_desc":"长期承接他人的情绪会让你分不清哪些是自己的，容易疲惫、失控或突然想逃。","alchemy_tip":"共情不等于吸收。练习在心里加一句「这是他的，不是我的」，然后只做能做的部分。"},"low":{"label":"情绪低干扰的理性派","gift_title":"高压下的清醒与稳定","gift_desc":"当所有人被情绪裹挟时，你还能处理事情本身，这在危机里是极稀缺的能力。","shadow_title":"难以被感知的在乎","shadow_desc":"你其实在乎，但表达方式让人感觉不到，容易在最亲近的关系里被误解为冷漠。","alchemy_tip":"情绪不需要你解决，只需要你在场。练习先说「我在」，再谈怎么办。"}},"big5_compliance":{"name":"冲突妥协倾向","volume":"vol2","category":"big5","high":{"label":"优先维系关系的协调者","gift_title":"让合作得以持续的润滑能力","gift_desc":"你能在冲突里先退一步，因此很多本会破裂的关系被你保住了。","shadow_title":"边界长期失守","shadow_desc":"你把和平放在自己前面，久了会累积一种说不清的委屈，最后在某个小事上突然爆发。","alchemy_tip":"先练习小范围的不同意。在无关紧要的事上说不，才能在大事上说得出口。"},"low":{"label":"坚持立场的直行派","gift_title":"清楚可预期的立场","gift_desc":"别人知道你在哪、不会变，这种可预期性在长期合作里极其宝贵。","shadow_title":"赢了道理输了关系","shadow_desc":"你常在事实层面正确，但让对方感到被压过，关系会在一次次正确中慢慢变冷。","alchemy_tip":"在表达不同意见之前，先确认对方要的是解决方案还是被理解。顺序反了，正确也会伤人。"}},"big5_alert":{"name":"风险预警敏感","volume":"vol2","category":"big5","high":{"label":"提前嗅到危险的雷达","gift_title":"超前的风险识别能力","gift_desc":"你总能比别人早一点看到那个会出问题的环节，因此少踩很多本可以避免的坑。","shadow_title":"把可能性当成事实","shadow_desc":"长期处于预警状态会让身体一直紧绷，很多灾难只发生在你的脑子里，但成本是真的。","alchemy_tip":"给每个担心加一个概率和一个应对方案。担心一旦具象，就不再有那么大的体积。"},"low":{"label":"低焦虑的行动者","gift_title":"不被预演消耗的行动力","gift_desc":"你不会在事情发生之前先受一遍苦，因此能在别人犹豫时直接出手。","shadow_title":"风险识别滞后","shadow_desc":"有些坑本可以提前看到，但你倾向于「到时候再说」，代价有时不可逆。","alchemy_tip":"对不可逆的事（健康、信任、法律）单独提高一级警惕，其余的事继续允许自己大胆。"}},"big5_rumination":{"name":"情绪反刍与波动","volume":"vol2","category":"big5","high":{"label":"高分辨率的情感处理器","gift_title":"极深的感受与创造力","gift_desc":"你能捕捉到别人略过的情绪层次，这种分辨率是许多创作与深度关系的基础。","shadow_title":"灾难化反刍与精神内耗","shadow_desc":"把小失误放大成全面崩盘，深夜反复咀嚼他人一句无心之言，第二天带着疲惫继续。","alchemy_tip":"给反刍设一个容器：写在纸上，写完合上。让它在纸上转，而不是在脑子里转。"},"low":{"label":"情绪底盘极稳的定海者","gift_title":"泰山崩于前而不乱的稳盘","gift_desc":"你的情绪很少失控，是团队与家庭在危机里最可靠的那根柱子。","shadow_title":"对隐性裂痕的察觉偏晚","shadow_desc":"因为你不太起伏，容易忽略别人已经积累很久的不满，等到发现时往往已经很深。","alchemy_tip":"定期主动问一句「最近有没有什么事让你不太舒服」。你的稳定不该成为别人不敢开口的理由。"}},"dark_mach":{"name":"马基雅维利谋略","volume":"vol3","category":"dark","high":{"label":"读懂牌桌的清醒策略家","gift_title":"顶级局势洞察与风控智谋","gift_desc":"你能一眼看穿利益链与潜规则，不当冤大头，在复杂博弈里为团队和自己争取到真正的空间。","shadow_title":"信任荒漠与关系工具化","shadow_desc":"过度算计防备，很难体验毫无保留的松弛亲密；你会发现自己总是被需要，却很少被真正爱着。","alchemy_tip":"为一两个关系设立「免算计区」：在这几个人面前，允许自己不算收益、不留后手。"},"low":{"label":"直来直去的坦荡者","gift_title":"赤诚透明的信任磁铁","gift_desc":"你说话算数、动机清楚，因此能吸引到同样重情义的人，活得更轻盈、负担更少。","shadow_title":"复杂博弈中易吃暗亏","shadow_desc":"容易把客套当承诺，缺乏利益隔离与识人防备，在真正复杂的局面里可能被利用而不自知。","alchemy_tip":"不必变得狡猾，但要有识人的功课：把重要的口头承诺，改成一次书面确认。"}},"dark_narc":{"name":"自恋光环渴求","volume":"vol3","category":"dark","high":{"label":"需要被看见的发光体","gift_title":"极具感染力的自我表达","gift_desc":"你相信自己值得被看见，这种确信会推着你站到更亮的地方，也真的能带动一群人往前走。","shadow_title":"掌声断供时的坍塌","shadow_desc":"当外部认可突然消失，你会经历超出事情本身的失落，容易做出为了被看见而损耗长期价值的决定。","alchemy_tip":"建立一处只有你自己的评价体系：每季度写一次「我为自己骄傲的一件小事」，不给任何人看。"},"low":{"label":"低调的自持者","gift_title":"不被虚荣牵动的判断力","gift_desc":"你的选择很少被掌声影响，因此在需要冷静取舍的场合，不容易为了体面做出错误决定。","shadow_title":"本该被看见时后退","shadow_desc":"好东西被你自己藏起来，别人无法评估你，很多机会因此落到表达更积极的人手上。","alchemy_tip":"让作品替你说话。不需要自我吹捧，只需要把做好的东西放在看得见的地方。"}},"dark_psycho":{"name":"冷酷果决","volume":"vol3","category":"dark","high":{"label":"高压下的外科医生","gift_title":"切断无效情绪的止损能力","gift_desc":"关键时刻你能把情绪放到一边，快速判断、快速拍板，抗压上限远高于常人。","shadow_title":"共情冰点与关系疏离","shadow_desc":"在亲密关系里显得过于理性冷硬，容易让在乎你的人感到不被接住，久了就不再来找你。","alchemy_tip":"把「处理问题」和「接住人」拆成两步。先花三分钟只做第二步，再进入你的效率模式。"},"low":{"label":"重情重感的柔软者","gift_title":"温润细腻的情感雷达","gift_desc":"你能敏锐觉察他人微小的痛点，给出极高浓度的情绪托底，这种能力让很多人愿意把真心交给你。","shadow_title":"决策拖泥带水","shadow_desc":"因为过度顾忌他人感受或心软，难以在止损节点果断切割，小问题拖成了大问题。","alchemy_tip":"给难以决断的事设一个「最晚决定日」。到那天无论情绪如何，都必须做一个选择。"}},"light_humanism":{"name":"人本主义","volume":"vol3","category":"light","high":{"label":"尊重每个个体尊严的人","gift_title":"让人不必缩小自己的场域","gift_desc":"你发自内心地认为每个人都有其价值，因此别人在你面前不必表演，也不必防御。","shadow_title":"在需要取舍时的迟疑","shadow_desc":"过度体谅每个人的处境，会让你该做减法时下不了手，最后由更狠的人替你决定。","alchemy_tip":"尊重人不等于回避决策。把「我不忍心」换成「我怎么做，才是对他最诚实的安排」。"},"low":{"label":"结果导向的现实主义者","gift_title":"不被情绪成本拖住的执行效率","gift_desc":"你能把人和事分开处理，因此不会因为某个人难受就让整件事停摆。","shadow_title":"被记住的是冷而不是对","shadow_desc":"你的判断常常正确，但方式让人感到被当成工具，长期会损耗你的支持网络。","alchemy_tip":"在做出正确的决定之后，多做一步：亲自告诉那个人你为什么这么做。"}},"light_kant":{"name":"康德式正直","volume":"vol3","category":"light","high":{"label":"不把人当工具的守线者","gift_title":"罕见的原则一致性","gift_desc":"哪怕对自己不利，你也不愿在关键处含糊，这种一致性让别人敢把重要的事交给你。","shadow_title":"道德洁癖带来的孤立","shadow_desc":"对不体面的低容忍，有时会让你在现实灰度里显得难以合作，甚至被贴上不好相处的标签。","alchemy_tip":"把「这件事不对」换成「我可以做哪一部分」。原则不必让你退出所有牌桌。"},"low":{"label":"灵活务实的灰度操作者","gift_title":"在复杂现实里把事推动的能力","gift_desc":"你理解世界不是非黑即白，因此能在多方利益中找出可行路径，比纯粹的人更能成事。","shadow_title":"底线在一次次例外里后退","shadow_desc":"每一次「这次特殊」都在悄悄移动你的标准，几年后回头看，可能已经不在原来的位置。","alchemy_tip":"写下三条你绝不越过的线，贴在能看见的地方。灰度可以很大，但底线必须是硬的。"}},"light_faith":{"name":"人性信仰","volume":"vol3","category":"light","high":{"label":"相信善意值得先给出的信任者","gift_title":"低成本建立深度合作的能力","gift_desc":"你愿意先给出信任，因此常常换来别人对你加倍的坦率，很多合作因你而变得简单。","shadow_title":"被反复透支的善意","shadow_desc":"默认他人善意会让你在真正该设防的时候反应偏慢，代价有时需要很久才能收回。","alchemy_tip":"保持先给出的习惯，但给自己加一条：同一个人透支两次之后，把信任降级为观察。"},"low":{"label":"审慎的验证者","gift_title":"极强的风险隔离能力","gift_desc":"你不会因为客气就交付底牌，因此很少在关系与合作中被真正伤到。","shadow_title":"错过本可以很深的关系","shadow_desc":"长期处于验证状态，会让愿意靠近你的人也慢慢收回手，最后你身边只剩下交易。","alchemy_tip":"给少数人一次「先信任」的机会。深度关系从来不是验证出来的，是先给出来的。"}},"covert_control":{"name":"隐性掌控欲","volume":"vol3","category":"dark","high":{"label":"不显山露水的局势操盘手","gift_title":"让人舒服地被安排的能力","gift_desc":"你不需要用命令就能让事情朝你要的方向走，这种柔和的影响力在复杂组织里极其有效。","shadow_title":"不敢直说的关系疲劳","shadow_desc":"长期用安排代替请求，会让你在关系里始终留着一层看不见的手，对方会觉得累却说不出原因。","alchemy_tip":"每周至少有一次，把「安排」换成「直接说我要什么」。坦白比技巧更省力。"},"low":{"label":"愿意放手的信任者","gift_title":"让别人真正成长的空间","gift_desc":"你能把事交出去而不反复插手，因此身边的人在你这里长得出能力，也长得出忠诚。","shadow_title":"关键处失焦","shadow_desc":"该盯的细节没有盯，问题往往在最不该出的时候冒出来，你才知道自己松得太早。","alchemy_tip":"为自己列三个「必须亲手确认」的关键点，其余全部放手。放手不等于失明。"}},"wv_nature":{"name":"人性预设","volume":"vol4","category":"worldview","polar":true,"negLabel":"审慎防备","posLabel":"善意信任","high":{"label":"相信善意的先行者","gift_title":"让关系变简单的信任红利","gift_desc":"你愿意先把人当成善的，因此别人在你这里不必先证明自己，关系能更快进入深处。","shadow_title":"在真正的恶意面前反应偏慢","shadow_desc":"默认善意会让你在该设防时迟钝，被利用之后还容易先怀疑是自己多心。","alchemy_tip":"保留先给信任的习惯，但加上一条：「两次之后降级」。善意不该是一次性的。"},"low":{"label":"先把世界看清楚的审慎者","gift_title":"极强的风险隔离能力","gift_desc":"你不因客气就交付底牌，因此极少在关系与合作里被真正伤到。","shadow_title":"把人推在门外的疲惫","shadow_desc":"长期验证状态会让愿意靠近的人慢慢收回手，你最后留下的是安全，也只剩下安全。","alchemy_tip":"给三个人一次「先信任」的额度。深度关系从来不是验证出来的。"}},"wv_causal":{"name":"因果归因","volume":"vol4","category":"worldview","polar":true,"negLabel":"顺应随机","posLabel":"长期掌控","high":{"label":"相信选择的掌控者","gift_title":"把命运握在手里的行动力","gift_desc":"你相信事情的结果多半来自选择，因此不会长期停在抱怨里，总能找到自己能改的那一部分。","shadow_title":"把不可控也算成自己的错","shadow_desc":"过强的掌控感会在运气不好时变成自责，明明不是你的问题，也会被算进你的账上。","alchemy_tip":"每次复盘分两栏：我造成的、不是我造成的。第二栏必须真的写下东西。"},"low":{"label":"与随机共处的顺应者","gift_title":"对无常的高容忍与松弛","gift_desc":"你不强求掌控一切，因此更少被挫败击穿，也更容易在变化里找到新的可能。","shadow_title":"把主动让给环境的惯性","shadow_desc":"把太多事归因于时代与运气，会让你在能改变的地方也停止用力。","alchemy_tip":"每周找一件「我完全能决定」的小事，认真做完。掌控感需要被重新训练。"}},"wv_social":{"name":"社会逻辑","volume":"vol4","category":"worldview","polar":true,"negLabel":"现实博弈","posLabel":"契约规则","high":{"label":"相信规则值得守的契约派","gift_title":"可预期的可靠人格","gift_desc":"你不因别人都在破例就跟着破，这种一致性会让你在长期博弈里被当成真正的对手与伙伴。","shadow_title":"被不守规则的人反复消耗","shadow_desc":"你守规则，但环境未必，容易出现你在原地讲道理、别人已经绕过你的局面。","alchemy_tip":"守规则的同时，也要会保护守规则的人。把「我不做」升级为「我要求这条对所有人成立」。"},"low":{"label":"看懂现实棋盘的博弈派","gift_title":"在真实世界里把事做成的能力","gift_desc":"你理解规则背后的动机与现实，因此不会因为教条而错过真正可行的解法。","shadow_title":"标准随场合漂移","shadow_desc":"习惯性按具体情况调整底线，久了别人无法预期你的行为，信任成本会显著上升。","alchemy_tip":"灰度可以有，但要让别人知道你的灰度在哪。公开你的判断标准，比反复解释更有效。"}},"lv_happiness":{"name":"幸福取向","volume":"vol4","category":"lifeview","polar":true,"negLabel":"体验主义","posLabel":"实现主义","high":{"label":"从创造里获得满足的人","gift_title":"能穿过枯燥的长期动力","gift_desc":"你能从「做成了一件事」里获得真实的满足，因此不会在无聊期就放弃，长期复利明显。","shadow_title":"把享受当成浪费","shadow_desc":"很难允许自己只是快乐而不产出，休息时也在隐隐觉得自己在浪费时间。","alchemy_tip":"把「享受」列入正式日程，并给它一个不产出任何东西的名字。它同样是生活的一部分。"},"low":{"label":"从体验里活着的人","gift_title":"极高的生命浓度与感受力","gift_desc":"你能真切地品尝当下的滋味，这种鲜活是很多人努力半生也换不回来的。","shadow_title":"长期项目的中途放弃","shadow_desc":"当一件事开始变得重复，你的投入就迅速衰减，几年下来可能留下很多开头。","alchemy_tip":"为一件事设置「有趣的里程碑」，让过程本身持续有新鲜感，而不是靠意志硬撑。"}},"lv_suffering":{"name":"苦难态度","volume":"vol4","category":"lifeview","polar":true,"negLabel":"拒绝内耗","posLabel":"意义转化","high":{"label":"能从痛里取出东西的人","gift_title":"极强的意义转化能力","gift_desc":"苦难在你这里不会白白发生，你能从中提炼出别人拿不到的东西，也会慢慢长出厚度。","shadow_title":"给痛苦附加过多的正当性","shadow_desc":"习惯从难里找意义，可能让你在该离开的时候继续忍受，把消耗误认为成长。","alchemy_tip":"先问一句「这件事值得我付出这个代价吗」，再问「它能给我什么」。顺序不能反。"},"low":{"label":"拒绝自找苦吃的清醒者","gift_title":"不把消耗浪漫化的判断力","gift_desc":"你不会为了「成长」而主动承受本可以避免的痛，因此能守住自己的能量。","shadow_title":"略过必要的不适","shadow_desc":"有些成长确实必须经过不舒服，过度回避会让你在很多事上停在浅层。","alchemy_tip":"区分「可避免的痛」与「必经的不适」。前者果断离开，后者主动穿过。"}},"lv_anchor":{"name":"存在锚点","volume":"vol4","category":"lifeview","polar":true,"negLabel":"向外建构","posLabel":"向内自洽","high":{"label":"向内的自洽者","gift_title":"不依赖外部确认的内核","gift_desc":"即使没有掌声，你也知道自己在做什么，这种稳定让你在长期无人喝彩的阶段也能坚持。","shadow_title":"与真实世界失去校准","shadow_desc":"过度向内会让你错过外部的真实反馈，可能在自己满意的方向上走偏很久而不自知。","alchemy_tip":"定期让三个你信任的人评价你正在做的事。内耗要靠自洽解决，偏差要靠外部校准。"},"low":{"label":"向外建构的行动者","gift_title":"把自我放进世界的勇气","gift_desc":"你愿意让世界看见你、评价你，因此成长速度快，也更容易抓住真实的机会。","shadow_title":"外部反馈断供时的坍塌","shadow_desc":"当认可消失，你会经历超出事情本身的失落，容易为了被看见而牺牲长期价值。","alchemy_tip":"建立一处不给任何人看的评价体系。你需要一个不依赖观众的存在理由。"}},"val_moral":{"name":"道德算法","volume":"vol4","category":"value","polar":true,"negLabel":"结果优先","posLabel":"原则底线","high":{"label":"以原则为坐标的人","gift_title":"在压力下也不变形的底线","gift_desc":"你的行为有高度可预期性，因此别人敢把真正重要的事交给你，这是一种极贵的信任。","shadow_title":"在灰度里显得不够灵活","shadow_desc":"坚持原则有时会让你错过本可双赢的解法，也会让务实的人觉得你不好合作。","alchemy_tip":"守住原则的目标，但放开路径。同样的底线，可以有很多种实现方式。"},"low":{"label":"以结果为坐标的务实者","gift_title":"把复杂局面推向前的能力","gift_desc":"你能权衡代价与收益，因此能在原则派卡住的地方找到真正可行的路。","shadow_title":"底线在例外中悄悄后退","shadow_desc":"每一次「这次特殊」都在移动标准，几年后你可能已经不在自己以为的位置上。","alchemy_tip":"写下三条绝不超过的线，让它们不参与任何权衡。其余的事，尽情务实。"}},"val_boundary":{"name":"边界重心","volume":"vol4","category":"value","polar":true,"negLabel":"归属稳定","posLabel":"自由独立","high":{"label":"以自由为主权的人","gift_title":"不被安排的完整人格","gift_desc":"你可以独自撑起自己的生活，不会因为害怕孤单而留在一段不合适的关系或工作里。","shadow_title":"把退路走成孤岛","shadow_desc":"过度强调独立，会在需要依靠别人时说不出口，最后连本可以获得的帮助也推掉了。","alchemy_tip":"自由的核心是「我可以选择依靠」，而不是「我不能依靠任何人」。练一次主动求助。"},"low":{"label":"以归属为锚的人","gift_title":"能建立长期深度连接的能力","gift_desc":"你愿意为一段关系让渡一部分自由，因此能拥有那种别人羡慕的、真正稳的归属。","shadow_title":"在关系里失去自己的声音","shadow_desc":"过度以关系为重，会让你长期忽略自己的需求，直到某天突然想全部推翻。","alchemy_tip":"每季度问自己一次：如果这段关系明天结束，我还剩下什么。答案要有内容。"}},"val_standard":{"name":"评判标尺","volume":"vol4","category":"value","polar":true,"negLabel":"效率务实","posLabel":"真诚公平","high":{"label":"以干净为准绳的人","gift_title":"让人放心的做事方式","gift_desc":"你在意过程是否干净，因此你的成功可以被公开讲述，这种体面本身就是长期资产。","shadow_title":"因讲究而错过窗口","shadow_desc":"对「方式对不对」的高要求有时会让你在需要快速出手时犹豫，机会窗口很短。","alchemy_tip":"把「怎么做得干净」拆成可执行的检查项，而不是无限的标准讨论。干净也可以很快。"},"low":{"label":"以有效为准绳的人","gift_title":"极高的落地能力","gift_desc":"你不被形式绑住，能在最短时间拿到结果，这种务实是很多团队真正缺的东西。","shadow_title":"被记住的只是效率","shadow_desc":"事情做成了，但过程中的人被忽略，长期会损耗愿意与你共事的人。","alchemy_tip":"在交付结果的同时，多花五分钟告诉参与者他们做对了什么。效率不该以人为代价。"}},"cog_global":{"name":"全局抽象","volume":"vol5","category":"cognitive","polar":true,"negLabel":"细节实证","posLabel":"全局抽象","high":{"label":"一眼看穿结构的架构师","gift_title":"第一性原理的穿透力","gift_desc":"你能把杂乱的现象压缩成一个底层模型，因此在信息不足时也能做出方向大致正确的判断。","shadow_title":"眼高手低与细节漏勺","shadow_desc":"对琐碎落地缺乏耐心，容易因忽略某个微小执行环节而整体翻车。","alchemy_tip":"给每个宏大判断配一个可验证的最小动作。模型再漂亮，也需要一次地面的确认。"},"low":{"label":"尊重一手事实的落地专家","gift_title":"极高的交付质量","gift_desc":"你相信具体的数据与真实的细节，因此做出来的东西经得起检查，从不画空饼。","shadow_title":"只见树木不见森林","shadow_desc":"长期沉浸细节，容易在局部做到最优，却错过整个方向的范式转移。","alchemy_tip":"每季度抬头看一次：我现在优化的这件事，在整个大盘里还重要吗。"}},"cog_diverge":{"name":"发散破局","volume":"vol5","category":"cognitive","polar":true,"negLabel":"收敛风控","posLabel":"发散破局","high":{"label":"先想十种可能的破局者","gift_title":"打破僵局的创造力","gift_desc":"面对死局，你能想到别人不敢想的路，很多真正的新机会都诞生在这种发散里。","shadow_title":"想法很多，落地很少","shadow_desc":"不断生成新的可能，容易让团队跟不上节奏，也让自己的注意力反复被切碎。","alchemy_tip":"每想十个，强行选一个并给它一个交付日期。发散的价值在于那一个被做出来的。"},"low":{"label":"先把最坏情况堵上的风控派","gift_title":"极低的翻车概率","gift_desc":"你在动手之前就排掉大部分风险，因此做出来的东西稳定、可预期、能承压。","shadow_title":"错过真正的新机会","shadow_desc":"过度收敛会让你在需要颠覆的节点继续优化旧路径，最后被别人绕过。","alchemy_tip":"每半年做一件「没有把握但值得试」的小事。风控是必要的，但不必覆盖全部人生。"}},"cog_logic":{"name":"逻辑抽离","volume":"vol5","category":"cognitive","polar":true,"negLabel":"直觉共振","posLabel":"逻辑抽离","high":{"label":"依赖结构判断的冷静者","gift_title":"不被情绪污染的判断力","gift_desc":"你能把问题拆成可比较的部分，因此在混乱与压力中依然能做出清楚的决定。","shadow_title":"漏掉那个说不清的东西","shadow_desc":"过度依赖可测量的部分，会让你错过那些无法量化、却真正决定成败的信号。","alchemy_tip":"每个重要决定，在算完所有数据之后，加问一句：我心里那点说不清的感觉在指向哪。"},"low":{"label":"依赖直觉与人的感受的人","gift_title":"极高的关系与情境分辨力","gift_de
