/* ───────── src/viz/radarSvg.js ───────── */
/* ============================================================
   radarSvg.js — 通用雷达图
   支持：单层 / 面具虚实叠层 / 双人叠加
   ============================================================ */



/**
 * @param {Array<{id,label,value,color?}>} axes
 * @param {Object} opts
 *   width, series: [{ name, values: number[], color, dashed, fill, width }]
 *   colorText, colorMuted, colorBorder, bg
 */
function radarSvg(axes, opts = {}) {
  const n = axes.length;
  if (n < 3) return svg('svg', { viewBox: '0 0 10 10' });

  const W = opts.width || 560;
  const H = opts.height || Math.round(W * 0.92);
  const endPadTop = 30;
  const cx = W / 2;
  const cy = H / 2 + (opts.offsetY || 0);
  const R = Math.min(W, H) * (opts.radiusRatio || 0.32);

  const cText = opts.colorText || '#1E2220';
  const cMuted = opts.colorMuted || '#8B8F89';
  const cBorder = opts.colorBorder || '#E4DFD4';
  const bg = opts.bg || '#FCFBF8';

  const root = svg('svg', {
    viewBox: `${-34} ${-endPadTop} ${W + 68} ${H + endPadTop + 34}`,
    width: '100%',
    role: 'img',
    'aria-label': opts.ariaLabel || '多维雷达图',
  });

  const g = svg('g', {});
  root.appendChild(g);

  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, f) => [cx + Math.cos(angle(i)) * R * f, cy + Math.sin(angle(i)) * R * f];

  // ---- 网格 ----
  const rings = opts.rings || [0.25, 0.5, 0.75, 1];
  rings.forEach((f, idx) => {
    const poly = Array.from({ length: n }, (_, i) => pt(i, f).join(',')).join(' ');
    g.appendChild(svg('polygon', {
      points: poly,
      fill: idx === rings.length - 1 ? opts.gridFill || 'none' : 'none',
      stroke: cBorder,
      'stroke-width': idx === rings.length - 1 ? 1 : 0.7,
      opacity: idx === rings.length - 1 ? 0.95 : 0.55,
    }));
  });

  // ---- 轴线 ----
  for (let i = 0; i < n; i += 1) {
    const [x, y] = pt(i, 1);
    g.appendChild(svg('line', {
      x1: cx, y1: cy, x2: x, y2: y,
      stroke: cBorder, 'stroke-width': 0.7, opacity: 0.7,
    }));
  }

  // ---- 数据层 ----
  const series = opts.series || [];
  series.forEach((s, si) => {
    const color = s.color || '#8C4A32';
    const pts = axes.map((a, i) => {
      const v = clamp(Number(s.values?.[i]) || 0, 0, 100);
      return pt(i, v / 100);
    });
    const poly = pts.map((p) => p.join(',')).join(' ');

    if (s.fill !== false) {
      g.appendChild(svg('polygon', {
        points: poly,
        fill: color,
        'fill-opacity': s.fillOpacity ?? (si === 0 ? 0.12 : 0.08),
        stroke: 'none',
      }));
    }

    g.appendChild(svg('polygon', {
      points: poly,
      fill: 'none',
      stroke: color,
      'stroke-width': s.width || 1.6,
      'stroke-dasharray': s.dashed ? '4 4' : 'none',
      'stroke-linejoin': 'round',
    }));

    pts.forEach((p, i) => {
      const dot = svg('circle', {
        cx: p[0], cy: p[1], r: s.dashed ? 2.2 : 2.8,
        fill: bg, stroke: color, 'stroke-width': 1.4,
      });
      // 悬浮 / 轻触提示：维度名 + 精确分数 + 档位
      dot.setAttribute('class', 'radar-dot');
      const ax = axes[i] || {};
      const val = Number(s.values?.[i]);
      if (Number.isFinite(val)) {
        const title = svg('title', {});
        title.textContent = `${ax.label || ax.id || ''} · ${round(val, 1)}${
          s.name && series.length > 1 ? `（${s.name}）` : ''
        }`;
        dot.appendChild(title);
      }
      g.appendChild(dot);
    });
  });

  // ---- 轴标签 ----
  const fs = opts.labelSize || (n > 10 ? 9 : 10.5);
  axes.forEach((a, i) => {
    const f = 1.13;
    const [x, y] = pt(i, f);
    const cos = Math.cos(angle(i));
    const sin = Math.sin(angle(i));
    const anchor = Math.abs(cos) < 0.22 ? 'middle' : cos > 0 ? 'start' : 'end';
    const dy = sin > 0.6 ? 10 : sin < -0.6 ? -2 : 4;

    const label = a.short || a.label;
    const labelNode = svgText(label, {
      x, y: y + dy,
      'text-anchor': anchor,
      'font-size': fs,
      'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
      fill: a.color || cMuted,
      'letter-spacing': '0.04em',
    });
    if (Number.isFinite(a.value)) {
      const t = svg('title', {});
      t.textContent = `${a.label || a.id || ''} · ${round(a.value, 1)}`;
      labelNode.appendChild(t);
    }
    g.appendChild(labelNode);

    if (opts.showValues && Number.isFinite(a.value)) {
      g.appendChild(svgText(`${round(a.value, 0)}`, {
        x, y: y + dy + (sin < -0.6 ? -12 : 12),
        'text-anchor': anchor,
        'font-size': fs - 1.5,
        'font-family': "'Noto Serif SC',Georgia,serif",
        fill: cText,
        'font-variant-numeric': 'tabular-nums',
        opacity: 0.7,
      }));
    }
  });

  return root;
}

/* ------------------------------------------------------------
   面具虚实叠层雷达：外显自评（虚）vs 暗线底色（实）
   ------------------------------------------------------------ */
function maskRadar(axes, opts = {}) {
  return radarSvg(axes, {
    ...opts,
    series: [
      {
        name: opts.surfaceName || '表层面具',
        values: axes.map((a) => a.masked ?? a.value),
        color: opts.surfaceColor || '#A8894F',
        dashed: true,
        fill: false,
        width: 1.4,
      },
      {
        name: opts.depthName || '潜意识底色',
        values: axes.map((a) => a.value),
        color: opts.depthColor || '#8C4A32',
        fill: true,
        fillOpacity: 0.1,
        width: 1.8,
      },
    ],
  });
}

/* ------------------------------------------------------------
   双人叠加雷达
   ------------------------------------------------------------ */
function dualRadar(axesA, valuesB, opts = {}) {
  return radarSvg(axesA, {
    ...opts,
    series: [
      {
        name: opts.nameA || 'A',
        values: axesA.map((a) => a.value),
        color: opts.colorA || '#8C4A32',
        fillOpacity: 0.1,
        width: 1.7,
      },
      {
        name: opts.nameB || 'B',
        values: valuesB,
        color: opts.colorB || '#3B4D70',
        fillOpacity: 0.1,
        width: 1.7,
      },
    ],
  });
}

/* ============================================================
   1 · 压力变形沙盒
   ============================================================ */

/**
 * 压力偏移模型。
 *
 * 直觉上「能量充沛」时人会稍微更接近自己的明线表显层，
 * 「极度耗竭」时则向暗线高压层滑落。这里不重跑题库，
 * 而是用一套可解释的线性偏移：
 *
 *   energy 0（极度耗竭） → 每个维度向「暗面方向」偏移
 *   energy 50（日常常态） → 原样
 *   energy 100（充沛顺境）→ 向「明面方向」偏移
 *
 * 「暗面方向」不是随意的：它由维度自身的极性决定——
 * 原罪 / 暗黑三角 / 防御 / 依恋不安 这类越耗竭越强，
 * 美德 / 光明三角 / 自主 / 掌控 这类越耗竭越弱。
 */
const DARKWARD = new Set([
  'sin_pride', 'sin_greed', 'sin_lust', 'sin_envy', 'sin_gluttony', 'sin_wrath', 'sin_sloth',
  'dark_mach', 'dark_narc', 'dark_psycho', 'covert_control',
  'att_anxiety', 'att_avoidance',
  'def_intellectual', 'def_detach', 'def_attack', 'def_fawn', 'def_project',
  'big5_alert', 'big5_rumination',
  'schema_abandonment', 'schema_deprivation', 'schema_defect', 'schema_mistrust',
  'schema_isolation', 'schema_std', 'schema_sacrifice', 'schema_approval',
  'schema_entitlement', 'schema_negativity',
  'hsp_sensory', 'hsp_emotional',
  'money_avoid', 'money_worship', 'money_status',
  'tki_avoiding', 'tki_competing', 'pac_child',
  'enn_4', 'enn_6', 'enn_9',
  'phil_cynic', 'phil_nihilism',
]);

const AMPLITUDE = 16;   // 满偏移时每个维度最多移动 16 分

/**
 * @param {Object} scores  当前得分
 * @param {number} energy  0–100
 * @returns {{ scores, delta, dominant, warnings, highlight }}
 */
function pressureSandbox(scores, energy = 50) {
  const e = clamp(Number.isFinite(energy) ? energy : 50, 0, 100);
  // t ∈ [-1, +1]：负数=耗竭，正数=充沛
  const t = (e - 50) / 50;

  const out = {};
  const delta = {};

  for (const [dim, raw] of Object.entries(scores || {})) {
    if (!Number.isFinite(raw)) continue;
    const darkward = DARKWARD.has(dim);
    // 充沛时明面维度上行、暗面维度下行；耗竭时反过来
    const dir = darkward ? -1 : 1;
    const shift = t * AMPLITUDE * dir;
    const next = clamp(raw + shift, 0, 100);
    out[dim] = round(next, 1);
    delta[dim] = round(next - raw, 1);
  }

  /* 变动最大的几项，用于文案 */
  const moved = Object.entries(delta)
    .filter(([, d]) => Math.abs(d) >= 1)
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));

  const rising = moved.filter(([, d]) => d > 0).slice(0, 3);
  const falling = moved.filter(([, d]) => d < 0).slice(0, 3);

  /* 预警：耗竭态下被推到危险高位的暗面维度 */
  const warnings = [];
  if (e < 40) {
    const hot = Object.entries(out)
      .filter(([dim, v]) => DARKWARD.has(dim) && v >= 68 && (scores[dim] ?? 0) < 62)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);
    for (const [dim, v] of hot) warnings.push({ dim, value: round(v, 1), kind: 'ember' });
  }

  const stage = e >= 78 ? 'zone' : e >= 55 ? 'steady' : e >= 32 ? 'tired' : 'depleted';

  return {
    energy: e,
    stage,
    scores: out,
    delta,
    rising,
    falling,
    warnings,
    mean: round(mean(Object.values(out)), 1),
  };
}

/**
 * @param {Object} scores
 * @returns {Array} 命中的张力对，按两端平均分降序
 */
function innerParliament(scores, limit = 3) {
  const s = scores || {};
  const out = [];

  for (const p of PARLIAMENT_PAIRS) {
    const av = s[p.a];
    const bv = s[p.b];
    if (!Number.isFinite(av) || !Number.isFinite(bv)) continue;
    if (av < p.threshold || bv < p.threshold) continue;

    const intensity = round((av + bv) / 2, 1);
    out.push({
      ...p,
      aScore: round(av, 0),
      bScore: round(bv, 0),
      intensity,
      /* 两端越接近，张力越大 */
      balance: round(100 - Math.abs(av - bv), 1),
    });
  }

  return out
    .sort((x, y) => (y.intensity + y.balance * 0.4) - (x.intensity + x.balance * 0.4))
    .slice(0, limit);
}

/* ============================================================
   3 · 时间胶囊
   ============================================================ */

/**
 * 对照两份得分，找出变化最大的维度。
 * @param {Object} past    过往快照的 scores
 * @param {Object} now     当前 scores
 * @param {Object} dimMap
 * @returns {{ rows, top5, meanShift, pastMean, nowMean, verdict }}
 */
function timelineDiff(past, now, dimMap = {}) {
  const rows = [];

  for (const [dim, nowV] of Object.entries(now || {})) {
    const pastV = past?.[dim];
    if (!Number.isFinite(nowV) || !Number.isFinite(pastV)) continue;
    rows.push({
      id: dim,
      name: dimMap[dim]?.name || dim,
      past: round(pastV, 1),
      now: round(nowV, 1),
      delta: round(nowV - pastV, 1),
    });
  }

  const top5 = [...rows]
    .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
    .slice(0, 5);

  const pastMean = rows.length ? round(mean(rows.map((r) => r.past)), 1) : null;
  const nowMean = rows.length ? round(mean(rows.map((r) => r.now)), 1) : null;
  const meanShift = rows.length ? round(nowMean - pastMean, 1) : null;

  const up = top5.filter((r) => r.delta > 0);
  const down = top5.filter((r) => r.delta < 0);

  let verdict = '';
  if (!rows.length) {
    verdict = '两份存档没有重叠维度，无法对照。';
  } else if (Math.abs(meanShift) < 2 && top5.every((r) => Math.abs(r.delta) < 6)) {
    verdict = '这段时间你的整体结构基本没动。稳定本身就是一种信息——要么环境没变，要么你的应对方式很稳。';
  } else if (meanShift > 5) {
    verdict = `整体上调了 ${meanShift} 分：${up[0]?.name || '多个维度'}明显走高。留意这是真的变了，还是这次作答比上次更愿意说自己好。`;
  } else if (meanShift < -5) {
    verdict = `整体下调了 ${Math.abs(meanShift)} 分：${down[0]?.name || '多个维度'}明显走低。如果这段时间确实不顺，这组数字更像一份记录，不是一份判决。`;
  } else {
    verdict = `整体只动了 ${meanShift} 分，但个别维度变化不小。这种「局部漂移」通常说明某一件具体的事改变了你的一部分，而不是整个人。`;
  }

  return { rows, top5, pastMean, nowMean, meanShift, verdict };
}

/* ============================================================
   LabView.js — 个人深度实验室（Phase 3 的三个模块）
   · sandboxSection   压力变形沙盒（交互滑杆 + 实时形变雷达）
   · parliamentSection 内在议会（双声部对话）
   · timelineSection   时间胶囊（双层对照 + 变化 Top 5）

/* ------------------------------------------------------------
   小工具
   ------------------------------------------------------------ */

const labHead = (no, title, hint) => el('div', { class: 'rsec__head' }, [
  el('span', { class: 'rsec__no', text: no }),
  el('h2', { text: title }),
  hint ? el('p', { text: hint }) : null,
]);

/* ------------------------------------------------------------
   雷达共用：挑一组有信息量的维度
   ------------------------------------------------------------ */

const RADAR_PICKS = [
  ['sin_pride', '自尊'],
  ['virtue_humility', '谦逊'],
  ['mot_autonomy', '自主'],
  ['mot_security', '安全'],
  ['big5_order', '秩序'],
  ['hsp_sensory', '敏惑'],
  ['big5_assert', '表达'],
  ['light_kant', '原则'],
  ['dark_mach', '谋略'],
  ['att_anxiety', '焦虑'],
];

function pickAxes(scores, max = 8) {
  const out = [];
  for (const [id, label] of RADAR_PICKS) {
    if (Number.isFinite(scores?.[id])) out.push({ id, label, value: scores[id] });
    if (out.length >= max) break;
  }
  if (out.length < 3) return [];
  return out;
}

/* ============================================================
   1 · 压力变形沙盒
   ============================================================ */

function sandboxSection({ scores, colors }) {
  const axes = pickAxes(scores);
  if (axes.length < 3) return null;

  const sec = el('section', { class: 'rsec', id: 'r-sandbox' });

  sec.appendChild(labHead('05', '压力变形沙盒', '拖动滑杆，看同一套特质在不同电量下会长成什么形状'));

  /* ---- 说明 ---- */
  sec.appendChild(el('p', {
    class: 'sandbox__lead',
    text: '下面这张雷达会随滑杆实时变形。往左是耗竭，暗面维度会涨、明面维度会退；往右是充沛，反过来。'
      + '它不是预测，是一个可解释的线性模型：满偏移最多移动 16 分。',
  }));

  /* ---- 滑杆 + 舞台 ---- */
  const stageBox = el('div', { class: 'sandbox' });
  sec.appendChild(stageBox);

  const control = el('div', { class: 'sandbox__control' });

  const valueTag = el('div', { class: 'sandbox__value' });
  const sliderWrap = el('div', { class: 'sandbox__slider' });

  const input = el('input', {
    type: 'range',
    min: '0',
    max: '100',
    step: '1',
    value: '50',
    class: 'sandbox__range',
    'aria-label': '内在能量模拟',
  });
  sliderWrap.appendChild(input);

  const ticks = el('div', { class: 'sandbox__ticks' });
  ENERGY_STAGES.slice().reverse().forEach((st) => {
    ticks.appendChild(el('span', { text: st.name }));
  });
  sliderWrap.appendChild(ticks);

  control.appendChild(valueTag);
  control.appendChild(sliderWrap);

  const stageCard = el('div', { class: 'sandbox__stage' });
  control.appendChild(stageCard);

  stageBox.appendChild(control);

  const canvas = el('div', { class: 'sandbox__canvas' });
  stageBox.appendChild(canvas);

  const deltaList = el('div', { class: 'sandbox__delta' });
  stageBox.appendChild(deltaList);

  /* ---- 渲染 ---- */
  function render(energy) {
    const sim = pressureSandbox(scores, energy);
    const stage = stageOf(energy);

    valueTag.innerHTML = '';
    valueTag.appendChild(el('b', { text: String(Math.round(energy)) }));
    valueTag.appendChild(el('i', { text: stage.name }));

    stageCard.innerHTML = '';
    stageCard.appendChild(el('h4', { text: stage.headline }));
    stageCard.appendChild(el('p', { text: stage.body }));

    canvas.innerHTML = '';
    const simAxes = axes.map((a) => ({
      ...a,
      value: Number.isFinite(sim.scores[a.id]) ? sim.scores[a.id] : a.value,
    }));

    canvas.appendChild(radarSvg(simAxes, {
      width: 480,
      colorText: colors.text,
      colorMuted: colors.muted,
      colorBorder: colors.border,
      bg: colors.card,
      series: [
        {
          name: '日常常态',
          values: axes.map((a) => a.value),
          color: colors.faint,
          dashed: true,
          fillOpacity: 0.03,
          width: 1.1,
        },
        {
          name: stage.name,
          values: simAxes.map((a) => a.value),
          color: energy < 45 ? colors.sin : energy > 60 ? colors.virtue : colors.gold,
          fillOpacity: 0.14,
        },
      ],
      showValues: false,
      labelSize: 10.5,
      ariaLabel: '压力变形沙盒雷达',
    }));

    deltaList.innerHTML = '';
    const moved = [...sim.rising, ...sim.falling]
      .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
      .slice(0, 6);

    if (!moved.length) {
      deltaList.appendChild(el('p', {
        class: 'sandbox__hint',
        text: '这就是你的日常常态，没有偏移。',
      }));
    } else {
      moved.forEach(([dim, d]) => {
        deltaList.appendChild(el('div', {
          class: `sandbox__chip is-${d > 0 ? 'up' : 'down'}`,
        }, [
          el('span', { text: colors.dimName(dim) }),
          el('b', { text: `${d > 0 ? '+' : ''}${round(d, 1)}` }),
        ]));
      });
    }

    /* 耗竭态的红色警示 */
    const warnBox = sec.querySelector('.sandbox__warn');
    if (warnBox) warnBox.remove();

    if (sim.warnings.length && energy < 42) {
      const w = el('div', { class: 'sandbox__warn' });
      w.appendChild(el('b', { text: '此刻最需要拉响的刹车' }));
      sim.warnings.forEach((x) => {
        w.appendChild(el('p', {
          text: `${colors.dimName(x.dim)} 被推到 ${x.value}——这个高度通常是耗竭带来的，不是你本来的样子。`,
        }));
      });
      stageBox.appendChild(w);
    }
  }

  input.addEventListener('input', () => render(Number(input.value)));

  /* 三档快捷按钮 */
  const presets = el('div', { class: 'sandbox__presets' });
  [
    ['充沛顺境', 88],
    ['日常常态', 50],
    ['极度耗竭', 12],
  ].forEach(([label, v]) => {
    presets.appendChild(el('button', {
      class: 'btn btn--sm',
      type: 'button',
      text: label,
      onclick: () => {
        input.value = String(v);
        render(v);
      },
    }));
  });
  stageBox.appendChild(presets);

  render(Number(input.value));
  return sec;
}

/* ============================================================

function parliamentSection({ scores }) {

  const sec = el('section', { class: 'rsec', id: 'r-parliament' });

/* ============================================================
   3 · 时间胶囊
   ============================================================ */

function timelineSection({ state, scores, colors, dimMap }) {
  const sec = el('section', { class: 'rsec', id: 'r-timeline' });

  sec.appendChild(labHead('07', '时间胶囊', '把过去的自己调出来，放在同一张图上'));

  /* 候选来源：1) 各卷的初印象快照 2) 手动粘贴的历史存档码 */
  const snaps = [];
  const initial = state.initialSnapshot || {};
  for (const [volId, snap] of Object.entries(initial)) {
    if (!snap?.scores) continue;
    snaps.push({
      key: `snap:${volId}`,
      label: `${volId.toUpperCase()} 初印象 · ${new Date(snap.sealedAt).toISOString().slice(0, 10)}`,
      scores: snap.scores,
      at: snap.sealedAt,
    });
  }

  const body = el('div', { class: 'timeline' });

  const status = el('p', { class: 'sandbox__hint', text: '' });
  const resultBox = el('div', { class: 'timeline__result' });

  const inputRow = el('div', { class: 'timeline__input' });
  const ta = el('textarea', {
    class: 'field field--code',
    rows: '3',
    placeholder: '粘贴一份历史 HA4- 存档码（可选）',
  });
  inputRow.appendChild(ta);
  inputRow.appendChild(el('button', {
    class: 'btn btn--sm btn--solid',
    type: 'button',
    text: '对照',
    onclick: () => {
      const raw = ta.value.trim();
      if (!raw) { toast('先粘贴一份存档码'); return; }
      const res = decodeSoulCode(raw, state.__dimOrder || []);
      if (!res.ok) { toast(res.error || '解码失败'); return; }
      renderDiff(res.state.computedScores, res.state.stamp || '历史存档');
    },
  }));
  body.appendChild(inputRow);

  /* 初印象快捷按钮 */
  if (snaps.length) {
    const chips = el('div', { class: 'timeline__chips' });
    snaps.slice(0, 4).forEach((s) => {
      chips.appendChild(el('button', {
        class: 'btn btn--sm btn--ghost',
        type: 'button',
        text: s.label,
        onclick: () => renderDiff(s.scores, s.label),
      }));
    });
    body.appendChild(chips);
  } else {
    body.appendChild(el('p', {
      class: 'sandbox__hint',
      text: '还没有初印象快照。每卷第一次完成时会自动封存一份，重测之后就能在这里对照。',
    }));
  }

  body.appendChild(status);
  body.appendChild(resultBox);

  function renderDiff(pastScores, label) {
    const diff = timelineDiff(pastScores, scores, dimMap);
    resultBox.innerHTML = '';

    if (!diff.rows.length) {
      resultBox.appendChild(el('p', { class: 'sandbox__hint', text: '两份数据没有重叠维度，无法对照。' }));
      return;
    }

    status.textContent = `对照：${label} · ${diff.rows.length} 个重叠维度`;

    /* 双层雷达 */
    const axes = pickAxes(scores, 8).filter((a) => Number.isFinite(pastScores[a.id]));
    if (axes.length >= 3) {
      const radarBox = el('div', { class: 'timeline__radar' });
      radarBox.appendChild(radarSvg(
        axes.map((a) => ({ ...a, value: pastScores[a.id] })),
        {
          width: 480,
          colorText: colors.text,
          colorMuted: colors.muted,
          colorBorder: colors.border,
          bg: colors.card,
          series: [
            {
              name: '过去',
              values: axes.map((a) => pastScores[a.id]),
              color: colors.faint,
              dashed: true,
              fillOpacity: 0.03,
              width: 1.1,
            },
            {
              name: '此刻',
              values: axes.map((a) => scores[a.id]),
              color: colors.gold,
              fillOpacity: 0.13,
            },
          ],
          labelSize: 10.5,
          ariaLabel: '时间胶囊双层雷达',
        },
      ));
      resultBox.appendChild(radarBox);
    }

    /* 变化 Top 5 */
    const list = el('div', { class: 'timeline__list' });
    diff.top5.forEach((r) => {
      const dir = r.delta > 0 ? 'up' : r.delta < 0 ? 'down' : 'flat';
      list.appendChild(el('div', { class: 'timeline__row' }, [
        el('span', { class: 'timeline__name', text: r.name }),
        el('span', { class: 'timeline__past', text: String(Math.round(r.past)) }),
        el('span', { class: 'timeline__arrow', text: '→' }),
        el('span', { class: 'timeline__now', text: String(Math.round(r.now)) }),
        el('span', { class: `timeline__delta is-${dir}`, text: `${r.delta > 0 ? '+' : ''}${r.delta}` }),
      ]));
    });
    resultBox.appendChild(list);

    resultBox.appendChild(el('p', { class: 'timeline__verdict', text: diff.verdict }));
  }

  sec.appendChild(body);
  return sec;
}

/* ───────── src/viz/butterflySvg.js ───────── */
/* ============================================================
   butterflySvg.js — 七美德 × 七原罪 双翼蝶形图
   中轴对称：左翼暖青绿延展美德，右翼暗红琥珀延展原罪。
   ============================================================ */



const PAIRS = [
  { sin: 'sin_pride', virtue: 'virtue_humility', label: '自尊', s: '傲慢', v: '谦逊' },
  { sin: 'sin_greed', virtue: 'virtue_charity', label: '资源', s: '贪婪', v: '慷慨' },
  { sin: 'sin_lust', virtue: 'virtue_chastity', label: '感官', s: '沉溺', v: '节制' },
  { sin: 'sin_envy', virtue: 'virtue_kindness', label: '比较', s: '嫉妒', v: '欣赏' },
  { sin: 'sin_gluttony', virtue: 'virtue_temperance', label: '代偿', s: '放纵', v: '克制' },
  { sin: 'sin_wrath', virtue: 'virtue_patience', label: '边界', s: '愤怒', v: '宽容' },
  { sin: 'sin_sloth', virtue: 'virtue_diligence', label: '启动', s: '逃避', v: '勤勉' },
];

/**
 * @param {Object} dims  维度分数字典
 * @param {Object} opts  { width, colorVirtue, colorSin, colorText, colorMuted, colorBorder }
 */
function butterflySvg(dims, opts = {}) {
  const W = opts.width || 720;
  const H = Math.round(W * 0.66);
  const cx = W / 2;
  const cy = H / 2;
  const wingW = cx * 0.82;
  const maxR = cy * 0.84;

  const cV = opts.colorVirtue || '#4A6B5D';
  const cS = opts.colorSin || '#8C4A32';
  const cText = opts.colorText || '#1E2220';
  const cMuted = opts.colorMuted || '#8B8F89';
  const cBorder = opts.colorBorder || '#E4DFD4';

  const root = svg('svg', {
    viewBox: `0 0 ${W} ${H}`,
    width: '100%',
    role: 'img',
    'aria-label': '七美德与七原罪双翼蝶形图',
  });

  const g = svg('g', {});
  root.appendChild(g);

  const rows = PAIRS.map((p, i) => {
    const t = PAIRS.length === 1 ? 0.5 : i / (PAIRS.length - 1);
    const y = 46 + t * (H - 92);
    const vs = Number.isFinite(dims[p.virtue]) ? dims[p.virtue] : 50;
    const sn = Number.isFinite(dims[p.sin]) ? dims[p.sin] : 50;
    return { ...p, y, vs, sn, t };
  });

  // ---- 中轴 ----
  g.appendChild(svg('line', {
    x1: cx, y1: 26, x2: cx, y2: H - 26,
    stroke: cBorder, 'stroke-width': 1, 'stroke-dasharray': '2 5',
  }));

  // ---- 网格弧 ----
  [0.25, 0.5, 0.75, 1].forEach((f) => {
    const rx = wingW * f;
    [1, -1].forEach((dir) => {
      const path = svg('path', {
        d: `M ${cx} ${cy - maxR * f * 0.82} C ${cx + dir * rx * 0.62} ${cy - maxR * f * 0.66},
            ${cx + dir * rx} ${cy - maxR * f * 0.28}, ${cx + dir * rx} ${cy}
            C ${cx + dir * rx} ${cy + maxR * f * 0.28},
            ${cx + dir * rx * 0.62} ${cy + maxR * f * 0.66}, ${cx} ${cy + maxR * f * 0.82}`,
        fill: 'none',
        stroke: cBorder,
        'stroke-width': 0.8,
        opacity: f === 1 ? 0.9 : 0.55,
      });
      g.appendChild(path);
    });
  });

  // ---- 双翼填充 ----
  const wingPath = (vals, dir) => {
    const pts = vals.map((v, i) => {
      const t = vals.length === 1 ? 0.5 : i / (vals.length - 1);
      const y = 46 + t * (H - 92);
      const x = cx + dir * wingW * (clamp(v, 0, 100) / 100);
      return [x, y];
    });
    let d = `M ${cx} ${cy}`;
    // 上缘到第一个点
    d += ` C ${cx + dir * wingW * 0.2} ${cy - maxR * 0.5}, ${pts[0][0] * 0.6 + cx * 0.4} ${pts[0][1] + 12}, ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i += 1) {
      const [px, py] = pts[i - 1];
      const [x, y] = pts[i];
      const midY = (py + y) / 2;
      d += ` C ${px} ${midY}, ${x} ${midY}, ${x} ${y}`;
    }
    const last = pts[pts.length - 1];
    d += ` C ${last[0] * 0.6 + cx * 0.4} ${last[1] - 12}, ${cx + dir * wingW * 0.2} ${cy + maxR * 0.5}, ${cx} ${cy}`;
    d += ' Z';
    return d;
  };

  const gradV = svg('linearGradient', { id: 'bw-v', x1: '0', y1: '0', x2: '1', y2: '0' });
  gradV.appendChild(svg('stop', { offset: '0%', 'stop-color': cV, 'stop-opacity': '0.34' }));
  gradV.appendChild(svg('stop', { offset: '100%', 'stop-color': cV, 'stop-opacity': '0.05' }));
  const gradS = svg('linearGradient', { id: 'bw-s', x1: '1', y1: '0', x2: '0', y2: '0' });
  gradS.appendChild(svg('stop', { offset: '0%', 'stop-color': cS, 'stop-opacity': '0.34' }));
  gradS.appendChild(svg('stop', { offset: '100%', 'stop-color': cS, 'stop-opacity': '0.05' }));

  const defs = svg('defs', {});
  defs.appendChild(gradV);
  defs.appendChild(gradS);
  root.insertBefore(defs, g);

  g.appendChild(svg('path', {
    d: wingPath(rows.map((r) => r.vs), -1),
    fill: 'url(#bw-v)', stroke: cV, 'stroke-width': 1.4, 'stroke-linejoin': 'round',
  }));
  g.appendChild(svg('path', {
    d: wingPath(rows.map((r) => r.sn), 1),
    fill: 'url(#bw-s)', stroke: cS, 'stroke-width': 1.4, 'stroke-linejoin': 'round',
  }));

  // ---- 节点与标签 ----
  rows.forEach((r) => {
    const xv = cx - wingW * (r.vs / 100);
    const xs = cx + wingW * (r.sn / 100);

    g.appendChild(svg('circle', { cx: xv, cy: r.y, r: 3, fill: cV, stroke: '#fff', 'stroke-width': 1 }));
    g.appendChild(svg('circle', { cx: xs, cy: r.y, r: 3, fill: cS, stroke: '#fff', 'stroke-width': 1 }));

    // 左右短引线 + 文字
    const labelY = r.y + 3.6;
    const leftAnchor = 'end';
    const rightAnchor = 'start';

    g.appendChild(svg('line', {
      x1: xv, y1: r.y, x2: Math.max(8, xv - 8), y2: r.y,
      stroke: cV, 'stroke-width': 0.6, opacity: 0.4,
    }));
    g.appendChild(svg('line', {
      x1: xs, y1: r.y, x2: Math.min(W - 8, xs + 8), y2: r.y,
      stroke: cS, 'stroke-width': 0.6, opacity: 0.4,
    }));

    // 端点：精确分数（上一行维度名由中轴统一标注）
    const lt = svgText(`${round(r.vs, 0)}`, {
      x: Math.max(6, xv - 11),
      y: labelY,
      'text-anchor': leftAnchor,
      'font-size': W > 560 ? 10.5 : 9,
      'font-family': "'Noto Serif SC',Georgia,serif",
      fill: cV,
      'font-variant-numeric': 'tabular-nums',
      opacity: 0.85,
    });
    const ltTitle = svg('title', {});
    ltTitle.textContent = `${r.v} · ${round(r.vs, 1)}`;
    lt.appendChild(ltTitle);
    g.appendChild(lt);

    const rt = svgText(`${round(r.sn, 0)}`, {
      x: Math.min(W - 6, xs + 11),
      y: labelY,
      'text-anchor': rightAnchor,
      'font-size': W > 560 ? 10.5 : 9,
      'font-family': "'Noto Serif SC',Georgia,serif",
      fill: cS,
      'font-variant-numeric': 'tabular-nums',
      opacity: 0.85,
    });
    const rtTitle = svg('title', {});
    rtTitle.textContent = `${r.s} · ${round(r.sn, 1)}`;
    rt.appendChild(rtTitle);
    g.appendChild(rt);

    // 中轴：7 组维度名称（左美德 / 右原罪，用斜杠分开）
    const midLabel = svgText(`${r.v}/${r.s}`, {
      x: cx,
      y: r.y + 3.4,
      'text-anchor': 'middle',
      'font-size': W > 560 ? 9 : 8,
      'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
      fill: cMuted,
      'letter-spacing': '0.02em',
    });
    // 白底托片，压住中轴虚线，保证可读
    const pillW = (W > 560 ? 9 : 8) * 4.2;
    g.appendChild(svg('rect', {
      x: cx - pillW / 2, y: r.y - 6, width: pillW, height: 12,
      fill: opts.bg || '#FCFBF8', opacity: 0.92, rx: 2,
    }));
    g.appendChild(midLabel);
  });

  // ---- 中心徽记 ----
  g.appendChild(svg('circle', { cx, cy, r: 15, fill: opts.bg || '#FCFBF8', stroke: cBorder, 'stroke-width': 1 }));
  g.appendChild(svg('circle', { cx, cy, r: 4.5, fill: 'none', stroke: cText, 'stroke-width': 1 }));
  g.appendChild(svg('line', { x1: cx, y1: cy - 15, x2: cx, y2: cy - 8, stroke: cBorder, 'stroke-width': 1 }));
  g.appendChild(svg('line', { x1: cx, y1: cy + 8, x2: cx, y2: cy + 15, stroke: cBorder, 'stroke-width': 1 }));

  // ---- 标题 ----
  const tv = svgText('美德 · 秩序', {
    x: cx - 34, y: 22, 'text-anchor': 'end',
    'font-size': 9.5, 'letter-spacing': '0.24em',
    'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
    fill: cV,
  });
  const ts = svgText('驱力 · 原罪', {
    x: cx + 34, y: 22, 'text-anchor': 'start',
    'font-size': 9.5, 'letter-spacing': '0.24em',
    'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
    fill: cS,
  });
  g.appendChild(tv);
  g.appendChild(ts);

  // ---- 左右均分 ----
  const mv = round(rows.reduce((a, r) => a + r.vs, 0) / rows.length, 1);
  const ms = round(rows.reduce((a, r) => a + r.sn, 0) / rows.length, 1);

  g.appendChild(svgText(`${mv}`, {
    x: cx - 34, y: H - 8, 'text-anchor': 'end',
    'font-size': 15, 'font-family': "'Noto Serif SC',Georgia,serif",
    fill: cV, 'font-variant-numeric': 'tabular-nums',
  }));
  g.appendChild(svgText(`${ms}`, {
    x: cx + 34, y: H - 8, 'text-anchor': 'start',
    'font-size': 15, 'font-family': "'Noto Serif SC',Georgia,serif",
    fill: cS, 'font-variant-numeric': 'tabular-nums',
  }));

  return root;
}

/* ============================================================
   spectrumSvg.js — 双极倾向光谱条
   中轴为 50，两侧为对立极。
   使用 HTML 承载文字（保证不随 SVG 缩放变形），SVG 只绘制轨道与指示点。
   ============================================================ */



/**
 * @param {Object} o { id, name, negLabel, posLabel, value, color }
 * @param {Object} opt { negColor, posColor, colorMuted, colorBorder, bg }
 * @returns {HTMLElement}
 */
function spectrumSvg(o, opt = {}) {
  const v = clamp(Number.isFinite(o.value) ? o.value : 50, 0, 100);
  const color = o.color || opt.color || '#A8894F';
  const cBorder = opt.colorBorder || '#E4DFD4';
  const cMuted = opt.colorMuted || '#8B8F89';
  const bg = opt.bg || '#FCFBF8';
  const negColor = opt.negColor || '#4A6B5D';
  const posColor = opt.posColor || '#8C4A32';

  const wrap = document.createElement('div');
  wrap.className = 'spectrum';
  wrap.setAttribute('role', 'img');
  wrap.setAttribute('aria-label', `${o.name || ''} 双极光谱，${v}`);

  /* ---------- 轨道 ---------- */
  const trackBox = document.createElement('div');
  trackBox.className = 'spectrum__track';

  const W = 320;
  const H = 26;
  const trackY = 14;
  const gid = `sp-${(o.id || Math.random().toString(36).slice(2, 8))}`;

  const s = svg('svg', {
    viewBox: `0 0 ${W} ${H}`,
    preserveAspectRatio: 'none',
    class: 'spectrum__svg',
  });

  const defs = svg('defs', {});
  const grad = svg('linearGradient', { id: gid, x1: '0', y1: '0', x2: '1', y2: '0' });
  grad.appendChild(svg('stop', { offset: '0%', 'stop-color': negColor, 'stop-opacity': '0.55' }));
  grad.appendChild(svg('stop', { offset: '50%', 'stop-color': cBorder, 'stop-opacity': '0.28' }));
  grad.appendChild(svg('stop', { offset: '100%', 'stop-color': posColor, 'stop-opacity': '0.55' }));
  defs.appendChild(grad);
  s.appendChild(defs);

  // 底轨
  s.appendChild(svg('rect', {
    x: 0, y: trackY, width: W, height: 2, rx: 1, fill: cBorder,
  }));
  // 渐变染层
  s.appendChild(svg('rect', {
    x: 0, y: trackY, width: W, height: 2, rx: 1, fill: `url(#${gid})`,
  }));

  // 中心与两端刻度
  [0, 0.5, 1].forEach((f) => {
    s.appendChild(svg('line', {
      x1: W * f, y1: trackY - 5, x2: W * f, y2: trackY + 7,
      stroke: cBorder, 'stroke-width': 1,
    }));
  });

  // 指示点
  const x = (W * v) / 100;
  s.appendChild(svg('circle', { cx: x, cy: trackY, r: 9, fill: color, opacity: 0.12 }));
  s.appendChild(svg('circle', { cx: x, cy: trackY, r: 4, fill: color, stroke: bg, 'stroke-width': 1.6 }));

  trackBox.appendChild(s);
  wrap.appendChild(trackBox);

  /* ---------- 数值 ---------- */
  const val = document.createElement('div');
  val.className = 'spectrum__value';
  val.style.color = color;
  val.style.left = `${v}%`;
  val.style.transform = 'translateX(-50%)';
  val.textContent = String(round(v, 0));
  wrap.appendChild(val);

  /* ---------- 两极标签 ---------- */
  const poles = document.createElement('div');
  poles.className = 'spectrum__poles';
  const neg = document.createElement('span');
  neg.textContent = o.negLabel || '低';
  const pos = document.createElement('span');
  pos.textContent = o.posLabel || '高';
  pos.style.textAlign = 'right';
  poles.appendChild(neg);
  poles.appendChild(pos);
  wrap.appendChild(poles);

  return wrap;
}

/** 批量列表（带名称列） */
function spectrumList(items, opt = {}) {
  const frag = document.createDocumentFragment();
  items.forEach((it) => {
    const row = document.createElement('div');
    row.className = 'spec-item';

    const name = document.createElement('div');
    name.className = 'spec-item__name';
    name.textContent = it.name;

    const box = document.createElement('div');
    box.className = 'spec-svg';
    box.appendChild(spectrumSvg(it, { ...opt, color: it.color || opt.color || '#A8894F' }));

    row.appendChild(name);
    row.appendChild(box);
    frag.appendChild(row);
  });
  return frag;
}

function attachmentStyle(anxiety, avoidance) {
  const a = Number.isFinite(anxiety) ? anxiety : 50;
  const v = Number.isFinite(avoidance) ? avoidance : 50;
  if (a < 52 && v < 52) return ATTACHMENT_STYLES.secure;
  if (a >= 52 && v < 52) return ATTACHMENT_STYLES.anxious;
  if (a < 52 && v >= 52) return ATTACHMENT_STYLES.avoidant;

/**
 * @param {Object} o { anxiety, avoidance, partner?: {anxiety, avoidance, name} }

function quadrantSvg(o = {}, opt = {}) {
  const W = opt.width || 460;
  const H = opt.height || Math.round(W * 0.96);
  const padL = 46;
  const padR = 22;

  g.appendChild(svg('line', {
    x1: padL, y1: padT + ih / 2, x2: padL + iw, y2: padT + ih / 2,
    stroke: cBorder, 'stroke-width': 0.9, 'stroke-dasharray': '3 4',
  }));

  // 轴标题
  g.appendChild(svgText('回避 →', {
    x: W - padR, y: H - 12, 'text-anchor': 'end',

    'font-family': "'Noto Sans SC','PingFang SC',sans-serif", fill: cMuted,

  g.appendChild(svgText('焦虑 ↑', {

  // 象限标签

/* ───────── src/viz/triadSvg.js ───────── */
/* ============================================================
   triadSvg.js — 光明三角 × 黑暗三角 对照图
   左右两枚等边三角形，顶点分别为三组特质；填充面积即该侧强度。
   用于 Vol.3 单卷报告（此前该卷没有任何图表）。
   ============================================================ */



const LIGHT = [
  { dim: 'light_humanism', short: '人本' },
  { dim: 'light_kant', short: '康德' },
  { dim: 'light_faith', short: '信仰' },
];

const DARK = [
  { dim: 'dark_mach', short: '谋略' },
  { dim: 'dark_narc', short: '自恋' },
  { dim: 'dark_psycho', short: '冷酷' },
];

/**
 * @param {Object} scores 维度分数字典
 * @param {Object} opt   { width, colorLight, colorDark, colorText, colorMuted, colorBorder, bg }
 */
function triadSvg(scores, opt = {}) {
  const W = opt.width || 560;
  const H = Math.round(W * 0.52);

  const cLight = opt.colorLight || '#4A6B5D';
  const cDark = opt.colorDark || '#8C4A32';
  const cText = opt.colorText || '#1E2220';
  const cMuted = opt.colorMuted || '#8B8F89';
  const cBorder = opt.colorBorder || '#E4DFD4';
  const bg = opt.bg || '#FCFBF8';

  const root = svg('svg', {
    viewBox: `0 0 ${W} ${H}`,
    width: '100%',
    role: 'img',
    'aria-label': '光明三角与黑暗三角对照图',
  });

  const g = svg('g', {});
  root.appendChild(g);

  const R = Math.min(W * 0.2, H * 0.34);
  const centers = [
    { cx: W * 0.25, cy: H * 0.53, items: LIGHT, color: cLight, name: '光明三角', vals: LIGHT.map((d) => clamp(scores[d.dim] ?? 50, 0, 100)) },
    { cx: W * 0.75, cy: H * 0.53, items: DARK, color: cDark, name: '黑暗三角', vals: DARK.map((d) => clamp(scores[d.dim] ?? 50, 0, 100)) },
  ];

  const vertex = (cx, cy, i, f) => {
    // 三角形顶点：上、右下、左下
    const angles = [-Math.PI / 2, Math.PI / 6, (Math.PI * 5) / 6];
    const a = angles[i];
    return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f];
  };

  centers.forEach((c) => {
    // 网格：25 / 50 / 75 / 100
    [0.25, 0.5, 0.75, 1].forEach((f) => {
      const pts = [0, 1, 2].map((i) => vertex(c.cx, c.cy, i, f).join(',')).join(' ');
      g.appendChild(svg('polygon', {
        points: pts,
        fill: 'none',
        stroke: cBorder,
        'stroke-width': f === 1 ? 1 : 0.7,
        opacity: f === 1 ? 0.95 : 0.5,
      }));
    });

    // 中轴
    [0, 1, 2].forEach((i) => {
      const [x, y] = vertex(c.cx, c.cy, i, 1);
      g.appendChild(svg('line', {
        x1: c.cx, y1: c.cy, x2: x, y2: y,
        stroke: cBorder, 'stroke-width': 0.6, opacity: 0.6,
      }));
    });

    // 数据多边形
    const pts = c.vals.map((v, i) => vertex(c.cx, c.cy, i, v / 100).join(',')).join(' ');
    g.appendChild(svg('polygon', {
      points: pts,
      fill: c.color,
      'fill-opacity': 0.14,
      stroke: c.color,
      'stroke-width': 1.6,
      'stroke-linejoin': 'round',
    }));

    // 顶点圆点
    c.vals.forEach((v, i) => {
      const [x, y] = vertex(c.cx, c.cy, i, v / 100);
      g.appendChild(svg('circle', { cx: x, cy: y, r: 3, fill: c.color, stroke: bg, 'stroke-width': 1.4 }));
    });

    /* 顶点标签 + 数值。
       左右两枚三角形「内侧」的那两个标签最容易撞在一起：
       W=560 时 外侧 1.32R 会让它们只隔 31px，而两个中文标签需要 ~40px。
       所以内侧标签单独用更小的外扩半径，外侧保持宽松。 */
    const OUTER_F = 1.3;
    const INNER_F = 1.14;
    c.items.forEach((it, i) => {
      const isInner = (c.cx < W / 2 && i === 1) || (c.cx > W / 2 && i === 2);
      const f = isInner ? INNER_F : OUTER_F;
      const [x, y] = vertex(c.cx, c.cy, i, f);
      const anchor = i === 0 ? 'middle' : i === 1 ? 'start' : 'end';
      const dy = i === 0 ? -2 : 4;
      g.appendChild(svgText(it.short, {
        x, y: y + dy,
        'text-anchor': anchor,
        'font-size': 9.5,
        'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
        fill: cMuted,
        'letter-spacing': '0.04em',
      }));
      g.appendChild(svgText(`${round(c.vals[i], 0)}`, {
        x, y: y + dy + (i === 0 ? -12 : 12),
        'text-anchor': anchor,
        'font-size': 11,
        'font-family': "'Noto Serif SC',Georgia,serif",
        fill: c.color,
        'font-variant-numeric': 'tabular-nums',
      }));
    });

    // 组名 + 均分
    const avg = round(c.vals.reduce((a, b) => a + b, 0) / c.vals.length, 1);
    g.appendChild(svgText(c.name, {
      x: c.cx, y: H - 26,
      'text-anchor': 'middle',
      'font-size': 10,
      'letter-spacing': '0.18em',
      'font-family': "'Noto Sans SC','PingFang SC',sans-serif",
      fill: cMuted,
    }));
    g.appendChild(svgText(`${avg}`, {
      x: c.cx, y: H - 8,
      'text-anchor': 'middle',
      'font-size': 16,
      'font-family': "'Noto Serif SC',Georgia,serif",
      fill: c.color,
      'font-variant-numeric': 'tabular-nums',
    }));
  });

  // 中央对比刻度
  const lightAvg = centers[0].vals.reduce((a, b) => a + b, 0) / 3;
  const darkAvg = centers[1].vals.reduce((a, b) => a + b, 0) / 3;
  const ratio = darkAvg > 1 ? lightAvg / darkAvg : 9.9;
  g.appendChild(svgText(`${lightAvg.toFixed(0)} : ${darkAvg.toFixed(0)}`, {
    x: W / 2,

/* ------------------------------------------------------------

const FONT_SERIF = `'Noto Serif SC','Songti SC','STSong',Georgia,serif`;
const FONT_SANS = `'Noto Sans SC','PingFang SC','-apple-system','Helvetica Neue',sans-serif`;

const PALETTE = {
  /* 象牙典藏版 */

/** 按字符宽度断行（中文逐字、英文按词优先） */
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  const paragraphs = String(text ?? '').split('\n');

  for (const para of paragraphs) {
    if (!para) { lines.push(''); continue; }
    let line = '';
    let i = 0;
    while (i < para.length) {
      const ch = para[i];
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        // 英文单词尽量不从中间断
        if (/[A-Za-z0-9]/.test(ch) && /[A-Za-z0-9]$/.test(line)) {
          const cut = line.lastIndexOf(' ');
          if (cut > line.length * 0.5) {
            lines.push(line.slice(0, cut));
            line = line.slice(cut + 1) + ch;
            i += 1;
            continue;
          }
        }
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
      i += 1;
    }
    if (line) lines.push(line);
  }
  return lines;
}

function drawText(ctx, text, x, y, {
  maxWidth = 900, lineHeight = 44, font = `400 28px ${FONT_SANS}`,
  color = '#1E2220', maxLines = 99, align = 'left',
} = {}) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  const lines = wrapText(ctx, text, maxWidth).slice(0, maxLines);
  lines.forEach((ln, i) => {
    ctx.fillText(ln, x, y + i * lineHeight);
  });
  ctx.restore();
  return y + lines.length * lineHeight;
}

function measureLines(ctx, text, maxWidth, font) {
  ctx.save();
  ctx.font = font;
  const n = wrapText(ctx, text, maxWidth).length;
  ctx.restore();
  return n;
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function hairline(ctx, x1, y, x2, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1, y + 0.5);
  ctx.lineTo(x2, y + 0.5);
  ctx.stroke();
  ctx.restore();
}

function drawBadge(ctx, text, x, y, { color, bg, border, font = `400 22px ${FONT_SANS}`, padX = 18, height = 40 }) {
  ctx.save();
  ctx.font = font;
  const w = ctx.measureText(text).width + padX * 2;
  roundRect(ctx, x, y, w, height, height / 2);
  if (bg) { ctx.fillStyle = bg; ctx.fill(); }
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + height / 2 + 1);
  ctx.restore();
  return w;
}

/* ------------------------------------------------------------
   密度计算（精灵图布局）
   ------------------------------------------------------------ */

function buildSections(report) {
  const { archetype, dual, cross, gifts, shadows, manual, values, mask } = report;
  const secs = [];

  secs.push({ type: 'archetype' });
  if (cross?.length) secs.push({ type: 'cross' });
  if (gifts?.length) secs.push({ type: 'gifts' });
  if (shadows?.length) secs.push({ type: 'shadows' });
  if (dual) secs.push({ type: 'dual' });
  if (manual) secs.push({ type: 'manual' });
  if (values?.length) secs.push({ type: 'values' });
  return secs;
}

/* ------------------------------------------------------------
   Canvas 雷达图（海报里必须有真实图形，不能只有文字条）
   ------------------------------------------------------------ */

function drawRadar(ctx, cx, cy, R, axes, opts = {}) {
  const n = axes.length;
  if (n < 3) return;

  const color = opts.color || '#A8894F';
  const border = opts.border || '#E4DFD4';
  const labelColor = opts.labelColor || '#5A5F5B';
  const font = opts.font || `400 16px ${FONT_SANS}`;
  const valueFont = opts.valueFont || `400 15px ${FONT_SERIF}`;

  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, f) => [cx + Math.cos(angle(i)) * R * f, cy + Math.sin(angle(i)) * R * f];

  ctx.save();

  // 网格
  [0.25, 0.5, 0.75, 1].forEach((f, idx) => {
    ctx.beginPath();
    for (let i = 0; i < n; i += 1) {
      const [x, y] = pt(i, f);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = border;
    ctx.globalAlpha = idx === 3 ? 0.95 : 0.5;
    ctx.lineWidth = idx === 3 ? 1.2 : 0.8;
    ctx.stroke();
  });

  // 轴线
  ctx.globalAlpha = 0.6;
  for (let i = 0; i < n; i += 1) {
    const [x, y] = pt(i, 1);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // 数据面
  ctx.beginPath();
  axes.forEach((a, i) => {
    const v = Math.max(0, Math.min(100, Number(a.value) || 0)) / 100;
    const [x, y] = pt(i, v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.16;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  // 顶点
  axes.forEach((a, i) => {
    const v = Math.max(0, Math.min(100, Number(a.value) || 0)) / 100;
    const [x, y] = pt(i, v);
    ctx.beginPath();
    ctx.arc(x, y, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });

  // 标签
  ctx.textAlign = 'left';
  axes.forEach((a, i) => {
    const [x, y] = pt(i, 1.16);
    const cos = Math.cos(angle(i));
    const sin = Math.sin(angle(i));
    ctx.textAlign = Math.abs(cos) < 0.25 ? 'center' : cos > 0 ? 'left' : 'right';
    const dy = sin > 0.5 ? 22 : sin < -0.5 ? -6 : 8;

    ctx.font = font;
    ctx.fillStyle = labelColor;
    ctx.fillText(a.label, x, y + dy);

    ctx.font = valueFont;
    ctx.fillStyle = color;
    ctx.fillText(String(Math.round(a.value)), x, y + dy + (sin < -0.5 ? -20 : 20));
  });

  ctx.restore();
}

/* ------------------------------------------------------------
   海报绘制
   ------------------------------------------------------------ */

async function drawPoster(report, {
  width = 1080,
  height = 1920,
  theme = 'light',
  long = false,
  nickname = '',
} = {}) {
  const P = PALETTE[theme] || PALETTE.light;

  // iOS Safari 对单张 canvas 有硬上限（约 4096×4096 或 1677 万像素，
  // 超出后 toDataURL 直接返回空字符串 → 白图）。
  // 1080×2800 @2x = 2160×5600 = 1210 万像素，高度 5600 已经越过 4096。
  // 这里按「最长边 ≤ 4096 且总面积 ≤ 1600 万」动态降 DPR。
  const SAFE_SIDE = 4096;
  const SAFE_AREA = 16_000_000;
  let dpr = 2;
  while (dpr > 1 && (width * dpr > SAFE_SIDE || height * dpr > SAFE_SIDE
    || width * dpr * height * dpr > SAFE_AREA)) {
    dpr -= 0.25;
  }
  dpr = Math.max(1, dpr);

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // 背景
  ctx.fillStyle = P.page;
  ctx.fillRect(0, 0, width, height);

  // 顶部柔和渐层
  const grad = ctx.createRadialGradient(width * 0.88, 40, 0, width * 0.88, 40, width * 0.9);
  grad.addColorStop(0, theme === 'dark' ? 'rgba(201,169,110,0.10)' : 'rgba(168,137,79,0.09)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height * 0.55);

  const padX = long ? 92 : 84;
  const cw = width - padX * 2;

  let y = long ? 96 : 104;

  /* ---------- 页眉 ---------- */
  ctx.textAlign = 'left';
  ctx.fillStyle = P.faint;
  ctx.font = `400 22px ${FONT_SANS}`;
  ctx.letterSpacing = '4px';
  ctx.fillText('THE HUMAN ATLAS', padX, y);
  ctx.letterSpacing = '0px';

  ctx.textAlign = 'right';
  ctx.font = `400 20px ${FONT_SANS}`;
  ctx.fillStyle = P.faint;
  ctx.fillText(formatDate(Date.now()), width - padX, y);

  y += 26;
  hairline(ctx, padX, y, width - padX, P.border);
  y += 70;

  /* ---------- 署名 ---------- */
  if (nickname) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.sub;
    ctx.font = `400 24px ${FONT_SANS}`;
    ctx.fillText(`— ${nickname} 的人性档案`, padX, y);
    y += 54;
  }

  /* ---------- 原型标题 ---------- */
  const arch = report.archetype?.best;
  if (arch) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.gold;
    ctx.font = `400 22px ${FONT_SANS}`;
    ctx.letterSpacing = '5px';
    ctx.fillText('SOUL ARCHETYPE', padX, y);
    ctx.letterSpacing = '0px';
    y += 58;

    ctx.fillStyle = P.text;
    ctx.font = `500 68px ${FONT_SERIF}`;
    ctx.fillText(arch.name, padX, y);
    y += 46;

    ctx.fillStyle = P.faint;
    ctx.font = `400 22px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText(arch.latin.toUpperCase(), padX, y);
    ctx.letterSpacing = '0px';
    y += 44;

    // keywords
    let kx = padX;
    (arch.keywords || []).forEach((k) => {
      const w = drawBadge(ctx, k, kx, y, {
        color: P.gold,
        border: P.goldSoft,
        font: `400 21px ${FONT_SANS}`,
      });
      kx += w + 12;
    });
    y += 66;

    // 判词
    y = drawText(ctx, arch.verdict, padX, y, {
      maxWidth: cw,
      lineHeight: 40,
      font: `400 26px ${FONT_SERIF}`,
      color: P.sub,
      maxLines: long ? 8 : 4,
    });
    y += 40;
  }

  /* ---------- 三仪表 ---------- */
  const lightDark = computeLightDarkRatio(report);
  const gauges = [
    { label: '光暗能量比', value: lightDark, unit: '' },
    { label: '社会面具厚度', value: Number.isFinite(report.mask?.value) ? Math.round(report.mask.value) : '—', unit: '' },
    { label: '测评完成度', value: `${report.completed?.length ?? 0}/${report.totalVolumes ?? 16}`, unit: '卷' },
  ];

  y += 10;
  hairline(ctx, padX, y, width - padX, P.border);
  y += 44;

  const gW = cw / 3;
  gauges.forEach((g, i) => {
    const gx = padX + i * gW;
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 18px ${FONT_SANS}`;
    ctx.letterSpacing = '2.5px';
    ctx.fillText(g.label, gx, y);
    ctx.letterSpacing = '0px';

    ctx.fillStyle = P.text;
    ctx.font = `500 52px ${FONT_SERIF}`;
    ctx.fillText(`${g.value}`, gx, y + 64);

    if (g.unit) {
      ctx.fillStyle = P.faint;
      ctx.font = `400 22px ${FONT_SANS}`;
      const vw = ctx.measureText(`${g.value}`).width;
      ctx.fillText(g.unit, gx + vw + 6, y + 64);
    }
  });

  y += 100;
  hairline(ctx, padX, y, width - padX, P.border);
  y += 56;

  /* ---------- 核心图谱：真实雷达 ---------- */
  const radarDims = [
    { id: 'big5_open', label: '探索' },
    { id: 'big5_order', label: '秩序' },
    { id: 'big5_assert', label: '表达' },
    { id: 'big5_compassion', label: '共情' },
    { id: 'big5_compliance', label: '妥协' },
    { id: 'big5_rumination', label: '反刍' },
    { id: 'cog_global', label: '抽象' },
    { id: 'cog_speed', label: '决断' },
    { id: 'mot_autonomy', label: '主权' },
    { id: 'mot_belonging', label: '羁绊' },
  ]
    .filter((d) => Number.isFinite(report.scores?.[d.id]))
    .slice(0, long ? 8 : 6)
    .map((d) => ({ label: d.label, value: report.scores[d.id] }));

  if (radarDims.length >= 3 && y < height - 300) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 19px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText('SIGNATURE AXES · 核心图谱', padX, y);
    ctx.letterSpacing = '0px';
    y += 30;

    const radarH = long ? 340 : 300;
    const cx = width / 2;
    const cy = y + radarH / 2 + 6;
    const R = radarH * 0.33;

    drawRadar(ctx, cx, cy, R, radarDims, {
      color: P.gold,
      border: P.border,
      labelColor: P.sub,
      font: `400 20px ${FONT_SANS}`,
      valueFont: `400 18px ${FONT_SERIF}`,
    });

    y += radarH + 8;
  }

  /* ---------- 王牌天赋卡 ---------- */
  if (report.gifts?.length) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 19px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText('SIGNATURE GIFTS · 王牌天赋', padX, y);
    ctx.letterSpacing = '0px';
    y += 40;

    report.gifts.slice(0, long ? 4 : 2).forEach((g, i) => {
      const cardH = long ? 168 : 152;
      roundRect(ctx, padX, y, cw, cardH, 6);
      ctx.fillStyle = P.card;
      ctx.fill();
      ctx.strokeStyle = P.border;
      ctx.lineWidth = 1;
      ctx.stroke();

      // 左侧色条
      ctx.fillStyle = P.virtue;
      ctx.fillRect(padX, y + 18, 3, cardH - 36);

      ctx.textAlign = 'left';
      ctx.fillStyle = P.faint;
      ctx.font = `400 17px ${FONT_SANS}`;
      ctx.letterSpacing = '2px';
      ctx.fillText(`0${i + 1} · ${g.name}`, padX + 26, y + 38);
      ctx.letterSpacing = '0px';

      ctx.fillStyle = P.text;
      ctx.font = `500 30px ${FONT_SERIF}`;
      ctx.fillText(g.gift_title, padX + 26, y + 78);

      drawText(ctx, g.gift_desc, padX + 26, y + 114, {
        maxWidth: cw - 52,
        lineHeight: 30,
        font: `400 20px ${FONT_SANS}`,
        color: P.sub,
        maxLines: long ? 2 : 1,
      });

      y += cardH + 16;
    });
    y += 24;
  }

  /* ---------- 阴影预警 ---------- */
  if (report.shadows?.length && (long || y < height - 420)) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 19px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText('SHADOW ALERTS · 阴影预警', padX, y);
    ctx.letterSpacing = '0px';
    y += 40;

    report.shadows.slice(0, long ? 3 : 1).forEach((s, i) => {
      const cardH = 132;
      roundRect(ctx, padX, y, cw, cardH, 6);
      ctx.fillStyle = P.card;
      ctx.fill();
      ctx.strokeStyle = P.border;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = P.sin;
      ctx.fillRect(padX, y + 18, 3, cardH - 36);

      ctx.textAlign = 'left';
      ctx.fillStyle = P.faint;
      ctx.font = `400 17px ${FONT_SANS}`;
      ctx.letterSpacing = '2px';
      ctx.fillText(`${s.name}`, padX + 26, y + 36);
      ctx.letterSpacing = '0px';

      ctx.fillStyle = P.text;
      ctx.font = `500 27px ${FONT_SERIF}`;
      ctx.fillText(s.shadow_title, padX + 26, y + 72);

      drawText(ctx, s.shadow_desc, padX + 26, y + 104, {
        maxWidth: cw - 52,
        lineHeight: 28,
        font: `400 19px ${FONT_SANS}`,
        color: P.sub,
        maxLines: 1,
      });

      y += cardH + 14;
    });
    y += 20;
  }

  /* ---------- 跨卷读心 ---------- */
  if (long && report.cross?.length) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 19px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText('CROSS-VOLUME INSIGHTS · 跨卷读心', padX, y);
    ctx.letterSpacing = '0px';
    y += 40;

    report.cross.slice(0, 3).forEach((c) => {
      const h = 40 + Math.min(4, measureLines(ctx, c.insight, cw - 52, `400 19px ${FONT_SANS}`)) * 30 + 34;
      roundRect(ctx, padX, y, cw, h, 6);
      ctx.fillStyle = P.card;
      ctx.fill();
      ctx.strokeStyle = P.border;
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = P.gold;
      ctx.font = `400 16px ${FONT_SANS}`;
      ctx.letterSpacing = '2px';
      ctx.fillText(c.tag, padX + 26, y + 30);
      ctx.letterSpacing = '0px';

      ctx.fillStyle = P.text;
      ctx.font = `500 26px ${FONT_SERIF}`;
      ctx.fillText(c.title, padX + 26, y + 68);

      const used = drawText(ctx, c.insight, padX + 26, y + 100, {
        maxWidth: cw - 52,
        lineHeight: 30,
        font: `400 19px ${FONT_SANS}`,
        color: P.sub,
        maxLines: 4,
      });
      y += Math.max(h, used + 20) + 14;
    });
    y += 20;
  }

  /* ---------- 核心价值 ---------- */
  if (report.values?.length) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 19px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText('CORE VALUES · 核心价值排序', padX, y);
    ctx.letterSpacing = '0px';
    y += 48;

    let vx = padX;
    report.values.slice(0, 3).forEach((v, i) => {
      ctx.fillStyle = P.gold;
      ctx.font = `500 34px ${FONT_SERIF}`;
      ctx.fillText(`0${i + 1}`, vx, y);
      ctx.fillStyle = P.text;
      ctx.font = `500 30px ${FONT_SERIF}`;
      ctx.fillText(v.name, vx + 54, y);
      vx += 54 + ctx.measureText(v.name).width + 40;
    });
    y += 56;
  }

  /* ---------- 核心刻度条 ---------- */
  const bars = (report.dimRows || []).slice(0, long ? 8 : 6);
  if (bars.length && y < height - (long ? 420 : 360)) {
    ctx.textAlign = 'left';
    ctx.fillStyle = P.faint;
    ctx.font = `400 19px ${FONT_SANS}`;
    ctx.letterSpacing = '4px';
    ctx.fillText('SIGNATURE AXES · 核心刻度', padX, y);
    ctx.letterSpacing = '0px';
    y += 44;

    const barW = cw - 132;
    bars.forEach((r) => {
      ctx.fillStyle = P.sub;
      ctx.font = `400 21px ${FONT_SANS}`;
      ctx.textAlign = 'left';
      ctx.fillText(r.name, padX, y + 6);

      const bx = padX + 150;
      ctx.fillStyle = P.border;
      ctx.fillRect(bx, y - 1, barW, 2);

      const frac = Math.max(0, Math.min(100, Number(r.score) || 0)) / 100;
      ctx.fillStyle = frac >= 0.5 ? P.gold : P.faint;
      ctx.fillRect(bx, y - 1, barW * frac, 2);

      ctx.textAlign = 'right';
      ctx.fillStyle = P.text;
      ctx.font = `500 22px ${FONT_SERIF}`;
      ctx.fillText(String(Math.round(r.score)), width - padX, y + 8);

      y += 46;
    });
    y += 20;
  }

  /* ---------- 页脚 ---------- */
  const footY = height - 76;
  hairline(ctx, padX, footY - 40, width - padX, P.border);

  ctx.textAlign = 'left';
  ctx.fillStyle = P.faint;
  ctx.font = `400 17px ${FONT_SANS}`;
  ctx.letterSpacing = '3px';
  ctx.fillText('HUMAN-ATLAS · 人性全息图谱', padX, footY);

  ctx.textAlign = 'right';
  ctx.fillText('纯前端本地运算 · 无数据上传', width - padX, footY);
  ctx.letterSpacing = '0px';

  /* ---------- 双线藏书票边框（Ex-Libris） ---------- */
  // 外框细线 + 内框更细的金线，四角留出小缺口，做出印刷品的装帧感
  const exOuter = 26;
  const exInner = 33;
  ctx.save();
  ctx.strokeStyle = P.border;
  ctx.lineWidth = 1;
  ctx.strokeRect(exOuter + 0.5, exOuter + 0.5, width - exOuter * 2 - 1, height - exOuter * 2 - 1);
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = P.gold;
  ctx.lineWidth = 0.8;
  ctx.strokeRect(exInner + 0.5, exInner + 0.5, width - exInner * 2 - 1, height - exInner * 2 - 1);
  ctx.globalAlpha = 1;

  // 四角的短角标
  const corner = 22;
  ctx.strokeStyle = P.gold;
  ctx.lineWidth = 1.6;
  const cx0 = exOuter;
  const cy0 = exOuter;
  const cx1 = width - exOuter;
  const cy1 = height - exOuter;
  [[cx0, cy0, 1, 1], [cx1, cy0, -1, 1], [cx0, cy1, 1, -1], [cx1, cy1, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(x + sx * corner, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + sy * corner);
    ctx.stroke();
  });
  ctx.restore();

  return canvas;
}

function computeLightDarkRatio(report) {
  const s = report.scores || {};
  const lightKeys = ['light_humanism', 'light_kant', 'light_faith', 'virtue_humility', 'virtue_charity', 'virtue_kindness', 'virtue_patience', 'virtue_temperance', 'virtue_diligence', 'virtue_chastity'];
  const darkKeys = ['dark_mach', 'dark_narc', 'dark_psycho', 'sin_pride', 'sin_greed', 'sin_envy', 'sin_wrath', 'sin_sloth', 'sin_lust', 'sin_gluttony'];
  const l = lightKeys.map((k) => s[k]).filter(Number.isFinite);
  const d = darkKeys.map((k) => s[k]).filter(Number.isFinite);
  if (!l.length || !d.length) return '—';
  const lm = l.reduce((a, b) => a + b, 0) / l.length;
  const dm = d.reduce((a, b) => a + b, 0) / d.length;
  if (dm <= 1) return '99:1';
  const ratio = Math.round((lm / dm) * 100);
  return `${Math.round(ratio / 10) * 10}:100`;
}

async function exportPoster(report, { long = false, theme = 'light', nickname = '' } = {}) {
  const w = 1080;
  const h = long ? 2800 : 1920;
  const canvas = await drawPoster(report, { width: w, height: h, theme, long, nickname });
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/png', 1);
  });
}

      L.push(`*维度：${g.name} · ${g.score}（${g.tier.name}）*`);

      L.push('');

    L.push('');
    L.push(`**高压退行态：** ${report.dual.underPressure}`);
    L.push('');
    if (report.dual.style) {
      L.push(`**触发点：** ${report.dual.style.trigger}`);
      L.push('');
      L.push(`**刹车处方：** ${report.dual.style.brake}`);
      L.push('');

    L.push('## 人生使用说明书');
    L.push('');

      L.push('### 最佳生态位');

      L.push('### 行动处方');

  return L.join('\n');
}

function downloadMarkdown(report, opts = {}) {
  const md = buildMarkdown(report, opts);
  const name = `human-atlas-${Date.now()}.md`;
  downloadText(name, md, 'text/markdown;charset=utf-8');
  return name;
}

async function copyMarkdown(report, opts = {}) {
  const md = buildMarkdown(report, opts);
  const ok = await copyText(md);
  if (ok) toast('Markdown 报告已复制');
  else toast('复制失败，请改用下载');
  return ok;
}

/* ------------------------------------------------------------
   AI 深度精读密文（v4.2）
   把全维得分、Z 尖峰、面具三分量、以及「耗时最久 / 改选最多」的
   三道犹豫题原文与选项，拼成一段可直接粘给任意大模型的分析师 Prompt。
   ------------------------------------------------------------ */

const TIER_WORD = (s) => (s >= 80 ? '极显锋芒' : s >= 60 ? '清晰倾向' : s >= 40 ? '弹性灰度' : '反向深潜');

/**
 * @param {Object} report   buildHolographicReport() 的产物（可带 dimRows）
 * @param {Object} opt      { nickname, answersByVolume, telemetry, volumes, mask, topValues }
 * @returns {string}
 */
function buildAIPrompt(report, opt = {}) {
  const {
    nickname = '', telemetry = {}, answersByVolume = {},
    volumes = {}, mask = null, topValues = [],
  } = opt;

  const scores = report.scores || {};
  const zs = report.zScores || {};
  const nameOf = Object.fromEntries((report.dimRows || []).map((d) => [d.id, d.name]));

  const L = [];

  L.push('你是我的私人心理分析师。下面是我在一个分卷式潜行测评里的完整作答结果。');
  L.push('请不要复述这些数字，也不要给我泛泛的鼓励。我要的是一次 30 分钟的深谈。');
  L.push('');
  L.push('## 我的档案');
  L.push(`- 署名：${nickname || '（未署名）'}`);
  L.push(`- 已完成：${(report.completed || []).length} 卷`);
  if (Number.isFinite(report.mask?.value)) {
    L.push(`- 社会面具厚度 M：${Math.round(report.mask.value)} / 100（${report.mask.tier?.name || TIER_WORD(report.mask.value)}）`);
    const d = mask?.dsd; const h = mask?.hlat; const g = mask?.mirror;
    const bits = [];
    if (Number.isFinite(d)) bits.push(`社会期许偏移 D_sd=${Math.round(d)}`);
    if (Number.isFinite(h)) bits.push(`犹豫修饰 H_lat=${Math.round(h)}`);
    if (Number.isFinite(g)) bits.push(`跨卷镜像撕裂 G_mirror=${Math.round(g)}`);
    if (bits.length) L.push(`  - ${bits.join(' · ')}`);
  }
  if (topValues.length) {
    L.push(`- 核心价值金字塔：${topValues.map((v) => v.name || v).join(' > ')}`);
  }

  const gifts = (report.gifts || []).slice(0, 4);
  const shadows = (report.shadows || []).slice(0, 3);
  if (gifts.length) {
    L.push(`- 王牌天赋：${gifts.map((g) => g.gift_title).join(' / ')}`);
  }
  if (shadows.length) {
    L.push(`- 阴影预警：${shadows.map((s) => s.shadow_title).join(' / ')}`);
  }
  if (report.archetype?.best?.name) {
    L.push(`- 原型匹配：${report.archetype.best.name}（拟合度 ${report.archetype.best.fit}）`);
  }

  L.push('');
  L.push('## 全维得分（0–100，50 为中性；Z 是我个人内部的相对尖峰）');
  const rows = Object.entries(scores)
    .filter(([, v]) => Number.isFinite(v))
    .sort((a, b) => (zs[b[0]] ?? 0) - (zs[a[0]] ?? 0));
  rows.forEach(([id, v]) => {
    const z = zs[id];
    const zPart = Number.isFinite(z) ? `  Z=${z > 0 ? '+' : ''}${z}` : '';
    L.push(`- ${nameOf[id] || id}：${v} （${TIER_WORD(v)}）${zPart}`);
  });

  /* ---------- 犹豫题：耗时最久 / 改选最多 ---------- */
  const qIndex = {};
  for (const [vid, vol] of Object.entries(volumes)) {
    const ans = answersByVolume[vid] || {};
    for (const q of vol.questions || []) {
      if (ans[q.id]?.value === undefined) continue;
      const tel = telemetry[q.id] || ans[q.id] || {};
      qIndex[q.id] = { q, vid, vol, tel, value: ans[q.id].value };
    }
  }

  const scored = Object.values(qIndex)
    .map((r) => ({
      ...r,
      ms: Number(r.tel.ms) || 0,
      changes: Number(r.tel.changes) || 0,
      dirty: !!r.tel.dirty,
    }))
    .filter((r) => !r.dirty);

  const fmtOption = (q, value) => {
    if (q.type === 'stealth_scale') {
      return `在 7 点量表上选了第 ${value} 档（左端：${q.scale?.left || ''} ／ 右端：${q.scale?.right || ''}）`;
    }
    if (q.type === 'budget_100') {
      const map = typeof value === 'object' ? value : {};
      return (q.items || []).map((it) => `${it.label} ${map[it.key] ?? 0} 点`).join('、');
    }
    if (q.type === 'pyramid_top3') {
      const arr = Array.isArray(value) ? value : [];
      return arr.map((k, i) => `第${i + 1}顺位「${(q.values || []).find((v) => v.key === k)?.label || k}」`).join(' → ');
    }
    const o = (q.options || []).find((x) => x.key === value);
    return o ? `${value}. ${o.text}` : String(value);
  };

  const slowest = [...scored].sort((a, b) => b.ms - a.ms).slice(0, 3);
  const mostChanged = [...scored].sort((a, b) => b.changes - a.changes).filter((r) => r.changes > 0).slice(0, 3);

  if (slowest.length) {
    L.push('');
    L.push('## 我停留最久的三道题（可能是真正的痛点）');
    slowest.forEach((r, i) => {
      L.push(`${i + 1}. [${r.vol.title}] ${r.q.context ? `${r.q.context}` : ''}`);
      L.push(`   问：${r.q.prompt}`);
      L.push(`   我选：${fmtOption(r.q, r.value)}`);
      L.push(`   耗时：${(r.ms / 1000).toFixed(1)} 秒`);
    });
  }

  if (mostChanged.length) {
    L.push('');
    L.push('## 我改选最多的题（可能是被压下去的那个答案）');
    mostChanged.forEach((r, i) => {
      L.push(`${i + 1}. ${r.q.prompt}`);
      L.push(`   最终选：${fmtOption(r.q, r.value)}`);
      L.push(`   改选次数：${r.changes}`);
    });
  }

  L.push('');
  L.push('## 我要你做的事');
  L.push('1. 先指出三个我在自我叙述里最可能在回避的东西，并给出支撑它的具体分数组合（不要空谈）。');
  L.push('2. 找出我得分里最矛盾的一组：哪两个高分放在同一个人身上会互相拉扯？它在我生活里可能长什么样？');
  L.push('3. 结合「停留最久」和「改选最多」的题，说出那个我没选、但其实很想选的答案是什么。');
  L.push('4. 给我三条未来 30 天可验证的小实验，每条都要能被我自己判定成功或失败。');
  L.push('5. 最后用不超过 80 字，写一句只说给我听的话。不要鼓励，要准确。');

  return L.join('\n');
}

async function copyAIPrompt(report, opt = {}) {
  const text = buildAIPrompt(report, opt);
  const ok = await copyText(text);
  toast(ok ? 'AI 精读密文已复制，粘给任意大模型即可' : '复制失败，请改用下载');
  return ok;
}

const meanOf = (ids, map) => {
  const vals = ids.map((i) => map[i]).filter((v) => Number.isFinite(v));
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
};

  const cs = getComputedStyle(document.documentElement);
  const g = (k) => cs.getPropertyValue(k).trim();
  return {
    text: g('--text-primary'),
    sub: g('--text-secondary'),
    faint: g('--text-tertiary'),
    border: g('--border'),
    gold: g('--gold'),
    card: g('--bg-card'),

  const card = el('button', {
    class: 'mirror-card',
    type: 'button',

  const inner = el('div', { class: 'mirror-card__inner' });

  const front = el('div', { class: 'mirror-face mirror-face--front' }, [

      el('span', { class: 'mirror-face__score', text: `${round(m.score, 0)}` }),
    ]),
    el('h3', { text: m.gift_title }),
    el('div', { class: 'mirror-face__dim', text: `${m.name} · ${m.tier.name}` }),
    el('div', { class: 'mirror-face__body', text: m.gift_desc }),
    el('div', { class: 'mirror-face__foot', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12a8 8 0 1 1 2.4 5.7"/><path d="M4 17v-5h5"/></svg><span>点击翻转 · 查看劣势面与炼金处方</span>' }),
  ]);

  const back = el('div', { class: 'mirror-face mirror-face--back' }, [
    el('div', { class: 'mirror-face__top' }, [
      el('span', { class: 'mirror-face__tag', text: 'SHADOW · 劣势面' }),
      el('span', { class: 'mirror-face__score', text: m.label }),
    ]),
    el('h3', { text: m.shadow_title }),
    el('div', { class: 'mirror-face__dim', text: '能量过载时的显影' }),
    el('div', { class: 'mirror-face__body', text: m.shadow_desc }),

  inner.appendChild(front);

  card.addEventListener('click', () => card.classList.toggle('is-flipped'));

  return card;
}

/* ------------------------------------------------------------
   维度明细表
   ------------------------------------------------------------ */

function dimTable(dims, MIRRORS) {
  const rows = dims
    .filter((d) => MIRRORS[d.id])
    .map((d) => ({ ...d, m: MIRRORS[d.id] }));

  const table = el('table', { class: 'dim-table' });

  table.appendChild(el('thead', {}, [
    el('tr', {}, [
      el('th', { text: '维度' }),
      el('th', { text: '分数' }),
      el('th', { text: '' }),
      el('th', { text: '档位' }),
      el('th', { text: '当前显影' }),
    ]),
  ]));

  const tbody = el('tbody');
  rows.forEach((r) => {
    const tier = tierOf(r.score);
    const m = mirrorFor(r.id, r.score, MIRRORS);
    const bar = el('div', { class: 'score-bar', style: { '--mc': m?.side === 'high' ? 'var(--gold)' : 'var(--vol2)' } }, [
      (() => { const i = el('i'); i.style.width = `${clamp(r.score, 0, 100)}%`; return i; })(),
    ]);

    tbody.appendChild(el('tr', {}, [
      el('td', {}, [
        el('div', { class: 'dim-table__name', text: m?.name || r.id }),
        el('div', { style: { fontSize: '10px', color: 'var(--text-tertiary)', letterSpacing: '0.06em' }, text: m?.side === 'high' ? '高分侧' : '低分侧' }),
      ]),
      el('td', { class: 'dim-table__score', text: `${round(r.score, 0)}` }),
      el('td', { style: { width: '38%' } }, [bar]),
      el('td', {}, [
        el('span', { class: 'tier-badge', dataset: { t: String(tier.id) }, text: tier.name }),
      ]),
      el('td', { style: { fontSize: '11.5px', color: 'var(--text-secondary)' }, text: m ? (m.side === 'high' ? m.gift_title : m.label) : '' }),
    ]));
  });

  table.appendChild(tbody);
  return table;
}

/* ------------------------------------------------------------
   报告内导航
   ------------------------------------------------------------ */

function reportNav(items) {
  const nav = el('div', { class: 'report-nav' });
  items.forEach((it, i) => {
    nav.appendChild(el('button', {
      class: i === 0 ? 'is-on' : '',
      type: 'button',
      text: it.label,
      onclick: (e) => {
        nav.querySelectorAll('button').forEach((b) => b.classList.remove('is-on'));
        e.currentTarget.classList.add('is-on');
        const target = document.getElementById(it.id);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
    }));
  });
  return nav;
}

/* ------------------------------------------------------------
   主渲染
   ------------------------------------------------------------ */

function renderReport(root, ctx) {
  const { App, DATA, volId, recompute, VOL_IDS = [] } = ctx;
  const state = App.state;
  const C = themeColors();

  // 单卷报告
  if (volId && DATA.volumes[volId]) {
    renderVolumeReport(root, ctx, volId);
    return;
  }

  // 完成度不足
  const completed = state.completedVolumes || [];
  if (!completed.length) {
    root.classList.add('view');
    root.appendChild(el('div', { class: 'empty', style: { marginTop: '70px' } }, [
      el('h3', { text: '还没有可以查看的档案' }),
      el('p', { text: '完成任意一卷，即可获得该卷的独立深度报告；完成三卷以上，跨卷读心引擎会自动激活。' }),
      el('a', { class: 'btn btn--solid', href: '#/', text: '前往卷宗大厅' }),
    ]));
    return;
  }

  const report = buildHolographicReport(state, DATA);
  const depth = reportDepth(completed.length);
  const archPack = report.archetype || null;
  const arch = archPack?.eligible === false ? null : archPack?.best;
  const archRunner = archPack?.eligible === false ? null : archPack?.runnerUp;
  const isComposite = Boolean(archPack?.isComposite && archRunner);

  root.classList.add('view');
  root.appendChild(el('div', { class: 'report', style: { '--vc': 'var(--gold)' } }));

  const wrap = root.firstElementChild;
  const nickname = state.nickname || '';

  /* ============ 模块 1 · 灵魂封面 ============ */
  const cover = el('div', { class: 'report-cover' });
  cover.appendChild(el('div', { class: 'cover-top' }, [
    el('div', { class: 'cover-vol' }, [
      el('span', { text: 'THE HUMAN ATLAS' }),
      el('span', { style: { opacity: 0.5 }, text: '·' }),
      el('span', { text: `${depth.name} · ${completed.length}/${VOL_IDS.length}` }),
    ]),
    el('div', { style: { fontSize: '10.5px', letterSpacing: '0.16em', color: 'var(--text-tertiary)' }, text: formatDate(state.updatedAt) }),
  ]));

  /* 主标题：复合原型时写成「主原型 × 副原型底色」 */
  const archTitle = arch
    ? (isComposite ? `${arch.name} × ${archRunner.name}底色` : arch.name)
    : '你的人性档案';

  cover.appendChild(el('div', {
    style: {
      fontSize: '10px',
      letterSpacing: '0.3em',
      textTransform: 'uppercase',
      color: 'var(--gold)',
      marginBottom: '12px',
    },
    text: arch ? (arch.latin || '') : '',
  }));

  cover.appendChild(el('h1', { class: 'cover-title', text: archTitle }));

  /* 专业心理学结构副标 */
  if (arch && arch.psych_tag) {
    cover.appendChild(el('p', { class: 'cover-psych', text: arch.psych_tag }));
  }

  /* 契合度 + 锚定维度数 */
  if (arch) {
    const anchorN = arch.hitCount || arch.hits?.length || 0;
    cover.appendChild(el('div', { class: 'cover-metrics' }, [
      el('span', { class: 'cover-metric' }, [
        el('b', { text: `${Math.round(arch.fit)}%` }),
        el('i', { text: '契合度' }),
      ]),
      el('span', { class: 'cover-metric' }, [
        el('b', { text: `${anchorN}` }),
        el('i', { text: '项核心特质锚定' }),
      ]),
      el('span', { class: 'cover-metric' }, [
        el('b', { text: `${Math.round((arch.coverage || 0) * 100)}%` }),
        el('i', { text: '维度覆盖' }),
      ]),
    ]));
  } else {
    cover.appendChild(el('p', {
      class: 'cover-psych',
      text: '已完成卷宗还不足以支撑跨卷原型判定。继续完成 1–2 卷后，这里会给出主原型与副原型底色。',
    }));
  }

  if (nickname) {
    cover.appendChild(el('div', {
      style: { fontSize: '11px', letterSpacing: '0.2em', color: 'var(--text-tertiary)', marginBottom: '16px' },
      text: `${nickname} · 私人档案`,
    }));
  }

  if (arch) {
    cover.appendChild(el('div', { class: 'cover-keywords' }, (arch.keywords || []).map((k) => el('span', { class: 'kw', text: k }))));
    cover.appendChild(el('p', { class: 'cover-verdict', text: arch.verdict }));
    if (isComposite) {
      cover.appendChild(el('p', {
        style: {
          margin: '6px 0 0', fontSize: '11.5px', color: 'var(--text-tertiary)', letterSpacing: '0.04em',
        },
        text: `副原型「${archRunner.name}」只差 ${Math.round(arch.fit - archRunner.fit)} 分，底色同样成立。`,
      }));
    }
  }

  const lightDark = computeLightDark(report.scores);
  const maskV = Number.isFinite(state.maskIndex) ? Math.round(state.maskIndex) : '—';
  const maskTier = Number.isFinite(state.maskIndex) ? maskTierOf(state.maskIndex) : null;

  cover.appendChild(el('div', { class: 'gauges' }, [
    gauge('光暗能量比', lightDark),
    gauge('社会面具厚度', maskV, maskTier ? ` · ${maskTier.name}` : ''),
    gauge('测评完成度', `${completed.length}`, ` / ${VOL_IDS.length} 卷`),
    gauge('跨卷规则命中', `${report.cross.length}`, ` / ${DATA.crossRules.length}`),
  ]));

  if (maskTier) {
    cover.appendChild(el('p', {
      style: {
        marginTop: '16px', fontSize: '11.5px', lineHeight: '1.9', color: 'var(--text-tertiary)',
      },
      text: `${maskTier.name} · ${maskTier.desc}`,
    }));
  }

  wrap.appendChild(cover);

  /* ============ 章节导航 ============ */
  const sections = [
    { id: 'r-dash', label: '可视化仪表盘' },
    { id: 'r-mirror', label: '双面镜' },
    { id: 'r-cross', label: '跨卷读心' },
    { id: 'r-dual', label: '双态推演' },
    { id: 'r-sandbox', label: '压力沙盒' },
    { id: 'r-parliament', label: '内在议会' },
    { id: 'r-timeline', label: '时间胶囊' },
    { id: 'r-archives', label: '分卷档案' },
    { id: 'r-manual', label: '使用说明书' },
    { id: 'r-export', label: '导出' },
  ];
  wrap.appendChild(reportNav(sections));

  /* ============ 模块 3 · 可视化仪表盘 ============ */
  const dash = el('section', { class: 'rsec', id: 'r-dash' });
  dash.appendChild(sec('01', '多维可视化', '所有图表均由原生 SVG 绘制，无第三方图表库'));

  // 蝶形图
  const vol1 = DATA.volumes.vol1;
  if (vol1 && completed.includes('vol1')) {
    const bcard = el('div', { class: 'chart-card' });
    bcard.appendChild(el('div', { class: 'chart-card__head' }, [
      el('h3', { text: '七美德 × 七原罪 · 双翼蝶形' }),
      el('span', { class: 'chart-card__note', text: '中轴为 50，左右展开幅度即该极的显影强度' }),
    ]));
    const bb = el('div', { class: 'chart-card__body' });
    bb.appendChild(butterflySvg(report.scores, {
      width: 760,
      colorVirtue: C.vol2,
      colorSin: C.vol1,
      colorText: C.text,
      colorMuted: C.faint,
      colorBorder: C.border,
      bg: C.card,
    }));
    bcard.appendChild(bb);
    dash.appendChild(bcard);
    dash.appendChild(el('div', { style: { height: '18px' } }));
  }

  // 雷达 + 光谱
  const grid2 = el('div', { class: 'chart-grid-2' });

  const radarAxes = [
    { id: 'big5_open', label: '探索', color: C.vol2 },
