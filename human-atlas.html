ig5_compliance":1.2},"social_desirability":3}]},{"id":"v13_q16","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"schema_defect","is_sensitive":true,"weight":0.85,"prompt":"洗完澡，镜子上全是雾。你抬手抹开一块，正好是自己的脸。","scale":{"left":"盯着看很久，把每一处松、每一处不对称都挑出来","right":"看一眼就走，镜子里没什么值得多看的","sdHigh":"right"},"effects":{"schema_defect":[2,-1.6],"big5_rumination":[1.2,-0.9],"schema_std":[1,-0.6]}},{"id":"v13_q17","type":"pyramid_top3","stealth_mode":"ipsative","layer":"explicit","mirror_key":"schema_values","is_sensitive":true,"weight":1.3,"context":"小时候那个房间早就拆了。缺的东西没法补，可你现在还在替它付账。","prompt":"如果时间能倒回去，你最想先补上哪三样，按先后排出来。","values":[{"key":"steady","label":"一个会一直留在原地的大人","effects":{"schema_abandonment":1.6,"mot_belonging":1,"att_anxiety":0.8}},{"key":"ask","label":"有人认真问过一句「你今天怎么样」","effects":{"schema_deprivation":1.6,"big5_compassion":0.8,"mot_belonging":0.8}},{"key":"accept","label":"不用表现好也能被留下的那种接纳","effects":{"schema_defect":1.6,"schema_approval":0.8,"virtue_humility":0.6}},{"key":"word","label":"一个说话算话的大人","effects":{"schema_mistrust":1.6,"light_kant":0.8,"val_moral":0.6}},{"key":"room","label":"一个不用装也能待着的房间","effects":{"schema_isolation":1.6,"def_detach":0.6,"mot_belonging":0.8}},{"key":"enough","label":"有人说过「你已经够好了」","effects":{"schema_std":1.6,"schema_approval":0.8,"big5_compassion":0.6}},{"key":"hold","label":"有人先照顾过我一次","effects":{"schema_sacrifice":1.6,"big5_compassion":0.8,"mot_belonging":0.6}},{"key":"allow","label":"被允许无理取闹一次","effects":{"schema_entitlement":1.6,"sin_pride":0.8,"mot_autonomy":0.6}}]},{"id":"v13_q18","type":"budget_100","stealth_mode":"budget","layer":"explicit","mirror_key":"schema_energy","is_sensitive":true,"weight":1.3,"context":"有些力气每天都在花，却从来不进日程表，也不算在任何一项支出里。","prompt":"现在把这一百点「隐形力气」分下去——你会看清自己其实在养什么。","items":[{"key":"alert","label":"提前预演最坏的那种结局","dim":"schema_negativity","base":0,"gain":1},{"key":"prove","label":"反复确认自己有没有被讨厌","dim":"schema_approval","base":0,"gain":1},{"key":"exit","label":"在每段关系里先留好退路","dim":"schema_mistrust","base":0,"gain":1},{"key":"caretake","label":"先照顾别人的情绪再轮到自己","dim":"schema_sacrifice","base":0,"gain":1},{"key":"polish","label":"把已经够好的东西再改一遍","dim":"schema_std","base":0,"gain":1},{"key":"cover","label":"遮住自己觉得不够好的那部分","dim":"schema_defect","base":0,"gain":1}]}]},"vol14":{"volume_id":"vol14","index":14,"title":"财富潜意识","subtitle":"四大金钱脚本与五种时间观","theme_color":"#8A6D3B","estimated_minutes":5,"intro":"这一卷不测你会不会赚钱。它只测一件事：钱在你身上最先唤起的反应——是想躲开，是抬头看，是拿它当尺子，还是攥着不敢松手。顺带看看你和时间的关系：力气放在已经过去的、正在发生的，还是还没来的日子上。十八个场景没有标准答案，也不存在所谓正确的金钱观。","dimensions":["money_avoid","money_worship","money_status","money_vigilance","time_past_neg","time_past_pos","time_present_hed","time_present_fate","time_future"],"questions":[{"id":"v14_q01","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"money_status","is_sensitive":false,"weight":1.4,"context":"六个人一顿吃掉七百多，人均不算便宜。结账时，那位收入明显比你宽裕的朋友先把卡递了过去，说这顿算他的，别扫兴。走出餐厅，夜风有点凉。","prompt":"沿着这条路往地铁站走，你心里最先起来的那句是——","options":[{"key":"A","text":"回家路上就在算：下次得挑同等价位的地方回请一次，不然心里过不去","effects":{"money_status":1.8,"money_vigilance":1.2,"sin_pride":1,"val_standard":0.8},"social_desirability":1},{"key":"B","text":"大方道谢收下，记住他最近在找的那张小众唱片，下次送他不必拼价格","effects":{"money_status":-1.6,"virtue_charity":1.2,"mot_belonging":1,"money_vigilance":-0.8},"social_desirability":3},{"key":"C","text":"心里松了口气，把这顿省下的钱当晚就转进那个专门存着的账户","effects":{"money_vigilance":1.6,"time_future":1.4,"mot_security":1.2,"money_status":-0.8},"social_desirability":2},{"key":"D","text":"没多想，只提议再往前走两步，去那家还开着的店坐一会儿，今晚还没散","effects":{"time_present_hed":1.8,"money_avoid":1.2,"mot_hedonism":1.4},"social_desirability":1}]},{"id":"v14_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"money_avoid","is_sensitive":true,"weight":0.85,"context":"十一点四十，客厅只剩冰箱在响。手机又亮了一下：本期账单可申请分期，最长十二期。","prompt":"这条短信你已经划掉过两次。今晚屏幕又亮起来，你的手指停在上面。","scale":{"left":"点开，把总额、利息和还款日一笔一笔看清楚","right":"再放一晚，明天脑子清醒了再处理","sdHigh":"left"},"effects":{"money_avoid":[-2,2],"money_vigilance":[1.4,-1.2],"big5_alert":[-0.4,1],"time_future":[1.4,-1.2]}},{"id":"v14_q03","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"money_vigilance","is_sensitive":false,"weight":1.25,"context":"和朋友吃完结账，小票上少算了一道一百多的硬菜。收银台后面排着队，服务生正低头核对下一桌的单子。","prompt":"你把小票折了一下，最先动的是——","options":[{"key":"A","text":"把那张单子递回去，指着菜名说这道没算，让他重开一张","effects":{"money_vigilance":1.8,"val_moral":1.2,"virtue_charity":1},"social_desirability":3},{"key":"B","text":"没回去，但把这件事记住了，下次来多点一道，把这份抹平","effects":{"money_vigilance":0.8,"val_moral":0.6,"mot_belonging":1,"sin_greed":-0.6},"social_desirability":2},{"key":"C","text":"收好走人，一百多对这家店不算什么，就当系统出错","effects":{"money_vigilance":-1.8,"val_moral":-1.4,"sin_greed":1},"social_desirability":0},{"key":"D","text":"心里有点不舒服：连自己家的账都算不明白，这店开不长","effects":{"money_vigilance":1.4,"big5_alert":1.2,"val_standard":1,"virtue_charity":-0.8},"social_desirability":1}]},{"id":"v14_q04","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"time_past_pos","is_sensitive":false,"weight":0.85,"prompt":"随机播放跳出一首十几年前的老歌，前奏三个音，你就知道是哪一首。","scale":{"left":"那几年整块回来了，连当时坐在谁旁边、窗外几点钟都记得","right":"听两句就划过去了，那时候的我，现在不太想回去","sdHigh":"left"},"effects":{"time_past_pos":[2,-2],"time_past_neg":[-1.2,1.6],"mot_belonging":[1,-0.6],"big5_rumination":[0.8,-0.4]}},{"id":"v14_q05","type":"forced_choice","stealth_mode":"projection","layer":"stealth","mirror_key":"time_present_fate","is_sensitive":false,"weight":1.4,"context":"车牌摇号结果出来，第三十八次没中。群里有人发了一句「命里有时终须有」，下面一排人在笑。","prompt":"你把页面关掉，抬头看了一眼窗外。这一刻，你心里更靠近哪一种说法？","options":[{"key":"A","text":"这东西本来就不由我，中不中都得过日子，关了就不想了","effects":{"time_present_fate":1.8,"wv_causal":1.2,"def_detach":1,"mot_mastery":-1.2},"social_desirability":2},{"key":"B","text":"三十八次说明路子错了：换个区、换种方式，先把规则重读一遍","effects":{"time_present_fate":-1.6,"time_future":1.6,"mot_mastery":1.4,"big5_industry":1},"social_desirability":3},{"key":"C","text":"名额就那么多，普通人排到天荒地老也轮不上，早看明白了","effects":{"time_present_fate":1.4,"lv_suffering":1.2,"sin_envy":0.8,"def_detach":0.8},"social_desirability":1},{"key":"D","text":"回了句玩笑，顺手约了晚上吃火锅，把这事当个段子讲出去","effects":{"time_present_hed":1.6,"lv_suffering":-1.2,"mot_hedonism":1,"wv_causal":0.6},"social_desirability":2}]},{"id":"v14_q06","type":"stealth_scale","stealth_mode":"projection","layer":"explicit","mirror_key":"money_worship","is_sensitive":false,"weight":0.85,"context":"婚宴中场，隔壁桌两个人一直在算：这一桌多少钱、酒是什么牌子、新郎家做什么生意。","prompt":"你端着杯子听了几句，冰块化了一半。哪一种说法更接近你私下信奉的？","scale":{"left":"钱确实是这个世界最硬的通行证，只是很少有人肯这么说","right":"我更想知道这两个人以后怎么过，一桌多少钱跟他们过得好不好无关","sdHigh":"right"},"effects":{"money_worship":[2,-2],"money_status":[1.2,-1.2],"lv_happiness":[-1.2,1.2],"sin_greed":[1,-1]}},{"id":"v14_q07","type":"forced_choice","stealth_mode":"normalization","layer":"stealth","mirror_key":"money_avoid","is_sensitive":true,"weight":1.4,"context":"周四晚上八点，房东发来消息说这房子他打算卖了，这两天中介会带人来看。第二天你正吃着饭，门铃响了，进来三个人，其中一个一进门就拿卷尺量阳台。","prompt":"中介收着卷尺，笑着问：要是接着租，一个月能出到多少。你放下筷子，答的是——","options":[{"key":"A","text":"说自己还没算过，让他们先随便看，转身进厨房把池子里泡着的碗一个个洗完","effects":{"money_avoid":1.8,"def_detach":0.8,"mot_security":-0.8,"big5_order":0.6},"social_desirability":2},{"key":"B","text":"把心里那个数字报出去，顺带问清违约金怎么算、房子卖了还能住到几月份","effects":{"money_avoid":-2,"big5_alert":0.8,"mot_security":1.4,"big5_order":1},"social_desirability":3},{"key":"C","text":"笑着把话绕过去，反过来问他们这房子现在一平挂多少、已经挂了多长时间","effects":{"money_status":1.6,"big5_alert":1,"cog_speed":0.8},"social_desirability":1},{"key":"D","text":"当晚把附近在租的房子全翻一遍，列成一张表，第二天想清楚了再回他话","effects":{"money_avoid":-1.6,"time_future":1.8,"big5_order":1},"social_desirability":0}]},{"id":"v14_q08","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"time_present_hed","is_sensitive":true,"weight":0.85,"context":"十二点四十，外卖软件里只剩那一家还开着，满减差八块。冰箱里有鸡蛋和半棵白菜。明早七点要起床，闹钟已经设好了。","prompt":"手指停在外卖页那个「去结算」的按钮上，久久没有按下去。","scale":{"left":"点了，今天已经够累，这顿算补给自己的，明天的事明天再想","right":"关掉软件去煮两个蛋，二十分钟也就过去了，钱和睡眠都省下来","sdHigh":"right"},"effects":{"time_present_hed":[2,-1.8],"time_future":[-1.6,1.8],"mot_hedonism":[1.4,-1],"big5_industry":[-0.8,1]}},{"id":"v14_q09","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"money_worship","is_sensitive":false,"weight":1.4,"context":"周六回家，你妈从柜子里搬出一桶油和一袋米，说银行的人讲得清楚：二十万存三年，年化四点五，还送这些。她把合同推到你面前，问你要不要也存一点。","prompt":"你翻着那几张纸，脑子里冒出来的念头，和纸面上印的字不在一条线上：","options":[{"key":"A","text":"先把风险等级和赎回条款翻出来，再问她这笔钱三年之内到底会不会用上","effects":{"money_worship":-1.8,"big5_alert":1,"mot_security":1.2,"big5_order":0.6},"social_desirability":3},{"key":"B","text":"心里其实有些服气：一年利息九千，比我加班一年攒下的还多，稳就是本事","effects":{"money_worship":2,"sin_greed":0.8,"mot_security":0.8},"social_desirability":0},{"key":"C","text":"劝她别全押在一处，留出三万能随时取的，剩下的再分，别为那点利息锁死","effects":{"money_worship":-1.6,"mot_security":1.2,"big5_alert":0.8},"social_desirability":2},{"key":"D","text":"笑她一桶油就被收买了，转头自己打开手机，翻同类产品的收益排行看了半小时","effects":{"money_worship":1.6,"sin_greed":0.9,"big5_open":0.6},"social_desirability":1}]},{"id":"v14_q10","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"money_avoid","is_sensitive":true,"weight":1.25,"context":"家族群里表弟发了婚礼请帖，艾特了所有人。你想起三年前他借的那三千，说好两个月还，中间提过两次，后来谁都没再提。","prompt":"手机还在手上，消息往上翻到那笔转账那一行，三秒之内你动了：","options":[{"key":"A","text":"先回一句恭喜，红包照旧包，那三千一个字不提——今天不该由我先开口","effects":{"money_avoid":1.8,"virtue_kindness":1.2,"mot_belonging":1},"social_desirability":3},{"key":"B","text":"把转账记录截了图发过去，跟一句：这个月我也紧，那三千你先还我","effects":{"money_avoid":-1.8,"big5_order":0.8,"val_standard":0.8},"social_desirability":1},{"key":"C","text":"在群里抢了个红包就退出去，请帖的事，打算拖到婚礼前三天再说","effects":{"money_avoid":1.6,"def_detach":1,"cog_speed":0.8},"social_desirability":0},{"key":"D","text":"翻出这月还剩多少，红包按老规矩包足，亲戚面前这份礼数一点不能短","effects":{"money_status":1.6,"mot_belonging":1.2,"virtue_charity":0.9},"social_desirability":2}]},{"id":"v14_q11","type":"stealth_scale","stealth_mode":"projection","layer":"stealth","mirror_key":"time_past_neg","is_sensitive":true,"weight":0.85,"context":"凌晨两点十七，你在二手平台上看见自己去年卖掉的那台相机，挂在同一个人手里，标价比你卖时高了两千。底下有九个人点了想要。","prompt":"你把那张照片放大，又缩小，屏幕的光照在脸上。","scale":{"left":"想起当时为什么卖：那笔钱填了家里哪个窟窿，那年账是怎么转开的","right":"想的是现在把它接回来，钱还能再挣，这台机器只有一台，错过就没了","sdHigh":"left"},"effects":{"time_past_neg":[2,-1.6],"time_present_hed":[-1.6,1.8],"mot_hedonism":[-1.2,1.4],"mot_belonging":[0.8,-0.6]}},{"id":"v14_q12","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"money_status","is_sensitive":false,"weight":1.4,"context":"你妈在电话里说，表姐家孩子满月，你表哥包了三千。她补了一句：你看着办，别让人觉得你在外面过得不行。","prompt":"挂了电话，转账页面停在金额那一栏，光标一直闪。你手上在掂的分量，其实是——","options":[{"key":"A","text":"按表哥的数目包过去，这种事上先低一头，往后年年都得低着那一头","effects":{"money_status":1.8,"sin_pride":1,"mot_belonging":0.8},"social_desirability":1},{"key":"B","text":"包两千，比表哥少一档但不难看，剩下的钱留着交下个季度的房租","effects":{"money_status":1.6,"mot_security":1,"big5_order":0.6},"social_desirability":2},{"key":"C","text":"包一千，孩子满月跟我包多少钱没关系，我妈那边我自己去说清楚","effects":{"money_status":-1.8,"mot_autonomy":1.2,"val_standard":1},"social_desirability":3},{"key":"D","text":"翻出当年自己办事收的礼簿，照着上面的数目一笔笔回过去，不多不少","effects":{"money_vigilance":1.8,"time_past_pos":1.6,"val_standard":0.8},"social_desirability":2}]},{"id":"v14_q13","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"time_future","is_sensitive":true,"weight":0.85,"context":"缴费单从窗口打出来，拖到地上还卷了一圈，父亲在病房里睡着。护士说下周还要再做一次。你哥在走廊尽头打电话，声音压得很低。","prompt":"排队的人还没挪到你，你靠着走廊那面墙，脑子里先翻起来的是哪一叠纸？","scale":{"left":"这几年为看病花出去的每一笔，谁垫过、谁还没还，都记得清清楚楚","right":"过去的先不算，接下来三个月要准备多少、从哪凑，才叫正事","sdHigh":"right"},"effects":{"time_past_neg":[2,-1.6],"time_future":[-1.6,1.8],"lv_suffering":[1.4,-0.6],"mot_security":[-0.6,1.2]}},{"id":"v14_q14","type":"forced_choice","stealth_mode":"projection","layer":"stealth","mirror_key":"money_worship","is_sensitive":false,"weight":1.4,"context":"小区门口新开的店，扫码进群送一板鸡蛋。队伍绕了两圈，前面有退休的教授，也有抱着孩子的年轻妈妈，都在算这一板值七块八。","prompt":"你站在队尾，听见前面有人笑着说时间不值钱。你心里更认下面哪一句。","options":[{"key":"A","text":"钱是最实在的东西：七块八攥在手里是硬的，体面那东西摸不着也换不来米","effects":{"money_worship":1.8,"val_standard":1,"lv_happiness":-0.8},"social_desirability":0},{"key":"B","text":"一板鸡蛋换一个微信号，店家不亏我也不亏，各人算各人心里那本账","effects":{"money_vigilance":1.8,"big5_alert":0.8,"cog_speed":0.8},"social_desirability":2},{"key":"C","text":"排着排着想起小时候跟奶奶排队领鸡蛋，那时候队伍里全是熟人，谁也不急","effects":{"time_past_pos":1.8,"mot_belonging":1.2,"lv_happiness":0.8},"social_desirability":1},{"key":"D","text":"没排队，进去按原价买了一板：七块八换二十分钟，这笔账我觉得值","effects":{"money_worship":-1.6,"mot_autonomy":1.2,"lv_happiness":0.6},"social_desirability":3}]},{"id":"v14_q15","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"time_past_neg","is_sensitive":true,"weight":1.3,"context":"搬家收拾到柜子最底层，一张旧当票从柜脚下面滑出来，纸已经发黄，日期是七年前。押的东西你还有印象，是一块表，表带断过一次。","prompt":"你蹲在地上，把它从灰里捡起来的那三秒，身体已经先做了动作：","options":[{"key":"A","text":"捏在手里看了三秒，直接塞进垃圾袋：那两年的账，不想再从头翻一遍","effects":{"time_past_neg":1.8,"def_detach":1.2,"lv_suffering":0.8},"social_desirability":1},{"key":"B","text":"拍了张照存进相册，打开计算器按现在的利息重算，看当年到底亏掉多少","effects":{"money_vigilance":1.8,"time_past_neg":1.6,"big5_alert":0.6},"social_desirability":2},{"key":"C","text":"坐在还没拆开的纸箱上发了会儿呆，想起那年冬天连暖气都不敢开","effects":{"time_past_neg":1.6,"lv_suffering":1.2,"mot_security":1},"social_desirability":1},{"key":"D","text":"笑了一声就撕成两半扔掉，那种日子没什么好回想，苦就是苦，不掺别的","effects":{"time_past_pos":-1.8,"def_detach":1.2,"mot_autonomy":0.8},"social_desirability":2}]},{"id":"v14_q16","type":"stealth_scale","stealth_mode":"projection","layer":"stealth","mirror_key":"time_future","is_sensitive":false,"weight":0.85,"context":"你算了一下，卡里的钱不上班大概能撑七个月。地铁进站，上来一群刚下班的人，脸上都是那种说不清的表情，包带压着西装。","prompt":"「七个月」这个数字在脑子里转，你把手机锁了屏，隔了两秒又按亮。","scale":{"left":"七个月是可以排的：每月花多少、第几个月必须接上，先列出来","right":"七个月就是七个月，先过好这周，真到那天总有办法，到时候再说","sdHigh":"left"},"effects":{"time_future":[1.8,-1.6],"time_present_fate":[-1.8,1.6],"mot_security":[1.2,-0.8],"big5_alert":[0.8,-0.6]}},{"id":"v14_q17","type":"pyramid_top3","stealth_mode":"ipsative","layer":"explicit","mirror_key":"money_values","is_sensitive":false,"weight":1.3,"context":"你在废纸上算了一笔账：如果突然多出十万，先填掉该填的窟窿，真正能自己支配的大概七万。桌上摆着八张纸条，每张写着一种花法，纸角被风扇吹起来。","prompt":"只能从这八种里挑三样，按你最想先动的那三样依次点选。","values":[{"key":"debt","label":"把欠的账一次还清，从此不用看还款日","effects":{"money_vigilance":1.6,"mot_security":1.2,"time_future":1.6}},{"key":"parents","label":"给爸妈换台舍不得买的空调，再做次体检","effects":{"time_past_pos":1.6,"mot_belonging":1.2,"virtue_kindness":1}},{"key":"retrain","label":"报一个能换赛道的课，把周末全砸进去","effects":{"time_future":1.6,"mot_mastery":1.2,"big5_industry":0.8}},{"key":"replace","label":"换掉用了六年的手机，和开机三分钟的电脑","effects":{"time_present_hed":1.6,"mot_hedonism":1.2,"big5_order":0.6}},{"key":"travel","label":"去一个一直想去的地方，把年假一次用完","effects":{"time_present_hed":1.6,"mot_hedonism":1,"mot_autonomy":0.8}},{"key":"invest","label":"买一只指数基金放着，十年之内都不看","effects":{"money_worship":1.6,"time_future":1.6,"mot_security":0.8}},{"key":"cash","label":"留成随时能取的现金，别的什么都不做","effects":{"money_vigilance":1.6,"mot_security":1.4,"money_avoid":1.6}},{"key":"roof","label":"修好老家那个漏雨的屋顶，留一条退路","effects":{"time_past_pos":1.6,"mot_belonging":1.2,"lv_anchor":0.8}}]},{"id":"v14_q18","type":"budget_100","stealth_mode":"budget","layer":"explicit","mirror_key":"money_energy","is_sensitive":false,"weight":1.3,"context":"每月工资到账那晚，手机里一堆事等着你：账单、定投、要出的礼、想买但不急的包。你手上只剩一百点注意力，分完就睡。","prompt":"把这一百点注意力分到这六件事上，加起来正好一百，多一点少一点都不行。","items":[{"key":"track","label":"把这月的账一笔笔对完，看钱到底去了哪儿","dim":"money_vigilance","base":0,"gain":1},{"key":"plan","label":"看一眼定投，把下个月自动划走的日子排好","dim":"time_future","base":0,"gain":1},{"key":"face","label":"想清楚这个月哪些场合要出钱、该包多少","dim":"money_status","base":0,"gain":1},{"key":"skip","label":"把账单短信一删，等哪天心情好了再一起看","dim":"money_avoid","base":0,"gain":1},{"key":"treat","label":"算算还能拿出多少，去吃一顿像样的","dim":"time_present_hed","base":0,"gain":1},{"key":"earn","label":"只盯进账：怎么让下个月多出两千块","dim":"money_worship","base":0,"gain":1}]}]},"vol15":{"volume_id":"vol15","index":15,"title":"冲突剧场","subtitle":"TKI 五种冲突模式与 PAC 沟通自我态","theme_color":"#9A5643","estimated_minutes":4,"intro":"冲突发生后的头三十秒，往往不是你决定的。这一卷只看那三十秒：在话出口之前，你的身体先做了什么——把位置摆明，先把场面接住，还是先退开一步。五种模式、三种自我态，没有哪一种更高级，只有它在这一场里是否合用。","dimensions":["tki_competing","tki_collaborating","tki_compromising","tki_avoiding","tki_accommodating","pac_parent","pac_adult","pac_child"],"questions":[{"id":"v15_q01","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"tki_competing","is_sensitive":true,"weight":1.4,"context":"你加班到十点回家。厨房水槽里堆着中午的碗，对方靠在沙发上看剧。你说了一句「碗能不能顺手洗掉」，他抬了下头，回了一句。","prompt":"那句话落地的两秒里，你嘴里最先冲出来的是哪一句？","options":[{"key":"A","text":"「我衣服是堆了三天，我说的今天是这口碗。两件事别混着算，我们只谈这一件。」","effects":{"pac_adult":1.8,"tki_collaborating":1.6,"cog_independent":0.8,"light_kant":0.6},"social_desirability":3},{"key":"B","text":"「我一天到晚挑毛病？那这个月你洗过几次碗，现在就把数摆出来。」","effects":{"tki_competing":1.9,"pac_parent":1.6,"def_attack":1.2,"sin_wrath":0.8},"social_desirability":0},{"key":"C","text":"「行，那我洗。」说完走去拧开水龙头，背对着他把碗一个个冲干净。","effects":{"tki_accommodating":1.9,"pac_child":1.4,"def_fawn":1.2,"big5_compliance":1},"social_desirability":1},{"key":"D","text":"「算了，你继续看吧。」把包放下，转身进卧室关上门，今晚不再多说一个字。","effects":{"tki_avoiding":1.9,"pac_child":1.2,"def_detach":1.4,"big5_rumination":0.8},"social_desirability":1}]},{"id":"v15_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"tki_compromising","is_sensitive":false,"weight":0.85,"prompt":"合租的人把你放在阳台的两箱书挪进了储物间，腾出地方放他的健身器材。你回来时他说：「至于吗，又不是给你扔了。」这件事你最后处理的方式更接近——","scale":{"left":"把书搬回来，然后跟他把公共区域怎么用一条条说清楚，写下来贴在冰箱上。","right":"自己重新找个角落收好，之后重要的东西都收回房间，这件事不再提起。","sdHigh":"left"},"effects":{"tki_compromising":[1.9,-1.4],"tki_collaborating":[1.6,-1.4],"tki_accommodating":[-1.2,1.8],"big5_compliance":[-1,1.2]}},{"id":"v15_q03","type":"stealth_scale","stealth_mode":"projection","layer":"stealth","mirror_key":"pac_parent","is_sensitive":true,"weight":0.85,"prompt":"你和伴侣说好不办婚礼，只把两边亲戚聚一顿。你妈知道后在电话里哭了半小时，说亲戚都通知了，你让她以后怎么见人。挂了电话，屋里很安静——你心里最响的那一句，带着怎样的语气？","scale":{"left":"婚是我们两个人的事，亲戚那边我一家一家去解释，她难受几天会过去。","right":"她说得对，亲戚都通知了，我这样确实不像话，是我们太只顾自己了。","sdHigh":"left"},"effects":{"pac_parent":[-1.6,1.9],"pac_adult":[1.8,-1.2],"tki_accommodating":[-1,1.4],"att_anxiety":[-0.6,0.9]}},{"id":"v15_q04","type":"forced_choice","stealth_mode":"ipsative","layer":"stealth","mirror_key":"pac_adult","is_sensitive":true,"weight":1.4,"context":"周会上，一个跨部门的人当着二十几个人说：「这方案上次就是因为你们组拖了半个月才黄，以后这种事别再交给你们。」你清楚延期是因为他们那边改了四轮需求。","prompt":"会议室安静了两秒。你最先开口的那一句是——","options":[{"key":"A","text":"「延期是事实，原因是需求改了四轮，我这儿有记录。会后我把时间线发群里，大家一起看。」","effects":{"pac_adult":1.9,"tki_collaborating":1.6,"tki_avoiding":-1.2,"cog_independent":0.8},"social_desirability":3},{"key":"B","text":"「上次是谁半夜十一点还在改你们的需求？您要不要现在把这句话说完整？」","effects":{"tki_competing":1.8,"pac_parent":1.2,"big5_assert":1.4,"def_attack":1},"social_desirability":0},{"key":"C","text":"「嗯，我们这边确实也有做得不够的地方，我回去再核一下。」然后没再抬头。","effects":{"tki_accommodating":1.7,"pac_child":1.4,"tki_avoiding":1.2,"big5_compliance":1},"social_desirability":1},{"key":"D","text":"没接话，把本子合上；会后写了一份三页的时间线，抄送给了在场的所有人。","effects":{"tki_avoiding":1.6,"covert_control":1.6,"def_intellectual":1.2,"pac_parent":-1},"social_desirability":2}]},{"id":"v15_q05","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"tki_avoiding","is_sensitive":false,"weight":1.25,"context":"深夜的地铁，你旁边的人把手机外放，音量很大，放的是一段吵架录音。整节车厢没人说话，有人换了个座位。","prompt":"那三十秒里，你身体先动的是——","options":[{"key":"A","text":"起身走到车厢另一头，宁可站着，也不想把今晚搭进去。","effects":{"tki_avoiding":2,"def_detach":1.2,"big5_compliance":1,"pac_child":-0.6},"social_desirability":2},{"key":"B","text":"转头直接说：「麻烦戴个耳机，谢谢。」说完就转回来。","effects":{"pac_adult":1.8,"big5_assert":1.4,"tki_competing":1.4,"tki_avoiding":-1.2},"social_desirability":3},{"key":"C","text":"掏出自己的耳机塞上，心里骂了一路，下车还在想。","effects":{"tki_avoiding":1.6,"big5_rumination":1.6,"sin_wrath":1.2,"tki_competing":-0.8},"social_desirability":1},{"key":"D","text":"站起来去找车头那边的乘务员，说前面有人在放声音。","effects":{"covert_control":1.8,"pac_adult":1.2,"tki_compromising":1,"tki_competing":-0.6},"social_desirability":2}]},{"id":"v15_q06","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"tki_collaborating","is_sensitive":false,"weight":0.85,"prompt":"一个认识十年的朋友，每次约饭都迟到四十分钟以上，今天已经是第三次。你在店里坐了四十分钟，服务员来问了两遍要不要先点。你心里的做法更接近——","scale":{"left":"他到了先不点菜，把这件事摊开说：能不能做到准时，做不到以后就换个方式约。","right":"算了，他这个人一直这样，来了就好好吃，别把一晚上弄坏。","sdHigh":"left"},"effects":{"tki_collaborating":[1.9,-1.4],"tki_accommodating":[-1.4,1.8],"pac_adult":[1.4,-1],"big5_compliance":[-1,1.2]}},{"id":"v15_q07","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"tki_accommodating","is_sensitive":true,"weight":1.4,"context":"这周六说好去你爸妈家吃饭，你妈从周三就开始准备。周四晚上，对方接了个电话，说他最好的朋友这周末从外地过来。挂了电话他说：「要不这周先不去你家了，他一年就来一次。」你说这事上礼拜就定好了，他回你一句。","prompt":"那句话是：「你就是这样，什么事都得按你的来。」这句反咬落下之后，你嘴里最先出来的是哪一句？","options":[{"key":"A","text":"「什么都得按我的来？那你数数，今年有几次是我最后让的。」","effects":{"tki_competing":1.9,"pac_parent":1.4,"def_attack":1,"sin_wrath":0.6},"social_desirability":1},{"key":"B","text":"「上礼拜三我就跟我妈说了，她准备了三天。这次你先陪你朋友，我自己回去。」","effects":{"tki_collaborating":1.7,"pac_adult":1.8,"tki_compromising":1,"light_kant":0.6},"social_desirability":3},{"key":"C","text":"「好，那就不去了，我跟我妈说一声。」然后真去说了，语气很平常。","effects":{"tki_accommodating":1.9,"pac_child":1.4,"def_fawn":1,"big5_compliance":1},"social_desirability":1},{"key":"D","text":"「随你吧。」转身进厨房把水龙头开到最大，剩下的晚上没怎么说话。","effects":{"tki_avoiding":1.9,"pac_child":1.2,"def_detach":1.2,"big5_rumination":0.8},"social_desirability":0}]},{"id":"v15_q08","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"tki_compromising","is_sensitive":true,"weight":0.85,"prompt":"家族群里三十多个人。你姑姑把你去年辞职的事翻出来，配了张截图，@你妈说「孩子这么折腾，你也不管管」。下面几个长辈陆续回了个「唉」。你的手指停在输入框上，更接近哪一种真实反应——","scale":{"left":"「姑姑，这事我私下跟您说清楚，别在群里让我妈难做。」发完把手机扣在桌上。","right":"「都是一家人，说两句就说两句。」回了个笑脸，之后几天没再点开那个群。","sdHigh":"left"},"effects":{"tki_compromising":[1.8,-1.2],"tki_competing":[1.3,-1.1],"pac_adult":[1.5,-1],"tki_avoiding":[-1,1.5]}},{"id":"v15_q09","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"pac_child","is_sensitive":true,"weight":1.2,"context":"家庭群里，你妈发了一张你小时候的照片，配文「那时候多听话」。一圈亲戚在下面接着说话，有人已经开始讲段子了。","prompt":"那条消息弹出来之后的三秒，你最先做出来的是——","options":[{"key":"A","text":"笑一下，跟着回一句「对，那会儿确实听话」，把这一轮轻轻绕过去。","effects":{"tki_accommodating":1.6,"pac_child":1.6,"def_fawn":1.2,"big5_compliance":0.8},"social_desirability":2},{"key":"B","text":"不接，直接私聊她：「妈，这种照片以后别往群里发了。」","effects":{"pac_adult":1.9,"tki_competing":1,"big5_assert":0.8,"tki_avoiding":-0.8},"social_desirability":3},{"key":"C","text":"「我那会儿听话，现在怎么就不听了？」当场把话顶回去。","effects":{"tki_competing":1.9,"pac_child":1.4,"sin_wrath":1.2,"pac_parent":0.6},"social_desirability":0},{"key":"D","text":"把群设成免打扰，接下来大半天没在里面说过一句话。","effects":{"tki_avoiding":1.8,"pac_child":0.8,"def_detach":1.2,"big5_rumination":0.8},"social_desirability":1}]},{"id":"v15_q10","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"tki_competing","is_sensitive":false,"weight":1.4,"context":"去年你把用了六年的胶片相机借给朋友拍婚礼。还回来时镜头有道细划痕，他没提。今年保养时师傅说这道划痕修不了，逆光会挂光。","prompt":"你把师傅的话截图发过去，他回：「这么久了才说，谁知道是不是我弄的。」你打出去的第一段话是——","options":[{"key":"A","text":"「行，那我认了。以后我的东西不再外借，这事到此为止。」","effects":{"tki_avoiding":1.9,"def_detach":1.4,"big5_rumination":0.8,"pac_adult":-0.6},"social_desirability":2},{"key":"B","text":"「不是钱的问题。那台相机跟了我六年，我只是想让你知道这件事。」","effects":{"pac_adult":1.8,"tki_collaborating":1.6,"light_kant":0.8,"tki_competing":-0.8},"social_desirability":3},{"key":"C","text":"「这台我用了六年。你说的那句『谁知道』，我记下了。」","effects":{"tki_competing":1.9,"def_attack":1.4,"sin_wrath":1,"tki_accommodating":-1.1},"social_desirability":0},{"key":"D","text":"「算了算了，是我想多了，你别往心里去。」然后自己把这条咽下去","effects":{"tki_accommodating":1.9,"def_fawn":1.4,"pac_child":1.2,"big5_compliance":1},"social_desirability":1}]},{"id":"v15_q11","type":"stealth_scale","stealth_mode":"normalization","layer":"stealth","mirror_key":"tki_avoiding","is_sensitive":false,"weight":0.85,"prompt":"楼上连着三晚十一点半还在挪家具、拖椅子。你上去敲门，开门的人听完，说：「我们家就这样，你要是受不了，当初就别租这层。」楼道的灯有点闪，你更可能停在哪种位置——","scale":{"left":"「那我们把时间说清楚：十一点以后尽量别挪，其他时候我不干涉。」站在门口把话说完。","right":"「哦，好。」点一下头就下楼，回家把耳塞翻出来。","sdHigh":"left"},"effects":{"tki_avoiding":[-1.8,1.9],"pac_adult":[1.7,-1.2],"tki_competing":[1.3,-1],"big5_compliance":[-1,1.2]}},{"id":"v15_q12","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"pac_parent","is_sensitive":false,"weight":1.4,"context":"合租的人这两个礼拜没倒过一次垃圾，门口那袋已经满了。你说了句「这个该倒了」，他头也没抬，回了一句。","prompt":"「你上次也没倒啊，别装得那么干净。」这话进来之后，你先说的是哪一句？","options":[{"key":"A","text":"「我上次是忘了，这袋我现在倒。从这周起排个班，贴在冰箱上。」","effects":{"pac_adult":1.8,"tki_collaborating":1.6,"tki_compromising":1.2,"light_kant":0.6},"social_desirability":3},{"key":"B","text":"「我装得干净？那你把这两周门口的东西认一下，哪袋是你的。」","effects":{"tki_competing":1.8,"sin_wrath":1,"def_attack":1.2,"pac_parent":0.8},"social_desirability":0},{"key":"C","text":"「你这人怎么总是这样，说了多少遍了。」说完自己拎下楼去扔。","effects":{"pac_parent":1.9,"tki_accommodating":1.2,"sin_pride":0.8,"def_attack":-0.6},"social_desirability":1},{"key":"D","text":"「算了。」把垃圾拎下楼，回来关上门，之后他那份不再管。","effects":{"tki_avoiding":1.8,"def_detach":1.2,"pac_parent":0.6,"big5_rumination":0.8},"social_desirability":2}]},{"id":"v15_q13","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"tki_accommodating","is_sensitive":false,"weight":1.4,"context":"三个人自驾进山，开车的朋友坚持走他查的小路，结果封路，绕了两个小时，天快黑了。后座那位开始抱怨，开车的人把话头转过来：「你当时也没说不行啊。」","prompt":"这一句反咬落下的时候，你嘴里最先出来的是什么样的声音？","options":[{"key":"A","text":"「现在算谁的错没用。先看还有几条路能到，天黑前把今晚的住处定下来。」","effects":{"pac_adult":1.8,"tki_collaborating":1.7,"cog_independent":0.6,"pac_child":-0.6},"social_desirability":3},{"key":"B","text":"「我说了走国道，你说那条路风景好。现在风景看够了吗？」","effects":{"tki_competing":1.9,"def_attack":1.2,"sin_wrath":1,"pac_parent":0.6},"social_desirability":0},{"key":"C","text":"「行，怪我，当时我该拦住你的。」往后座靠回去，不再开口。","effects":{"tki_accommodating":1.9,"pac_child":1.4,"def_fawn":1.2,"big5_compliance":0.8},"social_desirability":2},{"key":"D","text":"「你们定吧，我开车就行。」说完把座椅放低，戴上耳机闭上眼。","effects":{"tki_avoiding":1.8,"def_detach":1.4,"tki_compromising":-1.2,"big5_rumination":0.6},"social_desirability":1}]},{"id":"v15_q14","type":"forced_choice","stealth_mode":"normalization","layer":"stealth","mirror_key":"tki_compromising","is_sensitive":false,"weight":1.4,"context":"你租的车位被一辆不认识的车占了，挡风玻璃上留了电话，打了三次没人接。四十分钟后他从电梯里出来，你说「这是我租的车位」，他上下看了你一眼。","prompt":"「我就停一会儿，这楼里谁不停啊，你急什么。」这句反咬之后，你回的是哪一句？","options":[{"key":"A","text":"「您停可以，但我马上要用车。以后留个能接的电话，今天就这样。」","effects":{"tki_compromising":1.9,"pac_adult":1.7,"light_kant":0.6,"tki_competing":-1},"social_desirability":3},{"key":"B","text":"「我打了四十分钟电话。挪不挪？不挪我现在叫物业下来。」","effects":{"tki_competing":1.9,"big5_assert":1.2,"def_attack":1,"tki_accommodating":-1},"social_desirability":1},{"key":"C","text":"「行，那我停远一点。」把车开出去停到马路边，回来没再看他。","effects":{"tki_accommodating":1.8,"def_fawn":1.2,"big5_compliance":1,"pac_child":1},"social_desirability":2},{"key":"D","text":"「你这话挺有意思。」笑了一下，拍下车牌和车位编号发给物业。","effects":{"covert_control":1.8,"tki_competing":1.2,"pac_adult":1,"def_attack":-0.8},"social_desirability":1}]},{"id":"v15_q15","type":"pyramid_top3","stealth_mode":"ipsative","layer":"stealth","mirror_key":"conflict_values","is_sensitive":false,"weight":1.3,"context":"一场本来不算大的争执，最后没吵完就散了。回家的路上，你脑子里反复回放的往往不是观点对错，而是对方的态度。八种让人受不了的做法，只能留下三样最刺的。","prompt":"冲突里你最受不了对方做的事，哪三件排在最前？请按顺序点选。","values":[{"key":"dismiss","label":"把你的诉求说成「你太敏感了」","effects":{"tki_competing":1.5,"pac_adult":0.5}},{"key":"shutoff","label":"一言不发，转身走开或者干脆关机","effects":{"tki_avoiding":1.5,"att_anxiety":0.5}},{"key":"lecture","label":"用长辈语气告诉你「你应该反省一下自己」","effects":{"pac_parent":1.5,"tki_competing":0.5}},{"key":"flip","label":"把整件事绕回你自己也有问题","effects":{"tki_competing":1.4,"def_attack":0.5}},{"key":"rehearse","label":"翻出三年前的旧账一并算","effects":{"tki_compromising":1.4,"big5_rumination":0.5}},{"key":"coldface","label":"当场不吭声，之后几天用冷脸罚你","effects":{"tki_avoiding":1.4,"covert_control":0.5}},{"key":"plead","label":"突然开始赔笑，说自己什么都行","effects":{"tki_accommodating":1.5,"def_fawn":0.5}},{"key":"crowd","label":"把第三个人拉进来，让别人评理","effects":{"tki_collaborating":-1.4,"def_attack":0.5}}]},{"id":"v15_q16","type":"budget_100","stealth_mode":"budget","layer":"explicit","mirror_key":"conflict_energy","is_sensitive":false,"weight":1.3,"context":"一场已经冷了四十分钟的争执，两个人都还在客厅。现在给你一百点力气，接下来往哪儿使，基本就写出了你在这类局面里的本能。","prompt":"把一百点分到这六件事上。不必均分，也不必体面。","items":[{"key":"competing","label":"把道理说赢，把立场守住","dim":"tki_competing","base":0,"gain":1},{"key":"collaborating","label":"把两边真正卡住的东西摸出来","dim":"tki_collaborating","base":0,"gain":1},{"key":"compromising","label":"各退一步，先把今晚过完","dim":"tki_compromising","base":0,"gain":1},{"key":"avoiding","label":"找个事走开，等它自己变淡","dim":"tki_avoiding","base":0,"gain":1},{"key":"accommodating","label":"先让他顺心，把自己的话咽回去","dim":"tki_accommodating","base":0,"gain":1},{"key":"pac_adult","label":"把语气拉平，只说具体这件事","dim":"pac_adult","base":0,"gain":1}]}]},"vol16":{"volume_id":"vol16","index":16,"title":"神经边缘","subtitle":"高敏感 × 刺激寻求的四象限","theme_color":"#3B6B6E","estimated_minutes":4,"intro":"这一卷问的不是你内向还是外向，而是你的神经系统在什么音量下最好用：多少刺激算刚好，多少开始过载；别人的情绪涌进来时，你是被填满还是被冲垮。四象限里没有更健康的一格，只有你此刻站的那一格。","dimensions":["hsp_sensory","hsp_emotional","hss_novelty","hss_intensity"],"questions":[{"id":"v16_q01","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"neuro_festival","is_sensitive":false,"weight":1.4,"context":"跨城看一场音乐节，散场时已经十一点半。人群从铁马口往外涌，耳朵里还留着一层嗡响，T 恤贴在背上，回酒店的地铁要坐十四站。","prompt":"走出场地那两百米，你身上最先启动的是哪一样？","options":[{"key":"A","text":"耳机不戴，专挑人少的巷子走，让耳鸣自己退下去，谁说话都先不回","effects":{"hsp_sensory":1.8,"hss_intensity":-1.6,"big5_social":-1,"virtue_temperance":0.7},"social_desirability":2},{"key":"B","text":"还不想回酒店，跟着人流钻进夜市，找更吵的地方把耳朵继续填满","effects":{"hss_intensity":1.9,"hss_novelty":1.7,"hsp_sensory":-1.7,"hsp_emotional":-1.6,"mot_hedonism":1},"social_desirability":1},{"key":"C","text":"先发定位问同行的人走到哪了，散场之后一个人走的那段路最难受","effects":{"hsp_emotional":1.7,"hss_novelty":-1.6,"big5_social":1.1,"att_anxiety":0.9},"social_desirability":2},{"key":"D","text":"在出口回头站了半分钟，心里已经在查下一场在哪，眼睛还有点热","effects":{"hsp_emotional":1.8,"hss_novelty":1.6,"big5_aesthetic":1.1,"big5_rumination":0.7},"social_desirability":3}]},{"id":"v16_q02","type":"forced_choice","stealth_mode":"pressure","layer":"stealth","mirror_key":"neuro_office","is_sensitive":true,"weight":1.4,"context":"开放工位第三排，中央空调在你头顶一格一格换风，声音不高，一直没停。下午三点，同一行字你已经读了三遍，还是读成了别的东西。","prompt":"接下来这半小时，你会怎么把它过掉？","options":[{"key":"A","text":"从包里翻出降噪耳机戴上，提示音也关掉，先把这一小时的安静买回来","effects":{"hsp_sensory":1.9,"hss_intensity":-1.6,"hss_novelty":-1.6,"big5_order":0.8},"social_desirability":3},{"key":"B","text":"真正耗人的不是这声音，是隔壁组那个刚被说完话的人，一整天低着头","effects":{"hsp_emotional":1.8,"hss_intensity":-1.7,"big5_rumination":0.9,"big5_alert":0.8},"social_desirability":3},{"key":"C","text":"把这声音当背景照样写下去，周围有点动静反而更进得去，别人的情绪也不太沾","effects":{"hsp_sensory":-1.8,"hsp_emotional":-1.6,"hss_intensity":1.7,"virtue_temperance":0.9},"social_desirability":1},{"key":"D","text":"起身下楼走一圈，买杯冰的，换个场景再回来，坐着硬扛没有用","effects":{"hss_novelty":1.8,"cog_speed":1,"mot_hedonism":0.9,"big5_order":-0.8},"social_desirability":2}]},{"id":"v16_q03","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"neuro_mall","is_sensitive":false,"weight":0.85,"context":"一层中庭在推新品，四五个柜台同时开着试香纸。你从电梯下来，一股甜混着一股木质调一起进鼻子，后面还压着爆米花的味道。","prompt":"走过那四十米的时候，你身上发生的是——","scale":{"left":"不到十米就开始发晕，得先绕到侧门出去站一会儿，缓过来再往里走","right":"在柜台前停下来，让人再喷第三款，想知道混在一起会变成什么","sdHigh":"right"},"effects":{"hsp_sensory":[2,-2],"hss_novelty":[-1.7,1.7],"hss_intensity":[-1.6,1.7],"big5_aesthetic":[-0.7,1.2]}},{"id":"v16_q04","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"neuro_crash","is_sensitive":false,"weight":1.25,"context":"连轴四天：两场活动、一次通宵改稿、一顿推不掉的饭。周五晚上十点你终于到家，灯没开，包还挂在门口。","prompt":"进门那三秒，身体先去够的是什么？","options":[{"key":"A","text":"直接躺到地板上，等黑暗把耳朵里那层嗡声盖住，什么也不想再听","effects":{"hsp_sensory":1.9,"hss_intensity":-1.7,"big5_social":-1,"def_detach":0.8},"social_desirability":2},{"key":"B","text":"把音响拧开，音量推到能感觉地板在震，先让身体从麻里醒过来","effects":{"hss_intensity":1.9,"hsp_sensory":1.6,"hsp_emotional":-1.6,"mot_hedonism":1},"social_desirability":0},{"key":"C","text":"坐在地上给最熟的那个人发一句「到了」，等一 ulse","layer":"explicit","mirror_key":"wv_social","is_sensitive":true,"weight":1.2,"context":"你亲眼看到一个熟悉的人插队，理由是「我真的赶时间」，而队伍里有一位明显更需要的老人。","prompt":"你看到这一幕的第一秒，心里冒出来的东西是——","options":[{"key":"A","text":"一股很清楚的不舒服，规则被破掉这件事本身就让我难受","effects":{"wv_social":1.8,"light_kant":1.6,"sin_wrath":0.8,"val_moral":1.2},"social_desirability":3},{"key":"B","text":"先判断他是不是真的急，如果真有急事就算了","effects":{"wv_social":-0.8,"big5_compassion":1.2,"cog_ambiguity":1,"val_standard":-0.6},"social_desirability":2},{"key":"C","text":"心里不快，但不会开口，事后再看要不要提一句","effects":{"wv_social":0.4,"big5_compliance":1.4,"def_fawn":0.8,"sin_wrath":-0.6},"social_desirability":1},{"key":"D","text":"马上开口，不管他有什么理由，这个位置得先吐出来","effects":{"wv_social":1.4,"big5_assert":1.6,"def_attack":1.4,"sin_wrath":1.2},"social_desirability":1}]},{"id":"v4_q11","type":"stealth_scale","stealth_mode":"projection","layer":"explicit","mirror_key":"wv_causal","is_sensitive":false,"weight":0.85,"prompt":"那些长期做得很好的人，你认为他们更主要靠的是——","scale":{"left":"一套稳定、可复制的自我管理系统","right":"在几个关键节点上赶上了他们自己也无法复制的运气","sdHigh":"left"},"effects":{"wv_causal":[1.8,-1.8],"big5_industry":[1.4,-0.8],"cog_logic":[0.8,-0.6]}},{"id":"v4_q12","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"lv_happiness","is_sensitive":false,"weight":1.4,"prompt":"如果只能保留下一种体验，并且维持十年，你更愿意是——","options":[{"key":"A","text":"一直在做一件越来越难、但越来越像自己的事","effects":{"lv_happiness":1.8,"mot_mastery":1.6,"mot_purpose":1.2,"mot_hedonism":-1},"social_desirability":3},{"key":"B","text":"一直在换地方、换口味、换遇见的人，密度很高","effects":{"lv_happiness":-1.8,"mot_hedonism":2,"big5_open":1.2,"mot_security":-1},"social_desirability":1},{"key":"C","text":"一直有一小群人，晚饭时会在同一张桌子旁等你","effects":{"lv_happiness":0.4,"mot_belonging":2,"val_boundary":-1,"att_anxiety":0.4},"social_desirability":2}]},{"id":"v4_q13","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"val_boundary","is_sensitive":true,"weight":0.85,"prompt":"关于「稳定」，你内心的真实排序是——","scale":{"left":"稳定很贵，它值得我把一部 {"volume_id":"vol5","index":5,"title":"思维棱镜","subtitle":"认知风格与决策算法的六道棱面","theme_color":"#3B4D70","estimated_minutes":4,"intro":"这一卷不测量情绪，也不评判道德。它只测绘你大脑处理信息、做判断、解决难题的那台机器——你怎样把混乱的世界压缩成一个可以行动的结论。","dimensions":["cog_global","cog_diverge","cog_logic","cog_ambiguity","cog_independent","cog_speed"],"questions":[{"id":"v5_q01","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_global","is_sensitive":false,"weight":0.85,"prompt":"接到一个全新领域的任务，你把书翻开的第一个动作是——","scale":{"left":"先读目录和结论，把这件事的骨架搞清楚","right":"直接从第一个具体案例开始，边做边建立理解","sdHigh":"left"},"effects":{"cog_global":[2,-2],"big5_open":[1,-0.8],"cog_speed":[-0.6,1]}},{"id":"v5_q02","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"cog_diverge","is_sensitive":false,"weight":1.4,"context":"家里一位长辈的病已经反复三年，常规办法都试过了，全家开始陷入疲惫，谁都不再提「接下来怎么办」。","prompt":"你更愿意把接下来的力气放在——","options":[{"key":"A","text":"先列出十条从来没人试过的路子，哪怕八条最后是荒唐的","effects":{"cog_diverge":2,"big5_open":1.4,"cog_global":0.8,"cog_speed":-0.4},"social_desirability":2},{"key":"B","text":"把所有可能的风险点排一遍，先把最坏的那个堵上","effects":{"cog_diverge":-1.8,"big5_alert":1.6,"big5_order":1.2,"cog_ambiguity":-1.2},"social_desirability":3},{"key":"C","text":"找一个完全不懂医的朋友聊一次，看他怎么理解这件事","effects":{"cog_diverge":1.6,"big5_open":1.6,"light_humanism":0.6,"cog_independent":0.8},"social_desirability":2},{"key":"D","text":"先承认这条路走不通，然后认真讨论要不要换一种活法","effects":{"cog_diverge":-0.8,"dark_psycho":1.4,"cog_speed":1.2,"mot_mastery":-0.6},"social_desirability":1}]},{"id":"v5_q03","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_logic","is_sensitive":false,"weight":0.85,"prompt":"两个候选人条件几乎一样，但你心里对其中一个有说不清的好感。你的实际处理是——","scale":{"left":"把好感放到一边，回到可比较的维度上做决定","right":"相信那点说不清，它通常捕捉到了数据没覆盖的东西","sdHigh":"left"},"effects":{"cog_logic":[1.8,-1.8],"cog_speed":[-0.8,1],"big5_compassion":[-0.8,1.2]}},{"id":"v5_q04","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_ambiguity","is_sensitive":false,"weight":1.4,"prompt":"你打算换一座城市生活，两个月过去了，仍有三分之一的变量没定：住哪、做什么、要不要先斩后奏。家里人希望你月底给一个明确说法。你的状态更接近——","options":[{"key":"A","text":"先给一份带明确分支的图，把那三成写成可选路径，先往前走","effects":{"cog_ambiguity":1.8,"cog_speed":1,"big5_order":-0.4,"cog_global":1},"social_desirability":2},{"key":"B","text":"会很不舒服，没有确定的前提我很难给出任何承诺","effects":{"cog_ambiguity":-1.8,"big5_order":1.6,"big5_alert":1.2,"cog_speed":-1.2},"social_desirability":1},{"key":"C","text":"去找能拍板的人，先把那三成压下来，再谈路线","effects":{"cog_ambiguity":-1.4,"big5_assert":1.4,"covert_control":1,"cog_logic":1},"social_desirability":2},{"key":"D","text":"索性先做一个小实验，用真实反馈把那三成自己削掉","effects":{"cog_ambiguity":1.4,"cog_speed":1.6,"cog_diverge":1,"big5_industry":0.8},"social_desirability":3}]},{"id":"v5_q05","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_independent","is_sensitive":true,"weight":0.85,"prompt":"一个圈子里公认的「正确做法」，你隐约觉得有问题，但你说不出完整的理由。你通常——","scale":{"left":"先照做，多数人这么做总有它的道理","right":"会先按自己的判断试一次，哪怕要独自承担后果","sdHigh":"left"},"effects":{"cog_independent":[-1.8,2],"big5_compliance":[1.6,-1.4],"sin_pride":[-0.6,1.2]}},{"id":"v5_q06","type":"impulse_3s","stealth_mode":"impulse","layer":"explicit","mirror_key":"cog_speed","is_sensitive":false,"weight":1.2,"context":"一个重要机会，今天下午六点前必须决定，跳进去是三个月的重投入。你现在掌握的信息大概占到六成。","prompt":"看到那条消息后的第一反应是——","options":[{"key":"A","text":"先答应下来，六成就够了，剩下的边做边补，不必等万事齐备","effects":{"cog_speed":2,"cog_ambiguity":1.4,"dark_psycho":0.8,"big5_alert":-1},"social_desirability":1},{"key":"B","text":"立刻开始要把剩下那四成尽量敲出来，即使要拖到最后一刻","effects":{"cog_speed":-1.6,"big5_order":1.4,"big5_alert":1,"cog_logic":1},"social_desirability":3},{"key":"C","text":"先找两三个判断力可靠的人各问一圈，问完再自己定下来","effects":{"cog_speed":-0.8,"cog_independent":-0.6,"big5_compliance":1,"light_faith":1},"social_desirability":2},{"key":"D","text":"心里已经有一个答案，但还是会拖到最后十分钟才回","effects":{"cog_speed":-1,"sin_sloth":1.2,"big5_rumination":1,"cog_logic":0.4},"social_desirability":1}]},{"id":"v5_q07","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"cog_global","is_sensitive":false,"weight":1.4,"context":"两个人在同一场线下活动结束后，被问「怎么样」。一个人先说了三个具体细节，另一个人先说了这场活动的核心问题是什么。","prompt":"你觉得这两个人里，谁更可能在半年后走得更高？","options":[{"key":"A","text":"说细节的那位，他对真实发生的事有手感","effects":{"cog_global":-1.8,"cog_logic":1.2,"big5_order":1.2,"big5_alert":0.8},"social_desirability":2},{"key":"B","text":"说核心问题的那位，他能把经验变成可复用的判断","effects":{"cog_global":1.8,"cog_diverge":1,"mot_mastery":1.2,"big5_open":0.8},"social_desirability":3},{"key":"C","text":"不好说，这两个能力在不同阶段各有各的用","effects":{"cog_global":0.4,"cog_ambiguity":1.4,"big5_compliance":0.6,"cog_logic":0.4},"social_desirability":1}]},{"id":"v5_q08","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_diverge","is_sensitive":false,"weight":0.85,"prompt":"一轮头脑风暴结束，桌上通常留下的是——","scale":{"left":"很多张写着荒唐点子的纸，我们的问题是想不出","right":"两条能落地的方案，我们的问题是不够多","sdHigh":"left"},"effects":{"cog_diverge":[1.8,-1.8],"big5_open":[1.2,-0.8],"cog_logic":[-0.6,1]}},{"id":"v5_q09","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"cog_logic","is_sensitive":true,"weight":1.4,"prompt":"两种错误，你更能容忍自己犯哪一种？","options":[{"key":"A","text":"分析完全正确，但漏掉了那个说不清、却真正决定成败的感受","effects":{"cog_logic":1.8,"cog_global":0.6,"big5_compassion":-1,"light_humanism":-0.4},"social_desirability":1},{"key":"B","text":"感受全对了，但没做任何量化验证，最后被一个具体数字推翻","effects":{"cog_logic":-1.8,"cog_ambiguity":1.2,"big5_alert":-0.8,"light_humanism":1},"social_desirability":1}]},{"id":"v5_q10","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_ambiguity","is_sensitive":false,"weight":0.85,"prompt":"一次旅行，你更愿意选择哪种方式？","scale":{"left":"大致定好，剩下的到那看情况，喜欢被意外带走","right":"每一段都排好，不喜欢把时间交给不确定","sdHigh":"left"},"effects":{"cog_ambiguity":[2,-2],"big5_order":[-1.6,1.8],"big5_open":[1,-0.8]}},{"id":"v5_q11","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"cog_independent","is_sensitive":true,"weight":1.35,"context":"整个行业都在往一个方向跑，几乎所有聪明人都在说这是对的，但一些最基础的事实你还没法用现有说法解释。","prompt":"你猜那些最后真正做成了的人，当时更可能在做什么？","options":[{"key":"A","text":"先跟着跑，等方向明朗了再加速，不浪费力气去反抗","effects":{"cog_independent":-1.8,"big5_compliance":1.4,"mot_security":1.2,"cog_speed":0.4},"social_desirability":1},{"key":"B","text":"一边看着主流，一边在没人看的角落里默默做另一套","effects":{"cog_independent":1.8,"cog_diverge":1.4,"covert_control":0.8,"mot_autonomy":1},"social_desirability":3},{"key":"C","text":"公开提出疑问，哪怕会被当成不懂行的人","effects":{"cog_independent":1.4,"big5_assert":1.6,"sin_pride":0.8,"light_kant":0.6},"social_desirability":2},{"key":"D","text":"把两边都押一点，反正站在哪边都不该押满","effects":{"cog_independent":-0.6,"cog_ambiguity":1.2,"dark_mach":1.2,"big5_alert":0.8},"social_desirability":1}]},{"id":"v5_q12","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_speed","is_sensitive":false,"weight":0.85,"prompt":"面对一个需要立刻回应的机会，你的犹豫通常发生在——","scale":{"left":"几乎不犹豫，先接住再说，错了再改","right":"越想越多，往往等我想清楚的时候窗口已经关了","sdHigh":"left"},"effects":{"cog_speed":[1.8,-1.8],"sin_sloth":[-1,1.4],"big5_rumination":[-1,1.4],"big5_alert":[-0.8,1.2]}},{"id":"v5_q13","type":"forced_choice","stealth_mode":"normalization","layer":"explicit","mirror_key":"cog_global","is_sensitive":false,"weight":1.4,"context":"一件事上，你妈和你伴侣给出的意见完全相反：一位说你考虑得太远、不落地；另一位说你太计较眼前、缺高度。","prompt":"你的真实反应是——","options":[{"key":"A","text":"两边说的都对，我大概是站在中间那种人，谁的话都得听一半","effects":{"cog_global":1.2,"big5_open":1.2,"virtue_humility":1.4,"big5_industry":0.6},"social_desirability":3},{"key":"B","text":"先判断谁的说法更接近事实，另一个可能只是立场不同","effects":{"cog_global":0.6,"cog_independent":1.6,"cog_logic":1.2,"virtue_humility":0.2},"social_desirability":2},{"key":"C","text":"不管谁怎么说，我更相信自己做出来的结果最终会说明一切。","effects":{"cog_global":0.8,"sin_pride":1.4,"mot_autonomy":1.2,"big5_compliance":-1},"social_desirability":1},{"key":"D","text":"干脆分别问清他们真实的顾虑，把衡量的标准先对齐","effects":{"cog_logic":1.4,"covert_control":1,"big5_compliance":0.6,"big5_order":0.8},"social_desirabilit weight":0.85,"prompt":"关于「退路」，你的真实状态是——","scale":{"left":"手上得有至少两条能立刻走的路，我才会安心","right":"留太多退路本身就是一种不信任，我更愿意把自己逼到没有退路","sdHigh":"left"},"effects":{"mot_security":[2,-2],"big5_alert":[1.4,-1.2],"big5_rumination":[1,-0.8]}},{"id":"v6_q06","type":"forced_choice","stealth_mode":"projection","layer":"explicit","mirror_key":"mot_purpose","is_sensitive":false,"weight":1.4,"context":"你爸的老同事在一家单位做了十年，做到中层，收入不错。第八年的时候他曾经短暂地想过：这些事对我以外的人，真的有什么意义吗？","prompt":"你猜后来他最可能走上了哪一条路？","options":[{"key":"A","text":"把那点念头收起来，日子照样过得很好，只是偶尔在夜里想起","effects":{"mot_purpose":-1.6,"mot_security":1.6,"def_sublimate":0.4,"big5_rumination":1},"social_desirability":1},{"key":"B","text":"开始在下班后做一个很小的、只对自己有意义的项目","effects":{"mot_purpose":1.8,"big5_industry":1.2,"mot_autonomy":1,"def_sublimate":1.2},"social_desirability":3},{"key":"C","text":"用那点念头做筹码，换了一个更大、更能影响人的位置","effects":{"mot_purpose":1,"mot_mastery":1.6,"dark_mach":1.2,"dark_narc":1},"social_desirability":2},{"key":"D","text":"干脆辞职去做那件事，哪怕要重新从很低的地方开始","effects":{"mot_purpose":1.6,"mot_autonomy":1.8,"mot_security":-1.6,"dark_psycho":1},"social_desirability":2}]},{"id":"v6_q07","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"mot_hedonism","is_sensitive":false,"weight":0.85,"prompt":"一笔计划外的闲钱和一个完整的周末同时出现。你更想用它换——","scale":{"left":"一次非常好的体验：好餐厅、好位置、好天气","right":"把它存起来，或者换成一个更长久的东西","sdHigh":"right"},"effects":{"mot_hedonism":[2,-2],"mot_security":[-1.4,1.6],"big5_aesthetic":[1.2,-0.4],"virtue_temperance":[-1,1.2]}},{"id":"v6_q08","type":"forced_choice","stealth_mode":"ipsative","layer":"explicit","mirror_key":"mot_autonomy","is_sensitive":true,"weight":1.4,"context":"两份工作摆在面前：一份给你极高的自由度，做什么、怎么做、什么时候做都由你定，但收入只有另一份的六成，而且没人给你兜底。","prompt":"你更可能选——","options":[{"key":"A","text":"自由度更高的那份，钱可以少赚，时间不能不给","effects":{"mot_autonomy":2,"mot_security":-1.6,"val_boundary":1.4,"big5_order":-0.6},"social_desirability":2},{"key":"B","text":"收入更稳的那份，自由是有了余裕之后才能谈的东西","effects":{"mot_autonomy":-1.6,"mot_security":2,"sin_greed": 把柄，只要在合适的场合放出去，你能一次解决掉三年的麻烦。你也在想，这样做之后自己会变成什么样。","prompt":"你更接近的状态是——","scale":{"left":"会算准时机用出去，能用一次解决三年的事没理由不用","right":"会留着，但大概率永远不会用，我不想变成需要用它的人","sdHigh":"right"},"effects":{"dark_mach":[2,-2],"light_kant":[-1.6,1.8],"covert_control":[1.6,-1.2],"light_humanism":[-1.2,1.2]}},{"id":"v8_q07","type":"stealth_scale","stealth_mode":"mirror","layer":"stealth","mirror_key":"att_anxiety","is_sensitive":true,"weight":0.85,"context":"凌晨两点，你发现自己被一个重要的人从一个小群里移出去了。没有任何解释。","prompt":"接下来的十分钟你会做的事是——","scale":{"left":"先睡，明天再说，这件事不值得我现在处理","right":"马上开始翻聊天记录，找出自己哪句话说错了","sdHigh":"left"},"effects":{"att_anxiety":[-2,2],"big5_rumination":[-1.6,2],"def_fawn":[-1,1.4],"def_project":[-0.8,1.2]}},{"id":"v8_q08","type":"stealth_scale","stealth_mode":"mirror","layer":"stealth","mirror_key":"att_avoidance","is_sensitive":true,"weight":0.85,"context":"有人在你最狼狈的那个晚上，什么都没有问，直接来了。他就站在门口，手里拎着东西。","prompt":"你的第一反应是——","scale":{"left":"让他进来，那一刻我很需要有人在","right":"本能地想说我没事，先把门关一半","sdHigh":"left"},"effects":{"att_avoidance":[-2,2],"mot_belonging":[1.6,-1.2],"def_detach":[-1.2,1.4],"big5_compassion":[1.2,-1]}},{"id":"v8_q09","type":"stealth_scale","stealth_mode":"mirror","layer":"stealth","mirror_key":"def_fawn","is_sensitive":true,"weight":0.85,"context":"一个掌握你评价的人在饭桌上开了一个让你很难堪的玩笑，全桌都在笑，包括你不太熟的人。","prompt":"你的身体会先做哪一件事？","scale":{"left":"跟着笑一下，把这个场面接过去","right":"表情会变，会让他知道这句话不合适","sdHigh":"left"},"effects":{"def_fawn":[2,-1.8],"big5_compliance":[1.6,-1.4],"big5_assert":[-1.4,1.6],"sin_wrath":[-0.8,1.2]}},{"id":"v8_q10","type":"stealth_scale","stealth_mode":"mirror","layer":"stealth","mirror_key":"def_intellectual","is_sensitive":true,"weight":0.85,"context":"你刚刚失去了一个对你意义非常大的东西。它不会回来了。房间里很安静。","prompt":"一个小时之后，你的状态更接近——","scale":{"left":"在脑子里把它拆成几个阶段，理解它为什么会发生","right":"什么都想不了，只是坐在那，感觉像被抽走了一块","sdHigh":"left"},"effects":{"def_intellectual":[2,-2],"def_detach":[1.4,-1.2],"big5_compassion":[-1.2,1.6],"big5_rumination":[-0.4,1]}},{"id":"v8_q11","type":"stealth_scale","stealth_mode":"mirror","layer":"s esirability":2}]},{"id":"v9_q02","type":"stealth_scale","stealth_mode":"normalization","layer":"explicit","mirror_key":"jung_si","is_sensitive":false,"weight":0.85,"prompt":"凌晨两点四十，你已经躺了三个小时，手机扣在床头。你没在想工作，脑子却自己开始放东西。它放的是——","scale":{"left":"白天那些具体画面：谁说话时手在抖、那杯没喝完的茶、楼道里换掉的地砖","right":"一条线，顺着它一直往前推，推到三年后这件事会变成什么形状","sdHigh":"right"},"effects":{"jung_si":[2,-2],"jung_ni":[-2,2],"cog_global":[-1.4,1.4],"big5_rumination":[1.2,-0.6]}},{"id":"v9_q03","type":"forced_choice","stealth_mode":"pressure","layer":"stealth","mirror_key":"jung_te","is_sensitive":true,"weight":1.4,"context":"公司账上的钱只够发这个月工资。周一早上九点，白板上还写着原定三个月的路线图，老板说了句「你们看着办」就出去了。","prompt":"白板笔递到你手里，你先擦掉的是哪一块？","options":[{"key":"A","text":"先砍掉三件最贵又不产钱的事，剩下的人按能交付的日期重排一遍","effects":{"jung_te":2,"jung_ne":-0.9,"big5_order":1.3,"cog_speed":0.9},"social_desirability":2},{"key":"B","text":"先看屋里这七八张脸：谁会被裁、谁家里刚添了孩子，怎么分才不至于塌","effects":{"jung_fe":2,"jung_te":-1.1,"big5_compassion":1.3,"mot_belonging":0.9},"social_desirability":3},{"key":"C","text":"不等讨论完，先把自己手上那条最快能换钱的线当天跑起来，边跑边改","effects":{"jung_se":2,"jung_ne":-0.8,"big5_industry":1.4,"cog_speed":1.1},"social_desirability":1},{"key":"D","text":"把原来那条路整个扔掉，问一句：不做现在这个产品，我们还有什么能活","effects":{"jung_ne":1.9,"jung_si":-1.1,"cog_diverge":1.3,"big5_open":1.2},"social_desirability":2}]},{"id":"v9_q04","type":"impulse_3s","stealth_mode":"impulse","layer":"stealth","mirror_key":"jung_se","is_sensitive":false,"weight":1.25,"context":"夏天傍晚，你在便利店门口等雨停。一个外卖员的车在积水里滑倒，后座的餐盒散了一地，后面排队的喇叭开始响。","prompt":"雨还在下，你的脚动之前，身体已经先做了什么？","options":[{"key":"A","text":"已经蹲下去了，先把还封着的那几盒捞起来，别让雨水顺着缝泡进去","effects":{"jung_se":2,"jung_fi":-0.6,"big5_compassion":1.2,"def_sublimate":0.7},"social_desirability":3},{"key":"B","text":"先看他有没有摔伤，再抬头看按喇叭的是谁、周围有谁举着手机","effects":{"jung_fe":2,"jung_ti":-0.8,"big5_alert":1.4,"cog_speed":0.7},"social_desirability":2},{"key":"C","text":"心里先浮上一句「他今天大概已经跑了两百单」，眼睛有点热，人还站在檐下","effects":{"jung_fi":2,"jung_se":-1.1,"big5_compassion":1.3,"mot_belonging":0.6},"social_desirability":
